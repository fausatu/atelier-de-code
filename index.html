ription de l'UI", "React met à jour **le DOM** pour qu'il corresponde"], "points": ["JSX ressemble à du HTML mais c'est du JavaScript : `{ }` insère une expression.", "Les props sont **en lecture seule** : un composant ne modifie jamais ses props.", "Nom en **PascalCase** (`UserCard`), sinon React le prend pour une balise HTML.", "Listes : `items.map(item => <Item key={item.id} … />)`. La `key` stable et unique permet à React de savoir quel élément a changé.", "`className` au lieu de `class` ; un seul élément racine ou un fragment `<>…<\/>`."], "pitfalls": ["Utiliser l'index du tableau comme `key` sur une liste qui se réordonne.", "Écrire `Card()` au lieu de `<Card />`."], "example": {"lang": "tsx", "code": "type User = { id: number; name: string; role: string; online: boolean };\n\nfunction Badge({ online }: { online: boolean }) {\n  return <span className={online ? 'badge on' : 'badge'}>{online ? 'En ligne' : 'Absent'}<\/span>;\n}\n\nfunction UserCard({ user }: { user: User }) {\n  return (\n    <article className=\"card\">\n      <h3>{user.name}<\/h3>\n      <p>{user.role}<\/p>\n      <Badge online={user.online} />\n    <\/article>\n  );\n}\n\nexport default function Team({ users }: { users: User[] }) {\n  if (users.length === 0) return <p>Aucun membre.<\/p>;\n  return (\n    <section>\n      {users.map((u) => (\n        <UserCard key={u.id} user={u} />\n      ))}\n    <\/section>\n  );\n}", "notes": ["`Team` → `UserCard` → `Badge` : les données descendent par les props.", "`key={u.id}` : stable même si la liste est triée ou filtrée.", "Le `return` anticipé gère le cas « liste vide »."]}, "quiz": [{"q": "Un composant peut-il modifier ses props ?", "options": ["Oui", "Non, elles sont en lecture seule", "Seulement les objets", "Seulement dans useEffect"], "answer": 1, "why": "Pour une donnée qui change, on utilise le state (module suivant)."}, {"q": "À quoi sert `key` dans une liste ?", "options": ["Au style CSS", "À identifier chaque élément d'un rendu à l'autre", "À trier", "À l'accessibilité"], "answer": 1, "why": "Sans clé stable, React peut mélanger l'état des éléments."}, {"q": "Pourquoi `<userCard />` ne fonctionne pas ?", "options": ["Il manque des props", "Une minuscule = balise HTML pour React", "Il faut un fragment", "Il manque export"], "answer": 1, "why": "React cherche une balise HTML `<usercard>`, qui n'existe pas."}], "td": {"title": "Liste de produits", "enonce": "Affiche un catalogue à partir d'un tableau.", "consignes": ["`ProductCard` : nom, prix en euros, badge « Rupture » si stock = 0", "`ProductList` reçoit `products` et affiche une carte par produit", "Message « Aucun produit » si la liste est vide", "Bonus : `ProductList` reçoit `onlyAvailable` (booléen) et filtre"], "starter": {"lang": "tsx", "code": "const products = [\n  { id: 'p1', name: 'Clavier', price: 49.9, stock: 12 },\n  { id: 'p2', name: 'Souris', price: 19.5, stock: 0 },\n  { id: 'p3', name: 'Écran', price: 189, stock: 3 },\n];\n\nfunction ProductCard(/* props */) {\n  // à toi\n}\n\nexport default function ProductList({ products }) {\n  // à toi\n}"}, "hints": ["Prix : `price.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' })`", "Affichage conditionnel : `{product.stock === 0 && <span>Rupture<\/span>}`", "Filtre : `const visible = onlyAvailable ? products.filter(p => p.stock > 0) : products;`"], "solution": {"lang": "tsx", "code": "type Product = { id: string; name: string; price: number; stock: number };\n\nfunction ProductCard({ product }: { product: Product }) {\n  return (\n    <li className=\"product\">\n      <strong>{product.name}<\/strong>{' '}\n      {product.price.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' })}\n      {product.stock === 0 && <span className=\"badge\">Rupture<\/span>}\n    <\/li>\n  );\n}\n\nexport default function ProductList({\n  products,\n  onlyAvailable = false,\n}: {\n  products: Product[];\n  onlyAvailable?: boolean;\n}) {\n  const visible = onlyAvailable ? products.filter((p) => p.stock > 0) : products;\n  if (visible.length === 0) return <p>Aucun produit<\/p>;\n\n  return (\n    <ul>\n      {visible.map((p) => (\n        <ProductCard key={p.id} product={p} />\n      ))}\n    <\/ul>\n  );\n}"}, "checks": ["Chaque carte a une `key` stable (l'id)", "Aucune prop n'est modifiée (le filtre crée un nouveau tableau)"]}}, {"id": "react-state", "track": "react", "title": "State & re-rendu", "minutes": 15, "goal": "Comprendre ce qui déclenche un nouveau rendu, et pourquoi la valeur ne change pas « tout de suite ».", "why": "Une variable normale est remise à zéro à chaque rendu et ne met pas l'écran à jour. Le state, si.", "flow": ["`useState(0)` donne la **valeur** et une fonction pour la **changer**", "`setCount(…)` **demande** un nouveau rendu", "React **rappelle ton composant** avec la nouvelle valeur", "Le nouveau JSX est comparé à l'ancien et le DOM est **mis à jour**"], "points": ["Chaque rendu voit un **instantané** du state : juste après `setCount(count + 1)`, `count` vaut encore l'ancienne valeur.", "Si la nouvelle valeur dépend de l'ancienne : `setCount(c => c + 1)`.", "Ne jamais muter : tableau → `setItems([...items, x])`, objet → `setUser({ ...user, name })`.", "Ce qui se **calcule** à partir du state n'est pas un state (un total à partir des articles)."], "pitfalls": ["`items.push(x); setItems(items)` : même référence, React ne voit pas le changement.", "Appeler `setX` directement dans le corps du composant : boucle infinie."], "example": {"lang": "tsx", "code": "import { useState } from 'react';\n\nexport default function Counter() {\n  const [count, setCount] = useState(0);\n  const [history, setHistory] = useState<number[]>([]);\n\n  function add(n: number) {\n    setCount((c) => c + n);          // basé sur la valeur la plus récente\n    setHistory((h) => [...h, n]);    // nouveau tableau, pas de push\n  }\n\n  const actions = history.length;    // dérivé : pas besoin de state\n\n  return (\n    <div>\n      <p>Compteur : {count} ({actions} actions)<\/p>\n      <button onClick={() => add(1)}>+1<\/button>\n      <button onClick={() => add(-1)} disabled={count === 0}>-1<\/button>\n      <button onClick={() => { setCount(0); setHistory([]); }}>Reset<\/button>\n    <\/div>\n  );\n}", "notes": ["Deux states indépendants : `count` et `history`.", "`c => c + n` évite de lire un instantané périmé.", "`actions` est recalculé à chaque rendu, gratuitement."]}, "quiz": [{"q": "`setCount(count + 1); setCount(count + 1);` avec count = 0. Valeur affichée ensuite ?", "options": ["2", "1", "0", "Erreur"], "answer": 1, "why": "Les deux lignes lisent le même instantané (0). Avec `c => c + 1`, on obtiendrait 2."}, {"q": "Comment ajouter un élément à un state tableau ?", "options": ["`items.push(x)`", "`setItems([...items, x])`", "`items[items.length] = x`", "`setItems(items)`"], "answer": 1, "why": "Il faut une nouvelle référence pour que React détecte le changement."}, {"q": "Un panier a `items` en state. Le total doit-il être un state ?", "options": ["Oui, toujours", "Non, on le calcule à partir de `items`", "Seulement s'il est grand", "Dans un useEffect"], "answer": 1, "why": "Deux sources de vérité finissent toujours par diverger."}], "td": {"title": "Quantités du panier", "enonce": "Gère les quantités d'un petit panier.", "consignes": ["State : un objet `{ [productId]: quantité }`", "Boutons + et − par produit, jamais de quantité négative", "Total en euros **calculé** (pas de state)", "Bouton « Vider »"], "starter": {"lang": "tsx", "code": "import { useState } from 'react';\n\nconst products = [\n  { id: 'p1', name: 'Café', price: 4.5 },\n  { id: 'p2', name: 'Croissant', price: 1.2 },\n  { id: 'p3', name: 'Jus', price: 3 },\n];\n\nexport default function Cart() {\n  // à toi\n}"}, "hints": ["`const [qty, setQty] = useState<Record<string, number>>({});`", "Changer : `setQty(q => ({ ...q, [id]: Math.max(0, (q[id] ?? 0) + delta) }))`", "Total : `products.reduce((s, p) => s + p.price * (qty[p.id] ?? 0), 0)`"], "solution": {"lang": "tsx", "code": "export default function Cart() {\n  const [qty, setQty] = useState<Record<string, number>>({});\n\n  function change(id: string, delta: number) {\n    setQty((q) => ({ ...q, [id]: Math.max(0, (q[id] ?? 0) + delta) }));\n  }\n\n  const total = products.reduce((sum, p) => sum + p.price * (qty[p.id] ?? 0), 0);\n\n  return (\n    <div>\n      <ul>\n        {products.map((p) => (\n          <li key={p.id}>\n            {p.name}\n            <button onClick={() => change(p.id, -1)} disabled={!qty[p.id]}>−<\/button>\n            {qty[p.id] ?? 0}\n            <button onClick={() => change(p.id, 1)}>+<\/button>\n          <\/li>\n        ))}\n      <\/ul>\n      <p>Total : {total.toFixed(2)} €<\/p>\n      <button onClick={() => setQty({})}>Vider<\/button>\n    <\/div>\n  );\n}"}, "checks": ["Cliquer vite sur + plusieurs fois compte chaque clic", "Le total n'est pas dans un `useState`"]}}, {"id": "react-forms", "track": "react", "title": "Événements & formulaires", "minutes": 15, "goal": "Gérer les saisies avec des champs contrôlés et faire remonter les données au parent.", "why": "Pour valider, vider ou envoyer un formulaire, React doit connaître la valeur des champs à tout moment.", "flow": ["Le champ affiche une valeur **venant du state** (`value={title}`)", "Chaque frappe déclenche **onChange**", "onChange **met à jour le state**", "Le parent reçoit le résultat via une **fonction en prop** (`onAdd`)"], "points": ["Champ contrôlé : `value` + `onChange`. Le state est la seule source de vérité.", "`onSubmit` sur le `<form>` + `e.preventDefault()` pour éviter le rechargement de la page.", "Les données **descendent** (props), les événements **remontent** (callbacks `onQuelqueChose`).", "Deux composants frères ont besoin de la même donnée ? **Remonte le state** dans leur parent commun."], "pitfalls": ["`onClick={handle()}` appelle la fonction pendant le rendu. Écris `onClick={handle}` ou `onClick={() => handle(id)}`.", "Oublier `preventDefault` : la page se recharge et le state est perdu."], "example": {"lang": "tsx", "code": "import { useState, FormEvent } from 'react';\n\ntype Todo = { id: string; title: string };\n\nfunction TodoForm({ onAdd }: { onAdd: (title: string) => void }) {\n  const [title, setTitle] = useState('');\n\n  function handleSubmit(e: FormEvent) {\n    e.preventDefault();\n    if (title.trim() === '') return;\n    onAdd(title.trim());          // remonte au parent\n    setTitle('');                 // vide le champ\n  }\n\n  return (\n    <form onSubmit={handleSubmit}>\n      <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder=\"Nouvelle tâche\" />\n      <button type=\"submit\">Ajouter<\/button>\n    <\/form>\n  );\n}\n\nexport default function TodoApp() {\n  const [todos, setTodos] = useState<Todo[]>([]);\n\n  return (\n    <>\n      <TodoForm onAdd={(title) => setTodos((t) => [...t, { id: crypto.randomUUID(), title }])} />\n      <ul>\n        {todos.map((t) => <li key={t.id}>{t.title}<\/li>)}\n      <\/ul>\n    <\/>\n  );\n}", "notes": ["`TodoForm` ne connaît pas la liste : il signale juste « on a ajouté ce titre ».", "La liste vit dans `TodoApp`, qui décide quoi en faire.", "Le champ est vidé en remettant le state à `''`."]}, "quiz": [{"q": "`<button onClick={supprimer(id)}>` : que se passe-t-il ?", "options": ["Ça supprime au clic", "`supprimer` est appelé à chaque rendu", "Erreur de syntaxe", "Rien"], "answer": 1, "why": "Il faut passer une fonction : `onClick={() => supprimer(id)}`."}, {"q": "Une barre de recherche et une liste (frères) partagent le texte recherché. Où vit ce state ?", "options": ["Dans la barre de recherche", "Dans la liste", "Dans leur parent commun", "Dans une variable globale"], "answer": 2, "why": "On remonte le state au plus proche parent commun."}, {"q": "Pourquoi `e.preventDefault()` dans `onSubmit` ?", "options": ["Pour valider les champs", "Pour empêcher le navigateur de recharger la page", "Pour vider le formulaire", "C'est optionnel en React 19"], "answer": 1, "why": "Par défaut, un formulaire HTML envoie une requête et recharge la page."}], "td": {"title": "Contacts avec recherche", "enonce": "Construis une page de contacts avec recherche et ajout.", "consignes": ["`ContactsPage` (parent) détient la liste et le texte de recherche", "`SearchBar` (champ contrôlé) et `ContactList` sont frères", "La liste montre les contacts dont le nom contient le texte (insensible à la casse)", "`AddContact` (nom + email) refuse un nom vide et vide les champs après ajout"], "starter": {"lang": "tsx", "code": "import { useState } from 'react';\n\ntype Contact = { id: string; name: string; email: string };\n\nconst initial: Contact[] = [\n  { id: '1', name: 'Ana Martin', email: 'ana@exemple.fr' },\n  { id: '2', name: 'Léo Petit', email: 'leo@exemple.fr' },\n];\n\nexport default function ContactsPage() {\n  // à toi\n}"}, "hints": ["`SearchBar` reçoit `value` et `onChange` en props : c'est le parent qui garde le state.", "Filtre dérivé : `contacts.filter(c => c.name.toLowerCase().includes(query.toLowerCase()))`", "`AddContact` a son propre state pour ses deux champs, et appelle `onAdd(contact)`."], "solution": {"lang": "tsx", "code": "function SearchBar({ value, onChange }: { value: string; onChange: (v: string) => void }) {\n  return <input value={value} onChange={(e) => onChange(e.target.value)} placeholder=\"Rechercher\" />;\n}\n\nfunction ContactList({ contacts }: { contacts: Contact[] }) {\n  if (contacts.length === 0) return <p>Aucun contact<\/p>;\n  return <ul>{contacts.map((c) => <li key={c.id}>{c.name} – {c.email}<\/li>)}<\/ul>;\n}\n\nfunction AddContact({ onAdd }: { onAdd: (c: Contact) => void }) {\n  const [name, setName] = useState('');\n  const [email, setEmail] = useState('');\n\n  return (\n    <form\n      onSubmit={(e) => {\n        e.preventDefault();\n        if (!name.trim()) return;\n        onAdd({ id: crypto.randomUUID(), name: name.trim(), email: email.trim() });\n        setName('');\n        setEmail('');\n      }}\n    >\n      <input value={name} onChange={(e) => setName(e.target.value)} placeholder=\"Nom\" />\n      <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder=\"Email\" />\n      <button>Ajouter<\/button>\n    <\/form>\n  );\n}\n\nexport default function ContactsPage() {\n  const [contacts, setContacts] = useState(initial);\n  const [query, setQuery] = useState('');\n\n  const visible = contacts.filter((c) => c.name.toLowerCase().includes(query.toLowerCase()));\n\n  return (\n    <>\n      <SearchBar value={query} onChange={setQuery} />\n      <ContactList contacts={visible} />\n      <AddContact onAdd={(c) => setContacts((list) => [...list, c])} />\n    <\/>\n  );\n}"}, "checks": ["`SearchBar` n'a aucun `useState`", "La liste filtrée n'est pas stockée dans un state"]}}, {"id": "react-effect", "track": "react", "title": "useEffect & synchronisation", "minutes": 18, "goal": "Savoir quand utiliser useEffect, et surtout quand ne pas l'utiliser.", "why": "Le rendu doit rester pur : il calcule du JSX, c'est tout. Pour parler au monde extérieur (API, timer, titre de la page), il faut un endroit dédié.", "flow": ["Le composant **s'affiche**", "React exécute ensuite l'**effet**", "Si une **dépendance** change : **cleanup** de l'ancien effet, puis nouvel effet", "Au démontage, le **cleanup** s'exécute une dernière fois"], "points": ["Dépendances : `[]` = au montage seulement ; `[id]` = à chaque changement de `id` ; pas de tableau = après chaque rendu.", "Le **cleanup** (la fonction retournée) annule ce que l'effet a lancé : timer, abonnement, requête.", "Mets dans les dépendances **tout** ce que l'effet utilise et qui vient du composant.", "Pas d'effet pour une valeur dérivée ou pour réagir à un clic : fais-le dans le rendu ou dans le handler.", "En développement, le StrictMode lance l'effet deux fois pour vérifier ton cleanup.", "Avec Next.js, charge plutôt les données côté serveur (parcours Next.js)."], "pitfalls": ["Un effet qui met à jour un state qu'il a en dépendance : boucle infinie.", "Pas de cleanup sur un fetch : une réponse lente peut écraser une plus récente."], "example": {"lang": "tsx", "code": "import { useEffect, useState } from 'react';\n\ntype User = { id: number; name: string; email: string };\n\nexport default function UserProfile({ userId }: { userId: number }) {\n  const [user, setUser] = useState<User | null>(null);\n  const [error, setError] = useState<string | null>(null);\n\n  useEffect(() => {\n    const controller = new AbortController();\n    setUser(null);\n    setError(null);\n\n    fetch(`/api/users/${userId}`, { signal: controller.signal })\n      .then((r) => {\n        if (!r.ok) throw new Error(`HTTP ${r.status}`);\n        return r.json();\n      })\n      .then(setUser)\n      .catch((e) => {\n        if (e.name !== 'AbortError') setError(e.message);\n      });\n\n    return () => controller.abort();   // cleanup : annule si userId change\n  }, [userId]);\n\n  if (error) return <p>Erreur : {error}<\/p>;\n  if (!user) return <p>Chargement…<\/p>;\n  return <h2>{user.name} – {user.email}<\/h2>;\n}", "notes": ["`[userId]` : l'effet se relance quand on change d'utilisateur.", "`controller.abort()` empêche l'ancienne réponse d'arriver après la nouvelle.", "Trois états affichés : erreur, chargement, données."]}, "quiz": [{"q": "`useEffect(fn, [])` s'exécute…", "options": ["à chaque rendu", "après le premier rendu seulement (et cleanup au démontage)", "avant le rendu", "jamais en production"], "answer": 1, "why": "Tableau vide = aucune dépendance qui puisse changer."}, {"q": "À quoi sert la fonction retournée par l'effet ?", "options": ["Renvoyer une valeur au composant", "Nettoyer avant le prochain effet ou au démontage", "Gérer les erreurs", "Forcer un rendu"], "answer": 1, "why": "Timer à arrêter, requête à annuler, abonnement à fermer."}, {"q": "Tu dois afficher `fullName` à partir de `first` et `last` (deux states). Que faire ?", "options": ["Un useEffect qui appelle setFullName", "`const fullName = first + ' ' + last` dans le rendu", "Un troisième state", "useMemo obligatoire"], "answer": 1, "why": "Une valeur dérivée se calcule pendant le rendu."}], "td": {"title": "Chronomètre", "enonce": "Construis un chronomètre.", "consignes": ["Boutons Démarrer / Pause / Reset", "Affiche les secondes écoulées", "`setInterval` dans un effet qui dépend de `running`, avec cleanup", "Met à jour `document.title` avec le temps", "Vérifie qu'il n'y a jamais deux intervalles en même temps"], "starter": {"lang": "tsx", "code": "import { useEffect, useState } from 'react';\n\nexport default function Stopwatch() {\n  const [seconds, setSeconds] = useState(0);\n  const [running, setRunning] = useState(false);\n\n  // à toi\n\n  return <div>{seconds} s<\/div>;\n}"}, "hints": ["Si `!running`, l'effet ne fait rien : `if (!running) return;`", "`const id = setInterval(() => setSeconds(s => s + 1), 1000); return () => clearInterval(id);`", "Le titre est un deuxième effet qui dépend de `[seconds]`."], "solution": {"lang": "tsx", "code": "export default function Stopwatch() {\n  const [seconds, setSeconds] = useState(0);\n  const [running, setRunning] = useState(false);\n\n  useEffect(() => {\n    if (!running) return;\n    const id = setInterval(() => setSeconds((s) => s + 1), 1000);\n    return () => clearInterval(id);\n  }, [running]);\n\n  useEffect(() => {\n    document.title = `${seconds} s`;\n  }, [seconds]);\n\n  return (\n    <div>\n      <p>{seconds} s<\/p>\n      <button onClick={() => setRunning((r) => !r)}>{running ? 'Pause' : 'Démarrer'}<\/button>\n      <button onClick={() => { setRunning(false); setSeconds(0); }}>Reset<\/button>\n    <\/div>\n  );\n}"}, "checks": ["Démarrer / Pause rapidement n'accélère pas le chrono", "`setSeconds(s => s + 1)` et pas `setSeconds(seconds + 1)` (sinon instantané figé)"]}}, {"id": "react-hooks", "track": "react", "title": "Hooks personnalisés", "minutes": 15, "goal": "Extraire une logique avec state dans une fonction réutilisable.", "why": "Quand deux composants recopient le même `useState` + `useEffect`, cette logique doit vivre à un seul endroit.", "flow": ["Tu repères une logique répétée (state + effet)", "Tu la déplaces dans une fonction **`useQuelqueChose`**", "Elle utilise d'autres hooks et **renvoie** ce dont le composant a besoin", "Chaque composant qui l'appelle a **son propre state**"], "points": ["Un hook personnalisé commence par `use` et peut appeler d'autres hooks.", "Il partage la **logique**, pas les données : deux composants qui l'utilisent ont chacun leur state.", "Règles des hooks : appelés au **niveau supérieur** du composant, jamais dans un `if` ou une boucle.", "Renvoie un objet nommé (`{ data, error, loading }`) ou un tuple comme `useState`."], "pitfalls": ["Appeler un hook dans une condition : React mélange les states.", "Créer un hook pour une logique sans state ni effet : une fonction normale suffit."], "example": {"lang": "tsx", "code": "import { useEffect, useState } from 'react';\n\nexport function useFetch<T>(url: string) {\n  const [data, setData] = useState<T | null>(null);\n  const [error, setError] = useState<string | null>(null);\n  const [loading, setLoading] = useState(true);\n\n  useEffect(() => {\n    const controller = new AbortController();\n    setLoading(true);\n    setError(null);\n\n    fetch(url, { signal: controller.signal })\n      .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))\n      .then(setData)\n      .catch((e) => e.name !== 'AbortError' && setError(e.message))\n      .finally(() => setLoading(false));\n\n    return () => controller.abort();\n  }, [url]);\n\n  return { data, error, loading };\n}\n\n// Utilisation : une ligne dans chaque composant\nfunction Posts() {\n  const { data, error, loading } = useFetch<{ id: number; title: string }[]>('/api/posts');\n  if (loading) return <p>Chargement…<\/p>;\n  if (error) return <p>{error}<\/p>;\n  return <ul>{data!.map((p) => <li key={p.id}>{p.title}<\/li>)}<\/ul>;\n}", "notes": ["Toute la mécanique du module précédent est rangée dans `useFetch`.", "`<T>` rend le hook typé pour n'importe quelle donnée.", "`Posts` ne garde que l'affichage."]}, "quiz": [{"q": "Deux composants appellent `useFetch('/api/posts')`. Partagent-ils le même state ?", "options": ["Oui", "Non, chaque appel a son propre state", "Seulement si l'URL est identique", "Seulement en production"], "answer": 1, "why": "Un hook partage la logique, pas les données."}, {"q": "Lequel respecte les règles des hooks ?", "options": ["`if (ok) { useState(0) }`", "`const [x] = useState(0)` en haut du composant", "`for (...) useEffect(...)`", "useState dans un handler onClick"], "answer": 1, "why": "Les hooks doivent être appelés dans le même ordre à chaque rendu."}, {"q": "Quand créer un hook personnalisé ?", "options": ["Pour toute fonction", "Quand une logique avec state et/ou effets est répétée", "Jamais", "Seulement pour fetch"], "answer": 1, "why": "Sans hook à l'intérieur, une fonction normale suffit."}], "td": {"title": "useLocalStorage", "enonce": "Écris un hook qui fonctionne comme `useState` mais sauvegarde la valeur dans le navigateur.", "consignes": ["`useLocalStorage(key, initialValue)` renvoie `[value, setValue]`", "Lit la valeur sauvegardée au premier rendu (JSON)", "Sauvegarde à chaque changement", "Gère localStorage indisponible ou JSON invalide (retour à `initialValue`)", "Utilise-le pour un thème clair / sombre"], "starter": {"lang": "tsx", "code": "import { useEffect, useState } from 'react';\n\nexport function useLocalStorage<T>(key: string, initialValue: T) {\n  // à toi\n}\n\nfunction ThemeToggle() {\n  const [theme, setTheme] = useLocalStorage<'light' | 'dark'>('theme', 'light');\n  return <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}>{theme}<\/button>;\n}"}, "hints": ["Initialisation paresseuse : `useState(() => { ... lire localStorage ... })` ne lit qu'une fois.", "Entoure `JSON.parse` et `localStorage` d'un `try/catch`.", "Sauvegarde dans un `useEffect` qui dépend de `[key, value]`."], "solution": {"lang": "tsx", "code": "export function useLocalStorage<T>(key: string, initialValue: T) {\n  const [value, setValue] = useState<T>(() => {\n    try {\n      const saved = localStorage.getItem(key);\n      return saved !== null ? (JSON.parse(saved) as T) : initialValue;\n    } catch {\n      return initialValue;\n    }\n  });\n\n  useEffect(() => {\n    try {\n      localStorage.setItem(key, JSON.stringify(value));\n    } catch {\n      // stockage plein ou indisponible : on garde la valeur en mémoire\n    }\n  }, [key, value]);\n\n  return [value, setValue] as const;\n}"}, "checks": ["Le thème est conservé après rechargement", "Une valeur corrompue dans localStorage ne fait pas planter la page"]}}, {"id": "data-http", "track": "data", "title": "Une requête HTTP, de A à Z", "minutes": 12, "goal": "Comprendre ce qui se passe vraiment quand le front « récupère » ou « envoie » des données.", "why": "Fetch, axios, mutations… ça paraît compliqué parce qu'on voit le code avant le mécanisme. Or tout repose sur une seule idée : le navigateur pose une question au serveur, le serveur répond. Comme au restaurant : tu passes commande (requête), la cuisine prépare, le serveur t'apporte le plat ou te dit « plus de dessert » (réponse).", "flow": ["Le front **envoie une requête** : une méthode (GET, POST…), une URL, parfois un corps JSON", "Le serveur (Symfony, Next…) **traite** : lit la base, valide, enregistre", "Il renvoie une **réponse** : un code de statut (200, 404…) + un corps JSON", "Le front **attend** cette réponse (c'est asynchrone), puis met l'écran à jour"], "points": ["**GET** = lire (pas de corps). **POST** = créer. **PUT/PATCH** = modifier. **DELETE** = supprimer. Ces envois qui modifient des données s'appellent des **mutations**.", "Codes : 2xx = ça a marché (200 OK, 201 créé, 204 sans contenu) ; 4xx = le client s'est trompé (400, 401 non connecté, 403 interdit, 404, 422 données invalides) ; 5xx = le serveur a planté.", "Le corps voyage en **JSON** : du texte. Il faut le convertir en objet JS (fetch : `res.json()`, axios le fait tout seul).", "La réponse prend du temps : pendant ce temps, ton écran est dans un état **chargement**. Ensuite, **succès** ou **erreur**. Toujours ces 3 états.", "Onglet **Réseau** (Network) des outils de développement (F12) : tu y vois chaque requête, son statut et son contenu. C'est ton meilleur outil pour comprendre."], "pitfalls": ["Croire que la donnée est là « tout de suite » : elle arrive plus tard, il faut gérer le chargement.", "Ignorer les codes 4xx/5xx : une réponse 404 n'est pas « des données »."], "example": {"lang": "plaintext", "code": "NAVIGATEUR (React)                           SERVEUR (Symfony / Next)\n------------------                           ------------------------\nGET /api/articles            ------------->  lit la base\n                             <-------------  200 OK\n                                             [{\"id\":1,\"titre\":\"Hello\"}, ...]\n\nPOST /api/articles           ------------->  valide (DTO), enregistre\nContent-Type: application/json\n{\"titre\":\"Nouveau\",\"contenu\":\"...\"}\n                             <-------------  201 Created\n                                             {\"id\":42,\"titre\":\"Nouveau\", ...}\n\nPOST /api/articles           ------------->  validation échoue\n{\"titre\":\"\"}\n                             <-------------  422 Unprocessable Entity\n                                             {\"violations\":[{\"propertyPath\":\"titre\", ...}]}\n\nDELETE /api/articles/42      ------------->  supprime\n                             <-------------  204 No Content   (pas de corps)", "notes": ["Chaque échange = une requête et une réponse, rien de plus.", "Le même `POST` peut réussir (201) ou échouer (422) selon les données envoyées.", "Ouvre F12 > Réseau sur n'importe quel site et retrouve ces éléments : méthode, URL, statut, réponse."]}, "quiz": [{"q": "Tu veux enregistrer un nouveau commentaire. Quelle méthode ?", "options": ["GET", "POST", "DELETE", "HEAD"], "answer": 1, "why": "POST crée une ressource : c'est une mutation."}, {"q": "Le serveur répond 422. Ça veut dire…", "options": ["Tout va bien", "Les données envoyées sont invalides", "Le serveur a planté", "La page n'existe pas"], "answer": 1, "why": "4xx = erreur côté client ; 422 = validation échouée (ton DTO Symfony)."}, {"q": "Pendant qu'on attend la réponse, l'écran doit…", "options": ["ne rien afficher", "afficher un état de chargement", "planter", "afficher les anciennes données comme si de rien n'était"], "answer": 1, "why": "Trois états à gérer : chargement, succès, erreur."}], "td": {"title": "Lire le trafic réseau", "enonce": "Exercice d'observation, sans code : ouvre un site que tu utilises (ou ton propre projet), F12 > onglet Réseau > filtre « Fetch/XHR ».", "consignes": ["Trouve une requête GET : note son URL, son statut et un extrait de la réponse", "Fais une action qui enregistre quelque chose (like, commentaire, panier) : trouve le POST/PUT/PATCH, note le corps envoyé (onglet Payload)", "Provoque une erreur (formulaire vide, mauvaise page) et note le statut", "Pour chacune, écris en une phrase : qui demande quoi, et qu'a répondu le serveur"], "starter": {"lang": "plaintext", "code": "Requête 1 (lecture)\n  Méthode / URL :\n  Statut :\n  Réponse (extrait) :\n  En une phrase :\n\nRequête 2 (mutation)\n  Méthode / URL :\n  Corps envoyé :\n  Statut :\n  En une phrase :\n\nRequête 3 (erreur)\n  Méthode / URL :\n  Statut :\n  En une phrase :"}, "hints": ["Coche « Preserve log » pour garder les requêtes quand la page change.", "Clique sur une requête : onglets Headers (méthode, statut), Payload (ce qui part), Response (ce qui revient)."], "solution": {"lang": "plaintext", "code": "Exemple sur un réseau social :\n\nRequête 1 : GET /api/feed?page=1 -> 200\n  Réponse : [{\"id\": 981, \"auteur\": \"...\", \"likes\": 12}, ...]\n  \"Le front demande la page 1 du fil, le serveur renvoie la liste des posts.\"\n\nRequête 2 : POST /api/posts/981/like -> 201\n  Corps : {}   (l'id est dans l'URL)\n  \"Le front signale un like sur le post 981, le serveur l'enregistre.\"\n\nRequête 3 : POST /api/comments -> 422\n  Corps : {\"postId\": 981, \"texte\": \"\"}\n  \"Le front envoie un commentaire vide, le serveur refuse : données invalides.\""}, "checks": ["Tu as identifié au moins une lecture et une mutation", "Tu sais où lire le statut et le corps d'une requête"]}}, {"id": "data-get", "track": "data", "title": "Récupérer des données : fetch & axios", "minutes": 15, "goal": "Charger une liste depuis une API dans un composant React, avec chargement et erreur.", "why": "Le composant s'affiche avant que les données arrivent. Il faut donc lancer la requête, attendre, puis ranger le résultat dans le state pour que React redessine.", "flow": ["Le composant s'affiche avec `loading = true`", "Un **effet** lance la requête (`axios.get`)", "La réponse arrive : on la range dans le **state** (`setArticles`)", "React **redessine** avec les données, ou avec l'erreur"], "points": ["**fetch** est intégré au navigateur. **axios** est une librairie (`npm i axios`) qui simplifie : JSON automatique, erreurs automatiques sur 4xx/5xx, `baseURL`.", "Avec fetch, un 404 n'est **pas** une erreur : il faut vérifier `res.ok`. Avec axios, un 404 **lève** une erreur : tu la reçois dans `catch`.", "Avec axios, les données sont dans `response.data`.", "Crée une **instance** : `axios.create({ baseURL: '/api' })`, puis `api.get('/articles')` partout.", "Annule la requête si le composant disparaît (`AbortController`), comme vu dans le module useEffect."], "pitfalls": ["Oublier le tableau de dépendances de `useEffect` : requête à chaque rendu, en boucle.", "Afficher `articles.map` alors que `articles` est encore `null`."], "example": {"lang": "tsx", "code": "// api/client.ts : une seule configuration pour tout le projet\nimport axios from 'axios';\n\nexport const api = axios.create({\n  baseURL: 'http://localhost:8000/api',   // ton back Symfony\n  headers: { 'Content-Type': 'application/json' },\n});\n\n// ArticleList.tsx\nimport { useEffect, useState } from 'react';\nimport axios from 'axios';\nimport { api } from './api/client';\n\ntype Article = { id: number; titre: string; auteur: string };\n\nexport default function ArticleList() {\n  const [articles, setArticles] = useState<Article[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState<string | null>(null);\n\n  useEffect(() => {\n    const controller = new AbortController();\n\n    api.get<Article[]>('/articles', { signal: controller.signal })\n      .then((res) => setArticles(res.data))            // les données sont dans .data\n      .catch((err) => {\n        if (axios.isCancel(err)) return;               // requête annulée : on ignore\n        setError(err.response?.status === 404 ? 'Introuvable' : 'Erreur de chargement');\n      })\n      .finally(() => setLoading(false));\n\n    return () => controller.abort();\n  }, []);                                              // une seule fois au montage\n\n  if (loading) return <p>Chargement…<\/p>;\n  if (error) return <p role=\"alert\">{error}<\/p>;\n  return <ul>{articles.map((a) => <li key={a.id}>{a.titre} — {a.auteur}<\/li>)}<\/ul>;\n}\n\n// Même chose avec fetch :\n// const res = await fetch('/api/articles');\n// if (!res.ok) throw new Error(`HTTP ${res.status}`);   // à faire soi-même\n// const data = await res.json();                          // à faire soi-même", "notes": ["Trois states : les données, le chargement, l'erreur.", "`err.response?.status` : axios donne le code HTTP de l'erreur.", "Le bloc fetch en commentaire montre les deux étapes qu'axios fait à ta place."]}, "quiz": [{"q": "Avec axios, où sont les données JSON renvoyées par le serveur ?", "options": ["`res.json()`", "`res.data`", "`res.body`", "`res`"], "answer": 1, "why": "axios a déjà décodé le JSON."}, {"q": "Le serveur répond 404. Avec `fetch`, que se passe-t-il ?", "options": ["fetch lève une erreur", "fetch résout normalement : il faut tester `res.ok`", "fetch réessaie", "La page plante"], "answer": 1, "why": "fetch ne rejette que si le réseau échoue. axios, lui, rejette sur 4xx/5xx."}, {"q": "Pourquoi `useEffect(..., [])` et pas le fetch directement dans le corps du composant ?", "options": ["C'est plus joli", "Sinon la requête repart à chaque rendu, et chaque réponse provoque un nouveau rendu : boucle", "axios l'impose", "Pour le SEO"], "answer": 1, "why": "Le corps du composant s'exécute à chaque rendu."}], "td": {"title": "Afficher le catalogue de livres", "enonce": "Affiche la liste de `GET /api/livres` (ton API Symfony du parcours DTO, ou une API de test comme `https://jsonplaceholder.typicode.com/posts`).", "consignes": ["Une instance `api` avec `baseURL`", "Les 3 états : chargement, erreur, liste", "Un bouton « Recharger » qui relance la requête", "Message « Aucun livre » si la liste est vide"], "starter": {"lang": "tsx", "code": "import { useEffect, useState } from 'react';\nimport { api } from './api/client';\n\ntype Livre = { id: number; titre: string; auteur: string; disponible: boolean };\n\nexport default function Catalogue() {\n  // à toi\n}"}, "hints": ["Pour « Recharger » : un state `reloadKey` que tu incrémentes, et que tu mets dans les dépendances de l'effet.", "Remets `loading` à `true` et `error` à `null` au début de l'effet."], "solution": {"lang": "tsx", "code": "import axios from 'axios';\n\nexport default function Catalogue() {\n  const [livres, setLivres] = useState<Livre[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState<string | null>(null);\n  const [reloadKey, setReloadKey] = useState(0);\n\n  useEffect(() => {\n    const controller = new AbortController();\n    setLoading(true);\n    setError(null);\n\n    api.get<Livre[]>('/livres', { signal: controller.signal })\n      .then((res) => setLivres(res.data))\n      .catch((err) => { if (!axios.isCancel(err)) setError('Impossible de charger les livres'); })\n      .finally(() => setLoading(false));\n\n    return () => controller.abort();\n  }, [reloadKey]);\n\n  return (\n    <section>\n      <button onClick={() => setReloadKey((k) => k + 1)} disabled={loading}>Recharger<\/button>\n      {loading && <p>Chargement…<\/p>}\n      {error && <p role=\"alert\">{error}<\/p>}\n      {!loading && !error && livres.length === 0 && <p>Aucun livre<\/p>}\n      <ul>\n        {livres.map((l) => (\n          <li key={l.id}>{l.titre} — {l.auteur} {l.disponible ? '' : '(emprunté)'}<\/li>\n        ))}\n      <\/ul>\n    <\/section>\n  );\n}"}, "checks": ["Dans F12 > Réseau, tu vois un seul GET au chargement et un par clic sur « Recharger »", "Couper le serveur affiche ton message d'erreur au lieu de planter"]}}, {"id": "data-mutations", "track": "data", "title": "Envoyer des données : les mutations", "minutes": 18, "goal": "Créer, modifier, supprimer depuis React, et mettre l'écran à jour ensuite.", "why": "Lire, c'est une seule étape. Envoyer, c'en est deux : faire la requête, PUIS mettre à jour ce que l'écran affiche. C'est la deuxième étape qu'on oublie, et l'écran ne bouge pas.", "flow": ["L'utilisateur **déclenche** l'action (submit, clic)", "On envoie la **mutation** : `api.post` / `put` / `patch` / `delete`, avec un état **envoi en cours**", "Le serveur **valide et enregistre**, puis renvoie l'objet créé/modifié (ou une erreur 422)", "On **met à jour l'écran** : ajouter la réponse à la liste, ou recharger la liste"], "points": ["`api.post('/articles', { titre, contenu })` : axios transforme l'objet en JSON tout seul.", "Mutation = événement de l'utilisateur, donc **dans le handler** (`onSubmit`, `onClick`), **pas** dans un `useEffect`.", "Après succès, deux façons de mettre à jour : **ajouter la réponse** au state (`setArticles(a => [...a, res.data])`) ou **recharger** la liste.", "Erreurs 422 : `err.response.data` contient les violations ; affiche-les sous les champs.", "Pendant l'envoi : désactive le bouton (`disabled={saving}`) pour éviter les doubles clics."], "pitfalls": ["Envoyer puis oublier de mettre à jour le state : la donnée est en base mais pas à l'écran.", "Modifier le state AVANT de savoir si le serveur a accepté (sauf mise à jour optimiste volontaire, voir TanStack Query)."], "example": {"lang": "tsx", "code": "import { useState, FormEvent } from 'react';\nimport axios from 'axios';\nimport { api } from './api/client';\n\ntype Article = { id: number; titre: string };\n\nexport default function Articles({ initial }: { initial: Article[] }) {\n  const [articles, setArticles] = useState(initial);\n  const [titre, setTitre] = useState('');\n  const [saving, setSaving] = useState(false);\n  const [error, setError] = useState<string | null>(null);\n\n  async function handleCreate(e: FormEvent) {\n    e.preventDefault();\n    setSaving(true);\n    setError(null);\n    try {\n      const res = await api.post<Article>('/articles', { titre, contenu: '...' }); // 1. envoyer\n      setArticles((list) => [res.data, ...list]);                                // 2. mettre à jour l'écran\n      setTitre('');\n    } catch (err) {\n      if (axios.isAxiosError(err) && err.response?.status === 422) {\n        setError('Titre invalide (5 caractères minimum)');\n      } else {\n        setError(\"L'enregistrement a échoué\");\n      }\n    } finally {\n      setSaving(false);\n    }\n  }\n\n  async function handleDelete(id: number) {\n    await api.delete(`/articles/${id}`);\n    setArticles((list) => list.filter((a) => a.id !== id));\n  }\n\n  return (\n    <>\n      <form onSubmit={handleCreate}>\n        <input value={titre} onChange={(e) => setTitre(e.target.value)} />\n        <button disabled={saving}>{saving ? 'Envoi…' : 'Publier'}<\/button>\n        {error && <p role=\"alert\">{error}<\/p>}\n      <\/form>\n      <ul>\n        {articles.map((a) => (\n          <li key={a.id}>{a.titre} <button onClick={() => handleDelete(a.id)}>Supprimer<\/button><\/li>\n        ))}\n      <\/ul>\n    <\/>\n  );\n}", "notes": ["`async/await` + `try/catch/finally` : plus lisible que `.then()` pour une mutation.", "On ajoute `res.data` (la version du serveur, avec son `id`), pas ce qu'on a tapé.", "Supprimer : on retire l'élément du state une fois le serveur d'accord."]}, "quiz": [{"q": "Où lancer un `api.post` qui crée un commentaire ?", "options": ["Dans un useEffect", "Dans le handler `onSubmit`", "Dans le corps du composant", "Dans le return"], "answer": 1, "why": "C'est une réaction à une action de l'utilisateur."}, {"q": "Le POST réussit mais la liste à l'écran ne change pas. Que manque-t-il ?", "options": ["Un `useEffect`", "La mise à jour du state avec la réponse (ou un rechargement)", "`preventDefault`", "Un header"], "answer": 1, "why": "Le serveur a la donnée, mais React ne le sait pas."}, {"q": "Pourquoi ajouter `res.data` à la liste plutôt que `{ titre }` ?", "options": ["C'est pareil", "La réponse contient l'`id` et les champs calculés par le serveur", "Pour la performance", "axios l'impose"], "answer": 1, "why": "Sans id, impossible de supprimer ou modifier ensuite."}], "td": {"title": "Gérer les emprunts", "enonce": "Sur la liste des livres, ajoute les actions d'emprunt (endpoint `POST /api/emprunts` du parcours DTO, ou simule-le).", "consignes": ["Un bouton « Emprunter » par livre disponible → `api.post('/emprunts', { livreId, rendreLe })`", "Pendant l'envoi, seul le bouton de CE livre est désactivé", "Succès : le livre passe à « emprunté » dans la liste sans recharger", "409 : message « Déjà emprunté » ; autre erreur : message générique"], "starter": {"lang": "tsx", "code": "type Livre = { id: number; titre: string; disponible: boolean };\n\nexport default function Emprunts({ livres: initial }: { livres: Livre[] }) {\n  const [livres, setLivres] = useState(initial);\n  // à toi\n}"}, "hints": ["Un state `pendingId: number | null` suffit pour savoir quel bouton désactiver.", "Mise à jour : `setLivres(ls => ls.map(l => l.id === id ? { ...l, disponible: false } : l))`", "Date de retour dans 14 jours : `new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10)`"], "solution": {"lang": "tsx", "code": "export default function Emprunts({ livres: initial }: { livres: Livre[] }) {\n  const [livres, setLivres] = useState(initial);\n  const [pendingId, setPendingId] = useState<number | null>(null);\n  const [message, setMessage] = useState<string | null>(null);\n\n  async function emprunter(id: number) {\n    setPendingId(id);\n    setMessage(null);\n    try {\n      const rendreLe = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);\n      await api.post('/emprunts', { livreId: id, rendreLe });\n      setLivres((ls) => ls.map((l) => (l.id === id ? { ...l, disponible: false } : l)));\n    } catch (err) {\n      const status = axios.isAxiosError(err) ? err.response?.status : undefined;\n      setMessage(status === 409 ? 'Déjà emprunté' : \"L'emprunt a échoué\");\n    } finally {\n      setPendingId(null);\n    }\n  }\n\n  return (\n    <>\n      {message && <p role=\"alert\">{message}<\/p>}\n      <ul>\n        {livres.map((l) => (\n          <li key={l.id}>\n            {l.titre}{' '}\n            {l.disponible ? (\n              <button onClick={() => emprunter(l.id)} disabled={pendingId === l.id}>\n                {pendingId === l.id ? 'Envoi…' : 'Emprunter'}\n              <\/button>\n            ) : (\n              <em>emprunté<\/em>\n            )}\n          <\/li>\n        ))}\n      <\/ul>\n    <\/>\n  );\n}"}, "checks": ["F12 > Réseau : un seul POST par clic, avec le bon corps JSON", "Le livre change d'état sans recharger la page"]}}, {"id": "data-organiser", "track": "data", "title": "Organiser : couche API & hook", "minutes": 15, "goal": "Sortir les appels HTTP des composants pour que tout reste lisible.", "why": "Quand chaque composant contient ses `api.get`, ses URLs et ses `try/catch`, le moindre changement d'API oblige à modifier 15 fichiers.", "flow": ["Un fichier **`api/articles.ts`** regroupe les fonctions (`getArticles`, `createArticle`…) et leurs types", "Un **hook** `useArticles()` gère state, chargement, erreur et mutations", "Le **composant** appelle juste le hook et affiche", "Changer l'API = modifier **un seul fichier**"], "points": ["Trois couches : client HTTP (`api/client.ts`) → fonctions par ressource (`api/articles.ts`) → hooks (`useArticles`).", "Les types TypeScript (`Article`, `CreateArticleInput`) reflètent tes **DTO Symfony** : c'est le même contrat des deux côtés.", "Le hook expose des actions nommées : `create`, `remove`, `reload`.", "Les **intercepteurs** axios ajoutent le token d'authentification à chaque requête, à un seul endroit."], "pitfalls": ["Mettre les URLs en dur dans les composants.", "Un hook qui fait tout pour toute l'appli : un hook par ressource."], "example": {"lang": "tsx", "code": "// api/client.ts\nimport axios from 'axios';\nexport const api = axios.create({ baseURL: import.meta.env.VITE_API_URL });\n\napi.interceptors.request.use((config) => {\n  const token = localStorage.getItem('token');\n  if (token) config.headers.Authorization = `Bearer ${token}`;\n  return config;\n});\n\n// api/articles.ts : les mêmes champs que tes DTO Symfony\nexport type Article = { id: number; titre: string; extrait: string; auteur: string };\nexport type CreateArticleInput = { titre: string; contenu: string };\n\nexport const getArticles = () => api.get<Article[]>('/articles').then((r) => r.data);\nexport const createArticle = (input: CreateArticleInput) => api.post<Article>('/articles', input).then((r) => r.data);\nexport const deleteArticle = (id: number) => api.delete(`/articles/${id}`);\n\n// hooks/useArticles.ts\nexport function useArticles() {\n  const [articles, setArticles] = useState<Article[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState<string | null>(null);\n\n  const reload = useCallback(async () => {\n    setLoading(true);\n    setError(null);\n    try { setArticles(await getArticles()); }\n    catch { setError('Erreur de chargement'); }\n    finally { setLoading(false); }\n  }, []);\n\n  useEffect(() => { reload(); }, [reload]);\n\n  async function create(input: CreateArticleInput) {\n    const created = await createArticle(input);\n    setArticles((a) => [created, ...a]);\n  }\n\n  async function remove(id: number) {\n    await deleteArticle(id);\n    setArticles((a) => a.filter((x) => x.id !== id));\n  }\n\n  return { articles, loading, error, reload, create, remove };\n}\n\n// ArticlesPage.tsx : le composant ne parle plus HTTP\nexport default function ArticlesPage() {\n  const { articles, loading, error, remove } = useArticles();\n  if (loading) return <p>Chargement…<\/p>;\n  if (error) return <p role=\"alert\">{error}<\/p>;\n  return <ul>{articles.map((a) => <li key={a.id}>{a.titre} <button onClick={() => remove(a.id)}>×<\/button><\/li>)}<\/ul>;\n}", "notes": ["`.then((r) => r.data)` : les fonctions renvoient directement les données, pas la réponse axios.", "L'intercepteur ajoute le token partout, sans y penser dans chaque appel.", "`ArticlesPage` fait 5 lignes et ne contient aucune URL."]}, "quiz": [{"q": "L'URL `/articles` devient `/v2/articles`. Combien de fichiers modifier ?", "options": ["Tous les composants", "Un seul : `api/articles.ts`", "Le hook et les composants", "Aucun"], "answer": 1, "why": "C'est tout l'intérêt de la couche API."}, {"q": "À quoi sert un intercepteur de requête axios ?", "options": ["À annuler les requêtes", "À modifier chaque requête avant l'envoi (ex. ajouter le token)", "À mettre en cache", "À valider le JSON"], "answer": 1, "why": "Un seul endroit pour l'authentification."}, {"q": "D'où viennent idéalement les types `Article` du front ?", "options": ["On les invente", "Ils reflètent les DTO de sortie de l'API", "De la base de données", "D'axios"], "answer": 1, "why": "Le DTO est le contrat ; le type TypeScript en est le miroir."}], "td": {"title": "Refactoriser le catalogue", "enonce": "Reprends tes TD Catalogue et Emprunts, et range-les en couches.", "consignes": ["`api/livres.ts` : `getLivres()`, `emprunter(livreId, rendreLe)` et les types", "`hooks/useLivres.ts` : `{ livres, loading, error, reload, emprunter, pendingId }`", "Le composant `Catalogue` n'importe plus `api` ni `axios`"], "starter": {"lang": "tsx", "code": "// api/livres.ts\n// hooks/useLivres.ts\n// components/Catalogue.tsx\n// à toi"}, "hints": ["La logique `pendingId` et la mise à jour du livre déménagent dans le hook.", "Le hook renvoie aussi le message d'erreur d'emprunt."], "solution": {"lang": "tsx", "code": "// api/livres.ts\nexport type Livre = { id: number; titre: string; auteur: string; disponible: boolean };\nexport const getLivres = () => api.get<Livre[]>('/livres').then((r) => r.data);\nexport const emprunterLivre = (livreId: number, rendreLe: string) =>\n  api.post('/emprunts', { livreId, rendreLe }).then((r) => r.data);\n\n// hooks/useLivres.ts\nexport function useLivres() {\n  const [livres, setLivres] = useState<Livre[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState<string | null>(null);\n  const [pendingId, setPendingId] = useState<number | null>(null);\n\n  const reload = useCallback(async () => {\n    setLoading(true); setError(null);\n    try { setLivres(await getLivres()); } catch { setError('Impossible de charger les livres'); }\n    finally { setLoading(false); }\n  }, []);\n  useEffect(() => { reload(); }, [reload]);\n\n  async function emprunter(id: number) {\n    setPendingId(id); setError(null);\n    try {\n      const rendreLe = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);\n      await emprunterLivre(id, rendreLe);\n      setLivres((ls) => ls.map((l) => (l.id === id ? { ...l, disponible: false } : l)));\n    } catch (err) {\n      setError(axios.isAxiosError(err) && err.response?.status === 409 ? 'Déjà emprunté' : \"L'emprunt a échoué\");\n    } finally { setPendingId(null); }\n  }\n\n  return { livres, loading, error, reload, emprunter, pendingId };\n}\n\n// components/Catalogue.tsx\nexport default function Catalogue() {\n  const { livres, loading, error, reload, emprunter, pendingId } = useLivres();\n  if (loading) return <p>Chargement…<\/p>;\n  return (\n    <section>\n      {error && <p role=\"alert\">{error}<\/p>}\n      <button onClick={reload}>Recharger<\/button>\n      <ul>\n        {livres.map((l) => (\n          <li key={l.id}>\n            {l.titre}{' '}\n            {l.disponible\n              ? <button disabled={pendingId === l.id} onClick={() => emprunter(l.id)}>Emprunter<\/button>\n              : <em>emprunté<\/em>}\n          <\/li>\n        ))}\n      <\/ul>\n    <\/section>\n  );\n}"}, "checks": ["`Catalogue.tsx` n'importe ni `axios` ni `api`", "Changer l'URL des emprunts ne touche qu'un fichier"]}}, {"id": "data-tanstack", "track": "data", "title": "TanStack Query : le cache des données", "minutes": 18, "goal": "Utiliser la librairie standard qui gère chargement, cache, rechargement et mutations à ta place.", "why": "Dans les modules précédents, tu as écrit à la main loading, error, reload, mise à jour après mutation… Dans une vraie appli, ça se multiplie. TanStack Query (ex-React Query) fait tout ça, avec un cache partagé.", "flow": ["`useQuery` **lit** : une clé (`['articles']`) + une fonction qui va chercher (`getArticles`)", "Le résultat est mis en **cache** sous cette clé, partagé par tous les composants", "`useMutation` **écrit** : il appelle ta fonction (`createArticle`)", "En cas de succès, `invalidateQueries(['articles'])` dit « ces données sont périmées » → **rechargement automatique**"], "points": ["Installation : `npm i @tanstack/react-query`, puis `<QueryClientProvider client={queryClient}>` autour de l'appli.", "`useQuery` renvoie `data`, `isPending`, `isError`, `error`, `refetch` : tu n'écris plus ces states.", "Deux composants avec la même clé = **une seule requête** : ils partagent le cache.", "La clé contient les paramètres : `['articles', { page, q }]` → un cache par combinaison.", "Tes fonctions de la couche API (`getArticles`…) se branchent telles quelles : axios fait la requête, TanStack Query gère l'état."], "pitfalls": ["Mettre les données de `useQuery` dans un `useState` : tu recrées le problème. Utilise `data` directement.", "Oublier d'invalider après une mutation : l'écran garde l'ancienne liste."], "example": {"lang": "tsx", "code": "// main.tsx\nimport { QueryClient, QueryClientProvider } from '@tanstack/react-query';\nconst queryClient = new QueryClient();\n\ncreateRoot(document.getElementById('root')!).render(\n  <QueryClientProvider client={queryClient}>\n    <App />\n  <\/QueryClientProvider>,\n);\n\n// ArticlesPage.tsx\nimport { useQuery, useMutation, useQueryClient } from '@tanstack/react-query';\nimport { getArticles, createArticle, deleteArticle } from './api/articles';\n\nexport default function ArticlesPage() {\n  const queryClient = useQueryClient();\n\n  const { data: articles, isPending, isError } = useQuery({\n    queryKey: ['articles'],\n    queryFn: getArticles,                 // ta fonction axios\n  });\n\n  const create = useMutation({\n    mutationFn: createArticle,\n    onSuccess: () => queryClient.invalidateQueries({ queryKey: ['articles'] }),\n  });\n\n  const remove = useMutation({\n    mutationFn: deleteArticle,\n    onSuccess: () => queryClient.invalidateQueries({ queryKey: ['articles'] }),\n  });\n\n  if (isPending) return <p>Chargement…<\/p>;\n  if (isError) return <p role=\"alert\">Erreur de chargement<\/p>;\n\n  return (\n    <>\n      <button\n        onClick={() => create.mutate({ titre: 'Nouvel article', contenu: '...' })}\n        disabled={create.isPending}\n      >\n        {create.isPending ? 'Envoi…' : 'Ajouter'}\n      <\/button>\n      {create.isError && <p role=\"alert\">L'ajout a échoué<\/p>}\n      <ul>\n        {articles.map((a) => (\n          <li key={a.id}>{a.titre} <button onClick={() => remove.mutate(a.id)}>×<\/button><\/li>\n        ))}\n      <\/ul>\n    <\/>\n  );\n}", "notes": ["Plus aucun `useState` ni `useEffect` pour les données.", "`create.mutate(...)` lance la mutation ; `create.isPending` remplace ton `saving`.", "Après succès, la clé `['articles']` est invalidée : la liste se recharge seule, partout où elle est affichée."]}, "quiz": [{"q": "Deux composants appellent `useQuery({ queryKey: ['articles'], ... })` en même temps. Combien de requêtes ?", "options": ["Deux", "Une, le cache est partagé", "Aucune", "Une par rendu"], "answer": 1, "why": "La clé identifie la donnée dans le cache."}, {"q": "Après `createArticle` réussi, comment rafraîchir la liste ?", "options": ["`window.location.reload()`", "`queryClient.invalidateQueries({ queryKey: ['articles'] })`", "Un useEffect", "Rien, c'est automatique sans rien faire"], "answer": 1, "why": "Invalider = marquer comme périmé, TanStack Query recharge."}, {"q": "La liste dépend d'un filtre `page`. Quelle clé ?", "options": ["`['articles']`", "`['articles', { page }]`", "`page`", "Pas de clé"], "answer": 1, "why": "La clé contient tout ce dont dépend la requête."}], "td": {"title": "Catalogue avec TanStack Query", "enonce": "Réécris `Catalogue` avec TanStack Query, en réutilisant `api/livres.ts`.", "consignes": ["`useQuery` avec la clé `['livres', { page }]` et un bouton page suivante / précédente", "`useMutation` pour emprunter, qui invalide `['livres']` en cas de succès", "Message « Déjà emprunté » si la mutation échoue avec 409", "Aucun `useState` pour les données, le chargement ou l'erreur (un `useState` pour `page` est normal)"], "starter": {"lang": "tsx", "code": "import { useState } from 'react';\nimport { useQuery, useMutation, useQueryClient } from '@tanstack/react-query';\nimport { getLivresPage, emprunterLivre } from './api/livres';\n// getLivresPage(page) -> { items: Livre[], pages: number }\n\nexport default function Catalogue() {\n  const [page, setPage] = useState(1);\n  // à toi\n}"}, "hints": ["`invalidateQueries({ queryKey: ['livres'] })` invalide aussi `['livres', { page: 2 }]` : la correspondance se fait par préfixe.", "Erreur de mutation : `emprunt.error` ; avec axios, `axios.isAxiosError(emprunt.error) && emprunt.error.response?.status === 409`.", "`placeholderData: keepPreviousData` (import depuis `@tanstack/react-query`) garde la page précédente affichée pendant le chargement de la suivante."], "solution": {"lang": "tsx", "code": "import { useState } from 'react';\nimport axios from 'axios';\nimport { useQuery, useMutation, useQueryClient, keepPreviousData } from '@tanstack/react-query';\nimport { getLivresPage, emprunterLivre } from './api/livres';\n\nexport default function Catalogue() {\n  const [page, setPage] = useState(1);\n  const queryClient = useQueryClient();\n\n  const { data, isPending, isError } = useQuery({\n    queryKey: ['livres', { page }],\n    queryFn: () => getLivresPage(page),\n    placeholderData: keepPreviousData,\n  });\n\n  const emprunt = useMutation({\n    mutationFn: (livreId: number) =>\n      emprunterLivre(livreId, new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10)),\n    onSuccess: () => queryClient.invalidateQueries({ queryKey: ['livres'] }),\n  });\n\n  if (isPending) return <p>Chargement…<\/p>;\n  if (isError) return <p role=\"alert\">Impossible de charger les livres<\/p>;\n\n  const conflit = axios.isAxiosError(emprunt.error) && emprunt.error.response?.status === 409;\n\n  return (\n    <section>\n      {emprunt.isError && <p role=\"alert\">{conflit ? 'Déjà emprunté' : \"L'emprunt a échoué\"}<\/p>}\n      <ul>\n        {data.items.map((l) => (\n          <li key={l.id}>\n            {l.titre}{' '}\n            {l.disponible ? (\n              <button\n                onClick={() => emprunt.mutate(l.id)}\n                disabled={emprunt.isPending && emprunt.variables === l.id}\n              >\n                Emprunter\n              <\/button>\n            ) : (\n              <em>emprunté<\/em>\n            )}\n          <\/li>\n        ))}\n      <\/ul>\n      <button onClick={() => setPage((p) => p - 1)} disabled={page === 1}>Précédent<\/button>\n      <span> {page} / {data.pages} <\/span>\n      <button onClick={() => setPage((p) => p + 1)} disabled={page >= data.pages}>Suivant<\/button>\n    <\/section>\n  );\n}"}, "checks": ["Revenir à une page déjà vue s'affiche instantanément (cache)", "Après un emprunt, le livre passe à « emprunté » sans code de mise à jour manuelle"]}}, {"id": "next-routing", "track": "next", "title": "App Router : dossiers = routes", "minutes": 15, "goal": "Savoir quelle URL produit quel fichier, et à quoi servent layout, loading et error.", "why": "Next.js remplace la configuration des routes par une convention de dossiers : sans la connaître, on ne s'y retrouve pas.", "flow": ["Chaque **dossier** de `app/` = un segment d'URL", "`page.tsx` rend ce segment **accessible**", "`layout.tsx` **enveloppe** les pages du dossier et de ses sous-dossiers", "`[slug]` = segment **dynamique**, reçu dans `params`"], "points": ["`app/blog/page.tsx` → `/blog` ; `app/blog/[slug]/page.tsx` → `/blog/mon-article`.", "Un layout **reste monté** quand on navigue entre ses pages enfants.", "Fichiers spéciaux : `loading.tsx` (pendant le chargement), `error.tsx` (en cas d'erreur, composant client), `not-found.tsx`.", "`(groupe)` : un dossier entre parenthèses organise sans changer l'URL.", "Depuis Next 15, `params` est une **Promise** : `const { slug } = await params`.", "Navigation interne : `<Link href=\"/blog\">` (préchargement, pas de rechargement complet)."], "pitfalls": ["Un dossier sans `page.tsx` n'est pas une route.", "`<a>` pour la navigation interne : rechargement complet de l'app."], "example": {"lang": "tsx", "code": "// Arborescence\n// app/\n// ├── layout.tsx          -> enveloppe tout le site\n// ├── page.tsx            -> /\n// └── blog/\n//     ├── layout.tsx      -> enveloppe /blog et /blog/*\n//     ├── page.tsx        -> /blog\n//     ├── loading.tsx     -> affiché pendant le chargement\n//     └── [slug]/\n//         ├── page.tsx    -> /blog/n-importe-quoi\n//         └── not-found.tsx\n\n// app/blog/[slug]/page.tsx\nimport { notFound } from 'next/navigation';\nimport { getPost } from '@/lib/posts';\n\nexport default async function PostPage({\n  params,\n}: {\n  params: Promise<{ slug: string }>;\n}) {\n  const { slug } = await params;\n  const post = await getPost(slug);\n  if (!post) notFound();\n\n  return (\n    <article>\n      <h1>{post.title}<\/h1>\n      <p>{post.body}<\/p>\n    <\/article>\n  );\n}", "notes": ["La page est `async` : elle attend ses données côté serveur.", "`notFound()` affiche le `not-found.tsx` le plus proche.", "`@/` est un alias vers la racine du projet (configuré dans tsconfig)."]}, "quiz": [{"q": "Quel fichier crée la route `/compte/parametres` ?", "options": ["app/compte/parametres.tsx", "app/compte/parametres/page.tsx", "pages/compte.tsx", "app/(compte)/page.tsx"], "answer": 1, "why": "Un dossier par segment, et un `page.tsx` pour le rendre accessible."}, {"q": "`app/(marketing)/a-propos/page.tsx` donne quelle URL ?", "options": ["/marketing/a-propos", "/a-propos", "Aucune", "Une erreur"], "answer": 1, "why": "Les parenthèses n'apparaissent pas dans l'URL."}, {"q": "De /blog/a vers /blog/b, `app/blog/layout.tsx`…", "options": ["est re-monté", "reste monté, seule la page change", "est supprimé", "recharge la page"], "answer": 1, "why": "C'est pour ça qu'un layout est idéal pour une navigation ou une sidebar."}], "td": {"title": "Structure d'une boutique", "enonce": "Crée l'arborescence d'une petite boutique.", "consignes": ["`/` accueil, `/produits` liste, `/produits/[id]` détail", "Un layout commun avec une barre de navigation (`<Link>`)", "`/produits/[id]` appelle `notFound()` si le produit n'existe pas", "Un `loading.tsx` pour `/produits`", "Groupe `(compte)` avec `/connexion` et `/inscription` qui partagent un layout centré"], "starter": {"lang": "plaintext", "code": "app/\n├── layout.tsx\n├── page.tsx\n└── ...  (à toi)"}, "hints": ["Le layout centré va dans `app/(compte)/layout.tsx`.", "Données de test : un tableau `produits` dans `lib/produits.ts` avec une fonction `getProduit(id)`."], "solution": {"lang": "tsx", "code": "// app/\n// ├── layout.tsx                 nav avec <Link>\n// ├── page.tsx                   /\n// ├── produits/\n// │   ├── page.tsx               /produits\n// │   ├── loading.tsx\n// │   └── [id]/page.tsx          /produits/:id\n// └── (compte)/\n//     ├── layout.tsx             layout centré\n//     ├── connexion/page.tsx     /connexion\n//     └── inscription/page.tsx   /inscription\n\n// app/layout.tsx\nimport Link from 'next/link';\n\nexport default function RootLayout({ children }: { children: React.ReactNode }) {\n  return (\n    <html lang=\"fr\">\n      <body>\n        <nav>\n          <Link href=\"/\">Accueil<\/Link> <Link href=\"/produits\">Produits<\/Link>{' '}\n          <Link href=\"/connexion\">Connexion<\/Link>\n        <\/nav>\n        {children}\n      <\/body>\n    <\/html>\n  );\n}\n\n// app/produits/[id]/page.tsx\nimport { notFound } from 'next/navigation';\nimport { getProduit } from '@/lib/produits';\n\nexport default async function ProduitPage({ params }: { params: Promise<{ id: string }> }) {\n  const { id } = await params;\n  const produit = await getProduit(id);\n  if (!produit) notFound();\n  return <h1>{produit.nom}<\/h1>;\n}\n\n// app/(compte)/layout.tsx\nexport default function CompteLayout({ children }: { children: React.ReactNode }) {\n  return <div style={{ maxWidth: 400, margin: '4rem auto' }}>{children}<\/div>;\n}"}, "checks": ["`/produits/inexistant` affiche la page 404", "L'URL `/connexion` ne contient pas « compte »"]}}, {"id": "next-server-client", "track": "next", "title": "Server & Client Components", "minutes": 15, "goal": "Savoir où s'exécute chaque composant et où placer `'use client'`.", "why": "Par défaut, tout est rendu côté serveur : rapide et sûr, mais `useState` et `onClick` n'y fonctionnent pas.", "flow": ["Par défaut, un composant est un **Server Component** : exécuté sur le serveur, aucun JS envoyé", "`'use client'` en haut d'un fichier crée une **frontière** : ce fichier et ce qu'il importe partent au navigateur", "Les props qui traversent la frontière doivent être **sérialisables**", "Un Server Component peut **contenir** des Client Components"], "points": ["Serveur : accès direct à la base et aux secrets, `async/await` dans le composant.", "Client : state, effets, événements, APIs du navigateur.", "Place `'use client'` **le plus bas possible** : sur le bouton, pas sur toute la page.", "Props vers un Client Component : données simples (pas de fonctions, sauf les Server Actions).", "`children` permet de mettre du contenu serveur **à l'intérieur** d'un composant client."], "pitfalls": ["`'use client'` dans le layout racine : tout le site devient client.", "Importer un module qui contient des secrets dans un fichier client."], "example": {"lang": "tsx", "code": "// app/produits/page.tsx  (Server Component)\nimport { db } from '@/lib/db';\nimport AddToCart from './AddToCart';\n\nexport default async function ProduitsPage() {\n  const produits = await db.produit.findMany();   // directement en base\n\n  return (\n    <ul>\n      {produits.map((p) => (\n        <li key={p.id}>\n          {p.nom} – {p.prix} €\n          <AddToCart produitId={p.id} />\n        <\/li>\n      ))}\n    <\/ul>\n  );\n}\n\n// app/produits/AddToCart.tsx  (Client Component)\n'use client';\nimport { useState } from 'react';\n\nexport default function AddToCart({ produitId }: { produitId: string }) {\n  const [ajoute, setAjoute] = useState(false);\n  return (\n    <button onClick={() => setAjoute(true)} disabled={ajoute}>\n      {ajoute ? 'Ajouté' : 'Ajouter'}\n    <\/button>\n  );\n}", "notes": ["La liste et l'accès à la base restent sur le serveur.", "Seul le petit bouton est envoyé au navigateur.", "`produitId` est une chaîne : sérialisable, donc il traverse la frontière."]}, "quiz": [{"q": "Un composant sans `'use client'` peut-il utiliser `useState` ?", "options": ["Oui", "Non, c'est un Server Component", "Oui en dev", "Seulement s'il est async"], "answer": 1, "why": "Le state n'existe que dans le navigateur."}, {"q": "Où placer `'use client'` idéalement ?", "options": ["Dans le layout racine", "Sur le plus petit composant qui a besoin d'interactivité", "Dans chaque fichier", "Dans next.config"], "answer": 1, "why": "Moins de code client = page plus légère."}, {"q": "Peut-on passer une fonction `onSelect` d'un Server Component à un Client Component ?", "options": ["Oui", "Non, une fonction n'est pas sérialisable (sauf Server Action)", "Oui avec JSON.stringify", "Seulement en async"], "answer": 1, "why": "Le serveur envoie des données au navigateur, pas du code arbitraire."}], "td": {"title": "Page article interactive", "enonce": "Construis une page article où seuls les morceaux interactifs sont côté client.", "consignes": ["`app/articles/[id]/page.tsx` (serveur) charge l'article et ses commentaires", "`LikeButton` (client) avec un compteur local", "`Commentaires` repliable (client) qui reçoit la liste chargée côté serveur", "Aucun `'use client'` dans `page.tsx`"], "starter": {"lang": "tsx", "code": "// app/articles/[id]/page.tsx\nimport { getArticle, getCommentaires } from '@/lib/articles';\n\nexport default async function ArticlePage({ params }: { params: Promise<{ id: string }> }) {\n  // à toi\n}"}, "hints": ["`LikeButton` et `Commentaires` vont dans deux fichiers avec `'use client'` en première ligne.", "Passe les commentaires en prop : `<Commentaires items={commentaires} />` (tableau d'objets simples)."], "solution": {"lang": "tsx", "code": "// app/articles/[id]/page.tsx  (serveur)\nimport { notFound } from 'next/navigation';\nimport { getArticle, getCommentaires } from '@/lib/articles';\nimport LikeButton from './LikeButton';\nimport Commentaires from './Commentaires';\n\nexport default async function ArticlePage({ params }: { params: Promise<{ id: string }> }) {\n  const { id } = await params;\n  const [article, commentaires] = await Promise.all([getArticle(id), getCommentaires(id)]);\n  if (!article) notFound();\n\n  return (\n    <article>\n      <h1>{article.titre}<\/h1>\n      <p>{article.contenu}<\/p>\n      <LikeButton initial={article.likes} />\n      <Commentaires items={commentaires} />\n    <\/article>\n  );\n}\n\n// app/articles/[id]/LikeButton.tsx\n'use client';\nimport { useState } from 'react';\n\nexport default function LikeButton({ initial }: { initial: number }) {\n  const [likes, setLikes] = useState(initial);\n  return <button onClick={() => setLikes((l) => l + 1)}>{likes} j'aime<\/button>;\n}\n\n// app/articles/[id]/Commentaires.tsx\n'use client';\nimport { useState } from 'react';\n\ntype Commentaire = { id: string; auteur: string; texte: string };\n\nexport default function Commentaires({ items }: { items: Commentaire[] }) {\n  const [ouvert, setOuvert] = useState(false);\n  return (\n    <section>\n      <button onClick={() => setOuvert((o) => !o)}>\n        {ouvert ? 'Masquer' : `Voir les ${items.length} commentaires`}\n      <\/button>\n      {ouvert && <ul>{items.map((c) => <li key={c.id}><b>{c.auteur}<\/b> : {c.texte}<\/li>)}<\/ul>}\n    <\/section>\n  );\n}"}, "checks": ["`page.tsx` n'a pas `'use client'`", "Les deux requêtes partent en parallèle"]}}, {"id": "next-data", "track": "next", "title": "Données & cache", "minutes": 15, "goal": "Charger les données côté serveur et choisir entre statique, revalidé et dynamique.", "why": "Mal réglé, le cache affiche des données périmées, ou au contraire recalcule tout à chaque visite.", "flow": ["Le Server Component **attend** ses données (`await`)", "Next décide si la page est **statique** (générée une fois) ou **dynamique** (à chaque requête)", "`revalidate` = statique, **regénérée** au plus toutes les N secondes", "`revalidatePath` / `revalidateTag` **invalident** à la demande après une écriture"], "points": ["Lire les cookies, les headers ou `searchParams` rend la page dynamique.", "`fetch(url, { next: { revalidate: 60 } })` ou `export const revalidate = 60` dans la page.", "Depuis Next 15, `fetch` n'est **plus mis en cache par défaut**. Next 16 ajoute la directive `'use cache'` (Cache Components) : vérifie la doc de ta version.", "Lance les requêtes indépendantes **en parallèle** avec `Promise.all`.", "`<Suspense>` affiche la page tout de suite et diffuse la partie lente quand elle est prête."], "pitfalls": ["Enchaîner des `await` indépendants : les temps s'additionnent.", "Appeler sa propre route `/api` depuis un Server Component : appelle directement la fonction."], "example": {"lang": "tsx", "code": "// app/dashboard/page.tsx\nimport { Suspense } from 'react';\nimport { getUser } from '@/lib/auth';\nimport DernieresCommandes from './DernieresCommandes';\n\nexport const revalidate = 60; // page regénérée au plus toutes les 60 s\n\nasync function getStats() {\n  const res = await fetch('https://api.exemple.com/stats', { next: { revalidate: 60 } });\n  if (!res.ok) throw new Error('Stats indisponibles');\n  return res.json();\n}\n\nexport default async function Dashboard() {\n  const [stats, user] = await Promise.all([getStats(), getUser()]); // en parallèle\n\n  return (\n    <main>\n      <h1>Bonjour {user.name}<\/h1>\n      <p>{stats.ventes} ventes<\/p>\n      <Suspense fallback={<p>Chargement des commandes…<\/p>}>\n        <DernieresCommandes />\n      <\/Suspense>\n    <\/main>\n  );\n}", "notes": ["`Promise.all` : le temps total = la requête la plus lente, pas la somme.", "`DernieresCommandes` est un composant async : il arrive quand il est prêt.", "Si `getStats` lève une erreur, le `error.tsx` le plus proche s'affiche."]}, "quiz": [{"q": "Depuis Next 15, `fetch(url)` sans option dans un Server Component est…", "options": ["mis en cache pour toujours", "non mis en cache par défaut", "interdit", "mis en cache 60 s"], "answer": 1, "why": "Il faut maintenant demander le cache explicitement."}, {"q": "Deux requêtes indépendantes de 1 s chacune. Avec deux `await` à la suite, la page attend…", "options": ["1 s", "2 s", "0,5 s", "Ça dépend du cache"], "answer": 1, "why": "Avec `Promise.all`, ce serait 1 s."}, {"q": "Après avoir ajouté un article via une Server Action, comment rafraîchir `/blog` ?", "options": ["Recharger le serveur", "`revalidatePath('/blog')`", "Vider le navigateur", "`router.refresh()` côté serveur"], "answer": 1, "why": "Ça invalide le cache de cette route."}], "td": {"title": "Blog avec cache", "enonce": "Règle le chargement et le cache d'un blog.", "consignes": ["`/blog` : liste revalidée toutes les 5 minutes", "`/blog/[slug]` : `generateStaticParams` pré-génère les 20 derniers articles", "Article et commentaires chargés **en parallèle**… sauf si tu mets les commentaires dans un `<Suspense>` (choisis et explique)", "Les commentaires s'affichent après l'article, sans bloquer la page"], "starter": {"lang": "tsx", "code": "// app/blog/page.tsx\nimport { getPosts } from '@/lib/posts';\n\nexport default async function BlogPage() {\n  // à toi\n}\n\n// app/blog/[slug]/page.tsx\n// à toi"}, "hints": ["`export const revalidate = 300;` dans `app/blog/page.tsx`.", "`export async function generateStaticParams() { return (await getPosts(20)).map(p => ({ slug: p.slug })); }`", "Un composant async `Commentaires` dans un `<Suspense>` laisse l'article s'afficher d'abord."], "solution": {"lang": "tsx", "code": "// app/blog/page.tsx\nimport Link from 'next/link';\nimport { getPosts } from '@/lib/posts';\n\nexport const revalidate = 300; // 5 minutes\n\nexport default async function BlogPage() {\n  const posts = await getPosts();\n  return (\n    <ul>\n      {posts.map((p) => <li key={p.slug}><Link href={`/blog/${p.slug}`}>{p.title}<\/Link><\/li>)}\n    <\/ul>\n  );\n}\n\n// app/blog/[slug]/page.tsx\nimport { Suspense } from 'react';\nimport { notFound } from 'next/navigation';\nimport { getPost, getPosts, getComments } from '@/lib/posts';\n\nexport async function generateStaticParams() {\n  const posts = await getPosts(20);\n  return posts.map((p) => ({ slug: p.slug }));\n}\n\nasync function Commentaires({ slug }: { slug: string }) {\n  const comments = await getComments(slug);\n  return <ul>{comments.map((c) => <li key={c.id}>{c.text}<\/li>)}<\/ul>;\n}\n\nexport default async function PostPage({ params }: { params: Promise<{ slug: string }> }) {\n  const { slug } = await params;\n  const post = await getPost(slug);\n  if (!post) notFound();\n\n  // Choix : Suspense plutôt que Promise.all.\n  // L'article s'affiche dès qu'il est prêt ; les commentaires arrivent ensuite.\n  return (\n    <article>\n      <h1>{post.title}<\/h1>\n      <p>{post.body}<\/p>\n      <Suspense fallback={<p>Chargement des commentaires…<\/p>}>\n        <Commentaires slug={slug} />\n      <\/Suspense>\n    <\/article>\n  );\n}"}, "checks": ["Tu sais dire quand `/blog` sera recalculée", "Un commentaire lent ne bloque pas l'affichage de l'article"]}}, {"id": "next-actions", "track": "next", "title": "Server Actions & formulaires", "minutes": 15, "goal": "Modifier des données depuis un formulaire sans écrire d'API.", "why": "Avant, il fallait une route API, un fetch côté client et la gestion des états. Une Server Action est une fonction serveur que le formulaire appelle directement.", "flow": ["Une fonction `async` marquée **`'use server'`**", "est passée à `<form action={…}>`", "À l'envoi, Next **l'exécute sur le serveur** avec le `FormData`", "Elle écrit en base puis appelle **`revalidatePath`** pour rafraîchir l'affichage"], "points": ["Ça fonctionne même avant que le JavaScript soit chargé.", "**Valide toujours** les données dans l'action (par exemple avec Zod) : c'est un point d'entrée public.", "Vérifie aussi l'**authentification** dans l'action.", "`useActionState` (React 19) récupère erreurs et état ; il donne aussi `pending` pour le bouton.", "`redirect('/…')` après une création réussie."], "pitfalls": ["Faire confiance aux champs cachés (`userId` dans un `<input type=\"hidden\">`).", "Oublier `revalidatePath` : la liste n'affiche pas le nouvel élément."], "example": {"lang": "tsx", "code": "// app/todos/actions.ts\n'use server';\nimport { revalidatePath } from 'next/cache';\nimport { db } from '@/lib/db';\n\nexport type State = { error?: string };\n\nexport async function addTodo(_prev: State, formData: FormData): Promise<State> {\n  const title = String(formData.get('title') ?? '').trim();\n  if (title.length < 3) return { error: '3 caractères minimum' };\n\n  await db.todo.create({ data: { title } });\n  revalidatePath('/todos');\n  return {};\n}\n\n// app/todos/TodoForm.tsx\n'use client';\nimport { useActionState } from 'react';\nimport { addTodo } from './actions';\n\nexport default function TodoForm() {\n  const [state, formAction, pending] = useActionState(addTodo, {});\n  return (\n    <form action={formAction}>\n      <input name=\"title\" required />\n      <button disabled={pending}>{pending ? 'Ajout…' : 'Ajouter'}<\/button>\n      {state.error && <p role=\"alert\">{state.error}<\/p>}\n    <\/form>\n  );\n}", "notes": ["`name=\"title\"` : c'est la clé lue avec `formData.get('title')`.", "L'action renvoie un état (erreur ou rien) que le formulaire affiche.", "`revalidatePath('/todos')` : la liste (Server Component) se recharge."]}, "quiz": [{"q": "Où s'exécute une fonction marquée `'use server'` ?", "options": ["Dans le navigateur", "Sur le serveur", "Les deux", "Dans un worker"], "answer": 1, "why": "Le navigateur envoie juste une requête ; le code reste sur le serveur."}, {"q": "Faut-il valider les données dans une Server Action si le champ a `required` ?", "options": ["Non", "Oui, toujours : n'importe qui peut appeler l'action", "Seulement en production", "Seulement avec TypeScript"], "answer": 1, "why": "`required` est une aide côté navigateur, pas une sécurité."}, {"q": "Après l'ajout, la liste ne montre pas le nouvel élément. Il manque probablement…", "options": ["`'use client'`", "`revalidatePath`", "`useEffect`", "`preventDefault`"], "answer": 1, "why": "Sans invalidation, la page garde sa version en cache."}], "td": {"title": "Commentaires d'article", "enonce": "Ajoute un formulaire de commentaire à une page article.", "consignes": ["Action `addComment(articleId, prevState, formData)` : auteur (2–50 caractères) et texte (5–500)", "Erreurs par champ renvoyées au formulaire", "`revalidatePath` de la page de l'article", "Le bouton affiche « Envoi… » pendant l'envoi", "L'`articleId` ne vient **pas** d'un champ caché : utilise `.bind`"], "starter": {"lang": "tsx", "code": "// app/articles/[id]/actions.ts\n'use server';\n\nexport async function addComment(/* à toi */) {}\n\n// app/articles/[id]/CommentForm.tsx\n'use client';\n\nexport default function CommentForm({ articleId }: { articleId: string }) {\n  // à toi\n}"}, "hints": ["`const action = addComment.bind(null, articleId);` lie l'id côté serveur.", "État : `{ errors?: { auteur?: string; texte?: string } }`", "`useActionState(action, {})`"], "solution": {"lang": "tsx", "code": "// app/articles/[id]/actions.ts\n'use server';\nimport { revalidatePath } from 'next/cache';\nimport { db } from '@/lib/db';\n\nexport type CommentState = { errors?: { auteur?: string; texte?: string } };\n\nexport async function addComment(\n  articleId: string,\n  _prev: CommentState,\n  formData: FormData,\n): Promise<CommentState> {\n  const auteur = String(formData.get('auteur') ?? '').trim();\n  const texte = String(formData.get('texte') ?? '').trim();\n\n  const errors: CommentState['errors'] = {};\n  if (auteur.length < 2 || auteur.length > 50) errors.auteur = 'Entre 2 et 50 caractères';\n  if (texte.length < 5 || texte.length > 500) errors.texte = 'Entre 5 et 500 caractères';\n  if (Object.keys(error
