<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier de code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Un seul thème clair, teinté bleu-gris. Layout : barre latérale repliable (parcours) | zone de travail. Un module = 4 étapes en onglets ; le TD a 3 niveaux. */
:root {
  --bg: #eef3f8;
  --surface: #fbfcfe;
  --surface-2: #e5ecf4;
  --ink: #1f2633;
  --muted: #5d6779;
  --line: #d6dfea;
  --accent: #3a5bd6;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9fc;
  --good: #1d8a4f; --good-soft: #e1f3e8;
  --warn: #a96d00; --warn-soft: #fbf0d9;
  --bad: #c83c3c;  --bad-soft: #fbe5e5;
  --t-violet: #6b55cc; --t-orange: #cf6a1d; --t-green: #18865f; --t-cyan: #13809f; --t-graphite: #4a5263;
  --t-rose: #c23f78; --t-olive: #6f7f1a; --t-blue: #2f63c9; --t-brick: #b8432f;
  --code-bg: #f4f7fb; --code-ink: #24292f; --code-line: #d6dfea;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.85rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; } h4 { font-size: 0.95rem; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100%; }
.side { align-self: start; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px 14px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--font-display); font-size: 1.1rem; }
.nav-main { display: flex; flex-direction: column; gap: 2px; }
.nav-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 500; }
.nav-link:hover { background: var(--surface-2); }
.nav-link.on { background: var(--accent-soft); color: var(--accent); }
.count { min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--warn); color: #fff; font: 600 12px/20px var(--font-body); text-align: center; font-variant-numeric: tabular-nums; }
.count.zero { background: var(--surface-2); color: var(--muted); }
.side-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 10px; }
.groups { display: flex; flex-direction: column; gap: 2px; margin-top: -8px; }
.track-group { display: flex; flex-direction: column; gap: 1px; }
.track-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--ink); font-weight: 600; font-size: 0.86rem; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; }
.track-head:hover { background: var(--surface-2); }
.track-head .tname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); flex: none; margin-right: 2px; transition: transform 0.15s; }
.track-group.open .chev { transform: rotate(45deg); }
.minibar { margin-left: 8px; width: 32px; height: 4px; border-radius: 9px; background: var(--surface-2); overflow: hidden; flex: none; }
.minibar i { display: block; height: 100%; background: var(--tc); }
.track-head .frac { margin-left: 6px; min-width: 30px; text-align: right; color: var(--muted); font-weight: 500; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.mods { display: flex; flex-direction: column; gap: 1px; padding: 2px 0 8px; }
.mod-link { display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 0.86rem; line-height: 1.35; }
.mod-link:hover { background: var(--surface-2); color: var(--ink); }
.mod-link.on { background: var(--surface-2); color: var(--ink); font-weight: 500; }
.mod-link.all { color: var(--accent); font-size: 0.8rem; padding-left: 35px; }
.st { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; position: relative; }
.st.started { border-color: var(--tc, var(--accent)); background: linear-gradient(90deg, var(--tc, var(--accent)) 50%, transparent 50%); }
.st.done { border-color: var(--good); background: var(--good); }
.st.due { border-color: var(--warn); background: var(--warn); }
.side-foot { margin-top: auto; font-size: 0.78rem; color: var(--muted); padding: 8px 10px 0; border-top: 1px solid var(--line); display: flex; gap: 7px; align-items: flex-start; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-top: 7px; flex: none; }
.sync-dot.ok { background: var(--good); } .sync-dot.err { background: var(--bad); } .sync-dot.local { background: var(--warn); }

/* Logo d'un parcours : image logos/<id>.svg|png si présente, sinon badge texte */
.tlogo { display: inline-flex; align-items: center; justify-content: center; flex: none; width: var(--ls, 20px); height: var(--ls, 20px); border-radius: 6px; overflow: hidden; }
.tlogo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.tlogo .tbadge { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; border-radius: inherit; background: color-mix(in srgb, var(--tc) 14%, transparent); color: var(--tc); font: 600 calc(var(--ls, 20px) * 0.42) var(--font-mono); letter-spacing: -0.02em; white-space: nowrap; }
.tlogo.nologo .tbadge { display: flex; }
.tlogo.nologo img { display: none; }

.topbar { display: none; }
main { padding: 32px clamp(16px, 4vw, 48px) 64px; min-width: 0; }
.wrap { max-width: 1020px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.prose { max-width: 75ch; display: flex; flex-direction: column; gap: 12px; line-height: 1.7; }
.prose p { margin: 0; }
.prose pre.code { max-width: none; }
.prose ul.points { margin: 2px 0; }
.prose h4 { margin-top: 6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.run { background: var(--good); border-color: var(--good); color: #fff; }
.btn.run:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 0.84rem; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.ai-only { display: none !important; }
body.has-ai .ai-only { display: inline-flex !important; }
body.has-ai .ai-block.ai-only { display: block !important; }
body.has-ai .no-ai { display: none !important; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: color-mix(in srgb, var(--tc, var(--accent)) 14%, transparent); color: var(--tc, var(--accent)); }
.pill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; }
.pill.new { background: var(--surface-2); color: var(--muted); }
.pill.started { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.due { background: var(--warn-soft); color: var(--warn); }
.pill.custom { background: var(--surface-2); color: var(--muted); }
.pill.lvl { background: var(--surface-2); color: var(--muted); }
.bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--tc, var(--accent)); border-radius: 99px; }
.big { font-family: var(--font-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.due-list { display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; }
.due-list a { color: var(--ink); text-decoration: none; display: flex; gap: 8px; align-items: center; }
.due-list a:hover { color: var(--accent); }

/* Accueil */
.home-hero { display: grid; grid-template-columns: minmax(330px, 1.15fr) minmax(0, 1.2fr) minmax(190px, 0.8fr); gap: 14px; align-items: stretch; }
.home-hero > .card, .stat-col > .card { min-width: 0; }
.stat-col { display: grid; grid-template-rows: 1fr 1fr; gap: 14px; }
.ring { position: relative; flex: none; }
.ring svg { display: block; }
.ring circle { transition: stroke-dasharray 0.6s ease; }
.ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ring-in b { font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.ring-in b small { font-size: 0.7em; color: var(--muted); font-weight: 600; }
.ring-in span { font-size: 0.78rem; color: var(--muted); }
.hero-ring { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
.hero-ring .ring-in b { font-size: 2rem; }
.kpis { display: flex; flex-direction: column; gap: 10px; }
.kpis div { display: flex; align-items: baseline; gap: 8px; }
.kpis b { font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; min-width: 2ch; }
.kpis span { color: var(--muted); font-size: 0.86rem; white-space: nowrap; }
.kpis div:nth-child(1) b { color: var(--good); }
.kpis div:nth-child(2) b { color: var(--accent); }
.next-card { display: flex; flex-direction: column; gap: 8px; justify-content: center; border-left: 4px solid var(--tc, var(--accent)); }
.next-card h2 { font-size: 1.25rem; }
.next-card .btn { align-self: flex-start; }
.stat-card { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 14px 16px; text-decoration: none; color: var(--ink); }
.stat-card .stat-num { grid-row: 1 / 3; }
.stat-link { font-size: 0.84rem; color: var(--accent); font-weight: 500; }
a.stat-card:hover { border-color: var(--accent); }
.stat-link.muted { color: var(--muted); font-weight: 400; }
.stat-num { font-family: var(--font-display); font-size: 2.3rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-num small { font-size: 0.45em; color: var(--muted); }
.stat-lbl { color: var(--muted); font-size: 0.88rem; }
.stat-card.warn .stat-num { color: var(--warn); }
.tr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.tr-ring { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: var(--r); text-decoration: none; color: var(--ink); font-size: 0.84rem; font-weight: 500; text-align: center; }
.tr-ring:hover { background: var(--surface-2); }
.tr-ring .ring-in .tlogo { --ls: 26px; }
.hm-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1 1 300px; min-width: 260px; max-width: 680px; }
.hm-months { display: grid; gap: 4px; font-size: 0.72rem; color: var(--muted); }
.hm-months span { white-space: nowrap; overflow: visible; }
.hm-grid { display: grid; gap: 4px; }
.hm-col { display: grid; gap: 4px; }
.hm { display: block; width: 100%; aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); }
.hm-legend .hm { width: 11px; }
.hm.l-1 { background: transparent; }
.hm.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); }
.hm.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--surface-2)); }
.hm.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--surface-2)); }
.hm.l4 { background: var(--accent); }
.hm-legend { display: flex; align-items: center; gap: 3px; font-size: 0.72rem; color: var(--muted); }
.hm-legend span { margin: 0 4px; }
.act-row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.act-stats { display: flex; flex-direction: column; gap: 12px; }
.act-stats div { display: flex; align-items: baseline; gap: 8px; }
.act-stats b { font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; min-width: 2.5ch; }
.act-stats span { color: var(--muted); font-size: 0.86rem; }

/* Roadmap */
.rm-head { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.rm-head .tlogo { --ls: 56px; border-radius: 14px; }
.rm-kpis { display: flex; gap: 22px; }
.rm-kpis div { display: flex; flex-direction: column; }
.rm-kpis b { font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rm-kpis span { font-size: 0.8rem; color: var(--muted); }
.roadmap { list-style: none; margin: 8px 0 0; padding: 0; position: relative; display: flex; flex-direction: column; }
.roadmap::before { content: ""; position: absolute; left: 50%; top: 14px; bottom: 30px; width: 4px; margin-left: -2px; border-radius: 4px; background: repeating-linear-gradient(to bottom, var(--line) 0 10px, transparent 10px 18px); }
.rm-start, .rm-end { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 1; }
.rm-start::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 0 5px color-mix(in srgb, var(--tc) 20%, var(--bg)); }
.rm-cap { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); background: var(--bg); padding: 2px 10px; border-radius: 99px; }
.rm-end { margin-top: 18px; }
.rm-goalnode { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; line-height: 1; background: var(--surface); border: 2px dashed var(--line); color: var(--muted); }
.rm-end.passed .rm-goalnode { background: var(--tc); border: 0; color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--tc) 35%, transparent); }
.rm-end.passed .rm-cap { color: var(--tc); }
.rm-item { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); align-items: center; padding: 14px 0; }
.rm-item::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: transparent; }
.rm-item.passed::before { background: var(--tc); }
.rm-item.passed + .rm-item:not(.passed)::before { background: linear-gradient(to bottom, var(--tc) 50%, transparent 50%); }
.rm-node { grid-column: 2; grid-row: 1; justify-self: center; position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font-display); background: var(--surface); border: 3px solid var(--line); color: var(--muted); }
.rm-item.started .rm-node { border-color: var(--tc); color: var(--tc); background: conic-gradient(color-mix(in srgb, var(--tc) 22%, var(--surface)) 0 50%, var(--surface) 50% 100%); }
.rm-item.done .rm-node { background: var(--tc); border-color: var(--tc); color: #fff; }
.rm-item.due .rm-node { background: var(--warn); border-color: var(--warn); color: #fff; }
.rm-item.here .rm-node { box-shadow: 0 0 0 6px color-mix(in srgb, var(--tc) 22%, transparent); animation: rm-pulse 2.2s ease-in-out infinite; }
@keyframes rm-pulse { 50% { box-shadow: 0 0 0 11px color-mix(in srgb, var(--tc) 8%, transparent); } }
.rm-card { grid-row: 1; position: relative; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; color: var(--ink); transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
.rm-card:hover { transform: translateY(-2px); border-color: var(--tc); box-shadow: 0 8px 22px color-mix(in srgb, var(--tc) 14%, transparent); }
.rm-item.left .rm-card { grid-column: 1; margin-right: 6px; }
.rm-item.right .rm-card { grid-column: 3; margin-left: 6px; }
.rm-item.left .rm-card::after, .rm-item.right .rm-card::after { content: ""; position: absolute; top: 50%; width: 14px; height: 2px; background: var(--line); }
.rm-item.left .rm-card::after { right: -21px; }
.rm-item.right .rm-card::after { left: -21px; }
.rm-item.here .rm-card { border: 2px solid var(--tc); box-shadow: 0 8px 26px color-mix(in srgb, var(--tc) 18%, transparent); }
.rm-item.done .rm-card { background: color-mix(in srgb, var(--tc) 5%, var(--surface)); }
.rm-flag { position: absolute; top: -11px; left: 14px; background: var(--tc); color: #fff; font-size: 0.72rem; font-weight: 600; padding: 2px 10px; border-radius: 99px; }
.rm-meta { display: flex; gap: 10px; align-items: center; font-size: 0.76rem; color: var(--muted); }
.rm-num { font: 600 0.76rem var(--font-mono); color: var(--tc); text-transform: uppercase; }
.rm-title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
.rm-goal { font-size: 0.86rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rm-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.rm-steps { display: flex; gap: 4px; align-items: center; }
.rm-steps i { width: 18px; height: 5px; border-radius: 9px; background: var(--surface-2); }
.rm-steps i.on { background: var(--tc); }
.rm-steps i.lv { width: 8px; height: 8px; border-radius: 50%; }
.rm-steps .sep { width: 1px; height: 10px; background: var(--line); margin: 0 3px; }

/* Module */
.mod-head { display: flex; flex-direction: column; gap: 8px; }
.mod-head .tlogo { --ls: 22px; }
.steps { display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.step-tab { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 0; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.step-tab .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--font-mono); background: var(--surface-2); color: var(--muted); }
.step-tab.ok .n { background: var(--good); color: #fff; }
.step-tab.on { color: var(--ink); border-bottom-color: var(--tc); }
.step-tab.on .n { background: var(--tc); color: #fff; }
.step-tab.ok.on .n { background: var(--good); }
.panel { display: flex; flex-direction: column; gap: 22px; }
.why { border-left: 3px solid var(--tc); padding: 4px 0 4px 14px; max-width: 75ch; }
.prereq { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.prereq summary { cursor: pointer; padding: 12px 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; list-style: none; }
.prereq summary::-webkit-details-marker { display: none; }
.prereq summary::before { content: ""; width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); transition: transform 0.15s; }
.prereq[open] summary::before { transform: rotate(45deg); }
.prereq summary .muted { font-weight: 400; }
.prereq dl { margin: 0; padding: 0 16px 14px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: 0.92rem; }
.prereq dt { font-weight: 600; color: var(--tc); }
.prereq dd { margin: 0; }
.mech { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, 0.8fr); gap: 18px; align-items: start; }
.flow-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: f; }
.flow-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 0.92rem; line-height: 1.45; align-items: start; }
.flow-list li::before { counter-increment: f; content: counter(f); width: 26px; height: 26px; border-radius: 50%; background: var(--tc); color: #fff; display: grid; place-items: center; font: 600 12px var(--font-mono); }
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; overflow-x: auto; }
.diagram svg { display: block; width: 100%; height: auto; min-width: var(--minw, 480px); font-family: var(--font-body); }
.diagram .cap { font-size: 0.82rem; color: var(--muted); padding: 8px 6px 0; }
.lesson { display: flex; flex-direction: column; gap: 10px; }
.lesson h2 { font-size: 1.2rem; }
.points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.points li { padding-left: 18px; position: relative; }
.points li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 7px; height: 7px; border-radius: 2px; background: var(--tc); }
.pitfalls { background: var(--bad-soft); border-radius: var(--r); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.pitfalls h3 { color: var(--bad); font-size: 0.9rem; }
.pitfalls ul { margin: 0; padding: 0 0 0 16px; display: flex; flex-direction: column; gap: 4px; }
.recap { background: color-mix(in srgb, var(--tc) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tc) 30%, transparent); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.recap h3 { color: var(--tc); font-size: 0.9rem; }
.recap ol { margin: 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 5px; font-size: 0.93rem; }
.ai-box { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.ai-out { font-size: 0.93rem; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.ai-out:empty { display: none; }
.ai-out pre { margin: 0; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; }
.field { padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
textarea.field { width: 100%; resize: vertical; }

/* Code : fichiers à onglets */
pre.code { margin: 0; border: 1px solid var(--code-line); background: var(--code-bg); color: var(--code-ink); border-radius: var(--r); padding: 14px 16px; overflow-x: auto; font: 13px/1.6 var(--font-mono); tab-size: 4; }
pre.code code { background: none; padding: 0; font-size: inherit; color: inherit; }
.files { border: 1px solid var(--code-line); border-radius: var(--r); overflow: hidden; background: var(--code-bg); }
.files-tabs { display: flex; gap: 2px; background: var(--surface-2); border-bottom: 1px solid var(--code-line); padding: 4px 4px 0; overflow-x: auto; }
.ftab { border: 0; background: transparent; padding: 6px 12px; font: 500 12.5px var(--font-mono); color: var(--muted); border-radius: 7px 7px 0 0; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.ftab .dir { opacity: 0.6; }
.ftab.on { background: var(--code-bg); color: var(--ink); }
.ftab.mod::after { content: "•"; color: var(--accent); }
.fpane { display: none; }
.fpane.on { display: block; }
.files pre.code { border: 0; border-radius: 0; }
.files .editor { border: 0; border-radius: 0; min-height: 320px; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword { color: #cf222e; }
.hljs-string, .hljs-regexp { color: #0a3069; }
.hljs-number, .hljs-literal { color: #0550ae; }
.hljs-comment { color: #6e7781; font-style: italic; }
.hljs-title, .hljs-title.function_ { color: #8250df; }
.hljs-variable, .hljs-template-variable { color: #953800; }
.hljs-attr, .hljs-attribute, .hljs-type, .hljs-title.class_, .hljs-built_in { color: #0550ae; }
.hljs-meta, .hljs-tag, .hljs-name, .hljs-symbol { color: #116329; }
.hljs-subst { color: var(--code-ink); }
.ex { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.notes { display: flex; flex-direction: column; gap: 10px; counter-reset: n; margin: 0; padding: 0; list-style: none; }
.notes li { counter-increment: n; display: grid; grid-template-columns: 24px 1fr; gap: 8px; font-size: 0.9rem; }
.notes li::before { content: counter(n); width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font: 600 12px var(--font-mono); color: var(--tc); }

/* Quiz */
.q { display: flex; flex-direction: column; gap: 10px; }
.q-title { font-weight: 600; display: flex; gap: 10px; }
.q-title .k { font: 600 13px var(--font-mono); color: var(--tc); padding-top: 1px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.4; }
.opt:hover:not([disabled]) { border-color: var(--tc); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { font-size: 0.9rem; padding: 8px 12px; border-radius: 8px; }
.feedback.right { background: var(--good-soft); }
.feedback.wrong { background: var(--bad-soft); }
.feedback b { margin-right: 4px; }
.score { display: flex; align-items: center; gap: 14px; }

/* TD */
.levels { display: flex; gap: 8px; flex-wrap: wrap; }
.lvl-tab { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-width: 180px; text-align: left; flex: 1; }
.lvl-tab b { font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
.lvl-tab span { font-size: 0.8rem; color: var(--muted); }
.lvl-tab.on { border-color: var(--tc); box-shadow: inset 0 0 0 1px var(--tc); }
.lvl-tab.ok b::after { content: "✓"; color: var(--good); font-weight: 700; }
.consignes { margin: 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 5px; }
.editor { width: 100%; min-height: 300px; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--code-line); border-radius: var(--r); padding: 14px 16px; font: 13px/1.6 var(--font-mono); tab-size: 4; resize: vertical; white-space: pre; overflow: auto; display: block; }
.editor:focus { outline: 2px solid var(--tc); outline-offset: -2px; }
.hint { background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.checks label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; font-size: 0.92rem; }
.checks input { margin-top: 4px; accent-color: var(--good); }
.solution-warn { font-size: 0.86rem; color: var(--muted); }
.done-banner { display: flex; align-items: center; gap: 12px; background: var(--good-soft); border-radius: var(--r); padding: 12px 16px; }
.done-banner b { color: var(--good); }
.nav-steps { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.workbench { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 14px; align-items: start; }
.workbench.single { grid-template-columns: minmax(0, 1fr); }
.runout { display: flex; flex-direction: column; gap: 10px; }
.console { background: #1b1f27; color: #d7dce8; border-radius: var(--r); padding: 12px 14px; font: 12.5px/1.55 var(--font-mono); white-space: pre-wrap; word-break: break-word; min-height: 60px; max-height: 320px; overflow: auto; margin: 0; }
.console .err { color: #ff8585; }
.console .warnl { color: #ffd37a; }
.console .dim { color: #8a93a6; }
.preview { border: 1px solid var(--line); border-radius: var(--r); background: #fff; overflow: hidden; }
.preview iframe { width: 100%; height: 300px; border: 0; display: block; }
.tests { display: flex; flex-direction: column; gap: 4px; }
.tcase { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; padding: 6px 10px; border-radius: 7px; background: var(--surface-2); }
.tcase.pass { background: var(--good-soft); } .tcase.pass::before { content: "✓"; color: var(--good); font-weight: 700; }
.tcase.fail { background: var(--bad-soft); } .tcase.fail::before { content: "✗"; color: var(--bad); font-weight: 700; }
.tcase .detail { color: var(--muted); font-size: 0.84rem; display: block; }
.tsum { font-weight: 600; font-size: 0.9rem; }
.tsum.ok { color: var(--good); } .tsum.ko { color: var(--bad); }
.expected { border-left: 3px solid var(--line); padding-left: 14px; }
.out-head { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.loading-php { font-size: 0.86rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }

/* Révision */
.rev-card { display: flex; flex-direction: column; gap: 14px; border-top: 3px solid var(--tc); }
.recall-flow { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; }
.progress-dots { display: flex; gap: 5px; }
.progress-dots i { width: 22px; height: 5px; border-radius: 99px; background: var(--surface-2); }
.progress-dots i.on { background: var(--accent); }
.progress-dots i.ok { background: var(--good); }
.progress-dots i.ko { background: var(--warn); }
.sched { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.sched td, .sched th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.sched th { font-weight: 600; color: var(--muted); font-size: 0.8rem; }
.sched td.num { font-variant-numeric: tabular-nums; }

.form-grid { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 10px 14px; align-items: center; }
.form-grid label { font-weight: 500; font-size: 0.9rem; }
.swatches { display: flex; gap: 6px; }
.swatch { width: 26px; height: 26px; border-radius: 7px; border: 2px solid transparent; background: var(--tc); cursor: pointer; }
.swatch.on { border-color: var(--ink); }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; display: inline-block; }
@keyframes s { to { transform: rotate(360deg); } }
.err { color: var(--bad); font-size: 0.9rem; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 0.92rem; box-shadow: 0 6px 20px rgb(0 0 0 / 0.2); z-index: 50; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }

@media (max-width: 1280px) { .home-hero { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat-col { grid-column: 1 / -1; grid-template-rows: none; grid-template-columns: 1fr 1fr; } }
@media (max-width: 1000px) { .home-hero { grid-template-columns: minmax(0, 1fr); } .ex, .mech, .workbench { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-102%); transition: transform 0.2s; box-shadow: 0 0 40px rgb(0 0 0 / 0.25); }
  body.menu-open .side { transform: none; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  main { padding-top: 20px; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .prereq dl { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .prereq dd { margin-bottom: 8px; }
}
@media (max-width: 760px) {
  .roadmap::before { left: 22px; }
  .rm-start, .rm-end { align-items: flex-start; padding-left: 0; }
  .rm-start::before { margin-left: 15px; }
  .rm-end .rm-goalnode { margin-left: -5px; }
  .rm-item { grid-template-columns: 44px minmax(0, 1fr); column-gap: 18px; }
  .rm-item::before { left: 22px; }
  .rm-node { grid-column: 1; }
  .rm-item.left .rm-card, .rm-item.right .rm-card { grid-column: 2; margin: 0; }
  .rm-item.left .rm-card::after, .rm-item.right .rm-card::after { left: -18px; right: auto; width: 14px; }
}
@media (max-width: 520px) { .stat-col { grid-template-columns: minmax(0, 1fr); } .hero-ring { flex-direction: column; } .kpis { flex-direction: row; gap: 18px; } .kpis div { flex-direction: column; align-items: center; gap: 0; } .act-stats { flex-direction: row; gap: 18px; } .act-stats div { flex-direction: column; gap: 0; } .hm-months { font-size: 0.62rem; } h1 { font-size: 1.5rem; } .lvl-tab { min-width: 0; } }
</style>
</head>

<script>
"use strict";
const DATA = {"tracks": [{"id": "php", "name": "PHP orienté objet", "short": "PHP POO", "color": "violet", "desc": "Classes, encapsulation, héritage, interfaces, autoload, injection de dépendances."}, {"id": "doctrine", "name": "Doctrine ORM", "short": "Doctrine", "color": "orange", "desc": "Entités, migrations, persist/flush, repositories, relations, N+1."}, {"id": "dto", "name": "DTO avec Symfony", "short": "DTO", "color": "blue", "desc": "Recevoir et renvoyer du JSON proprement : DTO d'entrée, validation, sortie, filtres."}, {"id": "arch", "name": "Architecture : qui fait quoi", "short": "Architecture", "color": "olive", "desc": "Contrôleur, DTO, service, entité, repository : leurs rôles, leurs liens, et le trajet complet React → Symfony."}, {"id": "ddd", "name": "DDD (bonus)", "short": "DDD (bonus)", "color": "green", "desc": "Pour aller plus loin : value objects, entités riches, agrégats, architecture en couches."}, {"id": "react", "name": "React", "short": "React", "color": "cyan", "desc": "Composants, state, formulaires, effets, hooks personnalisés."}, {"id": "data", "name": "React : données & API", "short": "Données & API", "color": "rose", "desc": "Requêtes HTTP, fetch et axios, mutations, couche API, TanStack Query."}, {"id": "next", "name": "Next.js (App Router)", "short": "Next.js", "color": "graphite", "desc": "Routes, Server/Client Components, cache, Server Actions, API."}, {"id": "git", "name": "Git & GitHub", "short": "Git & GitHub", "color": "brick", "desc": "Le modèle de Git, merge, rebase, revenir en arrière, Conventional Commits, Pull Requests, outils."}], "modules": [{"id": "php-classes", "track": "php", "title": "Classes & objets", "minutes": 15, "goal": "Savoir créer une classe, l'instancier et comprendre ce que contient un objet.", "why": "Sans objets, les données et les fonctions qui les manipulent vivent séparément : n'importe quel code peut tout modifier, et ça finit par casser.", "flow": ["Tu écris la **classe** : le plan (propriétés + méthodes)", "`new Produit(...)` crée un **objet** en mémoire", "Le **constructeur** remplit son état initial", "Les **méthodes** lisent et modifient cet état via `$this`"], "points": ["Une classe ne fait rien seule. Chaque `new` crée un objet **indépendant** avec ses propres valeurs.", "`$this` = l'objet sur lequel la méthode est appelée.", "Depuis PHP 8, la **promotion de constructeur** déclare et remplit une propriété en une ligne : `public function __construct(private string $nom) {}`.", "Un objet passé à une fonction n'est **pas copié** : si la fonction le modifie, l'original est modifié. Pour une copie : `clone`."], "pitfalls": ["Oublier `$this->` : `$nom` tout seul est une variable locale, pas la propriété.", "Confondre `->` (objet) et `::` (statique, constante)."], "example": {"files": [{"path": "src/Produit.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nclass Produit\n{\n    public function __construct(\n        private string $nom,\n        private float $prixHT,\n    ) {}\n\n    public function prixTTC(float $tva = 0.2): float\n    {\n        return round($this->prixHT * (1 + $tva), 2);\n    }\n\n    public function nom(): string\n    {\n        return $this->nom;\n    }\n}\n\n$clavier = new Produit('Clavier', 50.0);\n$souris  = new Produit('Souris', 20.0);\n\necho $clavier->prixTTC(); // 60\necho $souris->nom();      // Souris"}], "notes": ["`declare(strict_types=1)` : PHP refuse un mauvais type au lieu de le convertir en silence.", "`private string $nom` dans le constructeur déclare ET assigne la propriété.", "`$clavier` et `$souris` : même plan, deux états différents."]}, "quiz": [{"q": "Que se passe-t-il à chaque `new Produit(...)` ?", "options": ["La classe est rechargée", "Un nouvel objet indépendant est créé et son constructeur est appelé", "Le même objet est réutilisé", "Les propriétés statiques sont remises à zéro"], "answer": 1, "why": "Chaque `new` crée un objet distinct puis exécute `__construct`."}, {"q": "Dans une méthode, `$this` désigne…", "options": ["La classe", "L'objet sur lequel la méthode est appelée", "La classe parente", "Le dernier objet créé"], "answer": 1, "why": "`$clavier->prixTTC()` : dans `prixTTC`, `$this` est `$clavier`."}, {"q": "Une fonction reçoit l'objet `$p` et appelle `$p->renommer('X')`. L'objet d'origine…", "options": ["reste inchangé, PHP a copié l'objet", "est modifié : c'est le même objet", "provoque une erreur", "est détruit"], "answer": 1, "why": "Les objets ne sont pas copiés au passage en paramètre. Pour une copie, il faut `clone`."}], "prereq": [{"term": "Variable", "def": "Une boîte avec un nom qui contient une valeur : `$prix = 50;`. En PHP, les variables commencent par `$`."}, {"term": "Fonction", "def": "Un bloc de code réutilisable qui reçoit des paramètres et renvoie un résultat : `function tva(float $p): float { return $p * 0.2; }`."}, {"term": "Type", "def": "La nature d'une valeur : `string` (texte), `int` (entier), `float` (décimal), `bool` (vrai/faux), `array` (liste). On peut l'écrire devant un paramètre pour que PHP vérifie."}, {"term": "Tableau associatif", "def": "Un tableau dont les cases ont un nom : `['nom' => 'Clavier', 'prix' => 50]`. C'est ce qu'on utilisait avant les objets pour regrouper des données."}, {"term": "Exception", "def": "Une erreur qu'on **lance** (`throw`) pour arrêter le code quand quelque chose est impossible. On la rattrape avec `try / catch`."}], "diagram": {"nodes": [{"id": "cls", "col": 0, "row": 0, "label": "class Produit", "kind": "doc", "sub": "le plan"}, {"id": "new1", "col": 1, "row": 0, "label": "new Produit('Clavier', 50)", "kind": "pill"}, {"id": "obj1", "col": 2, "row": 0, "label": "$clavier", "kind": "box", "sub": "nom = Clavier\nprixHT = 50"}, {"id": "new2", "col": 1, "row": 1, "label": "new Produit('Souris', 20)", "kind": "pill"}, {"id": "obj2", "col": 2, "row": 1, "label": "$souris", "kind": "box", "sub": "nom = Souris\nprixHT = 20"}, {"id": "call", "col": 3, "row": 0, "label": "$clavier->prixTTC()", "kind": "pill", "sub": "60", "color": "good"}], "edges": [{"from": "cls", "to": "new1", "label": "1 plan"}, {"from": "new1", "to": "obj1", "label": "2 crée"}, {"from": "cls", "to": "new2"}, {"from": "new2", "to": "obj2"}, {"from": "obj1", "to": "call", "label": "3 méthode"}], "caption": "Une classe, deux objets indépendants. La méthode travaille sur l'objet qui l'appelle (`$this`)."}, "lessons": [{"title": "Pourquoi des objets ?", "body": "Imagine que tu gères des produits avec des tableaux :\n\n```php\n$clavier = ['nom' => 'Clavier', 'prixHT' => 50.0];\n$souris  = ['nom' => 'Souris',  'prixHT' => 20.0];\n\nfunction prixTTC(array $produit): float\n{\n    return $produit['prixHT'] * 1.2;\n}\n```\n\nÇa marche, mais rien n'empêche quelqu'un d'écrire `$clavier['prixHT'] = -5;` ou d'oublier la clé `prixHT` dans un nouveau produit. Les **données** (le tableau) et le **code qui les manipule** (la fonction) vivent séparément : n'importe qui peut casser l'un sans que l'autre s'en aperçoive.\n\nUn **objet** regroupe les deux : ses données (les **propriétés**) et les opérations qu'on a le droit de faire dessus (les **méthodes**). La **classe** est le plan de construction : elle décrit ce que chaque objet contiendra et saura faire."}, {"title": "Classe, objet, constructeur", "body": "La classe se déclare une fois. Chaque `new` fabrique un **objet** à partir du plan, en appelant le **constructeur** `__construct`, qui remplit l'état de départ.\n\n```php\nclass Produit\n{\n    private string $nom;\n    private float $prixHT;\n\n    public function __construct(string $nom, float $prixHT)\n    {\n        $this->nom = $nom;        // \"dans CET objet, la propriété nom vaut $nom\"\n        $this->prixHT = $prixHT;\n    }\n}\n\n$clavier = new Produit('Clavier', 50.0);   // appelle __construct('Clavier', 50.0)\n$souris  = new Produit('Souris', 20.0);    // un deuxième objet, indépendant\n```\n\nDeux objets de la même classe ont la **même forme** (les mêmes propriétés) mais chacun a **ses propres valeurs**. Modifier `$clavier` ne touche jamais `$souris`.\n\nDepuis PHP 8, la **promotion de constructeur** raccourcit tout ça : écrire `private string $nom` directement dans les paramètres déclare la propriété et l'assigne en une ligne. Le code de l'exemple utilise cette forme courte ; les deux sont équivalentes."}, {"title": "$this : « l'objet sur lequel on travaille »", "body": "Dans une méthode, `$this` désigne l'objet qui a reçu l'appel. Quand tu écris `$clavier->prixTTC()`, à l'intérieur de `prixTTC`, `$this` **est** `$clavier`. Quand tu écris `$souris->prixTTC()`, `$this` est `$souris`. La méthode n'est écrite qu'une fois, mais elle s'adapte à l'objet qui l'appelle.\n\n- `$this->prixHT` : la propriété de l'objet courant.\n- `$prixHT` tout seul : une variable **locale** à la méthode, qui n'a rien à voir avec la propriété. C'est l'erreur n°1 des débutants.\n- `->` sert à accéder à une propriété ou une méthode **d'un objet** ; `::` sert pour ce qui appartient à la **classe** elle-même (constantes, méthodes statiques, `parent::`)."}, {"title": "Les objets ne sont pas copiés", "body": "Avec un tableau, passer la valeur à une fonction en fait une **copie** : la fonction peut modifier sa copie sans toucher l'original. Avec un objet, c'est différent : la variable contient une **référence** vers l'objet. Si tu passes `$clavier` à une fonction et que celle-ci appelle `$p->renommer('X')`, c'est **le même objet** qui est modifié.\n\n```php\nfunction renommerEnX(Produit $p): void { $p->renommer('X'); }\n\nrenommerEnX($clavier);\necho $clavier->nom(); // X  (l'original a changé)\n```\n\nC'est voulu : ça évite de copier de gros objets. Quand tu veux vraiment une copie indépendante, tu l'écris explicitement : `$copie = clone $clavier;`.\n\n`declare(strict_types=1);` en haut d'un fichier demande à PHP de refuser un mauvais type (par exemple la chaîne `\"50\"` là où on attend un `float`) au lieu de le convertir en silence. Mets-le toujours : les erreurs apparaissent tout de suite au lieu de se cacher."}], "recap": ["Une **classe** est un plan ; `new` fabrique un **objet** à partir de ce plan en appelant `__construct`.", "Chaque objet a ses **propres valeurs** ; deux `new` donnent deux objets indépendants.", "`$this` = l'objet qui reçoit l'appel. `$this->nom` est la propriété, `$nom` une variable locale.", "`->` pour un objet, `::` pour la classe (constantes, statique, `parent::`).", "Un objet passé en paramètre **n'est pas copié** ; pour une copie, `clone`."], "tds": [{"level": 1, "title": "Compte bancaire", "enonce": "Crée une classe `CompteBancaire` qui gère un solde en respectant des règles simples.", "consignes": ["Constructeur : `titulaire` (string), solde de départ à 0", "`deposer(float $montant)` refuse un montant ≤ 0 (`InvalidArgumentException`)", "`retirer(float $montant)` refuse si le solde est insuffisant (`DomainException`)", "`solde(): float` pour lire le solde", "Le solde ne doit **pas** être modifiable depuis l'extérieur"], "files": [{"path": "CompteBancaire.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nclass CompteBancaire\n{\n    // à toi\n}\n\n$c = new CompteBancaire('Ana');\n$c->deposer(100);\n$c->retirer(30);\necho $c->solde(); // 70"}], "hints": ["Le solde est une propriété `private float $solde = 0;`.", "Exception : `throw new DomainException('Solde insuffisant');`", "Vérifie la condition AVANT de modifier le solde."], "solution": [{"path": "CompteBancaire.php", "lang": "php", "code": "class CompteBancaire\n{\n    private float $solde = 0;\n\n    public function __construct(private string $titulaire) {}\n\n    public function deposer(float $montant): void\n    {\n        if ($montant <= 0) {\n            throw new InvalidArgumentException('Montant invalide');\n        }\n        $this->solde += $montant;\n    }\n\n    public function retirer(float $montant): void\n    {\n        if ($montant <= 0) {\n            throw new InvalidArgumentException('Montant invalide');\n        }\n        if ($montant > $this->solde) {\n            throw new DomainException('Solde insuffisant');\n        }\n        $this->solde -= $montant;\n    }\n\n    public function solde(): float\n    {\n        return $this->solde;\n    }\n}"}], "checks": ["`$c->solde = 1000;` provoque une erreur", "`retirer(500)` sur un compte à 70 lève une exception et le solde reste à 70", "`deposer(-5)` lève une exception"], "run": {"kind": "php", "tests": "$c = new CompteBancaire('Ana');\ncheck('Le solde de départ est 0', $c->solde() === 0.0 || $c->solde() === 0);\n$c->deposer(100);\ncheck('deposer(100) donne un solde de 100', (float) $c->solde() === 100.0);\n$c->retirer(30);\ncheck('retirer(30) donne un solde de 70', (float) $c->solde() === 70.0);\ncheck('retirer(500) lève une DomainException', throws(fn() => $c->retirer(500), DomainException::class));\ncheck('le solde reste à 70 après le refus', (float) $c->solde() === 70.0);\ncheck('deposer(-5) lève une InvalidArgumentException', throws(fn() => $c->deposer(-5), InvalidArgumentException::class));\n$rp = new ReflectionProperty(CompteBancaire::class, 'solde');\ncheck('la propriété solde est private', $rp->isPrivate());"}}, {"level": 2, "title": "Panier avec quantités", "enonce": "Un panier contient des lignes (produit + quantité). Ajouter deux fois le même produit doit **augmenter la quantité** au lieu de créer une deuxième ligne. C'est le même principe que le compte bancaire, mais l'état est une liste, pas un nombre.", "consignes": ["`Ligne` : propriétés `nom`, `prixUnitaire` (float), `quantite` (int), méthode `ajouter(int $n)` et `sousTotal(): float`", "`Panier::ajouter(string $nom, float $prix, int $quantite = 1)` : si une ligne porte déjà ce nom, augmente sa quantité ; sinon crée la ligne", "`Panier::total(): float` et `Panier::nombreDArticles(): int` (somme des quantités)", "Une quantité ≤ 0 lève une `InvalidArgumentException`", "Les lignes ne sont pas accessibles de l'extérieur"], "files": [{"path": "Panier.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Ligne\n{\n    // à toi\n}\n\nfinal class Panier\n{\n    // à toi\n}\n\n$p = new Panier();\n$p->ajouter('Clavier', 50.0);\n$p->ajouter('Souris', 20.0, 2);\n$p->ajouter('Clavier', 50.0);     // même produit : quantité 2\necho $p->total(), PHP_EOL;        // 140\necho $p->nombreDArticles();       // 4"}], "hints": ["Garde les lignes dans un tableau indexé par le nom : `$this->lignes[$nom]`. `isset($this->lignes[$nom])` dit si le produit est déjà là.", "`sousTotal()` = `prixUnitaire * quantite` ; le total du panier additionne les sous-totaux avec une boucle `foreach`.", "La vérification de la quantité se fait à **un seul endroit** : dans `Ligne` (constructeur et `ajouter`). `Panier` lui fait confiance."], "solution": [{"path": "Panier.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Ligne\n{\n    private int $quantite;\n\n    public function __construct(\n        private string $nom,\n        private float $prixUnitaire,\n        int $quantite,\n    ) {\n        $this->quantite = 0;\n        $this->ajouter($quantite);\n    }\n\n    public function ajouter(int $n): void\n    {\n        if ($n <= 0) {\n            throw new InvalidArgumentException('Quantité invalide');\n        }\n        $this->quantite += $n;\n    }\n\n    public function quantite(): int { return $this->quantite; }\n\n    public function sousTotal(): float\n    {\n        return $this->prixUnitaire * $this->quantite;\n    }\n}\n\nfinal class Panier\n{\n    /** @var array<string, Ligne> */\n    private array $lignes = [];\n\n    public function ajouter(string $nom, float $prix, int $quantite = 1): void\n    {\n        if (isset($this->lignes[$nom])) {\n            $this->lignes[$nom]->ajouter($quantite);\n            return;\n        }\n        $this->lignes[$nom] = new Ligne($nom, $prix, $quantite);\n    }\n\n    public function total(): float\n    {\n        $total = 0.0;\n        foreach ($this->lignes as $ligne) {\n            $total += $ligne->sousTotal();\n        }\n        return $total;\n    }\n\n    public function nombreDArticles(): int\n    {\n        $n = 0;\n        foreach ($this->lignes as $ligne) {\n            $n += $ligne->quantite();\n        }\n        return $n;\n    }\n}\n\n$p = new Panier();\n$p->ajouter('Clavier', 50.0);\n$p->ajouter('Souris', 20.0, 2);\n$p->ajouter('Clavier', 50.0);\necho $p->total(), PHP_EOL;        // 140\necho $p->nombreDArticles();       // 4"}], "checks": ["Ajouter deux fois « Clavier » donne une seule ligne avec quantité 2", "`ajouter('X', 10.0, 0)` lève une exception", "`$p->lignes` provoque une erreur depuis l'extérieur"], "run": {"kind": "php", "tests": "$p = new Panier();\n$p->ajouter('Clavier', 50.0);\n$p->ajouter('Souris', 20.0, 2);\n$p->ajouter('Clavier', 50.0);\ncheck('total() vaut 140', abs($p->total() - 140.0) < 0.001, 'obtenu : ' . $p->total());\ncheck('nombreDArticles() vaut 4', $p->nombreDArticles() === 4, 'obtenu : ' . $p->nombreDArticles());\ncheck('une quantité de 0 est refusée', throws(fn() => $p->ajouter('X', 10.0, 0), InvalidArgumentException::class));\ncheck('une quantité négative est refusée', throws(fn() => $p->ajouter('Y', 10.0, -2), InvalidArgumentException::class));\ncheck('les lignes sont privées', (new ReflectionProperty(Panier::class, 'lignes'))->isPrivate());\n$vide = new Panier();\ncheck('un panier vide a un total de 0', (float) $vide->total() === 0.0);"}, "expected": "140\n4"}, {"level": 3, "title": "Historique d'opérations et relevé", "enonce": "Reprends le `CompteBancaire` du niveau 1 et fais-lui **mémoriser chaque opération** sous forme d'objets `Operation`. Le compte doit pouvoir produire un relevé. Tu combines ici : objets qui contiennent d'autres objets, `DateTimeImmutable`, et un calcul dérivé de l'historique (le solde n'est plus stocké : il est **recalculé**).", "consignes": ["`Operation` : `type` (`'depot'` ou `'retrait'`), `montant` (float), `date` (`DateTimeImmutable`), méthode `montantSigne(): float` (+ pour un dépôt, − pour un retrait)", "`CompteBancaire` ne stocke **plus** `$solde` : `solde()` additionne les `montantSigne()` de l'historique", "`deposer()` et `retirer()` ajoutent une `Operation` (mêmes règles qu'au niveau 1 : montants > 0, retrait ≤ solde)", "`releve(): string` renvoie une ligne par opération au format `JJ/MM/AAAA  depot    +100.00` puis une dernière ligne `Solde : 70.00`", "`operations(): array` renvoie une **copie** de l'historique (le code extérieur ne doit pas pouvoir le modifier)"], "files": [{"path": "CompteBancaire.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Operation\n{\n    // à toi\n}\n\nfinal class CompteBancaire\n{\n    // à toi : plus de propriété $solde !\n\n    public function __construct(private string $titulaire) {}\n}\n\n$c = new CompteBancaire('Ana');\n$c->deposer(100);\n$c->retirer(30);\necho $c->releve();"}], "hints": ["`new DateTimeImmutable()` donne la date du moment ; `$date->format('d/m/Y')` l'affiche.", "`solde()` : `array_sum(array_map(fn(Operation $o) => $o->montantSigne(), $this->operations))`.", "`sprintf('%s  %-8s %+.2f', ...)` : `%-8s` cale le type sur 8 caractères, `%+.2f` affiche le signe et 2 décimales.", "Renvoyer un tableau d'objets avec `return $this->operations;` renvoie une copie du **tableau** : l'extérieur ne peut pas ajouter de ligne à ton historique. C'est suffisant ici."], "solution": [{"path": "CompteBancaire.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Operation\n{\n    public function __construct(\n        private string $type,\n        private float $montant,\n        private DateTimeImmutable $date,\n    ) {\n        if (!in_array($type, ['depot', 'retrait'], true)) {\n            throw new InvalidArgumentException(\"Type inconnu : $type\");\n        }\n        if ($montant <= 0) {\n            throw new InvalidArgumentException('Montant invalide');\n        }\n    }\n\n    public function montantSigne(): float\n    {\n        return $this->type === 'depot' ? $this->montant : -$this->montant;\n    }\n\n    public function ligne(): string\n    {\n        return sprintf('%s  %-8s %+.2f', $this->date->format('d/m/Y'), $this->type, $this->montantSigne());\n    }\n}\n\nfinal class CompteBancaire\n{\n    /** @var Operation[] */\n    private array $operations = [];\n\n    public function __construct(private string $titulaire) {}\n\n    public function deposer(float $montant): void\n    {\n        $this->operations[] = new Operation('depot', $montant, new DateTimeImmutable());\n    }\n\n    public function retirer(float $montant): void\n    {\n        if ($montant <= 0) {\n            throw new InvalidArgumentException('Montant invalide');\n        }\n        if ($montant > $this->solde()) {\n            throw new DomainException('Solde insuffisant');\n        }\n        $this->operations[] = new Operation('retrait', $montant, new DateTimeImmutable());\n    }\n\n    public function solde(): float\n    {\n        return array_sum(array_map(fn(Operation $o) => $o->montantSigne(), $this->operations));\n    }\n\n    /** @return Operation[] */\n    public function operations(): array\n    {\n        return $this->operations;\n    }\n\n    public function releve(): string\n    {\n        $lignes = array_map(fn(Operation $o) => $o->ligne(), $this->operations);\n        $lignes[] = sprintf('Solde : %.2f', $this->solde());\n        return implode(PHP_EOL, $lignes) . PHP_EOL;\n    }\n}\n\n$c = new CompteBancaire('Ana');\n$c->deposer(100);\n$c->retirer(30);\necho $c->releve();"}], "checks": ["Le relevé affiche 2 lignes d'opérations puis « Solde : 70.00 »", "Il n'y a plus de propriété `$solde` : supprime-la et vérifie que tout marche encore", "Un retrait supérieur au solde ne crée **pas** d'opération"], "run": {"kind": "php", "tests": "$c = new CompteBancaire('Ana');\n$c->deposer(100);\n$c->retirer(30);\ncheck('solde() recalculé vaut 70', abs($c->solde() - 70.0) < 0.001, 'obtenu : ' . $c->solde());\ncheck('2 opérations enregistrées', count($c->operations()) === 2);\ncheck('operations() contient des Operation', $c->operations()[0] instanceof Operation);\ncheck('montantSigne() du retrait est négatif', $c->operations()[1]->montantSigne() < 0);\n$r = $c->releve();\ncheck('le relevé se termine par \"Solde : 70.00\"', str_contains($r, 'Solde : 70.00'), $r);\ncheck('le relevé contient +100.00', str_contains($r, '+100.00'), $r);\ncheck('le relevé contient -30.00', str_contains($r, '-30.00'), $r);\ncheck('retirer(500) est refusé', throws(fn() => $c->retirer(500), DomainException::class));\ncheck('le refus n\\'a pas ajouté d\\'opération', count($c->operations()) === 2);\ncheck('plus de propriété $solde', !property_exists(CompteBancaire::class, 'solde'));\n$ops = $c->operations(); $ops[] = 'intrus';\ncheck('modifier le tableau renvoyé ne change pas le compte', count($c->operations()) === 2);"}, "expected": "12/11/2026  depot    +100.00\n12/11/2026  retrait  -30.00\nSolde : 70.00"}]}, {"id": "php-encapsulation", "track": "php", "title": "Encapsulation & visibilité", "minutes": 15, "goal": "Protéger l'état d'un objet pour qu'il soit toujours valide.", "why": "Si n'importe qui peut écrire `$user->email = 'nimporte quoi'`, ton objet peut devenir invalide n'importe où dans le code.", "flow": ["L'état est **private**", "On ne le modifie que par des **méthodes** publiques", "Chaque méthode **vérifie les règles** (invariants)", "L'objet est donc **toujours valide**"], "points": ["`public` : accessible partout. `protected` : la classe et ses enfants. `private` : la classe seule.", "Un **invariant** est une règle toujours vraie pour l'objet (un email contient un @, un prix n'est pas négatif).", "Valide dans le **constructeur** : un objet invalide ne doit jamais exister.", "`readonly` (PHP 8.1) : la propriété ne s'écrit qu'une fois, à l'initialisation.", "Préfère des méthodes métier (`changerEmail()`) aux setters génériques (`setEmail()`) : le nom dit l'intention."], "pitfalls": ["Un getter ET un setter pour chaque propriété : c'est une propriété publique avec plus de code.", "Valider en dehors de l'objet : la règle finit dupliquée ou oubliée."], "example": {"files": [{"path": "src/Email.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Email\n{\n    public readonly string $valeur;\n\n    public function __construct(string $valeur)\n    {\n        $valeur = strtolower(trim($valeur));\n        if (!filter_var($valeur, FILTER_VALIDATE_EMAIL)) {\n            throw new InvalidArgumentException(\"Email invalide : $valeur\");\n        }\n        $this->valeur = $valeur;\n    }\n}"}, {"path": "src/Utilisateur.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Utilisateur\n{\n    public function __construct(private Email $email) {}\n\n    public function changerEmail(Email $nouveau): void\n    {\n        $this->email = $nouveau;\n    }\n\n    public function email(): Email\n    {\n        return $this->email;\n    }\n}"}, {"path": "demo.php", "lang": "php", "code": "<?php\n$u = new Utilisateur(new Email('Ana@Mail.com'));\necho $u->email()->valeur; // ana@mail.com\n\ntry {\n    $u->changerEmail(new Email('pas un email'));\n} catch (InvalidArgumentException $e) {\n    echo $e->getMessage();  // Email invalide : pas un email\n}"}], "notes": ["`Email` valide dans son constructeur : un `Email` invalide ne peut pas exister (fichier `Email.php`).", "`readonly` : on lit `->valeur` directement, on ne peut pas la réécrire.", "`Utilisateur` n'a plus à valider l'email : le type `Email` le garantit. `changerEmail` est une méthode métier, pas un setter.", "Dans `demo.php`, le `new Email('pas un email')` échoue **avant** d'atteindre `changerEmail` : l'utilisateur garde son ancien email."]}, "quiz": [{"q": "Où placer la validation d'un objet ?", "options": ["Dans le contrôleur", "Dans le constructeur et dans les méthodes qui modifient l'état", "Dans la base de données", "Dans un setter public"], "answer": 1, "why": "C'est l'objet qui connaît ses règles : il les vérifie à chaque changement d'état."}, {"q": "`protected` signifie…", "options": ["visible partout", "visible dans la classe et ses classes enfants", "visible dans le même fichier", "modifiable une seule fois"], "answer": 1, "why": "`protected` ouvre l'accès aux enfants, pas à l'extérieur."}, {"q": "Avantage de `changerEmail(Email $e)` sur `setEmail(string $e)` ?", "options": ["Aucun", "Il est plus rapide", "Le type garantit la validité et le nom exprime l'intention", "Il évite d'écrire un constructeur"], "answer": 2, "why": "Le type `Email` est forcément valide, et le nom de la méthode parle le langage du métier."}], "prereq": [{"term": "Propriété / méthode", "def": "Une propriété est une variable qui appartient à un objet (`$this->email`) ; une méthode est une fonction qui appartient à l'objet (`$this->changerEmail()`). Vu au module Classes & objets."}, {"term": "Getter / setter", "def": "Un *getter* est une méthode qui lit une propriété (`getEmail()`), un *setter* une méthode qui la modifie (`setEmail($e)`). Pratique, mais on va voir que les setters génériques sont un piège."}, {"term": "Invariant", "def": "Une règle qui doit **toujours** être vraie pour un objet : « un prix n'est jamais négatif », « un email contient un @ ». Si un objet viole un invariant, il est dans un état impossible et tout le code qui l'utilise devient faux."}, {"term": "`final`", "def": "Mot-clé devant `class` qui interdit d'en hériter. Bon réflexe par défaut : tu lèves l'interdiction plus tard si besoin."}, {"term": "`filter_var`", "def": "Fonction PHP qui vérifie ou nettoie une valeur selon un filtre : `filter_var($s, FILTER_VALIDATE_EMAIL)` renvoie l'email ou `false`."}], "diagram": {"nodes": [{"id": "ext", "col": 0, "row": 0, "label": "Code extérieur", "kind": "actor", "sub": "contrôleur, service…"}, {"id": "set", "col": 1, "row": 0, "label": "$u->email = 'x'", "kind": "pill", "sub": "accès direct", "color": "bad"}, {"id": "meth", "col": 1, "row": 1, "label": "$u->changerEmail(new Email('x'))", "kind": "pill", "color": "good"}, {"id": "obj", "col": 3, "row": 0, "label": "Utilisateur", "kind": "box", "sub": "private Email $email"}, {"id": "rule", "col": 3, "row": 1, "label": "Email valide ?", "kind": "note", "sub": "vérifié dans le constructeur d'Email", "color": "good"}], "edges": [{"from": "ext", "to": "set"}, {"from": "set", "to": "obj", "label": "refusé (private)", "dashed": true, "color": "bad"}, {"from": "ext", "to": "meth"}, {"from": "meth", "to": "rule", "label": "1 valide"}, {"from": "rule", "to": "obj", "label": "2 modifie", "color": "good"}], "caption": "L'état est privé : la seule porte d'entrée est une méthode, qui vérifie les règles avant de modifier."}, "lessons": [{"title": "Le problème des propriétés publiques", "body": "Reprends le `Produit` du module précédent, mais avec une propriété publique :\n\n```php\nclass Produit\n{\n    public float $prixHT;\n}\n\n$p = new Produit();\n$p->prixHT = -50;        // personne ne peut l'empêcher\n```\n\nÀ partir de là, `prixTTC()` renvoie un nombre négatif, le total du panier est faux, la facture est fausse… et l'erreur se voit trois écrans plus loin, là où on ne cherche pas. Le code qui a écrit `-50` peut être n'importe où dans le projet.\n\nL'**encapsulation** consiste à cacher l'état de l'objet (`private`) et à n'autoriser sa modification qu'à travers des **méthodes**, qui vérifient que la règle est respectée. L'objet devient responsable de sa propre validité : un `Produit` ne peut tout simplement pas exister avec un prix négatif."}, {"title": "Les trois niveaux de visibilité", "body": "Chaque propriété ou méthode a une **visibilité** :\n\n- `public` : accessible depuis n'importe où. À réserver aux méthodes qui forment l'« interface » de l'objet, ce qu'il sait faire.\n- `protected` : accessible depuis la classe **et ses classes enfants** (voir le module Héritage), mais pas depuis l'extérieur.\n- `private` : accessible uniquement depuis la classe elle-même. C'est la visibilité par défaut à choisir pour les propriétés.\n\nRègle pratique : **toutes les propriétés en `private`**, et on n'ouvre que ce qui est nécessaire. Si tu hésites, mets `private` : passer en `protected` ou `public` plus tard est facile ; l'inverse casse du code.\n\nPHP 8.1 ajoute `readonly` : une propriété qu'on ne peut écrire **qu'une seule fois**, à l'initialisation. Idéal pour une valeur qui ne doit jamais changer après la création (un identifiant, une adresse email validée). On peut la lire librement (`$email->valeur`) sans getter : puisqu'elle ne peut pas être modifiée, la rendre publique en lecture ne présente aucun risque."}, {"title": "Valider dans le constructeur : un objet invalide n'existe pas", "body": "Le meilleur endroit pour vérifier une règle, c'est au moment où l'objet est créé. Si le constructeur lève une exception quand la valeur est mauvaise, alors **aucun** objet invalide ne peut exister dans tout le programme : tout code qui tient un `Email` en main sait qu'il est valide, sans avoir à revérifier.\n\n```php\nfinal class Email\n{\n    public readonly string $valeur;\n\n    public function __construct(string $valeur)\n    {\n        $valeur = strtolower(trim($valeur));                 // 1. normaliser\n        if (!filter_var($valeur, FILTER_VALIDATE_EMAIL)) {   // 2. vérifier\n            throw new InvalidArgumentException(\"Email invalide : $valeur\");\n        }\n        $this->valeur = $valeur;                             // 3. seulement si OK\n    }\n}\n```\n\nNote l'enchaînement : on **normalise** (minuscules, espaces retirés), on **vérifie**, et on n'assigne qu'après. Si la vérification échoue, l'exception sort du constructeur et le `new` ne renvoie rien : la variable ne reçoit jamais d'objet cassé.\n\nLes règles qui ne concernent pas qu'une valeur mais un **changement** d'état se vérifient dans la méthode qui fait ce changement (par exemple « on ne peut retirer que si le solde suffit » dans `retirer()`)."}, {"title": "Méthodes métier plutôt que setters", "body": "Comparer ces deux versions :\n\n```php\n// Version setter : décrit la mécanique\n$commande->setStatut('expediee');\n$commande->setDateExpedition(new DateTimeImmutable());\n\n// Version métier : décrit l'intention\n$commande->expedier();\n```\n\nLa deuxième est meilleure pour trois raisons. Elle **dit ce qui se passe** avec les mots du métier. Elle **garde les règles ensemble** : `expedier()` peut vérifier que la commande est payée, fixer la date et changer le statut en une seule opération cohérente, alors qu'avec des setters, rien n'empêche de changer le statut sans la date. Et elle est **plus facile à retrouver** : chercher « qui expédie des commandes ? » revient à chercher `->expedier(`.\n\nUn objet qui n'a qu'un getter et un setter par propriété s'appelle un **modèle anémique** : c'est une propriété publique avec plus de lignes. On y reviendra en DDD (module Entités riches). Pour l'instant, retiens : quand tu es tenté d'écrire `setX()`, demande-toi quelle **action métier** change X, et nomme la méthode d'après cette action."}], "recap": ["Toutes les propriétés en `private` ; on n'ouvre que ce qui est nécessaire.", "Un **invariant** se vérifie là où l'état change : constructeur et méthodes de modification.", "Si le constructeur refuse les valeurs invalides, un objet invalide **ne peut pas exister**.", "`readonly` : écrite une fois, lisible partout, impossible à modifier.", "Préfère une **méthode métier** (`expedier()`) à des setters (`setStatut()`)."], "tds": [{"level": 1, "title": "Prix et panier", "enonce": "Crée un objet `Prix` qui ne peut jamais être négatif, et un `Panier` qui l'utilise.", "consignes": ["`Prix` : propriété `readonly int $centimes` (on stocke en centimes pour éviter les erreurs d'arrondi)", "Exception si `$centimes < 0`", "`ajouter(Prix $autre): Prix` **renvoie un nouveau** `Prix` sans modifier l'actuel", "`Panier` : `ajouterArticle(Prix $p)` et `total(): Prix`, aucune propriété publique"], "files": [{"path": "Prix.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Prix\n{\n    // à toi\n}\n\nfinal class Panier\n{\n    // à toi\n}\n\n$panier = new Panier();\n$panier->ajouterArticle(new Prix(1999));\n$panier->ajouterArticle(new Prix(500));\necho $panier->total()->centimes; // 2499"}], "hints": ["`ajouter` fait `return new Prix($this->centimes + $autre->centimes);`", "Dans `Panier`, garde une liste `private array $articles = [];`", "Calcule le total à la demande en partant de `new Prix(0)`."], "solution": [{"path": "Prix.php", "lang": "php", "code": "final class Prix\n{\n    public function __construct(public readonly int $centimes)\n    {\n        if ($centimes < 0) {\n            throw new InvalidArgumentException('Prix négatif');\n        }\n    }\n\n    public function ajouter(Prix $autre): Prix\n    {\n        return new Prix($this->centimes + $autre->centimes);\n    }\n}\n\nfinal class Panier\n{\n    /** @var Prix[] */\n    private array $articles = [];\n\n    public function ajouterArticle(Prix $prix): void\n    {\n        $this->articles[] = $prix;\n    }\n\n    public function total(): Prix\n    {\n        $total = new Prix(0);\n        foreach ($this->articles as $prix) {\n            $total = $total->ajouter($prix);\n        }\n        return $total;\n    }\n}"}], "checks": ["`new Prix(-1)` lève une exception", "`$p->centimes = 5;` provoque une erreur", "`ajouter` ne modifie pas l'objet d'origine"], "run": {"kind": "php", "tests": "check('new Prix(-1) lève une exception', throws(fn() => new Prix(-1), InvalidArgumentException::class));\n$a = new Prix(1999); $b = new Prix(500);\n$c = $a->ajouter($b);\ncheck('ajouter renvoie un nouveau Prix', $c instanceof Prix && $c !== $a);\ncheck('la somme vaut 2499', $c->centimes === 2499);\ncheck('ajouter ne modifie pas l\\'original', $a->centimes === 1999);\n$rp = new ReflectionProperty(Prix::class, 'centimes');\ncheck('centimes est readonly', $rp->isReadOnly());\n$panier = new Panier();\n$panier->ajouterArticle(new Prix(1999));\n$panier->ajouterArticle(new Prix(500));\ncheck('total() du panier vaut 2499', $panier->total()->centimes === 2499);\ncheck('aucune propriété publique dans Panier', count((new ReflectionClass(Panier::class))->getProperties(ReflectionProperty::IS_PUBLIC)) === 0);"}}, {"level": 2, "title": "Mot de passe et utilisateur", "enonce": "Un `Utilisateur` a un mot de passe. Le mot de passe en clair ne doit **jamais** être stocké : seule son empreinte (hash) l'est. Tu écris un objet `MotDePasse` qui applique les règles de complexité, et un `Utilisateur` qui l'utilise. C'est l'encapsulation appliquée à un cas où une fuite d'état serait grave.", "consignes": ["`MotDePasse::depuisClair(string $clair): self` : refuse moins de 8 caractères ou sans chiffre (`InvalidArgumentException`), stocke `password_hash($clair, PASSWORD_DEFAULT)`", "`MotDePasse::depuisHash(string $hash): self` : recrée l'objet depuis la base (pas de vérification de complexité, le hash est déjà là)", "`MotDePasse::verifier(string $clair): bool` avec `password_verify`", "Le constructeur est `private` : on ne crée l'objet **que** par les deux méthodes nommées", "`Utilisateur::changerMotDePasse(string $ancien, string $nouveau)` : refuse si `$ancien` ne correspond pas (`DomainException`)", "Aucun getter ne renvoie le hash ni le clair, sauf `hash(): string` pour la sauvegarde en base"], "files": [{"path": "MotDePasse.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class MotDePasse\n{\n    // constructeur private + 2 méthodes statiques de création\n}\n\nfinal class Utilisateur\n{\n    public function __construct(private string $email, private MotDePasse $motDePasse) {}\n\n    // changerMotDePasse(...)\n}\n\n$u = new Utilisateur('ana@mail.com', MotDePasse::depuisClair('secret123'));\nvar_dump($u->verifierMotDePasse('secret123'));  // true\n$u->changerMotDePasse('secret123', 'nouveau456');\nvar_dump($u->verifierMotDePasse('secret123'));  // false"}], "hints": ["Une méthode statique de création : `public static function depuisClair(string $clair): self { ... return new self($hash); }`. Elle peut appeler le constructeur privé car elle est **dans** la classe.", "Chiffre présent : `preg_match('/\\d/', $clair) === 1`.", "`Utilisateur::verifierMotDePasse(string $clair)` délègue à `$this->motDePasse->verifier($clair)`."], "solution": [{"path": "MotDePasse.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class MotDePasse\n{\n    private function __construct(private string $hash) {}\n\n    public static function depuisClair(string $clair): self\n    {\n        if (strlen($clair) < 8) {\n            throw new InvalidArgumentException('8 caractères minimum');\n        }\n        if (preg_match('/\\d/', $clair) !== 1) {\n            throw new InvalidArgumentException('Au moins un chiffre');\n        }\n        return new self(password_hash($clair, PASSWORD_DEFAULT));\n    }\n\n    public static function depuisHash(string $hash): self\n    {\n        return new self($hash);\n    }\n\n    public function verifier(string $clair): bool\n    {\n        return password_verify($clair, $this->hash);\n    }\n\n    public function hash(): string\n    {\n        return $this->hash;\n    }\n}\n\nfinal class Utilisateur\n{\n    public function __construct(private string $email, private MotDePasse $motDePasse) {}\n\n    public function verifierMotDePasse(string $clair): bool\n    {\n        return $this->motDePasse->verifier($clair);\n    }\n\n    public function changerMotDePasse(string $ancien, string $nouveau): void\n    {\n        if (!$this->motDePasse->verifier($ancien)) {\n            throw new DomainException('Ancien mot de passe incorrect');\n        }\n        $this->motDePasse = MotDePasse::depuisClair($nouveau);\n    }\n}\n\n$u = new Utilisateur('ana@mail.com', MotDePasse::depuisClair('secret123'));\nvar_dump($u->verifierMotDePasse('secret123'));  // true\n$u->changerMotDePasse('secret123', 'nouveau456');\nvar_dump($u->verifierMotDePasse('secret123'));  // false"}], "checks": ["`new MotDePasse('x')` est impossible depuis l'extérieur", "`depuisClair('court1')` lève une exception, `depuisClair('sansChiffre')` aussi", "Changer le mot de passe avec un mauvais ancien mot de passe est refusé"], "run": {"kind": "php", "tests": "check('le constructeur est private', (new ReflectionMethod(MotDePasse::class, '__construct'))->isPrivate());\ncheck('depuisClair(\"court1\") est refusé', throws(fn() => MotDePasse::depuisClair('court1'), InvalidArgumentException::class));\ncheck('depuisClair(\"sansChiffreIci\") est refusé', throws(fn() => MotDePasse::depuisClair('sansChiffreIci'), InvalidArgumentException::class));\n$m = MotDePasse::depuisClair('secret123');\ncheck('verifier() accepte le bon mot de passe', $m->verifier('secret123'));\ncheck('verifier() refuse un mauvais mot de passe', !$m->verifier('autre'));\ncheck('hash() ne contient pas le mot de passe en clair', !str_contains($m->hash(), 'secret123'));\ncheck('depuisHash() recrée un objet qui vérifie encore', MotDePasse::depuisHash($m->hash())->verifier('secret123'));\n$u = new Utilisateur('ana@mail.com', $m);\ncheck('changer avec un mauvais ancien est refusé', throws(fn() => $u->changerMotDePasse('faux', 'nouveau456'), DomainException::class));\n$u->changerMotDePasse('secret123', 'nouveau456');\ncheck('après changement, le nouveau fonctionne', $u->verifierMotDePasse('nouveau456'));\ncheck('après changement, l\\'ancien ne fonctionne plus', !$u->verifierMotDePasse('secret123'));"}, "expected": "bool(true)\nbool(false)"}, {"level": 3, "title": "Créneau de réservation sans chevauchement", "enonce": "Une salle de réunion se réserve par créneaux. Tu modélises un `Creneau` immuable qui garantit ses règles (fin après début, dans les heures d'ouverture), puis une `Salle` qui refuse deux créneaux qui se chevauchent. Approfondissement : invariants sur **plusieurs** valeurs à la fois, immuabilité, et un invariant qui porte sur **une collection**.", "consignes": ["`Creneau` : `debut` et `fin` en `DateTimeImmutable`, `readonly`. Exceptions si `fin <= debut`, si la durée dépasse 4 h, ou si le créneau sort de 8 h–20 h", "`Creneau::chevauche(Creneau $autre): bool`", "`Creneau::decaler(int $minutes): Creneau` renvoie un **nouveau** créneau (l'objet d'origine ne change pas) et repasse par les mêmes règles", "`Salle::reserver(Creneau $c)` : `DomainException` si chevauchement avec un créneau déjà réservé", "`Salle::creneaux(): array` trié par début"], "files": [{"path": "Salle.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Creneau\n{\n    // à toi\n}\n\nfinal class Salle\n{\n    // à toi\n}\n\n$salle = new Salle('A101');\n$salle->reserver(new Creneau(new DateTimeImmutable('2026-03-02 09:00'), new DateTimeImmutable('2026-03-02 10:00')));\n$salle->reserver(new Creneau(new DateTimeImmutable('2026-03-02 10:00'), new DateTimeImmutable('2026-03-02 11:30')));\ntry {\n    $salle->reserver(new Creneau(new DateTimeImmutable('2026-03-02 09:30'), new DateTimeImmutable('2026-03-02 10:30')));\n} catch (DomainException $e) {\n    echo 'Refusé : ', $e->getMessage(), PHP_EOL;\n}\necho count($salle->creneaux());  // 2"}], "hints": ["Deux créneaux se chevauchent si `$this->debut < $autre->fin && $autre->debut < $this->fin`. Deux créneaux qui se touchent (10:00–11:00 et 11:00–12:00) ne se chevauchent **pas**.", "Durée en minutes : `($fin->getTimestamp() - $debut->getTimestamp()) / 60`. Heure : `(int) $debut->format('G')`.", "`decaler()` : `return new self($this->debut->modify(\"+$minutes minutes\"), $this->fin->modify(\"+$minutes minutes\"));` : le constructeur revalide tout.", "Pour trier : `usort($liste, fn(Creneau $a, Creneau $b) => $a->debut <=> $b->debut);`"], "solution": [{"path": "Salle.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Creneau\n{\n    private const DUREE_MAX_MINUTES = 240;\n    private const OUVERTURE = 8;\n    private const FERMETURE = 20;\n\n    pub
