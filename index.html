lic function __construct(\n        public readonly DateTimeImmutable $debut,\n        public readonly DateTimeImmutable $fin,\n    ) {\n        if ($fin <= $debut) {\n            throw new InvalidArgumentException('La fin doit être après le début');\n        }\n        $minutes = ($fin->getTimestamp() - $debut->getTimestamp()) / 60;\n        if ($minutes > self::DUREE_MAX_MINUTES) {\n            throw new InvalidArgumentException('4 heures maximum');\n        }\n        $hDebut = (int) $debut->format('G');\n        $hFin = (int) $fin->format('G') + ((int) $fin->format('i') > 0 ? 1 : 0);\n        if ($hDebut < self::OUVERTURE || $hFin > self::FERMETURE || $debut->format('Y-m-d') !== $fin->format('Y-m-d')) {\n            throw new InvalidArgumentException('Créneau hors des heures d\\'ouverture (8 h – 20 h)');\n        }\n    }\n\n    public function chevauche(Creneau $autre): bool\n    {\n        return $this->debut < $autre->fin && $autre->debut < $this->fin;\n    }\n\n    public function decaler(int $minutes): Creneau\n    {\n        return new self(\n            $this->debut->modify(\"$minutes minutes\"),\n            $this->fin->modify(\"$minutes minutes\"),\n        );\n    }\n}\n\nfinal class Salle\n{\n    /** @var Creneau[] */\n    private array $creneaux = [];\n\n    public function __construct(private string $nom) {}\n\n    public function reserver(Creneau $nouveau): void\n    {\n        foreach ($this->creneaux as $existant) {\n            if ($existant->chevauche($nouveau)) {\n                throw new DomainException(sprintf(\n                    'Chevauchement avec le créneau %s–%s',\n                    $existant->debut->format('H:i'),\n                    $existant->fin->format('H:i'),\n                ));\n            }\n        }\n        $this->creneaux[] = $nouveau;\n        usort($this->creneaux, fn(Creneau $a, Creneau $b) => $a->debut <=> $b->debut);\n    }\n\n    /** @return Creneau[] */\n    public function creneaux(): array\n    {\n        return $this->creneaux;\n    }\n}\n\n$salle = new Salle('A101');\n$salle->reserver(new Creneau(new DateTimeImmutable('2026-03-02 09:00'), new DateTimeImmutable('2026-03-02 10:00')));\n$salle->reserver(new Creneau(new DateTimeImmutable('2026-03-02 10:00'), new DateTimeImmutable('2026-03-02 11:30')));\ntry {\n    $salle->reserver(new Creneau(new DateTimeImmutable('2026-03-02 09:30'), new DateTimeImmutable('2026-03-02 10:30')));\n} catch (DomainException $e) {\n    echo 'Refusé : ', $e->getMessage(), PHP_EOL;\n}\necho count($salle->creneaux());  // 2"}], "checks": ["Un créneau 10:00–11:00 puis 11:00–12:00 est accepté (ils se touchent sans se chevaucher)", "`decaler()` ne modifie pas l'objet d'origine", "Un créneau de 5 h ou qui commence à 7 h est refusé"], "run": {"kind": "php", "tests": "$d = fn(string $h) => new DateTimeImmutable(\"2026-03-02 $h\");\ncheck('fin avant début refusé', throws(fn() => new Creneau($d('10:00'), $d('09:00')), InvalidArgumentException::class));\ncheck('5 heures refusées', throws(fn() => new Creneau($d('09:00'), $d('14:00')), InvalidArgumentException::class));\ncheck('début à 7 h refusé', throws(fn() => new Creneau($d('07:00'), $d('08:00')), InvalidArgumentException::class));\ncheck('fin à 21 h refusée', throws(fn() => new Creneau($d('19:00'), $d('21:00')), InvalidArgumentException::class));\n$a = new Creneau($d('09:00'), $d('10:00'));\n$b = new Creneau($d('10:00'), $d('11:00'));\n$c = new Creneau($d('09:30'), $d('10:30'));\ncheck('09–10 et 10–11 ne se chevauchent pas', !$a->chevauche($b) && !$b->chevauche($a));\ncheck('09–10 et 09:30–10:30 se chevauchent', $a->chevauche($c) && $c->chevauche($a));\n$dec = $a->decaler(30);\ncheck('decaler renvoie un nouveau créneau décalé', $dec->debut->format('H:i') === '09:30' && $dec->fin->format('H:i') === '10:30');\ncheck('decaler ne modifie pas l\\'original', $a->debut->format('H:i') === '09:00');\ncheck('decaler qui sort des horaires est refusé', throws(fn() => (new Creneau($d('18:00'), $d('19:30')))->decaler(60), InvalidArgumentException::class));\n$s = new Salle('A101');\n$s->reserver($b); $s->reserver($a);\ncheck('deux créneaux qui se touchent sont acceptés', count($s->creneaux()) === 2);\ncheck('la liste est triée par début', $s->creneaux()[0]->debut->format('H:i') === '09:00');\ncheck('un chevauchement est refusé', throws(fn() => $s->reserver($c), DomainException::class));\ncheck('le refus n\\'a rien ajouté', count($s->creneaux()) === 2);\ncheck('debut est readonly', (new ReflectionProperty(Creneau::class, 'debut'))->isReadOnly());"}, "expected": "Refusé : Chevauchement avec le créneau 09:00–10:00\n2"}]}, {"id": "php-heritage", "track": "php", "title": "Héritage & classes abstraites", "minutes": 15, "goal": "Savoir quand hériter, et à quoi sert une classe abstraite.", "why": "Plusieurs classes partagent une structure et du code. L'héritage évite de le dupliquer, mais mal utilisé il rigidifie tout.", "flow": ["Une classe **abstraite** définit ce qui est commun", "Elle déclare des méthodes **abstraites**, sans corps", "Chaque **enfant** (`extends`) les implémente", "Le code appelant manipule le **parent** sans connaître l'enfant"], "points": ["`extends` : l'enfant récupère les méthodes `public` et `protected` du parent.", "Une classe `abstract` ne s'instancie pas : elle sert de base.", "`parent::__construct(...)` appelle le constructeur du parent.", "Test « est-un » : un `Cercle` **est une** `Forme` → héritage. Une `Voiture` **a un** `Moteur` → composition (une propriété).", "`final` interdit d'hériter : bon réflexe par défaut pour les classes non prévues pour ça."], "pitfalls": ["Hériter juste pour réutiliser une méthode : préfère la composition.", "Des hiérarchies sur 3 niveaux ou plus deviennent vite illisibles."], "example": {"files": [{"path": "src/Forme.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nabstract class Forme\n{\n    public function __construct(protected string $nom) {}\n\n    abstract public function aire(): float;\n\n    public function decrire(): string\n    {\n        return sprintf('%s : %.2f m²', $this->nom, $this->aire());\n    }\n}"}, {"path": "src/Cercle.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Cercle extends Forme\n{\n    public function __construct(private float $rayon)\n    {\n        parent::__construct('Cercle');\n    }\n\n    public function aire(): float\n    {\n        return M_PI * $this->rayon ** 2;\n    }\n}"}, {"path": "src/Rectangle.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Rectangle extends Forme\n{\n    public function __construct(private float $l, private float $h)\n    {\n        parent::__construct('Rectangle');\n    }\n\n    public function aire(): float\n    {\n        return $this->l * $this->h;\n    }\n}"}, {"path": "demo.php", "lang": "php", "code": "<?php\nforeach ([new Cercle(1), new Rectangle(2, 3)] as $forme) {\n    echo $forme->decrire(), PHP_EOL;\n}\n// Cercle : 3.14 m²\n// Rectangle : 6.00 m²"}], "notes": ["`decrire()` est écrit une seule fois dans `Forme.php`, mais appelle l'`aire()` de l'enfant.", "Chaque enfant appelle `parent::__construct('…')` pour remplir le nom.", "La boucle de `demo.php` ne connaît que `Forme` : ajouter un `Triangle` ne la change pas.", "`protected $nom` : visible dans `Cercle` et `Rectangle`, pas depuis `demo.php`."]}, "quiz": [{"q": "`Forme` est abstraite. Peut-on faire `new Forme('x')` ?", "options": ["Oui", "Non, une classe abstraite ne s'instancie pas", "Oui si elle a un constructeur", "Seulement en PHP 8"], "answer": 1, "why": "Elle sert uniquement de base aux classes enfants."}, {"q": "Une `Commande` a une `Adresse`. Que choisir ?", "options": ["`Commande extends Adresse`", "`Adresse extends Commande`", "Composition : une propriété `Adresse` dans `Commande`", "Un trait"], "answer": 2, "why": "« A un » = composition. L'héritage est réservé au « est un »."}, {"q": "Dans `decrire()`, `$this->aire()` appelle…", "options": ["toujours la méthode abstraite", "la méthode de la classe réelle de l'objet", "une erreur", "la méthode du parent"], "answer": 1, "why": "PHP choisit la méthode selon la classe réelle de l'objet au moment de l'appel."}], "prereq": [{"term": "`protected`", "def": "Visibilité intermédiaire : accessible dans la classe **et** ses enfants, pas depuis l'extérieur (module Encapsulation)."}, {"term": "Signature", "def": "Le nom d'une méthode + ses paramètres typés + son type de retour : `public function aire(): float`. Une méthode abstraite n'a **que** sa signature, pas de corps."}, {"term": "Polymorphisme", "def": "Mot savant pour « plusieurs formes » : un même appel (`$forme->aire()`) exécute un code différent selon la classe réelle de l'objet. C'est PHP qui choisit, au moment de l'appel."}, {"term": "`sprintf`", "def": "Construit une chaîne avec des emplacements : `sprintf('%s : %.2f m²', $nom, $aire)` → `%s` texte, `%.2f` nombre à 2 décimales."}, {"term": "Composition", "def": "Mettre un objet **dans** un autre comme propriété (`Voiture` a un `Moteur`), par opposition à l'héritage (`Voiture` est un `Vehicule`)."}], "diagram": {"nodes": [{"id": "forme", "col": 1, "row": 0, "label": "abstract Forme", "kind": "doc", "sub": "nom · decrire()\nabstract aire()"}, {"id": "cercle", "col": 0, "row": 1, "label": "Cercle", "kind": "box", "sub": "rayon · aire() = πr²"}, {"id": "rect", "col": 2, "row": 1, "label": "Rectangle", "kind": "box", "sub": "l, h · aire() = l×h"}, {"id": "call", "col": 1, "row": 2, "label": "$forme->decrire()", "kind": "pill", "sub": "appelle aire() de la classe réelle", "color": "good"}], "edges": [{"from": "cercle", "to": "forme", "label": "extends"}, {"from": "rect", "to": "forme", "label": "extends"}, {"from": "call", "to": "cercle", "label": "si Cercle", "dashed": true, "color": "good"}, {"from": "call", "to": "rect", "label": "si Rectangle", "dashed": true, "color": "good"}], "caption": "Le parent définit le commun ; chaque enfant fournit sa propre `aire()`. Le code appelant ne connaît que `Forme`."}, "lessons": [{"title": "Partager du code sans le dupliquer", "body": "Tu as un `Cercle` et un `Rectangle`. Les deux ont un nom et une méthode `decrire()` qui affiche « Nom : aire m² ». Sans héritage, tu écris `decrire()` deux fois, à l'identique. Au troisième type de forme, tu la copies encore. Le jour où tu changes le format, tu dois le changer partout.\n\nL'**héritage** permet d'écrire ce qui est commun une seule fois dans une classe **parente** (`Forme`), et de laisser chaque classe **enfant** (`Cercle extends Forme`) hériter de ce code. L'enfant récupère toutes les propriétés et méthodes `public` et `protected` du parent, et peut en ajouter ou en redéfinir.\n\n```php\nclass Forme\n{\n    public function __construct(protected string $nom) {}\n\n    public function decrire(): string\n    {\n        return sprintf('%s : %.2f m²', $this->nom, $this->aire());\n    }\n}\n\nclass Cercle extends Forme\n{\n    public function __construct(private float $rayon)\n    {\n        parent::__construct('Cercle');    // on remplit la partie \"Forme\" de l'objet\n    }\n\n    public function aire(): float { return M_PI * $this->rayon ** 2; }\n}\n```\n\n`parent::__construct(...)` appelle le constructeur du parent : l'enfant est responsable de bien initialiser la partie héritée. Un `Cercle` **est une** `Forme` : partout où on attend une `Forme`, on peut passer un `Cercle`."}, {"title": "Classe abstraite : un plan incomplet, à compléter", "body": "Dans le code ci-dessus, `Forme::decrire()` appelle `$this->aire()`. Mais `Forme` ne sait pas calculer une aire : ça dépend de la forme. Deux problèmes : d'abord rien n'oblige un enfant à écrire `aire()` (on s'en rendrait compte par une erreur à l'exécution) ; ensuite `new Forme('x')` ne devrait pas avoir de sens.\n\nUne classe **abstraite** résout les deux :\n\n```php\nabstract class Forme\n{\n    abstract public function aire(): float;   // signature seule : \"à toi de l'écrire\"\n    // ... decrire() comme avant\n}\n```\n\n- `abstract class` : impossible de faire `new Forme(...)`. Elle sert uniquement de base.\n- `abstract public function aire(): float;` : chaque enfant **doit** implémenter cette méthode avec cette signature, sinon PHP refuse de charger la classe. L'oubli est détecté immédiatement.\n\nUne classe abstraite peut mélanger du code concret (`decrire()`) et des méthodes abstraites (`aire()`). C'est ce qui la distingue d'une interface (module suivant), qui ne contient **que** des signatures."}, {"title": "Le polymorphisme : un appel, plusieurs comportements", "body": "```php\n$formes = [new Cercle(1), new Rectangle(2, 3)];\nforeach ($formes as $forme) {\n    echo $forme->decrire(), PHP_EOL;\n}\n```\n\nLa boucle ne sait pas si `$forme` est un cercle ou un rectangle, et elle n'a pas besoin de le savoir. Quand `decrire()` appelle `$this->aire()`, PHP regarde la **classe réelle** de l'objet et exécute la bonne version. C'est le **polymorphisme**.\n\nL'intérêt : ajouter un `Triangle` demande d'écrire une classe de 10 lignes, et **zéro** modification de la boucle ni de `decrire()`. Le code qui utilise les formes est fermé aux modifications, mais ouvert aux extensions. Chaque fois que tu vois un `if ($type === 'cercle') ... elseif ($type === 'rectangle') ...`, c'est un endroit où le polymorphisme ferait mieux le travail."}, {"title": "Quand hériter, et quand ne pas le faire", "body": "L'héritage est tentant, parce qu'il permet de réutiliser du code. Mais il crée un lien **très fort** : l'enfant dépend de tous les détails du parent. Le test à faire avant d'écrire `extends` :\n\n- **« est un »** → héritage. Un `Cercle` *est une* `Forme`. Un `Salarie` *est un* `Employe`.\n- **« a un »** → composition : une propriété. Une `Voiture` *a un* `Moteur`. Une `Commande` *a une* `Adresse`. Écrire `Commande extends Adresse` n'aurait aucun sens, même si ça « réutiliserait » les champs de l'adresse.\n\nAutres règles pratiques :\n\n- Une hiérarchie de plus de 2 niveaux (`A extends B extends C`) devient vite illisible : on ne sait plus d'où vient chaque méthode.\n- Marque `final` les classes que tu n'as pas conçues pour être étendues. Tu enlèveras le `final` le jour où tu en auras besoin ; le contraire (découvrir que 5 classes héritent de la tienne) est beaucoup plus pénible.\n- Si tu hérites **juste pour piquer une méthode**, c'est de la composition déguisée : mets plutôt cette logique dans un objet à part et donne-le aux classes qui en ont besoin."}], "recap": ["`extends` : l'enfant récupère le `public` et le `protected` du parent, et peut redéfinir des méthodes.", "`parent::__construct()` initialise la partie héritée.", "`abstract class` : pas de `new` ; `abstract function` : signature seule, l'enfant **doit** l'implémenter.", "Polymorphisme : `$forme->aire()` exécute la version de la **classe réelle** de l'objet.", "« est un » → héritage ; « a un » → composition. Au doute : composition, et `final` par défaut."], "tds": [{"level": 1, "title": "Employés et salaires", "enonce": "Modélise des employés dont le salaire se calcule différemment selon leur type.", "consignes": ["Classe abstraite `Employe` avec `nom` et une méthode abstraite `salaireMensuel(): float`", "`Salarie` : salaire annuel / 12", "`Freelance` : taux journalier × jours travaillés", "Méthode commune `fiche(): string` dans `Employe` → « Ana : 2500.00 € »", "Calcule la masse salariale d'un tableau d'employés"], "files": [{"path": "Employes.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nabstract class Employe\n{\n    // à toi\n}\n\n// Salarie, Freelance...\n\n$equipe = [new Salarie('Ana', 30000), new Freelance('Léo', 400, 10)];\n// affiche chaque fiche + le total"}], "hints": ["`abstract public function salaireMensuel(): float;`", "`fiche()` : `sprintf('%s : %.2f €', $this->nom, $this->salaireMensuel())`", "Total : `array_sum(array_map(fn(Employe $e) => $e->salaireMensuel(), $equipe))`"], "solution": [{"path": "Employes.php", "lang": "php", "code": "abstract class Employe\n{\n    public function __construct(protected string $nom) {}\n\n    abstract public function salaireMensuel(): float;\n\n    public function fiche(): string\n    {\n        return sprintf('%s : %.2f €', $this->nom, $this->salaireMensuel());\n    }\n}\n\nfinal class Salarie extends Employe\n{\n    public function __construct(string $nom, private float $annuel)\n    {\n        parent::__construct($nom);\n    }\n\n    public function salaireMensuel(): float\n    {\n        return $this->annuel / 12;\n    }\n}\n\nfinal class Freelance extends Employe\n{\n    public function __construct(string $nom, private float $tjm, private int $jours)\n    {\n        parent::__construct($nom);\n    }\n\n    public function salaireMensuel(): float\n    {\n        return $this->tjm * $this->jours;\n    }\n}\n\n$equipe = [new Salarie('Ana', 30000), new Freelance('Léo', 400, 10)];\nforeach ($equipe as $e) {\n    echo $e->fiche(), PHP_EOL;\n}\n$total = array_sum(array_map(fn(Employe $e) => $e->salaireMensuel(), $equipe));\necho \"Total : $total €\";"}], "checks": ["Ajouter un nouveau type d'employé ne demande pas de toucher à `fiche()`", "`new Employe('x')` est impossible"], "run": {"kind": "php", "tests": "check('Employe est abstraite', (new ReflectionClass(Employe::class))->isAbstract());\ncheck('salaireMensuel est abstraite dans Employe', (new ReflectionMethod(Employe::class, 'salaireMensuel'))->isAbstract());\ncheck('Salarie étend Employe', is_subclass_of(Salarie::class, Employe::class));\ncheck('Freelance étend Employe', is_subclass_of(Freelance::class, Employe::class));\n$s = new Salarie('Ana', 30000);\ncheck('Salarie : 30000/12 = 2500', abs($s->salaireMensuel() - 2500) < 0.01, 'obtenu : ' . $s->salaireMensuel());\n$f = new Freelance('Léo', 400, 10);\ncheck('Freelance : 400 × 10 = 4000', abs($f->salaireMensuel() - 4000) < 0.01);\ncheck('fiche() formate \"Ana : 2500.00 €\"', $s->fiche() === 'Ana : 2500.00 €', 'obtenu : ' . $s->fiche());\ncheck('fiche() est définie dans Employe (pas dupliquée)', (new ReflectionMethod(Salarie::class, 'fiche'))->getDeclaringClass()->getName() === 'Employe');"}}, {"level": 2, "title": "Notifications : SMS, email, push", "enonce": "Une application envoie des notifications par plusieurs canaux. Chaque canal **formate** le message différemment (un SMS est limité à 160 caractères, un email a un sujet), mais tous suivent les mêmes étapes : vérifier le destinataire, formater, envoyer, journaliser. Tu mets les étapes communes dans le parent et tu laisses les enfants ne définir que ce qui change (c'est le patron *Template Method*).", "consignes": ["`abstract class Notification` avec `envoyer(string $destinataire, string $message): string` **concrète** qui : vérifie que le destinataire n'est pas vide (`InvalidArgumentException`), appelle `formater($message)`, puis renvoie `'[' . static::class . '] ' . $destinataire . ' <= ' . $formaté`", "`abstract protected function formater(string $message): string;`", "`Sms` : si le message dépasse 160 caractères, garde les 157 premiers et ajoute `...` (160 au total)", "`Email` : constructeur avec `$sujet`, formate en `\"Sujet: $sujet | $message\"`", "`Push` : met en majuscules", "`envoyer()` ne doit **pas** être redéfinie dans les enfants (marque-la `final`)"], "files": [{"path": "Notification.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nabstract class Notification\n{\n    // à toi\n}\n\n// Sms, Email, Push\n\n$canaux = [new Sms(), new Email('Bienvenue'), new Push()];\nforeach ($canaux as $canal) {\n    echo $canal->envoyer('ana', 'Ton compte est pret'), PHP_EOL;\n}"}], "hints": ["`static::class` dans le parent donne le nom de la classe **réelle** (`Sms`, `Email`…), pas `Notification`.", "`strlen($message) > 160` puis `substr($message, 0, 157) . '...'` : le résultat fait exactement 160 caractères.", "`final public function envoyer(...)` : le mot-clé `final` sur une **méthode** interdit aux enfants de la redéfinir."], "solution": [{"path": "Notification.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nabstract class Notification\n{\n    final public function envoyer(string $destinataire, string $message): string\n    {\n        if (trim($destinataire) === '') {\n            throw new InvalidArgumentException('Destinataire manquant');\n        }\n        $formate = $this->formater($message);\n        return '[' . static::class . '] ' . $destinataire . ' <= ' . $formate;\n    }\n\n    abstract protected function formater(string $message): string;\n}\n\nfinal class Sms extends Notification\n{\n    protected function formater(string $message): string\n    {\n        return strlen($message) > 160 ? substr($message, 0, 157) . '...' : $message;\n    }\n}\n\nfinal class Email extends Notification\n{\n    public function __construct(private string $sujet) {}\n\n    protected function formater(string $message): string\n    {\n        return \"Sujet: {$this->sujet} | $message\";\n    }\n}\n\nfinal class Push extends Notification\n{\n    protected function formater(string $message): string\n    {\n        return strtoupper($message);\n    }\n}\n\n$canaux = [new Sms(), new Email('Bienvenue'), new Push()];\nforeach ($canaux as $canal) {\n    echo $canal->envoyer('ana', 'Ton compte est pret'), PHP_EOL;\n}"}], "checks": ["Ajouter un canal `Slack` demande une classe de 6 lignes et rien d'autre", "Un destinataire vide est refusé par **tous** les canaux grâce au parent", "Un enfant qui redéfinit `envoyer()` provoque une erreur"], "run": {"kind": "php", "tests": "check('Notification est abstraite', (new ReflectionClass(Notification::class))->isAbstract());\ncheck('envoyer() est final', (new ReflectionMethod(Notification::class, 'envoyer'))->isFinal());\ncheck('formater() est abstraite et protected', (new ReflectionMethod(Notification::class, 'formater'))->isAbstract() && (new ReflectionMethod(Notification::class, 'formater'))->isProtected());\n$sms = new Sms();\ncheck('Sms : message court intact', $sms->envoyer('ana', 'Salut') === '[Sms] ana <= Salut', $sms->envoyer('ana', 'Salut'));\n$long = str_repeat('a', 200);\n$out = $sms->envoyer('ana', $long);\ncheck('Sms : message long coupé à 160 avec ...', strlen(explode(' <= ', $out)[1]) === 160 && str_ends_with($out, '...'), 'longueur : ' . strlen(explode(' <= ', $out)[1]));\ncheck('Email : sujet ajouté', (new Email('Bienvenue'))->envoyer('ana', 'ok') === '[Email] ana <= Sujet: Bienvenue | ok');\ncheck('Push : majuscules', (new Push())->envoyer('ana', 'ok') === '[Push] ana <= OK');\ncheck('destinataire vide refusé (règle du parent)', throws(fn() => (new Push())->envoyer('  ', 'x'), InvalidArgumentException::class));"}, "expected": "[Sms] ana <= Ton compte est pret\n[Email] ana <= Sujet: Bienvenue | Ton compte est pret\n[Push] ana <= TON COMPTE EST PRET"}, {"level": 3, "title": "Héritage ou composition ? Refactoriser un mauvais design", "enonce": "Un développeur a modélisé une boutique avec de l'héritage partout. Résultat : `ProduitEnPromo extends Produit`, `ProduitEnPromoLivraisonGratuite extends ProduitEnPromo`… et impossible d'avoir un produit en livraison gratuite **sans** promo. Ton travail : garder l'héritage là où il est justifié (« est un ») et remplacer le reste par de la composition, sans changer les résultats affichés.", "consignes": ["Supprime `ProduitEnPromo` et `ProduitEnPromoLivraisonGratuite`", "Crée un objet `Remise` (pourcentage, validé entre 0 et 100) et un objet `Livraison` (`estGratuite(): bool`, `frais(): float`) que `Produit` reçoit en **composition** (avec des valeurs par défaut : pas de remise, livraison 4,90 €)", "`Produit::prixFinal(): float` = prix remisé + frais de livraison", "Garde `ProduitNumerique extends Produit` (un produit numérique **est un** produit sans livraison : il force une `Livraison` gratuite et interdit d'en changer)", "Le script de démo doit afficher exactement le même résultat qu'avant"], "files": [{"path": "Boutique.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\n// ---- AVANT : à refactoriser ----\nclass Produit\n{\n    public function __construct(protected string $nom, protected float $prix) {}\n    public function prixFinal(): float { return $this->prix + 4.90; }\n    public function nom(): string { return $this->nom; }\n}\n\nclass ProduitEnPromo extends Produit\n{\n    public function __construct(string $nom, float $prix, protected float $remise) { parent::__construct($nom, $prix); }\n    public function prixFinal(): float { return $this->prix * (1 - $this->remise / 100) + 4.90; }\n}\n\nclass ProduitEnPromoLivraisonGratuite extends ProduitEnPromo\n{\n    public function prixFinal(): float { return $this->prix * (1 - $this->remise / 100); }\n}\n\nclass ProduitNumerique extends Produit\n{\n    public function prixFinal(): float { return $this->prix; }\n}\n\n// ---- Démo : le résultat doit rester identique après refactor ----\n$produits = [\n    new Produit('Clavier', 50.0),\n    new ProduitEnPromo('Souris', 20.0, 10),\n    new ProduitEnPromoLivraisonGratuite('Écran', 200.0, 15),\n    new ProduitNumerique('Ebook PHP', 12.0),\n];\nforeach ($produits as $p) {\n    printf(\"%-10s %7.2f €\\n\", $p->nom(), $p->prixFinal());\n}"}], "hints": ["La version refactorisée du script de démo : `new Produit('Souris', 20.0, new Remise(10))`, `new Produit('Écran', 200.0, new Remise(15), Livraison::gratuite())`.", "`Livraison` avec deux constructeurs nommés : `Livraison::standard()` (4,90) et `Livraison::gratuite()` (0).", "Dans `ProduitNumerique`, le constructeur ne prend pas de livraison et appelle `parent::__construct($nom, $prix, $remise, Livraison::gratuite())`.", "Le `printf` et les montants ne doivent pas bouger : c'est ton test de non-régression."], "solution": [{"path": "Boutique.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Remise\n{\n    public function __construct(public readonly float $pourcentage = 0)\n    {\n        if ($pourcentage < 0 || $pourcentage > 100) {\n            throw new InvalidArgumentException('Remise entre 0 et 100');\n        }\n    }\n\n    public function appliquer(float $prix): float\n    {\n        return $prix * (1 - $this->pourcentage / 100);\n    }\n}\n\nfinal class Livraison\n{\n    private function __construct(private float $frais) {}\n\n    public static function standard(): self { return new self(4.90); }\n    public static function gratuite(): self { return new self(0.0); }\n\n    public function estGratuite(): bool { return $this->frais === 0.0; }\n    public function frais(): float { return $this->frais; }\n}\n\nclass Produit\n{\n    protected Livraison $livraison;\n\n    public function __construct(\n        protected string $nom,\n        protected float $prix,\n        protected Remise $remise = new Remise(0),\n        ?Livraison $livraison = null,\n    ) {\n        $this->livraison = $livraison ?? Livraison::standard();\n    }\n\n    public function prixFinal(): float\n    {\n        return $this->remise->appliquer($this->prix) + $this->livraison->frais();\n    }\n\n    public function nom(): string { return $this->nom; }\n}\n\nfinal class ProduitNumerique extends Produit\n{\n    public function __construct(string $nom, float $prix, Remise $remise = new Remise(0))\n    {\n        parent::__construct($nom, $prix, $remise, Livraison::gratuite());\n    }\n}\n\n$produits = [\n    new Produit('Clavier', 50.0),\n    new Produit('Souris', 20.0, new Remise(10)),\n    new Produit('Écran', 200.0, new Remise(15), Livraison::gratuite()),\n    new ProduitNumerique('Ebook PHP', 12.0),\n];\nforeach ($produits as $p) {\n    printf(\"%-10s %7.2f €\\n\", $p->nom(), $p->prixFinal());\n}"}], "checks": ["Il ne reste que **deux** classes de produit : `Produit` et `ProduitNumerique`", "On peut créer un produit en livraison gratuite **sans** remise, ce qui était impossible avant", "La sortie du script est identique à l'avant"], "run": {"kind": "php", "tests": "check('ProduitEnPromo a disparu', !class_exists('ProduitEnPromo'));\ncheck('ProduitEnPromoLivraisonGratuite a disparu', !class_exists('ProduitEnPromoLivraisonGratuite'));\ncheck('Remise existe', class_exists('Remise'));\ncheck('Livraison existe', class_exists('Livraison'));\ncheck('ProduitNumerique est toujours un Produit', is_subclass_of(ProduitNumerique::class, Produit::class));\ncheck('Remise(150) refusée', throws(fn() => new Remise(150), InvalidArgumentException::class));\n$p = new Produit('Clavier', 50.0);\ncheck('Clavier : 54.90', abs($p->prixFinal() - 54.90) < 0.001, 'obtenu : ' . $p->prixFinal());\n$s = new Produit('Souris', 20.0, new Remise(10));\ncheck('Souris -10% : 22.90', abs($s->prixFinal() - 22.90) < 0.001, 'obtenu : ' . $s->prixFinal());\n$e = new Produit('Écran', 200.0, new Remise(15), Livraison::gratuite());\ncheck('Écran -15% livraison gratuite : 170.00', abs($e->prixFinal() - 170.0) < 0.001, 'obtenu : ' . $e->prixFinal());\n$g = new Produit('Câble', 10.0, new Remise(0), Livraison::gratuite());\ncheck('livraison gratuite SANS remise possible : 10.00', abs($g->prixFinal() - 10.0) < 0.001);\n$n = new ProduitNumerique('Ebook PHP', 12.0);\ncheck('Ebook : 12.00', abs($n->prixFinal() - 12.0) < 0.001);"}, "expected": "Clavier      54.90 €\nSouris       22.90 €\nÉcran       170.00 €\nEbook PHP    12.00 €"}]}, {"id": "php-interfaces", "track": "php", "title": "Interfaces & polymorphisme", "minutes": 15, "goal": "Programmer contre un contrat plutôt que contre une classe précise.", "why": "Si ton service dépend de `MailjetMailer`, changer de fournisseur oblige à modifier le service. Avec une interface, tu changes seulement l'implémentation.", "flow": ["L'**interface** décrit le contrat (des méthodes, sans code)", "Des classes l'**implémentent** (`implements`)", "Ton service **demande l'interface**, pas une classe", "On peut **brancher** n'importe quelle implémentation"], "points": ["Une interface = une liste de méthodes publiques à fournir. Pas d'état, pas de code.", "Une classe peut implémenter **plusieurs** interfaces, mais n'hérite que d'**une** classe.", "Interface : ce que ça sait faire. Classe abstraite : ce que c'est, avec du code partagé.", "C'est la base de l'injection de dépendances et des repositories en DDD."], "pitfalls": ["Une interface pour chaque classe « au cas où » : crée-la quand tu as plusieurs implémentations ou besoin de tester.", "Mettre dans l'interface des méthodes qu'une seule implémentation utilise."], "example": {"files": [{"path": "src/Notifier.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\ninterface Notifier\n{\n    public function envoyer(string $destinataire, string $message): void;\n}"}, {"path": "src/EmailNotifier.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class EmailNotifier implements Notifier\n{\n    public function envoyer(string $destinataire, string $message): void\n    {\n        echo \"Email à $destinataire : $message\\n\";\n    }\n}"}, {"path": "src/SmsNotifier.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class SmsNotifier implements Notifier\n{\n    public function envoyer(string $destinataire, string $message): void\n    {\n        echo \"SMS à $destinataire : $message\\n\";\n    }\n}"}, {"path": "src/AlerteStock.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class AlerteStock\n{\n    public function __construct(private Notifier $notifier) {}\n\n    public function verifier(string $produit, int $stock): void\n    {\n        if ($stock < 5) {\n            $this->notifier->envoyer('gerant', \"Stock bas : $produit ($stock)\");\n        }\n    }\n}"}, {"path": "demo.php", "lang": "php", "code": "<?php\n(new AlerteStock(new SmsNotifier()))->verifier('Clavier', 2);\n// SMS à gerant : Stock bas : Clavier (2)\n\n(new AlerteStock(new EmailNotifier()))->verifier('Clavier', 2);\n// Email à gerant : Stock bas : Clavier (2)"}], "notes": ["`Notifier.php` ne contient qu'une signature : c'est le contrat.", "`AlerteStock.php` ne mentionne ni SMS ni email : il demande un `Notifier`.", "Dans `demo.php`, la seule différence entre les deux appels est l'objet passé au constructeur.", "Un `FakeNotifier` qui enregistre les messages permettrait de tester `AlerteStock` sans rien envoyer."]}, "quiz": [{"q": "Combien d'interfaces une classe peut-elle implémenter ?", "options": ["Une seule", "Deux maximum", "Autant qu'elle veut", "Aucune si elle hérite déjà"], "answer": 2, "why": "`class A extends B implements C, D, E` est valide."}, {"q": "Pourquoi `AlerteStock` reçoit-il un `Notifier` et pas un `SmsNotifier` ?", "options": ["Pour la performance", "Pour changer d'implémentation sans modifier `AlerteStock`", "Parce que `SmsNotifier` est final", "C'est obligatoire en PHP"], "answer": 1, "why": "Il dépend du contrat, pas d'un fournisseur précis."}, {"q": "Une interface peut contenir…", "options": ["des propriétés privées", "des signatures de méthodes publiques (et des constantes)", "le code des méthodes", "un constructeur avec du code"], "answer": 1, "why": "Une interface décrit, elle n'implémente pas."}], "prereq": [{"term": "Classe abstraite", "def": "Classe qu'on ne peut pas instancier, qui contient du code commun et des méthodes abstraites à implémenter (module Héritage). L'interface en est la version « sans aucun code »."}, {"term": "Contrat", "def": "Une promesse sur **ce qu'une classe sait faire** (ses méthodes publiques), indépendamment de **comment** elle le fait. Une interface est un contrat écrit dans le langage."}, {"term": "Couplage", "def": "Le degré de dépendance entre deux morceaux de code. Fort couplage : changer l'un oblige à changer l'autre. Les interfaces servent à **découpler**."}, {"term": "Classe anonyme", "def": "Une classe sans nom créée sur place : `new class implements Notifier { ... }`. Pratique pour un faux objet dans un test."}], "diagram": {"nodes": [{"id": "svc", "col": 0, "row": 1, "label": "AlerteStock", "kind": "box", "sub": "dépend de Notifier"}, {"id": "iface", "col": 1, "row": 1, "label": "interface Notifier", "kind": "doc", "sub": "envoyer(…)", "color": "accent"}, {"id": "email", "col": 2, "row": 0, "label": "EmailNotifier", "kind": "box", "sub": "implements"}, {"id": "sms", "col": 2, "row": 1, "label": "SmsNotifier", "kind": "box", "sub": "implements"}, {"id": "fake", "col": 2, "row": 2, "label": "FakeNotifier", "kind": "box", "sub": "pour les tests", "color": "good"}], "edges": [{"from": "svc", "to": "iface", "label": "utilise"}, {"from": "email", "to": "iface", "dashed": true}, {"from": "sms", "to": "iface", "dashed": true}, {"from": "fake", "to": "iface", "dashed": true}], "caption": "Le service ne connaît que le contrat. On branche l'implémentation qu'on veut, y compris une fausse pour tester."}, "lessons": [{"title": "Le problème : dépendre d'une classe précise", "body": "```php\nfinal class AlerteStock\n{\n    private SmsNotifier $notifier;\n\n    public function __construct()\n    {\n        $this->notifier = new SmsNotifier();   // couplage fort\n    }\n}\n```\n\n`AlerteStock` est soudée à `SmsNotifier`. Conséquences : impossible de passer à l'email sans **modifier** `AlerteStock` ; impossible de tester `AlerteStock` sans envoyer de vrais SMS ; et si demain on veut envoyer SMS **et** email, il faut encore la modifier.\n\nCe que `AlerteStock` veut vraiment, ce n'est pas « un SmsNotifier », c'est « quelque chose qui sait envoyer un message ». C'est ce besoin, et uniquement lui, qu'une **interface** décrit."}, {"title": "Une interface est un contrat sans code", "body": "```php\ninterface Notifier\n{\n    public function envoyer(string $destinataire, string $message): void;\n}\n```\n\nUne interface liste des **signatures** de méthodes publiques (et éventuellement des constantes). Pas de propriétés, pas de corps de méthode. Elle dit « toute classe qui m'implémente **promet** de fournir ces méthodes ».\n\n```php\nfinal class EmailNotifier implements Notifier\n{\n    public function envoyer(string $destinataire, string $message): void\n    {\n        // envoi par email\n    }\n}\n```\n\nSi `EmailNotifier` oublie `envoyer()` ou change sa signature, PHP refuse de charger la classe : le contrat est vérifié par le langage, pas par la bonne volonté.\n\nDifférences avec une classe abstraite :\n\n- Une classe n'hérite que d'**une** classe (`extends`), mais peut implémenter **plusieurs** interfaces (`implements A, B`).\n- La classe abstraite dit « ce que c'est » et partage du **code** ; l'interface dit « ce que ça sait faire » et ne partage **rien**.\n- En pratique : interface pour décrire un **rôle** qu'on branche (`Notifier`, `Repository`, `PaymentGateway`), classe abstraite pour factoriser du code entre des enfants proches (`Forme`)."}, {"title": "Programmer contre l'interface", "body": "```php\nfinal class AlerteStock\n{\n    public function __construct(private Notifier $notifier) {}   // le type est l'INTERFACE\n\n    public function verifier(string $produit, int $stock): void\n    {\n        if ($stock < 5) {\n            $this->notifier->envoyer('gerant', \"Stock bas : $produit ($stock)\");\n        }\n    }\n}\n\nnew AlerteStock(new SmsNotifier());      // en prod, aujourd'hui\nnew AlerteStock(new EmailNotifier());    // demain : zéro changement dans AlerteStock\n```\n\n`AlerteStock` ne contient plus aucun `new` de notifier : il **reçoit** un objet qui respecte le contrat, et il s'en sert. Qui décide de l'implémentation ? Le code qui construit `AlerteStock` (dans Symfony, le conteneur de services, voir le module Injection de dépendances).\n\nC'est le même polymorphisme que dans le module Héritage : `$this->notifier->envoyer()` exécute la version de la classe réelle. La différence, c'est que les implémentations n'ont **aucun code en commun** ni de parent commun : juste le contrat."}, {"title": "Le bonus : des tests sans effets de bord", "body": "Comment vérifier qu'`AlerteStock` envoie bien une alerte quand le stock passe sous 5, sans envoyer un vrai SMS à chaque exécution des tests ? Avec une **fausse implémentation** qui se contente de mémoriser ce qu'on lui demande :\n\n```php\nfinal class FakeNotifier implements Notifier\n{\n    public array $envoyes = [];\n\n    public function envoyer(string $destinataire, string $message): void\n    {\n        $this->envoyes[] = [$destinataire, $message];\n    }\n}\n\n$fake = new FakeNotifier();\n(new AlerteStock($fake))->verifier('Clavier', 2);\nassert(count($fake->envoyes) === 1);\nassert(str_contains($fake->envoyes[0][1], 'Clavier'));\n```\n\nLe test est instantané, ne dépend d'aucun réseau, et vérifie précisément le comportement d'`AlerteStock`. Sans interface, ce test est impossible à écrire proprement.\n\nQuand créer une interface ? Pas « au cas où » pour chaque classe : quand tu as (ou prévois très probablement) **plusieurs implémentations**, ou quand tu as besoin de **remplacer** une dépendance dans les tests (tout ce qui touche au réseau, à la base, au temps, au hasard)."}], "recap": ["Une interface = une liste de signatures publiques. Aucun code, aucune propriété.", "`implements` engage la classe : méthode manquante ou signature différente = erreur au chargement.", "Un service **demande l'interface** dans son constructeur, jamais une classe concrète.", "Une classe implémente **plusieurs** interfaces, mais n'hérite que d'**une** classe.", "Interface + fausse implémentation = tests rapides, sans réseau ni base."], "tds": [{"level": 1, "title": "Moyens de paiement", "enonce": "Ton site accepte plusieurs moyens de paiement. Le service de commande ne doit pas savoir lequel est utilisé.", "consignes": ["Interface `PaymentGateway` avec `payer(int $centimes): string` (renvoie un id de transaction)", "`StripeGateway` : id préfixé `stripe_`", "`FakeGateway` (pour les tests) : mémorise les montants payés dans `public array $paiements`", "`CheckoutService` reçoit une `PaymentGateway`, méthode `checkout(int $centimes): string`", "`checkout` refuse un montant ≤ 0"], "files": [{"path": "Paiement.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\ninterface PaymentGateway\n{\n    // à toi\n}\n\n// StripeGateway, FakeGateway, CheckoutService\n\n$fake = new FakeGateway();\n$service = new CheckoutService($fake);\n$service->checkout(4200);\nvar_dump($fake->paiements); // [4200]"}], "hints": ["`uniqid('stripe_')` génère un id simple.", "`FakeGateway` ajoute chaque montant à `$this->paiements[]`.", "`public function __construct(private PaymentGateway $gateway) {}`"], "solution": [{"path": "Paiement.php", "lang": "php", "code": "interface PaymentGateway\n{\n    public function payer(int $centimes): string;\n}\n\nfinal class StripeGateway implements PaymentGateway\n{\n    public function payer(int $centimes): string\n    {\n        // appel à l'API Stripe ici\n        return uniqid('stripe_');\n    }\n}\n\nfinal class FakeGateway implements PaymentGateway\n{\n    public array $paiements = [];\n\n    public function payer(int $centimes): string\n    {\n        $this->paiements[] = $centimes;\n        return 'fake_' . count($this->paiements);\n    }\n}\n\nfinal class CheckoutService\n{\n    public function __construct(private PaymentGateway $gateway) {}\n\n    public function checkout(int $centimes): string\n    {\n        if ($centimes <= 0) {\n            throw new InvalidArgumentException('Montant invalide');\n        }\n        return $this->gateway->payer($centimes);\n    }\n}"}], "checks": ["`CheckoutService` ne mentionne jamais Stripe", "Tu peux tester `checkout` sans réseau grâce à `FakeGateway`"], "run": {"kind": "php", "tests": "check('PaymentGateway est une interface', interface_exists('PaymentGateway'));\ncheck('StripeGateway implémente PaymentGateway', in_array('PaymentGateway', class_implements(StripeGateway::class)));\ncheck('FakeGateway implémente PaymentGateway', in_array('PaymentGateway', class_implements(FakeGateway::class)));\n$fake = new FakeGateway();\n$service = new CheckoutService($fake);\n$id = $service->checkout(4200);\ncheck('checkout renvoie un id non vide', is_string($id) && $id !== '');\ncheck('FakeGateway a mémorisé le montant 4200', $fake->paiements === [4200], json_encode($fake->paiements));\ncheck('un montant de 0 est refusé', throws(fn() => $service->checkout(0), InvalidArgumentException::class));\ncheck('un montant négatif est refusé', throws(fn() => $service->checkout(-5), InvalidArgumentException::class));\ncheck('StripeGateway renvoie un id préfixé stripe_', str_starts_with((new StripeGateway())->payer(100), 'stripe_'));\n$src = file_get_contents(__FILE__) ?: '';\ncheck('CheckoutService ne mentionne pas Stripe', !preg_match('/class CheckoutService.*?\\n}/s', $src, $mm) || !str_contains($mm[0], 'Stripe'));"}}, {"level": 2, "title": "Plusieurs interfaces pour un même objet", "enonce": "Un objet peut jouer plusieurs rôles. Un `Document` doit pouvoir être **exporté** (en texte, en JSON) et **comparé** à un autre. Tu définis deux interfaces et un service de tri qui ne connaît que le contrat de comparaison. Tu verras aussi `instanceof` pour vérifier qu'un objet respecte un contrat.", "consignes": ["`interface Exportable { public function exporter(): string; }` et `interface Comparable { public function comparerA(Comparable $autre): int; }` (−1, 0 ou 1)", "`Document` (titre, nbPages) implémente **les deux** : exporte en `\"Titre (12 p.)\"`, compare par nombre de pages", "`Image` (nom, largeur, hauteur) implémente seulement `Exportable` : `\"nom 800x600\"`", "`Trieur::trier(array $elements): array` : refuse (`InvalidArgumentException`) tout élément qui n'est pas `Comparable`, et renvoie la liste triée", "`Exporteur::toutExporter(array $elements): string` : une ligne par élément exportable (les autres sont ignorés)"], "files": [{"path": "Documents.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\ninterface Exportable\n{\n    // à toi\n}\n\ninterface Comparable\n{\n    // à toi\n}\n\n// Document, Image, Trieur, Exporteur\n\n$docs = [new Document('Rapport', 12), new Document('Note', 2), new Document('Thèse', 300)];\nforeach ((new Trieur())->trier($docs) as $d) {\n    echo $d->exporter(), PHP_EOL;\n}\necho (new Exporteur())->toutExporter([new Image('logo', 800, 600), new Document('Note', 2)]);"}], "hints": ["`class Document implements Exportable, Comparable` : les interfaces se séparent par une virgule.", "Dans `comparerA`, `$autre` est typé `Comparable` : pour accéder à `nbPages`, vérifie `$autre instanceof Document` et lève une exception sinon.", "`usort($elements, fn(Comparable $a, Comparable $b) => $a->comparerA($b));` : `usort` attend exactement −1 / 0 / 1 ; l'opérateur `<=>` les renvoie."], "solution": [{"path": "Documents.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\ninterface Exportable\n{\n    public function exporter(): string;\n}\n\ninterface Comparable\n{\n    public function comparerA(Comparable $autre): int;\n}\n\nfinal class Document implements Exportable, Comparable\n{\n    public function __construct(private string $titre, private int $nbPages) {}\n\n    public function exporter(): string\n    {\n        return sprintf('%s (%d p.)', $this->titre, $this->nbPages);\n    }\n\n    public function comparerA(Comparable $autre): int\n    {\n        if (!$autre instanceof Document) {\n            throw new InvalidArgumentException('Comparaison impossible');\n        }\n        return $this->nbPages <=> $autre->nbPages;\n    }\n}\n\nfinal class Image implements Exportable\n{\n    public function __construct(private string $nom, private int $largeur, private int $hauteur) {}\n\n    public function exporter(): string\n    {\n        return sprintf('%s %dx%d', $this->nom, $this->largeur, $this->hauteur);\n    }\n}\n\nfinal class Trieur\n{\n    /** @param Comparable[] $elements */\n    public function trier(array $elements): array\n    {\n        foreach ($elements as $e) {\n            if (!$e instanceof Comparable) {\n                throw new InvalidArgumentException('Élément non comparable');\n            }\n        }\n        usort($elements, fn(Comparable $a, Comparable $b) => $a->comparerA($b));\n        return $elements;\n    }\n}\n\nfinal class Exporteur\n{\n    public function toutExporter(array $elements): string\n    {\n        $out = '';\n        foreach ($elements as $e) {\n            if ($e instanceof Exportable) {\n                $out .= $e->exporter() . PHP_EOL;\n            }\n        }\n        return $out;\n    }\n}\n\n$docs = [new Document('Rapport', 12), new Document('Note', 2), new Document('Thèse', 300)];\nforeach ((new Trieur())->trier($docs) as $d) {\n    echo $d->exporter(), PHP_EOL;\n}\necho (new Exporteur())->toutExporter([new Image('logo', 800, 600), new Document('Note', 2)]);"}], "checks": ["`Document` implémente deux interfaces, `Image` une seule", "Trier une liste contenant une `Image` lève une exception", "`Exporteur` ne connaît ni `Document` ni `Image`, seulement `Exportable`"], "run": {"kind": "php", "tests": "check('Exportable et Comparable sont des interfaces', interface_exists('Exportable') && interface_exists('Comparable'));\n$impl = class_implements(Document::class);\ncheck('Document implémente les deux interfaces', in_array('Exportable', $impl) && in_array('Comparable', $impl));\ncheck('Image implémente seulement Exportable', in_array('Exportable', class_implements(Image::class)) && !in_array('Comparable', class_implements(Image::class)));\n$tries = (new Trieur())->trier([new Document('Rapport', 12), new Document('Note', 2), new Document('Thèse', 300)]);\ncheck('tri par pages croissantes', array_map(fn($d) => $d->exporter(), $tries) === ['Note (2 p.)', 'Rapport (12 p.)', 'Thèse (300 p.)'], json_encode(array_map(fn($d) => $d->exporter(), $tries)));\ncheck('trier une Image est refusé', throws(fn() => (new Trieur())->trier([new Image('x', 1, 1)]), InvalidArgumentException::class));\n$out = (new Exporteur())->toutExporter([new Image('logo', 800, 600), new Document('Note', 2), 'intrus']);\ncheck('toutExporter ignore ce qui n\\'est pas Exportable', $out === \"logo 800x600\\nNote (2 p.)\\n\", json_encode($out));"}, "expected": "Note (2 p.)\nRapport (12 p.)\nThèse (300 p.)\nlogo 800x600\nNote (2 p.)"}, {"level": 3, "title": "Stratégie de livraison et tests sans réseau", "enonce": "Un site calcule les frais de port via des transporteurs externes. Chaque transporteur a sa propre API (on la **simule** ici), ses propres règles, et parfois il tombe en panne. Tu écris un `CalculateurFraisDePort` qui interroge plusieurs transporteurs, ignore ceux en panne, et choisit le moins cher. Tu combines interface, polymorphisme, exceptions, et une fausse implémentation pour tester chaque cas (panne, aucun transporteur, égalité).", "consignes": ["`interface Transporteur { public function nom(): string; public function devis(float $poidsKg): float; }` ; un transporteur **en panne** lève `TransporteurIndisponible` (classe d'exception à créer, qui étend `RuntimeException`)", "`Colissimo` : 4,90 + 1,20 €/kg ; `Chronopost` : 9,00 + 0,80 €/kg, refuse (`InvalidArgumentException`) au-delà de 30 kg", "`CalculateurFraisDePort::__construct(Transporteur ...$transporteurs)` (variadique : autant de transporteurs qu'on veut)", "`meilleurDevis(float $poids): Devis` : `Devis` est un petit objet (`transporteur`, `montant`) ; ignore les transporteurs indisponibles ou qui refusent ; si aucun ne répond, `DomainException`", "`FakeTransporteur` configurable : `new FakeTransporteur('Test', montant: 5.0)` ou `new FakeTransporteur('Test', panne: true)`", "Écris 3 scénarios de test à la fin du fichier avec `assert()` : moins cher choisi, panne ignorée, aucun disponible"], "files": [{"path": "Livraison.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class TransporteurIndisponible extends RuntimeException {}\n\ninterface Transporteur\n{\n    // à toi\n}\n\n// Colissimo, Chronopost, FakeTransporteur, Devis, CalculateurFraisDePort\n\n$calc = new CalculateurFraisDePort(new Colissimo(), new Chronopost());\n$d = $calc->meilleurDevis(2.0);\nprintf(\"%s : %.2f €\\n\", $d->transporteur, $d->montant);   // Colissimo : 7.30 €\n$d = $calc->meilleurDevis(20.0);\nprintf(\"%s : %.2f €\\n\", $d->transporteur, $d->montant);   // Chronopost : 25.00 €"}], "hints": ["Variadique : `public function __construct(Transporteur ...$transporteurs) { $this->transporteurs = $transporteurs; }`.", "Dans la boucle : `try { $m = $t->devis($poids); } catch (TransporteurIndisponible | InvalidArgumentException $e) { continue; }` : le `|` attrape deux types d'exception.", "Garde le meilleur au fur et à mesure : `if ($meilleur === null || $m < $meilleur->montant) $meilleur = new Devis($t->nom(), $m);`.", "`FakeTransporteur` : `public function __construct(private string $nom, private float $montant = 0, private bool $panne = false) {}` et `devis()` lève si `$this->panne`."], "solution": [{"path": "Livraison.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class TransporteurIndisponible extends RuntimeException {}\n\ninterface Transporteur\n{\n    public function nom(): string;\n    public function devis(float $poidsKg): float;\n}\n\nfinal class Colissimo implements Transporteur\n{\n    public function nom(): string { return 'Colissimo'; }\n\n    public function devis(float $poidsKg): float\n    {\n        return 4.90 + 1.20 * $poidsKg;\n    }\n}\n\nfinal class Chronopost implements Transporteur\n{\n    public function nom(): string { return 'Chronopost'; }\n\n    public function devis(float $poidsKg): float\n    {\n        if ($poidsKg > 30) {\n            throw new InvalidArgumentException('30 kg maximum');\n        }\n        return 9.00 + 0.80 * $poidsKg;\n    }\n}\n\nfinal class FakeTransporteur implements Transporteur\n{\n    public function __construct(private string $nom, private float $montant = 0.0, private bool $panne = false) {}\n\n    public function nom(): string { return $this->nom; }\n\n    public function devis(float $poidsKg): float\n    {\n        if ($this->panne) {\n            throw new TransporteurIndisponible($this->nom . ' en panne');\n        }\n        return $this->montant;\n    }\n}\n\nfinal class Devis\n{\n    public function __construct(public readonly string $transporteur, public readonly float $montant) {}\n}\n\nfinal class CalculateurFraisDePort\n{\n    /** @var Transporteur[] */\n    private array $transporteurs;\n\n    public function __construct(Transporteur ...$transporteurs)\n    {\n        $this->transporteurs = $transporteurs;\n    }\n\n    public function meilleurDevis(float $poids): Devis\n    {\n        $meilleur = null;\n        foreach ($this->transporteurs as $t) {\n            try {\n                $montant = $t->devis($poids);\n            } catch (TransporteurIndisponible | InvalidArgumentException $e) {\n                continue;\n            }\n            if ($meilleur === null || $montant < $meilleur->montant) {\n                $meilleur = new Devis($t->nom(), $montant);\n            }\n        }\n        if ($meilleur === null) {\n            throw new DomainException('Aucun transporteur disponible');\n        }\n        return $meilleur;\n    }\n}\n\n$calc = new CalculateurFraisDePort(new Colissimo(), new Chronopost());\n$d = $calc->meilleurDevis(2.0);\nprintf(\"%s : %.2f €\\n\", $d->transporteur, $d->montant);   // Colissimo : 7.30 €\n$d = $calc->meilleurDevis(20.0);\nprintf(\"%s : %.2f €\\n\", $d->transporteur, $d->montant);   // Chronopost : 25.00 €\n\n// Scénarios de test\n$c = new CalculateurFraisDePort(new FakeTransporteur('A', 10.0), new FakeTransporteur('B', 7.0));\nassert($c->meilleurDevis(1.0)->transporteur === 'B');\n\n$c = new CalculateurFraisDePort(new FakeTransporteur('A', 10.0), new FakeTransporteur('B', panne: true));\nassert($c->meilleurDevis(1.0)->transporteur === 'A');\n\n$c = new CalculateurFraisDePort(new FakeTransporteur('A', panne: true));\ntry { $c->meilleurDevis(1.0); assert(false); } catch (DomainException $e) { /* attendu */ }"}], "checks": ["Le calculateur ne contient aucun nom de transporteur réel", "Un transporteur en panne n'empêche pas d'obtenir un devis des autres", "Tes 3 scénarios passent avec `FakeTransporteur` sans toucher à Colissimo ni Chronopost"], "run": {"kind": "php", "tests": "check('TransporteurIndisponible étend RuntimeException', is_subclass_of(TransporteurIndisponible::class, RuntimeException::class));\ncheck('Transporteur est une interface avec nom() et devis()', interface_exists('Transporteur') && method_exists('Transporteur', 'nom') && method_exists('Transporteur', 'devis'));\n$calc = new CalculateurFraisDePort(new Colissimo(), new Chronopost());\n$d = $calc->meilleurDevis(2.0);\ncheck('2 kg : Colissimo à 7.30', $d->transporteur === 'Colissimo' && abs($d->montant - 7.30) < 0.001, $d->transporteur . ' ' . $d->montant);\n$d = $calc->meilleurDevis(20.0);\ncheck('20 kg : Chronopost à 25.00', $d->transporteur === 'Chronopost' && abs($d->montant - 25.0) < 0.001);\n$d = $calc->meilleurDevis(40.0);\ncheck('40 kg : Chronopost refuse, Colissimo choisi', $d->transporteur === 'Colissimo');\n$c = new CalculateurFraisDePort(new FakeTransporteur('A', 10.0), new FakeTransporteur('B', 7.0));\ncheck('fake : le moins cher gagne', $c->meilleurDevis(1.0)->transporteur === 'B');\n$c = new CalculateurFraisDePort(new FakeTransporteur('A', 10.0), new FakeTransporteur('B', panne: true));\ncheck('fake : la panne est ignorée', $c->meilleurDevis(1.0)->transporteur === 'A');\n$c = new CalculateurFraisDePort(new FakeTransporteur('A', panne: true));\ncheck('aucun disponible : DomainException', throws(fn() => $c->meilleurDevis(1.0), DomainException::class));\ncheck('constructeur variadique', (new ReflectionMethod(CalculateurFraisDePort::class, '__construct'))->isVariadic());"}, "expected": "Colissimo : 7.30 €\nChronopost : 25.00 €"}]}, {"id": "php-namespaces", "track": "php", "title": "Namespaces & autoload", "minutes": 12, "goal": "Organiser le code en dossiers et laisser Composer charger les classes.", "why": "Sans namespace, ta classe `User` entre en conflit avec celle d'une librairie, et tu dois écrire des `require` partout.", "flow": ["Chaque fichier déclare un **namespace** (`App\\Catalogue`)", "Le namespace **suit les dossiers** (norme PSR-4)", "`composer.json` associe `App\\` au dossier `src/`", "Quand tu utilises une classe, l'**autoloader** trouve et charge le fichier"], "points": ["PSR-4 : `App\\Catalogue\\Produit` → `src/Catalogue/Produit.php`. Une classe par fichier, nom du fichier = nom de la classe.", "`use App\\Catalogue\\Produit;` permet d'écrire `Produit` sans le chemin complet.", "`require __DIR__ . '/vendor/autoload.php';` une seule fois, au point d'entrée.", "Après avoir changé la section `autoload` : `composer dump-autoload`.", "Symfony le fait déjà : `src/` correspond à `App\\`."], "pitfalls": ["Namespace qui ne correspond pas au dossier → « Class not found ».", "Dans un namespace, `new DateTimeImmutable()` sans `use` cherche `App\\...\\DateTimeImmutable`. Ajoute `use DateTimeImmutable;` ou écris `\\DateTimeImmutable`."], "example": {"files": [{"path": "composer.json", "lang": "json", "code": "{\n  \"autoload\": {\n    \"psr-4\": { \"App\\\\\": \"src/\" }\n  }\n}"}, {"path": "src/Catalogue/Produit.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nnamespace App\\Catalogue;\n\nuse DateTimeImmutable;\n\nfinal class Produit\n{\n    public function __construct(\n        private string $nom,\n        private DateTimeImmutable $creeLe = new DateTimeImmutable(),\n    ) {}\n\n    public function nom(): string { return $this->nom; }\n}"}, {"path": "public/index.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nrequire __DIR__ . '/../vendor/autoload.php';\n\nuse App\\Catalogue\\Produit;\n\n$produit = new Produit('Clavier');   // l'autoloader charge src/Catalogue/Produit.php\necho $produit->nom();"}], "notes": ["`composer.json` : la seule règle, `App\\` → `src/`. Lance `composer dump-autoload` après l'avoir ajoutée.", "`Produit.php` : le dossier `src/Catalogue` correspond au namespace `App\\Catalogue`. `use DateTimeImmutable;` importe la classe native.", "`index.php` : un seul `require` (l'autoload). Aucun `require` de `Produit.php`.", "`__DIR__ . '/../vendor/autoload.php'` : chemin construit depuis le dossier de `index.php`, donc valable d'où qu'on lance le script."]}, "quiz": [{"q": "Avec `App\\` → `src/`, où se trouve `App\\Infra\\Doctrine\\OrderRepo` ?", "options": ["src/App/Infra/Doctrine/OrderRepo.php", "src/Infra/Doctrine/OrderRepo.php", "Infra/Doctrine/OrderRepo.php", "vendor/App/OrderRepo.php"], "answer": 1, "why": "Le préfixe `App\\` est remplacé par `src/`, le reste suit les dossiers."}, {"q": "Tu viens d'ajouter un mapping PSR-4 dans composer.json. Que lancer ?", "options": ["composer install --force", "composer dump-autoload", "php -l", "Rien"], "answer": 1, "why": "`dump-autoload` régénère la table de chargement."}, {"q": "Dans `namespace App\\Domain;`, `new DateTimeImmutable()` sans `use`…", "options": ["trouve la classe globale", "cherche `App\\Domain\\DateTimeImmutable` → erreur", "cherche dans vendor", "cherche dans le namespace parent"], "answer": 1, "why": "Pour les classes, PHP ne retombe pas sur l'espace global : il faut `use` ou `\\`."}], "prereq": [{"term": "`require`", "def": "Instruction qui charge un autre fichier PHP : `require 'Produit.php';`. Avant l'autoload, il fallait en écrire un par classe utilisée."}, {"term": "Composer", "def": "Le gestionnaire de dépendances de PHP. Il installe les librairies dans `vendor/` et génère `vendor/autoload.php`, le fichier qui sait charger toutes les classes."}, {"term": "FQCN", "def": "*Fully Qualified Class Name* : le nom complet d'une classe avec son namespace, `App\\Catalogue\\Produit`. C'est ce nom que PHP utilise réellement."}, {"term": "PSR-4", "def": "Une norme de la communauté PHP qui dit comment faire correspondre un namespace à un dossier. Composer et Symfony la suivent."}, {"term": "`__DIR__`", "def": "Constante magique qui vaut le dossier du fichier courant. `__DIR__ . '/vendor/autoload.php'` marche quel que soit l'endroit d'où on lance le script."}], "diagram": {"nodes": [{"id": "code", "col": 0, "row": 0, "label": "new Produit('Clavier')", "kind": "pill", "sub": "dans index.php"}, {"id": "use", "col": 1, "row": 0, "label": "use App\\Catalogue\\Produit", "kind": "note", "sub": "→ App\\Catalogue\\Produit"}, {"id": "auto", "col": 2, "row": 0, "label": "Autoloader", "kind": "box", "sub": "vendor/autoload.php"}, {"id": "map", "col": 2, "row": 1, "label": "composer.json", "kind": "doc", "sub": "\"App\\\\\" : \"src/\""}, {"id": "file", "col": 3, "row": 0, "label": "src/Catalogue/Produit.php", "kind": "file", "color": "good"}], "edges": [{"from": "code", "to": "use", "label": "1 nom complet"}, {"from": "use", "to": "auto", "label": "2 classe inconnue ?"}, {"from": "map", "to": "auto", "label": "règle", "dashed": true}, {"from": "auto", "to": "file", "label": "3 require"}], "caption": "À la première utilisation d'une classe, l'autoloader traduit son nom complet en chemin de fichier et le charge."}, "lessons": [{"title": "Deux problèmes que les namespaces règlent", "body": "**Les collisions de noms.** Ton projet a une classe `User`. La librairie d'authentification que tu installes a aussi une classe `User`. En PHP, deux classes ne peuvent pas porter le même nom : l'une des deux casse l'autre. Avec des namespaces, elles s'appellent `App\\Security\\User` et `Vendor\\Auth\\User` : plus de conflit.\n\n**Les `require` à la main.** Sans namespace ni autoload, chaque fichier commence par une liste de `require 'Produit.php'; require 'Catalogue.php'; …` qu'il faut maintenir. On oublie un fichier, on en charge deux fois, on crée des chemins relatifs fragiles. L'**autoloader** supprime tout ça : tu utilises une classe, PHP la charge tout seul.\n\nLes deux mécanismes vont ensemble : le namespace donne à chaque classe un nom complet unique, et c'est ce nom complet que l'autoloader traduit en chemin de fichier."}, {"title": "Déclarer et utiliser un namespace", "body": "```php\n<?php\n// src/Catalogue/Produit.php\nnamespace App\\Catalogue;\n\nfinal class Produit { /* ... */ }\n```\n\nLa ligne `namespace` est la première instruction du fichier. Le nom complet de cette classe est désormais `App\\Catalogue\\Produit`. Pour l'utiliser ailleurs, trois façons :\n\n```php\n// 1. le nom complet, à chaque fois (lourd)\n$p = new \\App\\Catalogue\\Produit('Clavier');\n\n// 2. importer une fois en haut du fichier, puis le nom court (la norme)\nuse App\\Catalogue\\Produit;\n$p = new Produit('Clavier');\n\n// 3. renommer en cas de conflit\nuse App\\Catalogue\\Produit as ProduitCatalogue;\n```\n\nLe piège classique : **dans** un fichier qui a un namespace, les classes natives de PHP (`DateTimeImmutable`, `Exception`, `InvalidArgumentException`…) ne sont plus trouvées automatiquement. `new DateTimeImmutable()` cherche `App\\Catalogue\\DateTimeImmutable`, qui n'existe pas. Deux solutions : `use DateTimeImmutable;` en haut, ou le préfixe `\\` : `new \\DateTimeImmutable()`. Les **fonctions** natives (`strlen`, `array_map`), elles, sont trouvées sans rien faire."}, {"title": "PSR-4 : le namespace suit les dossiers", "body": "L'autoloader a besoin d'une règle pour passer du nom `App\\Catalogue\\Produit` au fichier. La norme PSR-4 dit :\n\n1. On déclare un **préfixe** et le dossier qui lui correspond, dans `composer.json` : `\"App\\\\\"` → `\"src/\"`.\n2. Le reste du namespace devient des **sous-dossiers** : `Catalogue` → `src/Catalogue/`.\n3. Le nom de la classe devient le **nom du fichier** : `Produit` → `Produit.php`.\n\nDonc `App\\Catalogue\\Produit` → `src/Catalogue/Produit.php`. Conséquences pratiques :\n\n- **Une classe par fichier**, fichier nommé exactement comme la classe (majuscules comprises).\n- Le namespace d'un fichier **doit** correspondre à son dossier. Si tu déplaces un fichier, tu changes son namespace, et les `use` qui le référencent.\n- Si tu modifies la section `autoload` de `composer.json`, lance `composer dump-autoload` pour régénérer la table de correspondance.\n\nDans un projet Symfony, tout est déjà configuré : `src/` ↔ `App\\`. Quand tu crées `src/Service/Facturation.php`, tu écris `namespace App\\Service;` et c'est tout."}, {"title": "Ce qui se passe au moment du `new`", "body": "Dans `index.php`, tu écris `require __DIR__ . '/vendor/autoload.php';` **une seule fois**. Ce fichier enregistre une fonction d'autoload auprès de PHP. Ensuite :\n\n1. PHP rencontre `new Produit(...)`, résout le nom complet grâce au `use` : `App\\Catalogue\\Produit`.\n2. La classe n'est pas encore chargée → PHP appelle l'autoloader avec ce nom.\n3. L'autoloader applique la règle PSR-4 : préfixe `App\\` → `src/`, reste → `Catalogue/Produit.php`.\n4. Il fait le `require` du fichier. La classe existe maintenant, le `new` continue.\n\nLa fois suivante, la classe est déjà chargée : rien à faire. C'est pour ça que « Class not found » veut presque toujours dire : le namespace ne correspond pas au dossier, le nom du fichier n'est pas exactement celui de la classe, ou `composer dump-autoload` n'a pas été relancé."}], "recap": ["Un namespace donne à chaque classe un nom complet unique : `App\\Catalogue\\Produit`.", "`use` importe une classe en haut du fichier pour écrire son nom court.", "Dans un namespace, les classes natives demandent `use` ou `\\` ; les fonctions natives, non.", "PSR-4 : `App\\` ↔ `src/`, puis le namespace suit les dossiers et la classe donne le nom du fichier.", "« Class not found » = namespace ≠ dossier, nom de fichier ≠ nom de classe, ou `dump-autoload` oublié."], "tds": [{"level": 1, "title": "Ranger un mini-projet", "enonce": "Organise un petit projet avec Composer et PSR-4, sans aucun `require` de classe.", "consignes": ["`composer.json` avec le préfixe `App\\` vers `src/`", "`src/Catalogue/Produit.php` (namespace `App\\Catalogue`)", "`src/Catalogue/Catalogue.php` qui stocke des `Produit`, avec `ajouter()` et `compter()`", "`index.php` qui charge l'autoload et utilise les deux classes", "Lance `composer dump-autoload` puis `php index.php`"], "files": [{"path": "arborescence.txt", "lang": "plaintext", "code": "mon-projet/\n├── composer.json\n├── index.php\n└── src/\n    └── Catalogue/\n        ├── Produit.php\n        └── Catalogue.php"}], "hints": ["`composer.json` minimal : `{\"autoload\": {\"psr-4\": {\"App\\\\\": \"src/\"}}}`", "Dans `Catalogue.php`, `Produit` est dans le même namespace : pas besoin de `use`.", "`index.php` est à la racine : `require __DIR__ . '/vendor/autoload.php';`"], "solution": [{"path": "arborescence.txt", "lang": "php", "code": "// composer.json\n// { \"autoload\": { \"psr-4\": { \"App\\\\\": \"src/\" } } }\n\n// src/Catalogue/Produit.php\nnamespace App\\Catalogue;\n\nfinal class Produit\n{\n    public function __construct(public readonly string $nom) {}\n}\n\n// src/Catalogue/Catalogue.php\nnamespace App\\Catalogue;\n\nfinal class Catalogue\n{\n    /** @var Produit[] */\n    private array $produits = [];\n\n    public function ajouter(Produit $p): void\n    {\n        $this->produits[] = $p;\n    }\n\n    public function compter(): int\n    {\n        return count($this->produits);\n    }\n}\n\n// index.php\nrequire __DIR__ . '/vendor/autoload.php';\n\nuse App\\Catalogue\\Catalogue;\nuse App\\Catalogue\\Produit;\n\n$catalogue = new Catalogue();\n$catalogue->ajouter(new Produit('Clavier'));\necho $catalogue->compter(); // 1"}], "checks": ["`php index.php` fonctionne sans `require` de tes classes", "Renomme le dossier `Catalogue` sans changer le namespace : tu obtiens « Class not found » (essaie)"], "expected": "1"}, {"level": 2, "title": "Diagnostiquer des « Class not found »", "enonce": "Voici l'arborescence d'un projet et quatre erreurs rencontrées par un collègue. Pour chacune, trouve la cause précise et la correction. Exercice de lecture : pas de code à exécuter, mais tu dois raisonner exactement comme l'autoloader.", "consignes": ["Pour chaque cas 1 à 4 : écris la cause en une phrase et la correction (fichier à modifier, ligne)", "Indique le nom complet (FQCN) que PHP a réellement cherché", "Bonus : pour le cas 4, propose deux corrections différentes"], "files": [{"path": "diagnostic.txt", "lang": "plaintext", "code": "composer.json : { \"autoload\": { \"psr-4\": { \"App\\\\\": \"src/\" } } }\n\nsrc/\n├── Catalogue/\n│   ├── Produit.php          namespace App\\Catalogue;   final class Produit\n│   └── categorie.php        namespace App\\Catalogue;   final class Categorie\n├── Panier/\n│   └── Panier.php           namespace App\\Catalog;     final class Panier\n└── Service/\n    └── Facture.php          namespace App\\Service;     final class Facture\n                              -> contient : $date = new DateTimeImmutable();\n\npublic/index.php :\n    require __DIR__ . '/../vendor/autoload.php';\n    use App\\Catalogue\\Produit;\n    use App\\Panier\\Panier;\n    $p = new Produit('x');            // OK\n    $c = new Categorie('y');          // 1) Class \"Categorie\" not found\n    $panier = new Panier();           // 2) Class \"App\\Panier\\Panier\" not found\n    $f = new App\\Service\\Facture();   // 3) Class \"App\\Service\\Facture\" not found ... puis après correction :\n                                      // 4) Class \"App\\Service\\DateTimeImmutable\" not found\n\nCas 1 :\nCas 2 :\nCas 3 :\nCas 4 :"}], "hints": ["Cas 1 : il y a deux problèmes, un dans `index.php` et un dans le nom du fichier.", "Cas 2 : compare le namespace déclaré dans `Panier.php` avec le dossier.", "Cas 3 : relis la ligne `$f = new App\\Service\\Facture();` : elle est écrite **sans** `\\` initial, dans un fichier… qui n'a pas de namespace. Alors pourquoi l'erreur ? Regarde bien la casse."], "solution": [{"path": "diagnostic.txt", "lang": "plaintext", "code": "Cas 1 : index.php n'importe pas Categorie (pas de \"use App\\Catalogue\\Categorie;\"), donc PHP cherche\n        \"\\Categorie\" dans l'espace global -> introuvable.\n        Après ajout du use, deuxième erreur : le fichier s'appelle categorie.php (minuscule) alors que\n        PSR-4 exige Categorie.php. Renommer le fichier.\n        FQCN cherché : Categorie (puis App\\Catalogue\\Categorie -> src/Catalogue/Categorie.php).\n\nCas 2 : index.php demande App\\Panier\\Panier -> src/Panier/Panier.php. Le fichier existe, mais il\n        déclare \"namespace App\\Catalog;\" : la classe chargée s'appelle App\\Catalog\\Panier,\n        pas App\\Panier\\Panier. Corriger la ligne namespace en \"namespace App\\Panier;\".\n\nCas 3 : (piège) la ligne est correcte dans un fichier sans namespace : App\\Service\\Facture est bien le\n        nom complet. L'erreur vient d'ailleurs : vérifier que composer dump-autoload a été lancé après\n        la création du dossier Service, ou que le fichier n'est pas Facture.PHP / facture.php.\n        Si tout est bon, c'est le cache de l'autoloader : composer dump-autoload.\n\nCas 4 : dans Facture.php (namespace App\\Service), \"new DateTimeImmutable()\" est résolu en\n        App\\Service\\DateTimeImmutable. Correction A : ajouter \"use DateTimeImmutable;\" en haut du\n        fichier. Correction B : écrire \"new \\DateTimeImmutable()\"."}], "checks": ["Tu as donné le FQCN réellement cherché pour chaque cas", "Le cas 4 a deux corrections valides"]}, {"level": 3, "title": "Deux librairies, même nom de classe", "enonce": "Ton projet utilise deux librairies qui exposent chacune une classe `Client` : `Acme\\Http\\Client` et `Shop\\Crm\\Client`. Tu dois les utiliser **toutes les deux dans le même fichier**, puis écrire un adaptateur dans ton propre namespace. Exercice à faire dans un vrai projet avec Composer : il entraîne les alias, l'organisation en dossiers et `dump-autoload`.", "consignes": ["Crée un projet vide avec `composer init` (ou un `composer.json` minimal) et le mapping `App\\` → `src/`", "Simule les deux librairies dans `lib/acme/Client.php` et `lib/shop/Client.php` (namespaces `Acme\\Http` et `Shop\\Crm`), avec un mapping PSR-4 pour chacune (`Acme\\Http\\` → `lib/acme/`, `Shop\\Crm\\` → `lib/shop/`)", "`src/Crm/SynchroClients.php` (namespace `App\\Crm`) utilise les deux `Client` grâce à des **alias** `use … as …`", "`index.php` instancie `SynchroClients` et appelle `synchroniser()` qui affiche `HTTP -> CRM : ok`", "Lance `composer dump-autoload` puis `php index.php` ; ensuite, casse volontairement un namespace et observe l'erreur"], "files": [{"path": "composer.json", "lang": "json", "code": "{\n  \"autoload\": {\n    \"psr-4\": {\n      \"App\\\\\": \"src/\"\n    }\n  }\n}"}, {"path": "structure.txt", "lang": "plaintext", "code": "projet/\n├── composer.json\n├── index.php\n├── lib/\n│   ├── acme/Client.php      namespace Acme\\Http\n│   └── shop/Client.php      namespace Shop\\Crm\n└── src/\n    └── Crm/\n        └── SynchroClients.php   namespace App\\Crm"}], "hints": ["Plusieurs préfixes PSR-4 dans le même `composer.json` : une clé par préfixe dans l'objet `psr-4`.", "`use Acme\\Http\\Client as HttpClient; use Shop\\Crm\\Client as CrmClient;` puis `new HttpClient()` et `new CrmClient()`.", "Après toute modification de `composer.json` : `composer dump-autoload`."], "solution": [{"path": "composer.json", "lang": "json", "code": "{\n  \"autoload\": {\n    \"psr-4\": {\n      \"App\\\\\": \"src/\",\n      \"Acme\\\\Http\\\\\": \"lib/acme/\",\n      \"Shop\\\\Crm\\\\\": \"lib/shop/\"\n    }\n  }\n}"}, {"path": "lib/acme/Client.php", "lang": "php", "code": "<?php\nnamespace Acme\\Http;\n\nfinal class Client\n{\n    public function get(string $url): string { return \"HTTP\"; }\n}"}, {"path": "lib/shop/Client.php", "lang": "php", "code": "<?php\nnamespace Shop\\Crm;\n\nfinal class Client\n{\n    public function importer(string $donnees): string { return \"$donnees -> CRM : ok\"; }\n}"}, {"path": "src/Crm/SynchroClients.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nnamespace App\\Crm;\n\nuse Acme\\Http\\Client as HttpClient;\nuse Shop\\Crm\\Client as CrmClient;\n\nfinal class SynchroClients\n{\n    public function __construct(\n        private HttpClient $http = new HttpClient(),\n        private CrmClient $crm = new CrmClient(),\n    ) {}\n\n    public function synchroniser(): string\n    {\n        $donnees = $this->http->get('/clients');\n        return $this->crm->importer($donnees);\n    }\n}"}, {"path": "index.php", "lang": "php", "code": "<?php\nrequire __DIR__ . '/vendor/autoload.php';\n\nuse App\\Crm\\SynchroClients;\n\necho (new SynchroClients())->synchroniser(), PHP_EOL;   // HTTP -> CRM : ok"}], "checks": ["`php index.php` affiche `HTTP -> CRM : ok` sans aucun `require` de classe", "Les deux classes `Client` cohabitent dans `SynchroClients.php`", "Changer `namespace Shop\\Crm;` en `namespace Shop\\CRM;` provoque « Class not found » : tu sais expliquer pourquoi"], "expected": "HTTP -> CRM : ok"}]}, {"id": "php-di", "track": "php", "title": "Injection de dépendances", "minutes": 15, "goal": "Comprendre pourquoi on passe les dépendances au constructeur au lieu de les créer.", "why": "Une classe qui fait `new PDO(...)` ou `new Mailer()` à l'intérieur est impossible à tester et à reconfigurer.", "flow": ["La classe **déclare** ce dont elle a besoin dans son constructeur", "Quelqu'un d'autre **crée** les dépendances", "et les **injecte** à la création", "En Symfony, le **conteneur** le fait automatiquement (autowiring)"], "points": ["Une classe de service ne fait pas `new` de ses services : elle les reçoit.", "Les objets valeur (`Email`, `Prix`, `DateTimeImmutable`) peuvent être créés avec `new` partout : ce ne sont pas des services.", "Interface + injection = changer d'implémentation sans toucher la classe.", "En Symfony, type-hinter le constructeur suffit : le conteneur trouve le service."], "pitfalls": ["Injecter le conteneur lui-même et piocher dedans : ça cache les vraies dépendances.", "Un constructeur avec 8 dépendances : la classe fait trop de choses, découpe-la."], "example": {"files": [{"path": "src/Service/InscriptionService.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nnamespace App\\Service;\n\nuse App\\Repository\\UserRepository;\nuse App\\Mail\\Mailer;\n\nfinal class InscriptionService\n{\n    public function __construct(\n        private UserRepository $users,\n        private Mailer $mailer,\n    ) {}\n\n    public function inscrire(string $email): void\n    {\n        $this->users->save($email);\n        $this->mailer->send($email, 'Bienvenue');\n    }\n}"}, {"path": "src/Repository/UserRepository.php", "lang": "php", "code": "<?php\nnamespace App\\Repository;\n\ninterface UserRepository\n{\n    public function save(string $email): void;\n}"}, {"path": "src/Mail/Mailer.php", "lang": "php", "code": "<?php\nnamespace App\\Mail;\n\ninterface Mailer\n{\n    public function send(string $to, string $subject): void;\n}"}, {"path": "tests/InscriptionServiceTest.php", "lang": "php", "code": "<?php\n// Les fausses implémentations : rapides, sans base ni réseau\nfinal class InMemoryUserRepository implements UserRepository\n{\n    public array $saved = [];\n    public function save(string $email): void { $this->saved[] = $email; }\n}\n\nfinal class FakeMailer implements Mailer\n{\n    public array $sent = [];\n    public function send(string $to, string $subject): void { $this->sent[] = [$to, $subject]; }\n}\n\n$repo = new InMemoryUserRepository();\n$mailer = new FakeMailer();\n$service = new InscriptionService($repo, $mailer);\n\n$service->inscrire('ana@mail.com');\n\nassert($repo->saved === ['ana@mail.com']);\nassert($mailer->sent === [['ana@mail.com', 'Bienvenue']]);"}], "notes": ["`InscriptionService.php` : deux dépendances déclarées dans le constructeur, typées par des interfaces. Aucun `new`.", "Les deux interfaces ne contiennent que le contrat. En production, Symfony injecte `MysqlUserRepository` et `SmtpMailer` (non montrés).", "`InscriptionServiceTest.php` : on construit le service **à la main** avec des fausses implémentations, puis on vérifie ce qu'elles ont reçu.", "Le service n'a pas changé d'une ligne entre la prod et le test."]}, "quiz": [{"q": "Quelle classe peut raisonnablement être créée avec `new` dans un service ?", "options": ["Un repository Doctrine", "Un client HTTP", "Un objet valeur comme `Email` ou `DateTimeImmutable`", "Le mailer"], "answer": 2, "why": "Les objets valeur n'ont pas de dépendances externes à remplacer."}, {"q": "Avantage principal de l'injection ?", "options": ["Le code est plus court", "On peut remplacer les dépendances (tests, autre implémentation) sans modifier la classe", "PHP va plus vite", "On évite les namespaces"], "answer": 1, "why": "La classe ne décide plus quelle implémentation utiliser."}, {"q": "En Symfony, comment un service reçoit-il un autre service ?", "options": ["`$this->get('service')`", "En le type-hintant dans son constructeur (autowiring)", "Avec `new`", "Via une variable globale"], "answer": 1, "why": "Le conteneur lit les types du constructeur et injecte ce qui correspond."}], "prereq": [{"term": "Dépendance", "def": "Tout objet dont une classe a besoin pour faire son travail : un repository, un mailer, une connexion à la base, une horloge…"}, {"term": "Interface", "def": "Un contrat sans code que plusieurs classes peuvent implémenter (module précédent). L'injection prend tout son sens quand on injecte des interfaces."}, {"term": "Service", "def": "Dans Symfony, un objet qui **fait** quelque chose (envoyer un mail, calculer, enregistrer) et dont on a besoin d'une seule instance. Par opposition aux objets de **données** (entités, DTO, value objects)."}, {"term": "Conteneur de services", "def": "L'objet de Symfony qui connaît tous les services, sait les construire dans le bon ordre et les fournir à qui en a besoin. On ne l'appelle presque jamais directement."}, {"term": "Autowiring", "def": "La capacité du conteneur à deviner quoi injecter en lisant les **types** du constructeur. `private Mailer $mailer` suffit : il cherche le service de type `Mailer`."}], "diagram": {"nodes": [{"id": "cont", "col": 1, "row": 0, "label": "Conteneur Symfony", "kind": "box", "sub": "lit les types d
