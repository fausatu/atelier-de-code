s).length > 0) return { errors };\n\n  await db.comment.create({ data: { articleId, auteur, texte } });\n  revalidatePath(`/articles/${articleId}`);\n  return {};\n}\n\n// app/articles/[id]/CommentForm.tsx\n'use client';\nimport { useActionState } from 'react';\nimport { addComment, CommentState } from './actions';\n\nexport default function CommentForm({ articleId }: { articleId: string }) {\n  const action = addComment.bind(null, articleId);\n  const [state, formAction, pending] = useActionState<CommentState, FormData>(action, {});\n\n  return (\n    <form action={formAction}>\n      <input name=\"auteur\" placeholder=\"Ton nom\" />\n      {state.errors?.auteur && <p role=\"alert\">{state.errors.auteur}<\/p>}\n      <textarea name=\"texte\" placeholder=\"Ton commentaire\" />\n      {state.errors?.texte && <p role=\"alert\">{state.errors.texte}<\/p>}\n      <button disabled={pending}>{pending ? 'Envoi…' : 'Publier'}<\/button>\n    <\/form>\n  );\n}"}, "checks": ["Un texte de 3 caractères affiche une erreur sous le champ", "Le nouveau commentaire apparaît sans recharger la page"]}}, {"id": "next-api", "track": "next", "title": "Route Handlers (API)", "minutes": 12, "goal": "Créer des endpoints HTTP dans l'App Router.", "why": "Pour un webhook, une app mobile ou un service externe, il faut une vraie URL d'API : c'est le rôle des Route Handlers.", "flow": ["Un fichier **`route.ts`** dans un dossier de `app/`", "exporte une fonction par **méthode HTTP** (`GET`, `POST`…)", "qui reçoit la **Request** (et les `params`)", "et renvoie une **Response** (`Response.json(...)`)"], "points": ["`app/api/todos/route.ts` → `/api/todos`. Pas de `page.tsx` dans le même dossier.", "Objets web standard : `request.json()`, `new URL(request.url).searchParams`.", "Codes HTTP explicites : 201 créé, 204 sans contenu, 400 entrée invalide, 404 introuvable.", "Pour ton propre front Next, préfère les **Server Actions** ; les Route Handlers servent aux clients externes."], "pitfalls": ["Ne pas valider le corps de la requête.", "Créer une route API juste pour l'appeler depuis un Server Component."], "example": {"lang": "tsx", "code": "// app/api/todos/route.ts\nimport { db } from '@/lib/db';\n\nexport async function GET(request: Request) {\n  const { searchParams } = new URL(request.url);\n  const done = searchParams.get('done');\n  const todos = await db.todo.findMany({\n    where: done === null ? {} : { done: done === 'true' },\n  });\n  return Response.json(todos);\n}\n\nexport async function POST(request: Request) {\n  const body = await request.json().catch(() => null);\n  if (!body || typeof body.title !== 'string' || body.title.trim() === '') {\n    return Response.json({ error: 'title requis' }, { status: 400 });\n  }\n  const todo = await db.todo.create({ data: { title: body.title.trim() } });\n  return Response.json(todo, { status: 201 });\n}\n\n// app/api/todos/[id]/route.ts\nexport async function DELETE(\n  _request: Request,\n  { params }: { params: Promise<{ id: string }> },\n) {\n  const { id } = await params;\n  await db.todo.delete({ where: { id } });\n  return new Response(null, { status: 204 });\n}", "notes": ["Un JSON invalide est rattrapé par `.catch(() => null)` → 400.", "Le `[id]` dynamique fonctionne comme pour les pages.", "204 : succès sans corps de réponse."]}, "quiz": [{"q": "Quel fichier répond à `POST /api/contact` ?", "options": ["app/api/contact/page.tsx", "app/api/contact/route.ts avec `export async function POST`", "pages/api/contact.ts uniquement", "app/contact/route.ts"], "answer": 1, "why": "Le dossier donne l'URL, le nom de la fonction exportée donne la méthode."}, {"q": "Corps de requête invalide : quel code renvoyer ?", "options": ["200", "400", "404", "500"], "answer": 1, "why": "400 = l'erreur vient du client."}, {"q": "Ton propre formulaire Next doit créer un élément. Que préférer ?", "options": ["Un Route Handler + fetch", "Une Server Action", "Un useEffect", "Un middleware"], "answer": 1, "why": "Moins de code, et la revalidation est intégrée."}], "td": {"title": "API de notes", "enonce": "Écris une petite API de notes, stockée en mémoire pour l'exercice.", "consignes": ["`GET /api/notes` avec filtre optionnel `?q=` sur le titre", "`POST /api/notes` : titre de 1 à 100 caractères, sinon 400", "`GET /api/notes/[id]` et `DELETE /api/notes/[id]` avec 404 si absente", "Teste avec `curl`"], "starter": {"lang": "tsx", "code": "// lib/notes.ts\nexport type Note = { id: string; titre: string; creeLe: string };\nexport const notes: Note[] = [];\n\n// app/api/notes/route.ts\n// à toi\n\n// app/api/notes/[id]/route.ts\n// à toi\n\n// Tests :\n// curl -X POST localhost:3000/api/notes -H 'Content-Type: application/json' -d '{\"titre\":\"Courses\"}'\n// curl 'localhost:3000/api/notes?q=cour'"}, "hints": ["`crypto.randomUUID()` pour l'id.", "Suppression : `const i = notes.findIndex(n => n.id === id); if (i === -1) return 404; notes.splice(i, 1);`", "Le stockage en mémoire est perdu au redémarrage : c'est normal pour l'exercice."], "solution": {"lang": "tsx", "code": "// app/api/notes/route.ts\nimport { notes } from '@/lib/notes';\n\nexport async function GET(request: Request) {\n  const q = new URL(request.url).searchParams.get('q')?.toLowerCase();\n  const result = q ? notes.filter((n) => n.titre.toLowerCase().includes(q)) : notes;\n  return Response.json(result);\n}\n\nexport async function POST(request: Request) {\n  const body = await request.json().catch(() => null);\n  const titre = typeof body?.titre === 'string' ? body.titre.trim() : '';\n  if (titre.length < 1 || titre.length > 100) {\n    return Response.json({ error: 'titre : 1 à 100 caractères' }, { status: 400 });\n  }\n  const note = { id: crypto.randomUUID(), titre, creeLe: new Date().toISOString() };\n  notes.push(note);\n  return Response.json(note, { status: 201 });\n}\n\n// app/api/notes/[id]/route.ts\nimport { notes } from '@/lib/notes';\n\ntype Ctx = { params: Promise<{ id: string }> };\n\nexport async function GET(_req: Request, { params }: Ctx) {\n  const { id } = await params;\n  const note = notes.find((n) => n.id === id);\n  return note ? Response.json(note) : Response.json({ error: 'Introuvable' }, { status: 404 });\n}\n\nexport async function DELETE(_req: Request, { params }: Ctx) {\n  const { id } = await params;\n  const i = notes.findIndex((n) => n.id === id);\n  if (i === -1) return Response.json({ error: 'Introuvable' }, { status: 404 });\n  notes.splice(i, 1);\n  return new Response(null, { status: 204 });\n}"}, "checks": ["Un POST sans titre renvoie 400", "Un DELETE sur un id inconnu renvoie 404"]}}, {"id": "git-modele", "track": "git", "title": "Comment Git fonctionne vraiment", "minutes": 15, "goal": "Comprendre ce qu'est un commit, une branche et HEAD : tout le reste en découle.", "why": "Rebase, reset, revert paraissent magiques tant qu'on pense « Git enregistre des fichiers ». En réalité Git enregistre des photos du projet reliées entre elles, et les branches ne sont que des étiquettes collées dessus. Une fois ça compris, chaque commande devient « je déplace une étiquette » ou « je crée une nouvelle photo ».", "flow": ["Tu modifies des fichiers dans ton **dossier de travail**", "`git add` les met dans la **zone de préparation** (staging) : « ces changements iront dans la prochaine photo »", "`git commit` prend une **photo** (snapshot) du projet, avec un identifiant unique (`a1b2c3d`) et un lien vers la photo **parente**", "La **branche** est une étiquette qui pointe vers le dernier commit ; **HEAD** indique où tu te trouves"], "points": ["Un commit = une photo complète du projet + son parent + auteur + message. Il est **immuable** : on ne modifie jamais un commit, on en crée un nouveau.", "Les commits forment une **chaîne** : chacun pointe vers son parent. L'historique, c'est cette chaîne.", "Une branche (`main`, `feature/login`) est juste une **étiquette mobile** : à chaque commit, elle avance sur le nouveau.", "**HEAD** = « tu es ici ». D'habitude il pointe vers une branche, qui pointe vers un commit.", "`git log --oneline --graph --all` dessine tout ça dans le terminal : utilise-le tout le temps."], "pitfalls": ["Croire qu'une branche est une copie du code : c'est une étiquette de quelques octets.", "Faire `git add .` sans regarder : vérifie toujours avec `git status` et `git diff --staged`."], "example": {"lang": "plaintext", "code": "  DOSSIER DE TRAVAIL  --git add-->  ZONE DE PRÉPARATION  --git commit-->  HISTORIQUE\n  (tes fichiers)                    (staging / index)                     (commits)\n\n\n  Historique : chaque commit pointe vers son parent\n\n      A <--- B <--- C <--- D          A, B, C, D = commits (photos)\n                           ^\n                          main        main = étiquette sur D\n                           ^\n                          HEAD        HEAD = \"tu es ici\"\n\n  Après un nouveau commit E :\n\n      A <--- B <--- C <--- D <--- E\n                                  ^\n                                 main  (l'étiquette a avancé toute seule)\n                                  ^\n                                 HEAD\n\n  Créer une branche = créer une nouvelle étiquette sur le même commit :\n\n      git switch -c feature\n      A <--- B <--- C <--- D <--- E\n                                  ^\n                             main, feature\n                                  ^\n                                 HEAD -> feature", "notes": ["Les flèches vont de l'enfant vers le parent : un commit connaît son passé, pas son futur.", "`git switch -c feature` ne copie rien : il pose une étiquette.", "Toutes les commandes avancées (rebase, reset…) déplacent des étiquettes ou créent de nouveaux commits."]}, "quiz": [{"q": "Qu'est-ce qu'une branche dans Git ?", "options": ["Une copie complète du projet", "Une étiquette qui pointe vers un commit", "Un dossier", "Un serveur"], "answer": 1, "why": "C'est pour ça que créer une branche est instantané."}, {"q": "Que fait `git add` ?", "options": ["Envoie sur GitHub", "Prépare des changements pour le prochain commit", "Crée un commit", "Crée une branche"], "answer": 1, "why": "Le staging permet de choisir précisément ce qui ira dans le commit."}, {"q": "Que désigne HEAD ?", "options": ["Le premier commit", "La position actuelle (la branche ou le commit où tu es)", "La branche distante", "Le dernier push"], "answer": 1, "why": "« Tu es ici » sur la carte de l'historique."}], "td": {"title": "Observer l'historique", "enonce": "Dans un dossier vide, crée un petit dépôt et observe ce que fait chaque commande.", "consignes": ["Crée 3 commits sur `main` (un fichier modifié à chaque fois)", "Crée une branche `essai`, fais-y 2 commits", "Reviens sur `main`, fais 1 commit", "Après chaque étape, lance `git log --oneline --graph --all` et dessine l'arbre sur papier", "Note ce que pointe HEAD à chaque fois (`cat .git/HEAD`)"], "starter": {"lang": "bash", "code": "mkdir atelier-git && cd atelier-git\ngit init -b main\necho \"v1\" > notes.txt\ngit add notes.txt\ngit commit -m \"premier commit\"\n# à toi : continue\ngit log --oneline --graph --all"}, "hints": ["`git switch -c essai` crée la branche et s'y place ; `git switch main` revient.", "`cat .git/HEAD` affiche `ref: refs/heads/main` : HEAD pointe vers la branche, pas directement vers un commit."], "solution": {"lang": "bash", "code": "git init -b main\necho \"v1\" > notes.txt && git add . && git commit -m \"c1\"\necho \"v2\" >> notes.txt && git commit -am \"c2\"\necho \"v3\" >> notes.txt && git commit -am \"c3\"\n\ngit switch -c essai\necho \"e1\" > essai.txt && git add . && git commit -m \"e1\"\necho \"e2\" >> essai.txt && git commit -am \"e2\"\n\ngit switch main\necho \"v4\" >> notes.txt && git commit -am \"c4\"\n\ngit log --oneline --graph --all\n# * 9f1e2d3 (HEAD -> main) c4\n# | * 7a6b5c4 (essai) e2\n# | * 3d2c1b0 e1\n# |/\n# * 1a2b3c4 c3\n# * ...  c2\n# * ...  c1\n# Les deux branches partent de c3 : elles ont \"divergé\"."}, "checks": ["Ton dessin correspond à la sortie de `git log --graph`", "Tu sais expliquer pourquoi `essai.txt` disparaît quand tu reviens sur `main`"]}}, {"id": "git-merge", "track": "git", "title": "Branches, merge & conflits", "minutes": 15, "goal": "Fusionner une branche et résoudre un conflit sans paniquer.", "why": "Travailler à plusieurs, ou sur plusieurs choses à la fois, demande des branches. Le moment délicat, c'est de les réunir.", "flow": ["Tu crées une branche pour une tâche (`feature/panier`)", "Tu y fais tes commits pendant que `main` avance de son côté", "`git merge feature/panier` (depuis `main`) **réunit** les deux histoires", "Si les deux ont modifié **les mêmes lignes**, Git s'arrête : **conflit** à résoudre à la main"], "points": ["**Fast-forward** : si `main` n'a pas bougé, Git avance simplement l'étiquette. Aucun nouveau commit.", "**Merge commit** : si les deux ont avancé, Git crée un commit avec **deux parents**.", "Un conflit ressemble à `<<<<<<<`, `=======`, `>>>>>>>` dans le fichier : tu choisis le bon contenu, tu supprimes les marqueurs, `git add`, `git commit`.", "`git merge --abort` annule une fusion en cours si tu es perdu.", "Ton éditeur (VS Code, PhpStorm) affiche les conflits avec des boutons « Accepter l'actuel / l'entrant / les deux »."], "pitfalls": ["Laisser des marqueurs `<<<<<<<` dans le code et commiter.", "Des branches qui vivent des semaines : plus elles sont longues, plus les conflits sont gros. Fusionne souvent."], "example": {"lang": "plaintext", "code": "  AVANT                                  APRÈS  git switch main && git merge feature\n\n      A --- B --- C   main                   A --- B --- C ------- M   main\n             \\                                      \\             /\n              D --- E   feature                      D --- E -----     feature\n\n  M = merge commit (2 parents : C et E)\n\n\n  CONFLIT dans prix.php :\n\n  <<<<<<< HEAD\n  const TVA = 0.20;          <- version de main (là où tu es)\n  =======\n  const TVA = 0.055;         <- version de feature (ce que tu fusionnes)\n  >>>>>>> feature\n\n  Résolution :\n    1. choisir (ou combiner), supprimer les 3 lignes de marqueurs\n    2. git add prix.php\n    3. git commit            (Git propose un message de merge)", "notes": ["HEAD dans le conflit = la branche où tu es (ici `main`).", "Un conflit n'est pas une erreur : Git te demande juste de décider.", "Après résolution, l'historique garde la trace des deux branches."]}, "quiz": [{"q": "`main` n'a reçu aucun commit depuis la création de `feature`. Que fait `git merge feature` ?", "options": ["Un merge commit", "Un fast-forward : l'étiquette main avance", "Un conflit", "Rien"], "answer": 1, "why": "Rien à combiner : il suffit d'avancer."}, {"q": "Dans un conflit, la partie entre `<<<<<<< HEAD` et `=======` est…", "options": ["la version de la branche que tu fusionnes", "la version de la branche où tu es", "l'ancienne version", "un commentaire"], "answer": 1, "why": "HEAD = là où tu es."}, {"q": "Tu es perdu au milieu d'une fusion. Quelle commande annule tout ?", "options": ["git reset --hard origin", "git merge --abort", "git delete", "git stop"], "answer": 1, "why": "Retour à l'état d'avant le merge."}], "td": {"title": "Provoquer et résoudre un conflit", "enonce": "Dans ton dépôt d'essai, fabrique un conflit volontaire et résous-le.", "consignes": ["Sur `main`, crée `config.txt` avec la ligne `couleur=bleu`, commit", "Branche `theme` : change en `couleur=vert`, commit", "Retour sur `main` : change en `couleur=rouge`, commit", "Fusionne `theme` dans `main`, résous en gardant `couleur=vert`", "Regarde le graphe final"], "starter": {"lang": "bash", "code": "echo \"couleur=bleu\" > config.txt && git add . && git commit -m \"config\"\n# à toi"}, "hints": ["`git status` pendant le conflit te liste les fichiers en conflit et la marche à suivre.", "Après avoir édité le fichier : `git add config.txt` puis `git commit` (sans `-m`, Git propose un message)."], "solution": {"lang": "bash", "code": "echo \"couleur=bleu\" > config.txt && git add . && git commit -m \"config\"\ngit switch -c theme\necho \"couleur=vert\" > config.txt && git commit -am \"theme vert\"\ngit switch main\necho \"couleur=rouge\" > config.txt && git commit -am \"theme rouge\"\n\ngit merge theme\n# CONFLICT (content): Merge conflict in config.txt\ngit status                     # \"both modified: config.txt\"\n# édite config.txt : garde seulement \"couleur=vert\"\ngit add config.txt\ngit commit                     # message \"Merge branch 'theme'\"\ngit log --oneline --graph"}, "checks": ["Le fichier final ne contient plus aucun marqueur", "Le graphe montre un commit avec deux parents"]}}, {"id": "git-rebase", "track": "git", "title": "Rebase : réécrire proprement", "minutes": 18, "goal": "Comprendre ce que fait rebase, quand l'utiliser et quand l'éviter.", "why": "Avec des merges partout, l'historique devient un plat de spaghettis. Rebase permet de « rejouer » tes commits au-dessus de la dernière version de `main`, pour un historique en ligne droite. Mais comme il crée de nouveaux commits, il peut faire des dégâts s'il est mal utilisé.", "flow": ["Tu es sur `feature`, `main` a avancé depuis que tu as commencé", "`git rebase main` **met de côté** tes commits D et E", "Il place `feature` au bout de `main`, puis **rejoue** D et E un par un : ce sont de **nouveaux** commits D' et E' (nouveaux identifiants)", "Résultat : une ligne droite, comme si tu avais commencé ton travail aujourd'hui"], "points": ["Merge **conserve** l'histoire telle qu'elle s'est passée ; rebase la **réécrit** pour qu'elle soit plus lisible.", "**Règle d'or** : ne rebase jamais des commits **déjà partagés** sur une branche où d'autres travaillent (ex. `main`). Rebase seulement **ta** branche.", "Après un rebase d'une branche déjà poussée : `git push --force-with-lease` (refuse si quelqu'un d'autre a poussé entre-temps, contrairement à `--force`).", "**Rebase interactif** `git rebase -i HEAD~3` : réorganiser tes 3 derniers commits : `pick` (garder), `reword` (changer le message), `squash`/`fixup` (fusionner avec le précédent), `drop` (supprimer).", "Conflit pendant un rebase : corrige, `git add`, puis `git rebase --continue`. Perdu : `git rebase --abort`."], "pitfalls": ["Rebaser `main` ou une branche partagée : les autres se retrouvent avec un historique incompatible.", "Utiliser `git push --force` au lieu de `--force-with-lease`."], "example": {"lang": "plaintext", "code": "  AVANT                                  APRÈS  git switch feature && git rebase main\n\n      A --- B --- C --- F   main              A --- B --- C --- F   main\n             \\                                                   \\\n              D --- E   feature                                   D' --- E'   feature\n\n  D' et E' = mêmes changements que D et E, mais NOUVEAUX commits (nouveaux ids).\n  Ensuite, git switch main && git merge feature  ->  fast-forward, ligne droite.\n\n\n  REBASE INTERACTIF  git rebase -i HEAD~4   (l'éditeur s'ouvre)\n\n  pick   1a2b3c4 feat: ajoute le panier\n  fixup  5d6e7f8 oups typo                  <- fusionné dans le précédent, message jeté\n  reword 9a8b7c6 fix bug                    <- tu pourras réécrire le message\n  drop   3c2b1a0 console.log de debug       <- supprimé\n\n  Résultat : 2 commits propres au lieu de 4.", "notes": ["Les anciens D et E existent toujours un moment (voir `reflog`) : un rebase raté se rattrape.", "Le rebase interactif sert surtout à nettoyer ta branche avant d'ouvrir une Pull Request.", "Beaucoup d'équipes configurent `git pull --rebase` par défaut pour éviter les merges inutiles."]}, "quiz": [{"q": "Après `git rebase main`, tes commits ont…", "options": ["les mêmes identifiants", "de nouveaux identifiants (ce sont de nouveaux commits)", "disparu", "été fusionnés en un seul"], "answer": 1, "why": "Rebase rejoue les changements : il crée des copies."}, {"q": "Peut-on rebaser `main` sur laquelle toute l'équipe travaille ?", "options": ["Oui", "Non : on ne réécrit pas un historique déjà partagé", "Oui avec --force", "Seulement le vendredi"], "answer": 1, "why": "C'est la règle d'or du rebase."}, {"q": "Pour fusionner un commit « oups typo » dans le précédent sans garder son message :", "options": ["pick", "fixup", "drop", "reword"], "answer": 1, "why": "`squash` garde les deux messages pour les combiner, `fixup` jette celui du commit fusionné."}], "td": {"title": "Nettoyer une branche", "enonce": "Crée une branche avec des commits brouillons, puis nettoie-la et mets-la à jour avec `main`.", "consignes": ["Sur `feature/contact`, fais 4 commits : « ajoute formulaire », « wip », « oups », « ajoute validation »", "Pendant ce temps, ajoute 1 commit sur `main`", "Avec `rebase -i`, obtiens 2 commits : `feat: ajoute le formulaire de contact` et `feat: valide le formulaire de contact`", "Rebase la branche sur `main`", "Vérifie que l'historique est une ligne droite"], "starter": {"lang": "bash", "code": "git switch main\ngit switch -c feature/contact\n# 4 commits ici...\ngit switch main\n# 1 commit ici...\ngit switch feature/contact\n# à toi"}, "hints": ["`git rebase -i HEAD~4` ouvre les 4 derniers commits ; le plus ancien est en haut.", "Mets `reword` sur le premier pour changer son message, `fixup` sur « wip » et « oups ».", "Pour changer l'éditeur utilisé par Git : `git config --global core.editor \"code --wait\"`."], "solution": {"lang": "bash", "code": "git switch feature/contact\ngit rebase -i HEAD~4\n# Dans l'éditeur :\n#   reword a1 ajoute formulaire\n#   fixup  b2 wip\n#   fixup  c3 oups\n#   reword d4 ajoute validation\n# puis réécris les messages :\n#   feat: ajoute le formulaire de contact\n#   feat: valide le formulaire de contact\n\ngit rebase main\n# en cas de conflit : corrige, git add <fichier>, git rebase --continue\n\ngit log --oneline --graph --all\n# * (HEAD -> feature/contact) feat: valide le formulaire de contact\n# * feat: ajoute le formulaire de contact\n# * (main) le commit de main\n# * ...\n# Ligne droite : un merge dans main sera un fast-forward."}, "checks": ["Ta branche contient exactement 2 commits, au-dessus de `main`", "Les messages suivent le format `feat: ...`"]}}, {"id": "git-revenir", "track": "git", "title": "Revenir en arrière", "minutes": 18, "goal": "Choisir la bonne commande pour annuler : restore, reset, revert, et le filet de sécurité reflog.", "why": "« Revenir en arrière » peut vouloir dire 5 choses différentes : annuler une modification non sauvegardée, défaire un commit local, annuler un commit déjà poussé, regarder une ancienne version… Chaque cas a sa commande. Se tromper de commande, c'est là qu'on perd du travail.", "flow": ["Pas encore commité ? **`git restore`** remet un fichier comme au dernier commit", "Commité mais **pas poussé** ? **`git reset`** recule l'étiquette de la branche", "Déjà **poussé / partagé** ? **`git revert`** crée un **nouveau** commit qui annule l'ancien", "Tout cassé ? **`git reflog`** liste toutes les positions passées de HEAD : on peut presque toujours revenir"], "points": ["`git restore fichier` : jette tes modifications non commitées (attention, définitif). `git restore --staged fichier` : retire du staging, garde la modification.", "`git reset --soft HEAD~1` : annule le dernier commit, **garde** les changements préparés. `--mixed` (par défaut) : les garde mais non préparés. `--hard` : **efface** tout.", "`git revert <id>` : sûr sur une branche partagée, l'historique n'est pas réécrit.", "Regarder une ancienne version : `git switch --detach <id>` (HEAD « détaché »). Pour y travailler : `git switch -c nouvelle-branche`.", "Récupérer un seul fichier d'un ancien commit : `git restore --source=<id> chemin/fichier`.", "`git commit --amend` : corrige le **dernier** commit (message ou fichier oublié), seulement s'il n'est pas poussé."], "pitfalls": ["`git reset --hard` sur des commits déjà poussés : tu réécris l'historique partagé.", "Paniquer et recloner le projet : `git reflog` retrouve presque tout."], "example": {"lang": "bash", "code": "# 1. J'ai cassé un fichier, pas encore commité\ngit restore src/Panier.php\n\n# 2. J'ai ajouté un fichier au staging par erreur\ngit restore --staged .env\n\n# 3. J'ai oublié un fichier dans mon dernier commit (pas encore poussé)\ngit add oubli.php\ngit commit --amend --no-edit\n\n# 4. Mon dernier commit local est mauvais, je veux le refaire\ngit reset --soft HEAD~1      # le commit disparaît, les changements restent prêts\n\n# 5. Je veux tout jeter et revenir 2 commits en arrière (local uniquement !)\ngit reset --hard HEAD~2\n\n# 6. Un commit déjà poussé sur main a introduit un bug\ngit revert 9f1e2d3           # nouveau commit qui fait l'inverse\ngit push\n\n# 7. Voir le projet tel qu'il était le 1er octobre\ngit log --oneline --before=\"2026-10-01\" -1\ngit switch --detach a1b2c3d\ngit switch -                 # revenir où j'étais\n\n# 8. J'ai fait un reset --hard de trop, au secours\ngit reflog                   # liste : HEAD@{0} reset, HEAD@{1} commit \"ajoute panier\"...\ngit reset --hard HEAD@{1}    # retour à la position d'avant", "notes": ["Les cas 1 à 5 ne touchent que ta machine ; le cas 6 est le seul sûr pour un commit déjà partagé.", "`HEAD~1` = le parent du commit actuel ; `HEAD~2` = le grand-parent.", "Le reflog garde l'historique des déplacements de HEAD pendant environ 90 jours (par défaut)."]}, "quiz": [{"q": "Un commit déjà poussé sur `main` contient un bug. Quelle commande ?", "options": ["git reset --hard", "git revert <id>", "git commit --amend", "git restore"], "answer": 1, "why": "revert ajoute un commit d'annulation sans réécrire l'historique partagé."}, {"q": "`git reset --soft HEAD~1` fait quoi ?", "options": ["Efface le dernier commit et ses changements", "Annule le dernier commit mais garde les changements prêts à être recommités", "Pousse sur GitHub", "Crée une branche"], "answer": 1, "why": "--soft : seule l'étiquette recule."}, {"q": "Après un `reset --hard` malheureux, comment retrouver tes commits ?", "options": ["Impossible", "`git reflog` puis `git reset --hard HEAD@{n}`", "Recloner", "git revert"], "answer": 1, "why": "Le reflog est le filet de sécurité de Git."}], "td": {"title": "Le parcours du combattant", "enonce": "Dans ton dépôt d'essai, provoque chaque situation et répare-la avec la bonne commande.", "consignes": ["Modifie un fichier puis annule la modification sans commit", "Fais un commit avec une faute dans le message, corrige le message", "Fais 2 commits, puis annule-les en gardant les changements", "Fais un `reset --hard HEAD~3`, puis retrouve l'état d'avant grâce au reflog", "Fais un commit puis annule-le avec `revert` (comme s'il était déjà poussé) ; regarde le log"], "starter": {"lang": "bash", "code": "# Pour chaque étape, note : la situation, la commande, ce que montre git log --oneline"}, "hints": ["Message de commit : `git commit --amend -m \"nouveau message\"`.", "Deux commits annulés en gardant les changements : `git reset HEAD~2` (mode mixed par défaut)."], "solution": {"lang": "bash", "code": "# 1\necho \"cassé\" >> notes.txt\ngit restore notes.txt\n\n# 2\ngit commit -am \"fix: corrige la typpo\"\ngit commit --amend -m \"fix: corrige la typo\"\n\n# 3\necho a >> notes.txt && git commit -am \"a\"\necho b >> notes.txt && git commit -am \"b\"\ngit reset HEAD~2           # les modifs a et b sont dans le dossier, non préparées\ngit status\n\n# 4\ngit commit -am \"ab\"\ngit reset --hard HEAD~3\ngit reflog                 # repère la ligne \"commit: ab\", ex. HEAD@{1}\ngit reset --hard HEAD@{1}\n\n# 5\necho bug >> notes.txt && git commit -am \"feat: ajoute un bug\"\ngit revert HEAD            # ouvre l'éditeur avec \"Revert ...\"\ngit log --oneline          # 2 commits : le bug ET son annulation"}, "checks": ["Tu sais dire quelle commande est sûre après un push (revert)", "Tu as récupéré l'état perdu avec le reflog"]}}, {"id": "git-commits", "track": "git", "title": "Bien écrire ses commits (Conventional Commits)", "minutes": 12, "goal": "Écrire des commits utiles : un seul sujet, un message clair au format `type(portée): description`.", "why": "« fix », « wip », « modifs » : dans 3 mois, personne (toi compris) ne sait ce qui a changé ni pourquoi. Un format commun rend l'historique lisible, et des outils peuvent s'en servir pour générer un changelog ou numéroter les versions automatiquement.", "flow": ["Un commit = **un seul changement logique** (atomique)", "Message : `type(portée optionnelle): description` à l'impératif, en minuscules, sans point final", "Une ligne vide, puis un **corps** qui explique **pourquoi** (si ce n'est pas évident)", "Changement qui casse la compatibilité : `!` après le type, ou `BREAKING CHANGE:` en pied de message"], "points": ["**feat** : nouvelle fonctionnalité pour l'utilisateur. **fix** : correction de bug.", "**refactor** : réorganisation du code sans changer le comportement. **perf** : amélioration de performance.", "**docs** : documentation. **test** : ajout ou correction de tests. **style** : formatage (espaces, virgules), pas le CSS.", "**chore** : tâches annexes (mise à jour de dépendances, config). **build** : système de build. **ci** : intégration continue (GitHub Actions).", "Portée = la zone concernée : `feat(panier): …`, `fix(api): …`.", "Le format vient de la spécification *Conventional Commits* (conventionalcommits.org). Chaque équipe peut l'adapter : regarde l'historique du projet."], "pitfalls": ["Un commit « fix + refactor + nouvelle fonctionnalité » : impossible à annuler proprement avec `revert`.", "Un message qui dit **quoi** (`change la ligne 42`) au lieu de **pourquoi**."], "example": {"lang": "plaintext", "code": "  MAUVAIS                             BON\n  -------                             ---\n  fix                                 fix(panier): empêche une quantité négative\n  wip                                 feat(auth): ajoute la connexion par lien magique\n  modifs diverses                     refactor(commande): extrait le calcul du total dans un service\n  update                              chore(deps): met à jour symfony/http-kernel en 7.3\n  ajout tests + fix bug + css         (3 commits séparés : test, fix, style)\n\n\n  Message complet :\n\n  fix(emprunt): refuse un 4e emprunt simultané\n\n  La règle \"3 emprunts max\" n'était vérifiée que côté front :\n  un appel direct à l'API permettait de la contourner.\n  La vérification est maintenant dans EmpruntService.\n\n  Closes #128\n\n\n  Changement cassant :\n\n  feat(api)!: renomme le champ \"auteur\" en \"auteurNom\" dans LivreOutput\n\n  BREAKING CHANGE: les clients doivent lire \"auteurNom\".", "notes": ["Impératif présent : « ajoute », « corrige » (comme une instruction : « ce commit… ajoute »).", "`Closes #128` ferme automatiquement l'issue 128 sur GitHub au merge.", "`git add -p` te laisse choisir morceau par morceau ce qui va dans le commit : idéal pour faire des commits atomiques."]}, "quiz": [{"q": "Tu renommes des variables et déplaces une méthode, sans changer le comportement. Type ?", "options": ["feat", "fix", "refactor", "style"], "answer": 2, "why": "Même comportement, code réorganisé."}, {"q": "Tu mets à jour une dépendance dans composer.json. Type ?", "options": ["feat", "chore", "fix", "docs"], "answer": 1, "why": "Tâche de maintenance, pas de changement visible pour l'utilisateur (`build` est aussi accepté selon les équipes)."}, {"q": "Comment préparer seulement une partie des modifications d'un fichier ?", "options": ["git add .", "git add -p", "git commit -a", "git stash"], "answer": 1, "why": "`-p` (patch) te demande pour chaque morceau : y / n."}], "td": {"title": "Réécrire des messages", "enonce": "Voici l'historique d'un collègue. Réécris chaque message au format Conventional Commits, et indique ceux qu'il aurait fallu découper.", "consignes": ["Donne le bon type et une portée", "Description à l'impératif, courte", "Signale les commits qui mélangent plusieurs changements et propose le découpage"], "starter": {"lang": "plaintext", "code": "1. \"ajout page profil\"\n2. \"correction bug login qui plantait si email en majuscules\"\n3. \"maj readme\"\n4. \"nettoyage code + correction calcul TVA + ajout bouton export\"\n5. \"passage de react 18 à 19\"\n6. \"tests panier\"\n7. \"le prix s'affiche plus vite\""}, "hints": ["Le 4 contient trois changements de types différents.", "Le 5 peut être `chore(deps)` ou `build`, selon les conventions de l'équipe."], "solution": {"lang": "plaintext", "code": "1. feat(profil): ajoute la page profil\n2. fix(auth): accepte les emails en majuscules à la connexion\n3. docs: met à jour le README\n4. À DÉCOUPER en 3 commits :\n   refactor(facture): simplifie le calcul des lignes\n   fix(facture): corrige le taux de TVA appliqué\n   feat(facture): ajoute le bouton d'export\n5. chore(deps): passe à React 19\n6. test(panier): couvre l'ajout et la suppression d'articles\n7. perf(catalogue): accélère l'affichage des prix"}, "checks": ["Chaque message tient sur une ligne et commence par un type", "Tu as découpé le 4"]}}, {"id": "git-github", "track": "git", "title": "GitHub : remote, Pull Requests & workflow", "minutes": 15, "goal": "Comprendre le lien entre ton dépôt local et GitHub, et le circuit d'une Pull Request.", "why": "Ton dépôt local et celui de GitHub sont deux copies indépendantes. `push`, `pull` et `fetch` les synchronisent. Sans ce modèle en tête, on ne comprend pas pourquoi « ça marche chez moi mais pas sur GitHub » ou pourquoi un push est refusé.", "flow": ["**`origin`** = le nom du dépôt GitHub dans ton dépôt local", "`git fetch` **télécharge** les nouveautés dans des étiquettes `origin/main` sans toucher à ton travail", "`git pull` = fetch + **fusion** dans ta branche ; `git push` **envoie** tes commits", "Sur GitHub, une **Pull Request** propose de fusionner ta branche dans `main` après relecture"], "points": ["`origin/main` est la dernière version de `main` sur GitHub **que tu as téléchargée**. `git fetch` la met à jour.", "Push refusé (« rejected, fetch first ») : quelqu'un a poussé avant toi. `git pull --rebase` puis `git push`.", "Premier push d'une branche : `git push -u origin feature/x` (`-u` mémorise le lien pour les fois suivantes).", "Workflow classique : branche depuis `main` à jour → commits → push → Pull Request → relecture et CI → merge → supprimer la branche.", "Sur la PR, 3 façons de fusionner : **merge commit**, **squash** (tous tes commits en un seul), **rebase**. Beaucoup d'équipes choisissent squash : un commit propre par fonctionnalité sur `main`.", "`.gitignore` : liste ce qui ne doit **jamais** partir (`.env`, `vendor/`, `node_modules/`, `var/`)."], "pitfalls": ["Travailler directement sur `main`.", "Commiter un `.env` avec des mots de passe : même supprimé ensuite, il reste dans l'historique. Change le secret."], "example": {"lang": "plaintext", "code": "  TA MACHINE                                        GITHUB (origin)\n  ==========                                        ===============\n  main          A---B                               main   A---B---C   (un collègue a poussé C)\n  origin/main   A---B   (dernière info connue)\n\n  git fetch     -> origin/main  A---B---C           (ton main n'a pas bougé)\n  git pull      -> main         A---B---C           (fetch + fusion)\n\n\n  WORKFLOW D'UNE FONCTIONNALITÉ\n\n  git switch main && git pull                 1. partir de main à jour\n  git switch -c feat/export-pdf               2. une branche par tâche\n  ... commits ...                             3. commits atomiques et bien nommés\n  git push -u origin feat/export-pdf          4. envoyer la branche\n  -> GitHub : \"Compare & pull request\"        5. ouvrir la PR (description, captures)\n  -> relecture, CI verte, corrections         6. nouveaux commits = la PR se met à jour\n  -> \"Squash and merge\"                       7. fusion dans main\n  git switch main && git pull                 8. récupérer main à jour\n  git branch -d feat/export-pdf               9. supprimer la b   const hadLocal = Object.keys(state.progress.modules).length > 0;

  refs.prog.onSnapshot((snap) => {
    if (snap.metadata && !snap.metadata.fromCache) { done(); if (syncState !== "err") setSync("ok"); }
    if (!snap.exists) { if (hadLocal && snap.metadata && !snap.metadata.fromCache) saveProgress(); return; }
    if (progWriter.pending()) return;
    const d = snap.data();
    if (d && d.modules) { state.progress = JSON.parse(JSON.stringify(d)); saveLocal(); refresh(); }
  }, () => { done(); setSync("local"); });
  refs.drafts.onSnapshot((snap) => {
    if (!snap.exists || draftWriter.pending()) return;
    const d = snap.data();
    if (d && d.codes) { state.drafts = { ...d.codes }; saveLocal(); }
  }, () => {});
  refs.lib.onSnapshot((snap) => {
    if (!snap.exists) { if ((state.custom.modules.length || state.custom.tracks.length) && snap.metadata && !snap.metadata.fromCache) libWriter.schedule(); return; }
    if (libWriter.pending()) return;

/* ---------- graphiques ---------- */
function ring(pct, size, stroke, color, inner, sub) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  const arc = p > 0 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>` : "";
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>${arc}</svg><div class="ring-in"><b>${inner}</b>${sub ? `<span>${sub}</span>` : ""}</div></div>`;
}
function logActivity() {
  const a = (state.progress.activity = state.progress.activity || {});
  const d = today(); a[d] = (a[d] || 0) + 1;

}
function activityStats() {
  const a = state.progress.activity || {};
  let streak = 0; const d = new Date();
  if (!a[ymd(d)]) d.setDate(d.getDate() - 1);
  while (a[ymd(d)]) { streak++; d.setDate(d.getDate() - 1); }
  let week = 0; for (let i = 0; i < 7; i++) week += a[addDays(-i)] || 0;
  return { streak, week };
}
function heatmap(weeks) {
  const a = state.progress.activity || {};
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const dow = (start.getDay() + 6) % 7;            // lundi = 0
  start.setDate(start.getDate() - dow - 7 * (weeks - 1));
  const t = today(); let cols = "", months = "", lastMonth = -1, lastLabel = -9;
  for (let w = 0; w < weeks; w++) {
    let cells = "";
    const first = new Date(start); first.setDate(start.getDate() + 7 * w);
    const m = first.getMonth();
    const showM = m !== lastMonth && w - lastLabel >= 3;
    months += `<span>${showM ? first.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "") : ""}</span>`;
    if (showM) lastLabel = w;
    lastMonth = m;
    for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setDate(start.getDate() + 7 * w + d);
      const k = ymd(day); const n = a[k] || 0;

      cells += `<i class="hm l${lvl}" title="${frDate(k)} : ${n} action${n > 1 ? "s" : ""}"></i>`;
    }
    cols += `<div class="hm-col">${cells}</div>`;
  }
  return `<div class="hm-wrap"><div class="hm-months" style="grid-template-columns:repeat(${weeks}, minmax(0, 1fr))">${months}</div><div class="hm-grid" style="grid-template-columns:repeat(${weeks}, minmax(0, 1fr))">${cols}</div>
    <div class="hm-legend"><span>Moins</span><i class="hm l0"></i><i class="hm l1"></i><i class="hm l2"></i><i class="hm l3"></i><i class="hm l4"></i><span>Plus</span></div></div>`;
}

        ${due.length ? `<div class="row"><span class="big" style="color:var(--warn)">${due.length}</span><span>module(s) à réviser aujourd'hui</span><span class="spacer"></span><button class="btn primary" data-act="startReview">Commencer</button></div>
          <div class="due-list">${due.map((m) => `<a href="#m-${esc(m.id)}" style="${tc(track(m.track))}"><span class="st due"></span>${esc(m.title)} <span class="muted small">· ${esc(track(m.track).short)}</span></a>`).join("")}</div>`
        : `<h3>Rien à réviser aujourd'hui</h3><p class="muted">${doneMods.length ? "Tu peux t'entraîner librement sur tes modules acquis, sans changer le planning." : "Termine un premier module (quiz + TD) pour lancer les révisions."}</p>${doneMods.length ? `<div><button class="btn" data-act="practice">S'entraîner sur 3 modules au hasard</button></div>` : ""}`}
      </div>
      ${upcoming.length ? `<div class="card" style="padding:6px 8px"><table class="sched"><thead><tr><th>Module</th><th>Parcours</th><th>Prochaine révision</th><th>Palier</th></tr></thead><tbody>${upcoming.map((m) => `<tr><td><a href="#m-${esc(m.id)}">${esc(m.title)}</a></td><td>${esc(track(m.track).short)}</td><td class="num">${frDate(prog(m.id).due)} <span class="muted">(J+${daysFromToday(prog(m.id).due)})</span></td><td class="num">${prog(m.id).box || 1}/${INTERVALS.length}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </div>`;
  }
  if (r.finished) {
    return `<div class="wrap"><div class="stack" style="gap:6px"><h1>Révision terminée</h1><p class="lead">${r.practice ? "Entraînement libre : le planning n'a pas changé." : "Le planning a été mis à jour."}</p></div>
      <div class="card" style="padding:6px 8px"><table class="sched"><thead><tr><th>Module</th><th>Résultat</th><th>${r.practice ? "" : "Prochaine révision"}</th></tr></thead><tbody>${r.queue.map((it) => { const m = mod(it.id); return `<tr><td>${esc(m.title)}</td><td>${it.result ? '<span class="pill done">Sans faute</span>' : '<span class="pill due">À retravailler</span>'}</td><td class="num">${r.practice ? "" : frDate(prog(it.id).due)}</td></tr>`; }).join("")}</tbody></table></div>
      <div class="row"><button class="btn primary" data-act="closeReview">Retour aux révisions</button>${r.queue.some((it) => !it.result) ? `<span class="muted small">Pour les modules à retravailler, relis l'étape Comprendre.</span>` : ""}</div></div>`;
  }
  const it = r.queue[r.idx];
  const m = mod(it.id);
  const t = track(m.track);
  const dots = r.queue.map((x, i) => `<i class="${i < r.idx ? (x.result ? "ok" : "ko") : i === r.idx ? "on" : ""}"></i>`).join("");
  const allAnswered = it.qs.every((q) => q.a !== undefined);
  const qs = it.revealed ? it.qs.map((q, k) => {
    const Q = m.quiz[q.qi];
    const opts = q.perm.map((oi) => {
      let cls = "";
      if (q.a !== undefined && oi === Q.answer) cls = "right"; else if (q.a === oi) cls = "wrong";
      return `<button class="opt ${cls}" ${q.a !== undefined ? "disabled" : ""} data-act="rAnswer" data-k="${k}" data-o="${oi}">${inl(Q.options[oi])}</button>`;
    }).join("");
    const fb = q.a !== undefined ? `<div class="feedback ${q.a === Q.answer ? "right" : "wrong"}"><b>${q.a === Q.answer ? "Juste." : "Pas tout à fait."}</b>${inl(Q.why)}</div>` : "";
    return `<div class="q"><div class="q-title"><span class="k">Q${k + 1}</span><span>${inl(Q.q)}</span></div><div class="opts">${opts}</div>${fb}</div>`;
  }).join("") : "";
  return `<div class="wrap" style="${tc(t)}">
    <div class="row"><h1 style="font-size:1.4rem">${r.practice ? "Entraînement" : "Révision"}</h1><span class="spacer"></span><div class="progress-dots">${dots}</div><button class="btn sm ghost" data-act="closeReview">Quitter</button></div>
    <div class="card rev-card">
      <div class="row"><span class="chip" style="${tc(t)}">${esc(t.short || t.name)}</span><span class="muted small">${r.idx + 1}/${r.queue.length}</span></div>
      <h2>${esc(m.title)}</h2>
      <div class="stack"><b>1. Sans regarder : explique en 2 ou 3 phrases comment ça marche.</b>
        <textarea class="field" rows="3" placeholder="Écris de mémoire, même approximativement…" aria-label="Rappel libre"></textarea>
        ${it.revealed ? `<div class="stack small"><span class="muted">Compare avec le mécanisme :</span><ol class="recall-flow">${m.flow.map((f) => `<li>${inl(f)}</li>`).join("")}</ol></div>` : `<div><button class="btn" data-act="reveal">Comparer avec le mécanisme</button></div>`}
      </div>
      ${it.revealed ? `<div class="stack" style="gap:18px"><b>2. Quiz</b>${qs}</div>` : ""}
      ${allAnswered ? `<div class="row"><button class="btn primary" data-act="rNext">${r.idx < r.queue.length - 1 ? "Module suivant" : "Terminer"}</button></div>` : ""}
    </div>
  </div>`;
}

/* ---------- rendu principal ---------- */
let lastRoute = null;
function render() {
  const r = currentRoute();
  let html;
  if (r === "revision") html = viewReview();
  else if (r === "ajouter") html = viewAdd();
  else if (r === "claude") html = viewClaude();
  else if (r.startsWith("t-")) html = viewTrack(r.slice(2));
  else if (r.startsWith("m-")) html = viewModule(r.slice(2));
  else html = viewHome();
  const main = $("#main");
  main.innerHTML = html;
  highlight(main);
  renderSide();
  if (lastRoute !== r) { window.scrollTo(0, 0); lastRoute = r; }
}
function refresh() {
  renderSide();
  const a = document.activeElement;
  if (a && $("#main").contains(a) && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return;
  if (currentRoute() === "revision" && state.ui.review) return;
  render();
}

/* ---------- actions ---------- */
function markSeen(id, step) { const p = ensure(id); p.seen = p.seen || []; if (!p.seen.includes(step)) { p.seen.push(step); logActivity(); } }
function checkComplete(id) {
  const p = ensure(id);
  if (p.quizDone && p.tdDone && !p.done) {
    p.done = true; p.box = 1; p.due = addDays(INTERVALS[0]); p.doneAt = today();
    toast("Module acquis. Première révision demain.");
  }
}
function saveDraftFrom(el) { const id = el.dataset.id; state.drafts[id] = el.value; draftWriter.schedule(); }

const ACTIONS = {
  toggleTrack(el) {
    const id = el.dataset.id; const r = currentRoute();
    const cur = r.startsWith("m-") ? mod(r.slice(2))?.track : r.startsWith("t-") ? r.slice(2) : null;
    const isOpen = openTracks.has(id) || id === cur;
    if (isOpen) { openTracks.delete(id); if (id === cur) location.hash = "#accueil"; } else openTracks.add(id);
    saveOpen(); renderSide();
  },
  menu() { document.body.classList.toggle("menu-open"); },
  step(el) {
    keepDraft(); const id = el.dataset.id; const s = Number(el.dataset.step);
    const cur = state.ui.step[id] ?? 0;
    if (cur === 0 || cur === 1) markSeen(id, cur);
    state.ui.step[id] = s;
    saveProgress(); render();
    const tabs = $(".steps"); if (tabs) tabs.scrollIntoView({ block: "nearest" });
  },
  answer(el) {
    const id = el.dataset.id; const m = mod(id); const p = ensure(id);
    p.answers = p.answers || {};
    p.answers[el.dataset.q] = Number(el.dataset.o);
    logActivity();
    if (Object.keys(p.answers).length === m.quiz.length) { p.quizDone = true; checkComplete(id); }
    saveProgress(); render();
  },
  resetQuiz(el) { const p = ensure(el.dataset.id); p.answers = {}; saveProgress(); render(); },
  hint(el) { const id = el.dataset.id; state.ui.hints[id] = (state.ui.hints[id] || 0) + 1; keepDraft(); render(); },
  solution(el) { const id = el.dataset.id; state.ui.showSol[id] = !state.ui.showSol[id]; keepDraft(); render(); },
  check(el) {
    const p = ensure(el.dataset.id); const i = Number(el.dataset.i);
    p.checks = (p.checks || []).filter((x) => x !== i); if (el.checked) p.checks.push(i);
    saveProgress();
  },
  tdDone(el) { const id = el.dataset.id; keepDraft(); const p = ensure(id); p.tdDone = true; logActivity(); checkComplete(id); saveProgress(); render(); },
  tdUndo(el) { const p = ensure(el.dataset.id); p.tdDone = false; saveProgress(); render(); },
  resetCode(el) { const id = el.dataset.id; delete state.drafts[id]; draftWriter.schedule(); const ed = $("#ed-" + CSS.escape(id)); if (ed) ed.value = mod(id).td.starter.code; },
  async copyCode(el) { const ed = $("#ed-" + CSS.escape(el.dataset.id)); try { await navigator.clipboard.writeText(ed.value); toast("Code copié."); } catch (e) { ed.select(); toast("Sélectionné : copie avec Ctrl+C."); } },
  explain(el) { aiExplain(mod(el.dataset.id)); },
  review(el) { aiReview(mod(el.dataset.id)); },
  startReview() { startReview(dueModules().map((m) => m.id), false); },
  practice() { const ids = shuffle(allModules().filter((m) => prog(m.id)?.done).map((m) => m.id)).slice(0, 3); startReview(ids, true); },
  reveal() { state.ui.review.queue[state.ui.review.idx].revealed = true; render(); },
  rAnswer(el) { const r = state.ui.review; r.queue[r.idx].qs[Number(el.dataset.k)].a = Number(el.dataset.o); render(); },
  rNext() {
    const r = state.ui.review; const it = r.queue[r.idx]; const m = mod(it.id);
    it.result = it.qs.every((q) => q.a === m.quiz[q.qi].answer);
    if (!r.practice) {
      const p = ensure(it.id);
      if (it.result) { p.box = Math.min((p.box || 1) + 1, INTERVALS.length); p.due = addDays(INTERVALS[p.box - 1]); }
      else { p.box = 1; p.due = addDays(1); }
      p.lastReview = today(); p.reviews = (p.reviews || 0) + 1; logActivity();
      saveProgress();
    }
    if (r.idx < r.queue.length - 1) r.idx++; else r.finished = true;
    render();
  },
  closeReview() { state.ui.review = null; render(); },
  forgetKey() { setKey(""); applyStandaloneAI(); render(); toast("Clé supprimée de ce navigateur."); },
  async testKey() {
    const msg = $("#key-msg"); msg.textContent = "Test en cours…";
    try { await callApi("Réponds juste : OK", {}, 10); msg.textContent = "La clé fonctionne."; }
    catch (e) { msg.textContent = e.code === "not_granted" ? "Clé refusée : vérifie-la dans la console." : "Échec : " + (e.message || "erreur réseau"); }
  },
  color(el) { state.ui.newTrackColor = el.dataset.c; readGenForm(); render(); },
  genRun() { readGenForm(); aiGenerate(); },
  genSave() { saveGenerated(); },
  import() { importJSON(); },
  async copyTpl() { try { await navigator.clipboard.writeText(moduleTemplate()); toast("Modèle copié."); } catch (e) { $("#import-json").value = moduleTemplate(); toast("Modèle collé dans le champ."); } },
  askDel(el) { state.ui.confirmDel = el.dataset.id; render(); },
  cancelDel() { state.ui.confirmDel = null; render(); },
  delMod(el) {
    const id = el.dataset.id;
    state.custom.modules = state.custom.modules.filter((m) => m.id !== id);
    delete state.progress.modules[id]; delete state.drafts[id];
    state.ui.confirmDel = null;
    libWriter.schedule(); saveProgress(); draftWriter.schedule(); render(); toast("Module supprimé.");
  },
  delTrack(el) { state.custom.tracks = state.custom.tracks.filter((t) => t.id !== el.dataset.id); libWriter.schedule(); render(); },
};
function keepDraft() { const ed = document.querySelector("textarea.editor"); if (ed) saveDraftFrom(ed); }

document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (e.target.closest(".side a")) document.body.classList.remove("menu-open");
  if (!a) return;
  if (a.tagName === "INPUT" && a.type === "checkbox") { ACTIONS[a.dataset.act]?.(a, e); return; }
  e.preventDefault();
  ACTIONS[a.dataset.act]?.(a, e);
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "ask") { const q = f.q.value.trim(); if (q) aiAsk(mod(f.dataset.id), q); }
  if (f.dataset.form === "gen") { readGenForm(); aiGenerate(); }
  if (f.dataset.form === "key") {
    const k = f.key.value.trim();
    if (!k.startsWith("sk-")) { $("#key-msg").textContent = "Une clé Anthropic commence par sk-ant-."; return; }
    setKey(k); applyStandaloneAI(); render(); toast("Clé enregistrée. Les boutons Claude sont actifs.");
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "g-track") { readGenForm(); render(); }
});
let draftTimer;
document.addEventListener("input", (e) => {
  if (e.target.classList.contains("editor")) { clearTimeout(draftTimer); const el = e.target; draftTimer = setTimeout(() => saveDraftFrom(el), 500); }
});
document.addEventListener("keydown", (e) => {
  const el = e.target;
  if (el.classList && el.classList.contains("editor") && e.key === "Tab" && !e.shiftKey) {
    e.preventDefault();
    const s = el.selectionStart, en = el.selectionEnd;
    el.setRangeText("    ", s, en, "end");
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }
});
window.addEventListener("hashchange", () => { document.body.classList.remove("menu-open"); render(); });

/* ---------- Claude ---------- */
function levelContext() { return "L'élève a un niveau intermédiaire en programmation. Il a besoin de comprendre COMMENT une chose fonctionne pour pouvoir la faire. Réponds en français, de façon simple, concise et concrète."; }
function moduleContext(m) {
  return `Module « ${m.title} » (parcours ${track(m.track).name}).\nObjectif : ${m.goal}\nMécanisme : ${m.flow.map((f, i) => `${i + 1}) ${f}`).join(" ")}\nPoints clés : ${m.points.join(" | ")}`;
}
async function runAI(outSel, prompt, intro) {
  const out = $(outSel);
  if (!out || !sample) return;
  out.style.display = "";
  out.innerHTML = `<p class="muted small"><span class="spin"></span> ${esc(intro)}</p>`;
  try {
    const res = await sample(prompt, {
      cache: false,
      onText: ({ text }) => { const o = $(outSel); if (o) { o.innerHTML = md(text); } },
    });
    const o = $(outSel);
    if (o) { o.innerHTML = md(res.text); highlight(o); }
  } catch (e) {
    const o = $(outSel);
    if (!o) return;
    if (e && e.code === "not_granted") { o.innerHTML = standalone ? `<p class="err">Clé API refusée. <a href="#claude">Vérifie ta clé</a>.</p>` : `<p class="err">Claude n'est pas autorisé dans cette vue.</p>`; }
    else if (e && e.code === "rate_limited") { o.innerHTML = `<p class="err">Trop de demandes d'un coup. Réessaie dans une minute.</p>`; }
    else { o.innerHTML = `<p class="err">La réponse n'a pas pu être générée. Réessaie.</p>`; }
  }
}
function aiExplain(m) {
  runAI("#ai-learn", `${levelContext()}\n\n${moduleContext(m)}\n\nL'élève n'a pas compris l'explication. Ré-explique autrement : commence par une analogie du quotidien (3 phrases max), puis relie chaque élément de l'analogie au mécanisme, puis donne un mini exemple de code de 5 à 10 lignes dans un bloc \`\`\`. 180 mots maximum hors code. Pas de titre.`, "Claude reformule…");
}
function aiAsk(m, q) {
  runAI("#ai-learn", `${levelContext()}\n\n${moduleContext(m)}\n\nQuestion de l'élève : ${q}\n\nRéponds directement à la question, en 150 mots maximum (hors code). Si un exemple aide, un bloc \`\`\` court. Pas de titre.`, "Claude réfléchit…");
}
function aiReview(m) {
  const ed = $("#ed-" + CSS.escape(m.id));
  const codeTxt = ed ? ed.value : "";
  keepDraft();
  if (!codeTxt.trim() || codeTxt.trim() === m.td.starter.code.trim()) { toast("Écris d'abord ton code dans l'éditeur."); return; }
  runAI("#ai-td", `${levelContext()}\n\nTu corriges un TD.\nTD : ${m.td.title}\nÉnoncé : ${m.td.enonce}\nConsignes :\n${m.td.consignes.map((c, i) => `${i + 1}. ${c}`).join("\n")}\n\nSolution de référence (NE LA RECOPIE PAS) :\n${m.td.solution.code}\n\nCode de l'élève :\n${codeTxt}\n\nRéponds ainsi :\n- Une ligne par consigne : « OK » ou ce qui manque/est faux, en une phrase.\n- Le point le plus important à corriger et POURQUOI (lié au mécanisme du module).\n- Un indice pour corriger, sans donner le code complet.\nSi tout est bon, dis-le et propose une amélioration. 200 mots maximum.`, "Claude relit ton code…");
}
function readGenForm() {
  const f = document.querySelector('form[data-form="gen"]');
  if (!f) return;
  const g = state.ui.gen || (state.ui.gen = {});
  g.track = f.track.value; g.topic = f.topic.value; g.notes = f.notes.value;
  if (f.tname) g.tname = f.tname.value;
}
async function aiGenerate() {
  const g = state.ui.gen || {};
  if (!sample) return;
  if (!g.topic || !g.topic.trim()) { g.error = "Indique un sujet."; render(); return; }
  if (g.track === "__new" && !(g.tname || "").trim()) { g.error = "Donne un nom au nouveau parcours."; render(); return; }
  const trackName = g.track === "__new" ? g.tname.trim() : track(g.track).name;
  const exemple = JSON.stringify(stripModule(DATA.modules[0]));
  g.loading = true; g.error = null; g.result = null; render();
  const prompt = `${levelContext()}\n\nÉcris UN module d'apprentissage sur le sujet « ${g.topic.trim()} » pour le parcours « ${trackName} ».${g.notes ? `\nPrécisions de l'élève : ${g.notes}` : ""}\n\nMéthode : d'abord le problème que ça résout (why), puis le mécanisme en 4 étapes courtes (flow), 4 ou 5 points essentiels, 2 pièges, un exemple de code réaliste et commenté (15 à 40 lignes) avec 3 notes, 3 questions de quiz (4 options, answer = index de la bonne réponse, why = explication courte), et un TD pratique (énoncé, 3 à 5 consignes, code de départ, 2 ou 3 indices progressifs, solution complète, 2 ou 3 vérifications).\nContraintes : sections courtes et simples ; markdown inline seulement (\`code\`, **gras**) dans les textes ; lang parmi php, tsx, javascript, sql, bash, yaml, json, python, plaintext ; contenu exact et à jour.\n\nRéponds UNIQUEMENT avec un objet JSON valide ayant exactement cette structure (exemple d'un autre module) :\n${exemple}`;
  try {
    const val = await sample.json(prompt, { modelTier: "complex" });
    const m = normalizeModule(val);
    if (!m) throw new Error("format");
    g.result = m;
  } catch (e) {
    g.error = e && e.code === "rate_limited" ? "Trop de demandes. Réessaie dans une minute." : e && e.code === "not_granted" ? (standalone ? "Clé API refusée : vérifie-la dans « Activer les boutons Claude »." : "Claude n'est pas autorisé dans cette vue.") : "Le module généré était incomplet. Réessaie.";
  }
  g.loading = false;
  if (currentRoute() === "ajouter") render();
}
function stripModule(m) { const { id, track, ...rest } = m; return rest; }
function asStrArr(a) { return Array.isArray(a) ? a.filter((x) => typeof x === "string" && x.trim()).map((x) => x.trim()) : []; }
function normCode(c) { if (!c || typeof c.code !== "string") return null; return { lang: LANGS[c.lang] !== undefined ? c.lang : "plaintext", code: c.code.replace(/\s+$/, "") }; }
function normalizeModule(v) {
  if (!v || typeof v !== "object") return null;
  const str = (x) => (typeof x === "string" ? x.trim() : "");
  const quiz = (Array.isArray(v.quiz) ? v.quiz : []).map((q) => ({ q: str(q && q.q), options: asStrArr(q && q.options), answer: Number(q && q.answer), why: str(q && q.why) }))
    .filter((q) => q.q && q.options.length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length);
  const td = v.td || {};
  const ex = v.example || {};
  const m = {
    title: str(v.title), minutes: Number(v.minutes) || 15, goal: str(v.goal), why: str(v.why),
    flow: asStrArr(v.flow).slice(0, 6), points: asStrArr(v.points), pitfalls: asStrArr(v.pitfalls),
    example: { ...(normCode(ex) || { lang: "plaintext", code: "" }), notes: asStrArr(ex.notes) },
    quiz,
    td: { title: str(td.title) || "TD", enonce: str(td.enonce), consignes: asStrArr(td.consignes), starter: normCode(td.starter) || { lang: "plaintext", code: "" }, hints: asStrArr(td.hints), solution: normCode(td.solution), checks: asStrArr(td.checks) },
  };
  if (!m.title || !m.goal || m.flow.length < 2 || !m.points.length || !m.example.code || !quiz.length || !m.td.enonce || !m.td.consignes.length || !m.td.solution) return null;
  if (!m.td.hints.length) m.td.hints = ["Relis le mécanisme du module."];
  if (!m.td.checks.length) m.td.checks = ["Ton code respecte toutes les consignes"];
  if (!m.why) m.why = m.goal;
  return m;
}
function ensureTrack(name, color) {
  const n = name.trim();
  const existing = tracks().find((t) => t.name.toLowerCase() === n.toLowerCase() || (t.short || "").toLowerCase() === n.toLowerCase());
  if (existing) return existing.id;
  const t = { id: "t" + rid(), name: n, short: n.length > 14 ? n.slice(0, 13) + "…" : n, color: color || "rose", desc: "Parcours ajouté." };
  state.custom.tracks.push(t);
  return t.id;
}
function saveGenerated() {
  const g = state.ui.gen; if (!g || !g.result) return;
  const tid = g.track === "__new" ? ensureTrack(g.tname, state.ui.newTrackColor) : g.track;
  const m = { ...g.result, id: "c" + rid(), track: tid };
  state.custom.modules.push(m);
  libWriter.schedule();
  state.ui.gen = { track: tid };
  location.hash = "#m-" + m.id;
  toast("Module ajouté.");
}
function importJSON() {
  const err = $("#import-err");
  let v;
  try { v = JSON.parse($("#import-json").value); } catch (e) { err.textContent = "JSON invalide : vérifie les virgules et les guillemets."; return; }
  const list = Array.isArray(v) ? v : [v];
  let added = 0, firstId = null;
  for (const raw of list) {
    const m = normalizeModule(raw);
    if (!m) continue;
    let tid = raw.track && tracks().some((t) => t.id === raw.track) ? raw.track : null;
    if (!tid) tid = ensureTrack(raw.trackName || raw.track || "Mes modules", "rose");
    const id = "c" + rid();
    state.custom.modules.push({ ...m, id, track: tid });
    added++; firstId = firstId || id;
  }
  if (!added) { err.textContent = "Aucun module valide : il faut au moins title, goal, flow, points, example, quiz et td."; return; }
  libWriter.schedule();
  toast(`${added} module(s) importé(s).`);
  location.hash = "#m-" + firstId;
}

/* ---------- démarrage ---------- */
loadLocal();
render();
initCaps();
</script>
