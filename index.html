string $titre,\n        public readonly string $extrait,\n        public readonly string $auteur,      // juste le nom, pas l'objet User\n        public readonly string $creeLe,      // date formatée\n    ) {}\n}\n\n// L'entité Article, elle, reste interne : relations, id, mot de passe de l'auteur...\n// Elle ne sort jamais telle quelle de l'API.", "notes": ["Deux DTO différents pour l'entrée et la sortie : ils n'ont pas les mêmes champs.", "`auteur` est une simple chaîne : pas de relation à sérialiser, pas de boucle.", "Si tu renommes une colonne en base, seul le code qui remplit `ArticleOutput` change : le front ne voit rien."]}, "quiz": [{"q": "Pourquoi ne pas renvoyer l'entité `User` directement en JSON ?", "options": ["C'est plus lent", "On exposerait des champs sensibles et on lierait le front à la structure de la base", "Symfony l'interdit", "Le JSON ne gère pas les objets"], "answer": 1, "why": "Le DTO choisit exactement ce qui sort."}, {"q": "Un DTO contient…", "options": ["la logique métier", "des données à transporter, sans logique", "les requêtes SQL", "le mapping Doctrine"], "answer": 1, "why": "Il décrit une forme de données, c'est tout."}, {"q": "Pour créer et pour afficher un article, combien de DTO ?", "options": ["Un seul pour tout", "Deux : un d'entrée et un de sortie", "Aucun, on utilise l'entité", "Un par colonne"], "answer": 1, "why": "Le client n'envoie pas l'id ni la date de création, mais il les reçoit."}], "td": {"title": "Concevoir les DTO d'une inscription", "enonce": "Pour l'inscription d'un utilisateur, écris les deux DTO. Pas encore de contrôleur.", "consignes": ["`RegisterInput` : ce que le formulaire React envoie (email, mot de passe, pseudo, acceptation des CGU)", "`UserOutput` : ce que l'API renvoie après inscription", "Explique en commentaire pourquoi le mot de passe n'apparaît que dans l'un des deux", "Propriétés `public readonly`, aucune méthode"], "starter": {"lang": "php", "code": "final class RegisterInput\n{\n    // à toi\n}\n\nfinal class UserOutput\n{\n    // à toi\n}"}, "hints": ["Le client n'envoie pas d'id ni de date : ils sont générés côté serveur.", "La sortie peut contenir `id`, `email`, `pseudo`, `inscritLe`… mais jamais le mot de passe."], "solution": {"lang": "php", "code": "final class RegisterInput\n{\n    public function __construct(\n        public readonly string $email,\n        public readonly string $motDePasse,   // en clair, uniquement à l'entrée : on le hache tout de suite\n        public readonly string $pseudo,\n        public readonly bool $accepteCgu,\n    ) {}\n}\n\nfinal class UserOutput\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly string $email,\n        public readonly string $pseudo,\n        public readonly string $inscritLe,\n    ) {}\n    // Pas de mot de passe : une réponse d'API ne renvoie jamais un secret, même haché.\n}"}, "checks": ["`UserOutput` ne contient aucun champ sensible", "`RegisterInput` ne contient pas d'id"]}}, {"id": "dto-entree", "track": "dto", "title": "DTO d'entrée & validation", "minutes": 15, "goal": "Recevoir le JSON du front dans un DTO validé automatiquement.", "why": "Lire `$request->getContent()`, faire `json_decode` et vérifier chaque champ à la main est long et on oublie toujours un cas.", "flow": ["Le front envoie un corps JSON (`POST /api/articles`)", "`#[MapRequestPayload]` **désérialise** le JSON dans ton DTO", "Le **Validator** vérifie les contraintes `#[Assert\\...]`", "Valide → ton contrôleur reçoit le DTO. Invalide → Symfony répond **422** avec la liste des erreurs"], "points": ["`#[MapRequestPayload]` existe depuis Symfony 6.3.", "Les noms des clés JSON doivent correspondre aux propriétés du DTO.", "Contraintes courantes : `NotBlank`, `Length`, `Email`, `Positive`, `Choice`, `Count`.", "Si la validation échoue, ton code ne s'exécute même pas : le contrôleur reste court.", "Côté React, le 422 arrive dans `error.response.data` avec axios : tu peux afficher les erreurs sous chaque champ."], "pitfalls": ["Valider dans le contrôleur avec des `if` au lieu des contraintes.", "Oublier `NotBlank` : une chaîne vide passe le type `string`."], "example": {"lang": "php", "code": "// src/Dto/CreateArticleInput.php\nnamespace App\\Dto;\n\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nfinal class CreateArticleInput\n{\n    public function __construct(\n        #[Assert\\NotBlank]\n        #[Assert\\Length(min: 5, max: 180)]\n        public readonly string $titre = '',\n\n        #[Assert\\NotBlank]\n        public readonly string $contenu = '',\n\n        #[Assert\\Count(max: 5)]\n        #[Assert\\All([new Assert\\Length(max: 30)])]\n        public readonly array $tags = [],\n    ) {}\n}\n\n// src/Controller/ArticleController.php\n#[Route('/api/articles', methods: ['POST'])]\npublic function create(\n    #[MapRequestPayload] CreateArticleInput $input,\n    ArticleService $articles,\n): JsonResponse {\n    $article = $articles->creer($input);              // on ne passe que des données valides\n    return $this->json(ArticleOutput::fromEntity($article), 201);\n}", "notes": ["Les valeurs par défaut (`''`) permettent de signaler « champ manquant » proprement via `NotBlank`.", "Le contrôleur fait 2 lignes : la validation est déjà faite.", "201 = « créé »."]}, "quiz": [{"q": "Que fait `#[MapRequestPayload]` ?", "options": ["Il enregistre en base", "Il transforme le JSON reçu en DTO et le valide", "Il génère une migration", "Il crée une route"], "answer": 1, "why": "Désérialisation + validation, avant d'entrer dans ton contrôleur."}, {"q": "Le front envoie un titre vide. Que se passe-t-il ?", "options": ["Le contrôleur plante", "Symfony répond 422 avec les erreurs, le contrôleur n'est pas exécuté", "L'article est créé sans titre", "200 OK"], "answer": 1, "why": "`NotBlank` échoue, Symfony arrête là."}, {"q": "Pourquoi `#[Assert\\NotBlank]` sur une propriété `string` ?", "options": ["Inutile, le type suffit", "Le type accepte une chaîne vide `''`", "Pour la performance", "Pour Doctrine"], "answer": 1, "why": "Le type vérifie que c'est une chaîne, pas qu'elle contient quelque chose."}], "td": {"title": "Endpoint d'inscription", "enonce": "Reprends `RegisterInput` et branche-le sur un endpoint qui valide tout.", "consignes": ["Email valide et obligatoire", "Mot de passe : 8 caractères minimum", "Pseudo : 3 à 20 caractères, lettres, chiffres et `_` seulement (`Regex`)", "`accepteCgu` doit valoir `true` (`IsTrue`)", "Route `POST /api/register` qui renvoie 201 et un `UserOutput`"], "starter": {"lang": "php", "code": "use Symfony\\Component\\Validator\\Constraints as Assert;\n\nfinal class RegisterInput\n{\n    public function __construct(\n        public readonly string $email = '',\n        public readonly string $motDePasse = '',\n        public readonly string $pseudo = '',\n        public readonly bool $accepteCgu = false,\n    ) {}\n}\n\n// Contrôleur : à toi"}, "hints": ["`#[Assert\\Regex('/^[a-zA-Z0-9_]+$/')]`", "`#[Assert\\IsTrue(message: 'Tu dois accepter les CGU')]`", "Le hachage du mot de passe se fait dans le service, avec `UserPasswordHasherInterface`."], "solution": {"lang": "php", "code": "final class RegisterInput\n{\n    public function __construct(\n        #[Assert\\NotBlank, Assert\\Email]\n        public readonly string $email = '',\n\n        #[Assert\\NotBlank, Assert\\Length(min: 8)]\n        public readonly string $motDePasse = '',\n\n        #[Assert\\NotBlank, Assert\\Length(min: 3, max: 20), Assert\\Regex('/^[a-zA-Z0-9_]+$/')]\n        public readonly string $pseudo = '',\n\n        #[Assert\\IsTrue(message: 'Tu dois accepter les CGU')]\n        public readonly bool $accepteCgu = false,\n    ) {}\n}\n\n#[Route('/api/register', methods: ['POST'])]\npublic function register(\n    #[MapRequestPayload] RegisterInput $input,\n    InscriptionService $inscription,\n): JsonResponse {\n    $user = $inscription->inscrire($input);\n    return $this->json(new UserOutput(\n        $user->getId(),\n        $user->getEmail(),\n        $user->getPseudo(),\n        $user->getInscritLe()->format(DATE_ATOM),\n    ), 201);\n}"}, "checks": ["Un POST avec `\"pseudo\": \"a b\"` renvoie 422", "Le contrôleur ne contient aucun `if` de validation"]}}, {"id": "dto-sortie", "track": "dto", "title": "DTO de sortie & mapping", "minutes": 12, "goal": "Transformer une entité en DTO de sortie, proprement et à un seul endroit.", "why": "Sérialiser l'entité directement provoque des boucles (Article → Auteur → Articles → …) et expose des champs que le front n'a pas à voir.", "flow": ["Le contrôleur récupère une ou plusieurs **entités**", "Une méthode **`fromEntity()`** construit le DTO de sortie", "Le DTO ne contient que des **types simples** (string, int, tableaux)", "`$this->json($dto)` le convertit en **JSON**"], "points": ["Mets le mapping dans une méthode statique du DTO (`ArticleOutput::fromEntity($a)`) ou dans une classe dédiée (`ArticleMapper`).", "Formate les dates en chaînes (`DATE_ATOM`) : le front sait les lire.", "Pour une liste : `array_map(ArticleOutput::fromEntity(...), $articles)`.", "Un DTO « liste » plus léger qu'un DTO « détail » évite d'envoyer le contenu complet de 50 articles."], "pitfalls": ["Faire le mapping dans chaque contrôleur : il finit copié-collé et différent partout.", "Mettre un objet entité dans le DTO de sortie : la boucle revient."], "example": {"lang": "php", "code": "final class ArticleOutput\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly string $titre,\n        public readonly string $extrait,\n        public readonly string $auteur,\n        public readonly string $creeLe,\n    ) {}\n\n    public static function fromEntity(Article $a): self\n    {\n        return new self(\n            id: $a->getId(),\n            titre: $a->getTitre(),\n            extrait: mb_substr($a->getContenu(), 0, 140),\n            auteur: $a->getAuteur()->getNom(),\n            creeLe: $a->getCreeLe()->format(DATE_ATOM),\n        );\n    }\n}\n\n#[Route('/api/articles', methods: ['GET'])]\npublic function list(ArticleRepository $repo): JsonResponse\n{\n    $articles = $repo->findAvecAuteur();   // fetch join, voir le module N+1\n    return $this->json(array_map(ArticleOutput::fromEntity(...), $articles));\n}\n\n// JSON renvoyé :\n// [{\"id\":1,\"titre\":\"Hello\",\"extrait\":\"...\",\"auteur\":\"Ana\",\"creeLe\":\"2026-11-10T09:00:00+01:00\"}]", "notes": ["Les arguments nommés (`id:`, `titre:`) rendent le mapping lisible.", "`ArticleOutput::fromEntity(...)` (syntaxe PHP 8.1) passe la méthode comme fonction à `array_map`.", "Le JSON correspond exactement aux propriétés du DTO : c'est ce que React reçoit dans `response.data`."]}, "quiz": [{"q": "Pourquoi `auteur` est une `string` et pas un objet `User` ?", "options": ["Pour la performance", "Pour éviter les boucles et ne pas exposer tout l'utilisateur", "Doctrine l'impose", "Par habitude"], "answer": 1, "why": "Le DTO de sortie ne contient que ce dont l'écran a besoin."}, {"q": "Où placer le code entité → DTO ?", "options": ["Dans chaque contrôleur", "À un seul endroit : `fromEntity()` ou un mapper", "Dans le template", "Dans l'entité"], "answer": 1, "why": "Un seul endroit = une seule version du JSON."}, {"q": "Côté React avec axios, où se trouve ce JSON ?", "options": ["`response.json`", "`response.data`", "`response.body`", "`response.dto`"], "answer": 1, "why": "axios décode le JSON et le met dans `data`."}], "td": {"title": "API du catalogue de livres", "enonce": "Expose les livres de la bibliothèque (modules Doctrine) avec deux DTO.", "consignes": ["`LivreListItem` : id, titre, auteur (nom), disponible", "`LivreDetail` : tout `LivreListItem` + isbn, publieLe (Y-m-d)", "`GET /api/livres` renvoie une liste de `LivreListItem`", "`GET /api/livres/{id}` renvoie un `LivreDetail` ou 404"], "starter": {"lang": "php", "code": "final class LivreListItem\n{\n    // à toi\n}\n\nfinal class LivreDetail\n{\n    // à toi\n}\n\n// LivreController : à toi"}, "hints": ["404 : `throw $this->createNotFoundException();` si le livre est introuvable.", "Avec `#[Route('/api/livres/{id}')]` et un paramètre `Livre $livre`, Symfony charge l'entité et renvoie 404 tout seul (EntityValueResolver)."], "solution": {"lang": "php", "code": "final class LivreListItem\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly string $titre,\n        public readonly string $auteur,\n        public readonly bool $disponible,\n    ) {}\n\n    public static function fromEntity(Livre $l): self\n    {\n        return new self($l->getId(), $l->getTitre(), $l->getAuteur()->getNom(), $l->isDisponible());\n    }\n}\n\nfinal class LivreDetail\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly string $titre,\n        public readonly string $auteur,\n        public readonly bool $disponible,\n        public readonly string $isbn,\n        public readonly string $publieLe,\n    ) {}\n\n    public static function fromEntity(Livre $l): self\n    {\n        return new self(\n            $l->getId(), $l->getTitre(), $l->getAuteur()->getNom(), $l->isDisponible(),\n            $l->getIsbn(), $l->getPublieLe()->format('Y-m-d'),\n        );\n    }\n}\n\n#[Route('/api/livres', methods: ['GET'])]\npublic function list(LivreRepository $repo): JsonResponse\n{\n    return $this->json(array_map(LivreListItem::fromEntity(...), $repo->catalogue()));\n}\n\n#[Route('/api/livres/{id}', methods: ['GET'])]\npublic function show(Livre $livre): JsonResponse   // 404 automatique si absent\n{\n    return $this->json(LivreDetail::fromEntity($livre));\n}"}, "checks": ["Le JSON ne contient aucun objet imbriqué `auteur: {...}`", "`/api/livres/999999` renvoie 404"]}}, {"id": "dto-modifier", "track": "dto", "title": "Du DTO à l'entité (créer, modifier)", "minutes": 15, "goal": "Utiliser un DTO d'entrée pour créer ou modifier une entité, sans setters partout.", "why": "Faire `$article->setTitre($data['titre'])` champ par champ dans le contrôleur mélange HTTP, règles et base de données.", "flow": ["Le contrôleur reçoit un **DTO validé**", "Il le passe à un **service** (le cas d'usage)", "Le service appelle le **constructeur** ou une **méthode métier** de l'entité avec les valeurs du DTO", "Puis `flush()`, et on renvoie un **DTO de sortie**"], "points": ["Création : `new Article($input->titre, $input->contenu, $auteur)`.", "Modification : une méthode métier, `$article->modifier($input->titre, $input->contenu)`.", "PUT = remplacer toute la ressource (tous les champs requis). PATCH = modifier une partie (champs optionnels, souvent `?string`).", "L'entité garde ses règles (modules Encapsulation et Entités riches) ; le DTO ne fait que transporter."], "pitfalls": ["Faire hériter le DTO de l'entité, ou l'inverse.", "Utiliser un seul DTO pour créer et modifier alors que les champs obligatoires ne sont pas les mêmes."], "example": {"lang": "php", "code": "final class UpdateArticleInput\n{\n    public function __construct(\n        #[Assert\\NotBlank, Assert\\Length(min: 5, max: 180)]\n        public readonly string $titre = '',\n        #[Assert\\NotBlank]\n        public readonly string $contenu = '',\n    ) {}\n}\n\nfinal class ArticleService\n{\n    public function __construct(private EntityManagerInterface $em) {}\n\n    public function creer(CreateArticleInput $in, User $auteur): Article\n    {\n        $article = new Article($in->titre, $in->contenu, $auteur);\n        $this->em->persist($article);\n        $this->em->flush();\n        return $article;\n    }\n\n    public function modifier(Article $article, UpdateArticleInput $in): Article\n    {\n        $article->modifier($in->titre, $in->contenu);   // méthode métier de l'entité\n        $this->em->flush();                             // déjà suivie : pas de persist\n        return $article;\n    }\n}\n\n#[Route('/api/articles/{id}', methods: ['PUT'])]\npublic function update(\n    Article $article,\n    #[MapRequestPayload] UpdateArticleInput $input,\n    ArticleService $service,\n): JsonResponse {\n    return $this->json(ArticleOutput::fromEntity($service->modifier($article, $input)));\n}", "notes": ["Le contrôleur : HTTP → DTO → service → DTO de sortie.", "Le service : il orchestre, sans connaître HTTP.", "Pas de `persist` dans `modifier` : l'article vient de la base (module Unit of Work)."]}, "quiz": [{"q": "Pour modifier seulement le titre d'un article, quelle méthode HTTP ?", "options": ["GET", "PATCH", "DELETE", "POST"], "answer": 1, "why": "PATCH = modification partielle ; PUT remplace toute la ressource."}, {"q": "Qui applique les valeurs du DTO à l'entité ?", "options": ["Le DTO lui-même", "Un service, via le constructeur ou une méthode métier de l'entité", "Le front", "Doctrine automatiquement"], "answer": 1, "why": "Le service orchestre, l'entité garde ses règles."}, {"q": "Dans `modifier()`, pourquoi pas de `persist` ?", "options": ["Oubli", "L'article vient de la base, il est déjà suivi par Doctrine", "PUT n'en a pas besoin", "Le DTO s'en charge"], "answer": 1, "why": "Seuls les nouveaux objets ont besoin de `persist`."}], "td": {"title": "Emprunter un livre via l'API", "enonce": "Crée l'endpoint qui enregistre un emprunt.", "consignes": ["DTO `EmpruntInput` : `livreId` (int, positif), `rendreLe` (date `Y-m-d`, dans le futur)", "Service `EmpruntService::emprunter(EmpruntInput $in, User $membre): Emprunt`", "Le service appelle `$livre->emprunter()` (exception si indisponible)", "Route `POST /api/emprunts` → 201 + `EmpruntOutput` ; 409 si le livre est déjà emprunté"], "starter": {"lang": "php", "code": "final class EmpruntInput\n{\n    // à toi\n}\n\nfinal class EmpruntService\n{\n    // à toi\n}\n\n// Contrôleur : à toi"}, "hints": ["Date : `#[Assert\\Date]` sur une `string`, puis `new \\DateTimeImmutable($in->rendreLe)` dans le service. Vérifie qu'elle est future dans le service ou avec `GreaterThan('today')` sur un `DateTimeImmutable`.", "409 Conflict : attrape la `DomainException` dans le contrôleur et renvoie `$this->json(['error' => ...], 409)`.", "`#[CurrentUser] User $membre` donne l'utilisateur connecté."], "solution": {"lang": "php", "code": "final class EmpruntInput\n{\n    public function __construct(\n        #[Assert\\Positive]\n        public readonly int $livreId = 0,\n        #[Assert\\NotBlank, Assert\\Date]\n        public readonly string $rendreLe = '',\n    ) {}\n}\n\nfinal class EmpruntService\n{\n    public function __construct(private EntityManagerInterface $em, private LivreRepository $livres) {}\n\n    public function emprunter(EmpruntInput $in, User $membre): Emprunt\n    {\n        $livre = $this->livres->find($in->livreId) ?? throw new NotFoundHttpException('Livre introuvable');\n        $retour = new \\DateTimeImmutable($in->rendreLe);\n        if ($retour <= new \\DateTimeImmutable('today')) {\n            throw new \\InvalidArgumentException('La date de retour doit être dans le futur');\n        }\n        $livre->emprunter();                         // DomainException si indisponible\n        $emprunt = new Emprunt($livre, $membre, $retour);\n        $this->em->persist($emprunt);\n        $this->em->flush();\n        return $emprunt;\n    }\n}\n\n#[Route('/api/emprunts', methods: ['POST'])]\npublic function create(\n    #[MapRequestPayload] EmpruntInput $input,\n    #[CurrentUser] User $membre,\n    EmpruntService $service,\n): JsonResponse {\n    try {\n        $emprunt = $service->emprunter($input, $membre);\n    } catch (\\DomainException $e) {\n        return $this->json(['error' => $e->getMessage()], 409);\n    } catch (\\InvalidArgumentException $e) {\n        return $this->json(['error' => $e->getMessage()], 422);\n    }\n    return $this->json(EmpruntOutput::fromEntity($emprunt), 201);\n}"}, "checks": ["Emprunter deux fois le même livre renvoie 409", "Le contrôleur ne modifie aucune entité lui-même"]}}, {"id": "dto-query", "track": "dto", "title": "Filtres & pagination (query string)", "minutes": 10, "goal": "Recevoir les paramètres d'URL (`?page=2&q=php`) dans un DTO validé.", "why": "Une liste a presque toujours des filtres et une pagination. Les lire un par un avec `$request->query->get()` est fastidieux et non validé.", "flow": ["Le front appelle `GET /api/articles?q=php&page=2`", "`#[MapQueryString]` remplit un **DTO de filtres**", "Les contraintes **valident** (page ≥ 1, taille max…)", "Le repository reçoit le DTO et construit la requête"], "points": ["`#[MapQueryString]` (Symfony 6.3+) fonctionne comme `#[MapRequestPayload]`, mais avec l'URL.", "Donne des valeurs par défaut : `page = 1`, `parPage = 20`.", "Limite `parPage` (ex. 100) pour qu'on ne puisse pas demander un million de lignes.", "Renvoie aussi le total pour que le front affiche la pagination : `{ items: [...], total: 134, page: 2 }`.", "Côté axios : `api.get('/articles', { params: { q: 'php', page: 2 } })` construit l'URL pour toi."], "pitfalls": ["Accepter `parPage` sans limite.", "Construire la requête en concaténant les filtres (injection SQL)."], "example": {"lang": "php", "code": "final class ArticleFilters\n{\n    public function __construct(\n        #[Assert\\Length(max: 50)]\n        public readonly ?string $q = null,\n        #[Assert\\Positive]\n        public readonly int $page = 1,\n        #[Assert\\Range(min: 1, max: 100)]\n        public readonly int $parPage = 20,\n    ) {}\n}\n\n#[Route('/api/articles', methods: ['GET'])]\npublic function list(\n    #[MapQueryString] ?ArticleFilters $filters,\n    ArticleRepository $repo,\n): JsonResponse {\n    $filters ??= new ArticleFilters();             // aucune query string\n    [$articles, $total] = $repo->rechercher($filters);\n\n    return $this->json([\n        'items' => array_map(ArticleOutput::fromEntity(...), $articles),\n        'total' => $total,\n        'page' => $filters->page,\n    ]);\n}\n\n// Repository\npublic function rechercher(ArticleFilters $f): array\n{\n    $qb = $this->createQueryBuilder('a')->leftJoin('a.auteur', 'u')->addSelect('u');\n    if ($f->q) {\n        $qb->andWhere('LOWER(a.titre) LIKE :q')->setParameter('q', '%' . mb_strtolower($f->q) . '%');\n    }\n    $qb->orderBy('a.creeLe', 'DESC')\n       ->setFirstResult(($f->page - 1) * $f->parPage)\n       ->setMaxResults($f->parPage);\n\n    $paginator = new Paginator($qb);\n    return [iterator_to_array($paginator), count($paginator)];\n}", "notes": ["`?ArticleFilters` + `??=` : sans query string, on prend les valeurs par défaut.", "`Paginator` (Doctrine) donne la page ET le total.", "La réponse a une forme fixe que le front peut utiliser pour la pagination."]}, "quiz": [{"q": "`GET /api/articles?parPage=5000` avec `Range(max: 100)` :", "options": ["Renvoie 5000 articles", "Renvoie une erreur de validation (4xx)", "Renvoie 100 articles", "Plante"], "answer": 1, "why": "La contrainte protège ta base."}, {"q": "Avec axios, comment envoyer `?q=php&page=2` proprement ?", "options": ["Concaténer la chaîne à la main", "`api.get('/articles', { params: { q: 'php', page: 2 } })`", "Dans le body", "Dans un header"], "answer": 1, "why": "axios encode les paramètres pour toi."}, {"q": "Pourquoi renvoyer `total` avec la liste ?", "options": ["Pour le cache", "Pour que le front calcule le nombre de pages", "Doctrine l'exige", "Pour la sécurité"], "answer": 1, "why": "Sans total, impossible d'afficher « page 2 sur 7 »."}], "td": {"title": "Filtrer le catalogue", "enonce": "Ajoute filtres et pagination à `GET /api/livres`.", "consignes": ["DTO `LivreFilters` : `q` (texte), `disponible` (booléen optionnel), `page`, `parPage` (max 50)", "Le repository applique uniquement les filtres fournis", "Réponse : `{ items, total, page, pages }`"], "starter": {"lang": "php", "code": "final class LivreFilters\n{\n    // à toi\n}\n\n// LivreRepository::rechercher(LivreFilters $f): array  -> [livres, total]\n// LivreController::list : à toi"}, "hints": ["`public readonly ?bool $disponible = null` : null = pas de filtre.", "`pages` = `(int) ceil($total / $f->parPage)`."], "solution": {"lang": "php", "code": "final class LivreFilters\n{\n    public function __construct(\n        #[Assert\\Length(max: 50)]\n        public readonly ?string $q = null,\n        public readonly ?bool $disponible = null,\n        #[Assert\\Positive]\n        public readonly int $page = 1,\n        #[Assert\\Range(min: 1, max: 50)]\n        public readonly int $parPage = 20,\n    ) {}\n}\n\npublic function rechercher(LivreFilters $f): array\n{\n    $qb = $this->createQueryBuilder('l')->leftJoin('l.auteur', 'a')->addSelect('a');\n    if ($f->q) {\n        $qb->andWhere('LOWER(l.titre) LIKE :q')->setParameter('q', '%' . mb_strtolower($f->q) . '%');\n    }\n    if ($f->disponible !== null) {\n        $qb->andWhere('l.disponible = :d')->setParameter('d', $f->disponible);\n    }\n    $qb->orderBy('l.titre', 'ASC')\n       ->setFirstResult(($f->page - 1) * $f->parPage)\n       ->setMaxResults($f->parPage);\n    $p = new Paginator($qb);\n    return [iterator_to_array($p), count($p)];\n}\n\n#[Route('/api/livres', methods: ['GET'])]\npublic function list(#[MapQueryString] ?LivreFilters $f, LivreRepository $repo): JsonResponse\n{\n    $f ??= new LivreFilters();\n    [$livres, $total] = $repo->rechercher($f);\n    return $this->json([\n        'items' => array_map(LivreListItem::fromEntity(...), $livres),\n        'total' => $total,\n        'page' => $f->page,\n        'pages' => (int) ceil($total / $f->parPage),\n    ]);\n}"}, "checks": ["`?disponible=true` ne renvoie que les livres disponibles", "`?parPage=200` est refusé"]}}, {"id": "arch-roles", "track": "arch", "title": "Qui fait quoi : les 5 rôles", "minutes": 15, "goal": "Savoir exactement le rôle du contrôleur, du DTO, du service, de l'entité et du repository.", "why": "Sans séparation, tout finit dans le contrôleur : 200 lignes qui lisent le JSON, valident, calculent, font du SQL et formatent la réponse. Impossible à relire, à tester ou à réutiliser. Pense à un restaurant : le serveur prend la commande, le chef cuisine, le magasinier gère le stock. Personne ne fait le travail des autres.", "flow": ["**Contrôleur** (le serveur du restaurant) : reçoit la requête HTTP, appelle le bon service, renvoie la réponse", "**DTO** (le bon de commande) : la forme des données qui entrent et qui sortent", "**Service** (le chef) : exécute le cas d'usage, applique la logique, coordonne", "**Entité + Repository** (les ingrédients + le magasinier) : l'entité porte les données et ses règles ; le repository les cherche et les range en base"], "points": ["**Contrôleur** : parle HTTP (route, statut, JSON). Il ne contient **aucune** règle métier ni requête. Objectif : moins de 15 lignes par action.", "**DTO** : aucune logique ; juste des propriétés et des contraintes de validation.", "**Service** : ne connaît **pas** HTTP (pas de `Request`, pas de `JsonResponse`). Il pourrait être appelé par une commande console ou un test.", "**Entité** : ses propres règles (`emprunter()` refuse si indisponible). **Repository** : seulement des lectures en base (`find`, QueryBuilder).", "Test simple : si tu peux décrire une classe en une phrase sans « et », elle a un seul rôle."], "pitfalls": ["Un `if` métier dans le contrôleur (« si le stock est à 0… »).", "Un service qui renvoie une `JsonResponse` ou lit `$request`."], "example": {"lang": "plaintext", "code": "            REQUÊTE HTTP  POST /api/emprunts  {\"livreId\": 3, \"rendreLe\": \"2026-12-01\"}\n                 |\n                 v\n  +-----------------------------+\n  | CONTRÔLEUR                  |  \"Je reçois, je délègue, je réponds.\"\n  | EmpruntController::create   |\n  +-----------------------------+\n        |  JSON -> EmpruntInput (DTO d'entrée, validé)\n        v\n  +-----------------------------+\n  | SERVICE                     |  \"J'exécute le cas d'usage.\"\n  | EmpruntService::emprunter   |\n  +-----------------------------+\n        |                     |\n        | find(3)             | $livre->emprunter()   (règle : disponible ?)\n        v                     v\n  +---------------+     +---------------+\n  | REPOSITORY    |     | ENTITÉ        |  \"Je garde mes règles.\"\n  | LivreRepo     |---->| Livre         |\n  +---------------+     +---------------+\n        |                     |\n        v                     | persist / flush (EntityManager)\n     BASE DE DONNÉES  <-------+\n                 |\n                 v\n  CONTRÔLEUR : Emprunt -> EmpruntOutput (DTO de sortie) -> JSON, statut 201", "notes": ["La flèche descend toujours : le contrôleur connaît le service, le service connaît le repository et l'entité. Jamais l'inverse.", "Le DTO sert de frontière : en entrée (JSON → objet) et en sortie (entité → JSON).", "La règle « livre disponible ? » vit dans l'entité, pas dans le contrôleur ni dans le service."]}, "quiz": [{"q": "Où placer « un membre ne peut pas avoir plus de 3 emprunts en cours » ?", "options": ["Dans le contrôleur", "Dans le DTO", "Dans le service (ou l'entité si elle a l'info)", "Dans le repository"], "answer": 2, "why": "C'est une règle métier : service ou entité, jamais le contrôleur ni le DTO."}, {"q": "Le service doit-il renvoyer une `JsonResponse` ?", "options": ["Oui", "Non : il renvoie des objets métier, le contrôleur fabrique la réponse HTTP", "Seulement en API", "Seulement pour les erreurs"], "answer": 1, "why": "Le service ne connaît pas HTTP, ce qui permet de l'appeler depuis une commande ou un test."}, {"q": "Quel est le rôle du repository ?", "options": ["Valider les données", "Chercher et lire les entités en base", "Formater le JSON", "Gérer les routes"], "answer": 1, "why": "Il cache le SQL/DQL derrière des méthodes nommées."}], "td": {"title": "Trier le code d'un contrôleur", "enonce": "Ce contrôleur fait tout. Pour chaque bloc numéroté, indique dans quelle classe il devrait aller (Contrôleur, DTO, Service, Entité, Repository) et pourquoi, en une phrase.", "consignes": ["Attribue un rôle à chaque bloc de 1 à 7", "Justifie en une phrase", "Bonus : réécris le contrôleur en 5 lignes maximum"], "starter": {"lang": "php", "code": "#[Route('/api/commandes', methods: ['POST'])]\npublic function create(Request $request, EntityManagerInterface $em): JsonResponse\n{\n    // 1\n    $data = json_decode($request->getContent(), true);\n    if (empty($data['produitId']) || ($data['quantite'] ?? 0) < 1) {\n        return new JsonResponse(['error' => 'Données invalides'], 422);\n    }\n    // 2\n    $produit = $em->createQuery('SELECT p FROM App\\Entity\\Produit p WHERE p.id = :id')\n        ->setParameter('id', $data['produitId'])->getOneOrNullResult();\n    // 3\n    if ($produit->getStock() < $data['quantite']) {\n        return new JsonResponse(['error' => 'Stock insuffisant'], 409);\n    }\n    // 4\n    $produit->setStock($produit->getStock() - $data['quantite']);\n    // 5\n    $commande = new Commande($produit, $data['quantite'], $this->getUser());\n    $em->persist($commande);\n    $em->flush();\n    // 6\n    $json = ['id' => $commande->getId(), 'total' => $commande->getTotal() / 100 . ' €'];\n    // 7\n    return new JsonResponse($json, 201);\n}"}, "hints": ["Le bloc 1 mélange deux choses : la forme des données (DTO) et la réponse HTTP (contrôleur, ou automatique avec `MapRequestPayload`).", "Les blocs 3 et 4 vont ensemble : « retirer du stock, sauf si insuffisant » est une seule règle."], "solution": {"lang": "php", "code": "// 1 -> DTO CommandeInput + #[MapRequestPayload] : forme et validation des données entrantes.\n// 2 -> Repository (ProduitRepository::find) : lire en base.\n// 3+4 -> Entité Produit::retirerDuStock(int $q) : la règle \"pas de stock négatif\" appartient au produit.\n// 5 -> Service CommandeService::passer() : orchestrer (chercher, appliquer la règle, créer, enregistrer).\n// 6 -> DTO de sortie CommandeOutput::fromEntity() : choisir et formater ce qui sort.\n// 7 -> Contrôleur : statut HTTP et réponse JSON.\n\n#[Route('/api/commandes', methods: ['POST'])]\npublic function create(\n    #[MapRequestPayload] CommandeInput $input,\n    #[CurrentUser] User $user,\n    CommandeService $commandes,\n): JsonResponse {\n    $commande = $commandes->passer($input, $user);\n    return $this->json(CommandeOutput::fromEntity($commande), 201);\n}"}, "checks": ["Chaque bloc a une seule destination", "Ton contrôleur réécrit ne contient ni `if` métier ni requête"]}}, {"id": "arch-liens", "track": "arch", "title": "Comment les classes sont reliées", "minutes": 15, "goal": "Comprendre comment le contrôleur obtient le service, et le service le repository, sans jamais faire `new`.", "why": "On voit `public function __construct(private LivreRepository $livres)` partout, mais on ne sait pas qui crée ces objets ni comment ils arrivent. C'est le conteneur de services de Symfony.", "flow": ["Chaque classe **déclare** ce dont elle a besoin dans son **constructeur** (ou dans les paramètres d'une action de contrôleur)", "Au démarrage, Symfony lit ces **types** (autowiring)", "Le **conteneur** crée chaque service **une seule fois** et le passe à ceux qui en ont besoin", "Résultat : une **chaîne** Contrôleur → Service → Repository/EntityManager, montée automatiquement"], "points": ["Tout ce qui est dans `src/` (sauf entités, DTO…) est un service enregistré automatiquement (`config/services.yaml`).", "Les **entités** et les **DTO** ne sont **pas** des services : on les crée avec `new` (ou Symfony les remplit, comme `MapRequestPayload`).", "Les dépendances vont **vers le bas** : un repository ne dépend jamais d'un service, un service jamais d'un contrôleur.", "Si une interface n'a qu'une implémentation, Symfony les relie tout seul. Sinon, un alias dans `services.yaml`.", "Commande utile : `php bin/console debug:autowiring Livre` liste ce que tu peux injecter."], "pitfalls": ["Faire `new LivreRepository()` ou `new EmpruntService(...)` à la main dans un contrôleur.", "Une dépendance circulaire (A a besoin de B qui a besoin de A) : c'est le signe que les rôles sont mal découpés."], "example": {"lang": "php", "code": "// Le contrôleur demande le service\nfinal class EmpruntController extends AbstractController\n{\n    public function __construct(private EmpruntService $emprunts) {}   // injecté par Symfony\n    // ...\n}\n\n// Le service demande le repository et l'EntityManager\nfinal class EmpruntService\n{\n    public function __construct(\n        private LivreRepository $livres,          // pour LIRE\n        private EntityManagerInterface $em,       // pour ÉCRIRE (persist/flush)\n    ) {}\n}\n\n// Le repository demande le registre Doctrine\nfinal class LivreRepository extends ServiceEntityRepository\n{\n    public function __construct(ManagerRegistry $registry)\n    {\n        parent::__construct($registry, Livre::class);\n    }\n}\n\n// Ce que Symfony fait pour toi, en gros :\n// $registry   = ...;                                   // fourni par Doctrine\n// $em         = ...;\n// $livres     = new LivreRepository($registry);\n// $service    = new EmpruntService($livres, $em);\n// $controller = new EmpruntController($service);", "notes": ["Personne n'écrit les `new` du bas : c'est le conteneur qui les fait, dans le bon ordre.", "Chaque classe ne connaît que l'étage juste en dessous.", "En test, tu peux faire ces `new` toi-même avec de fausses implémentations (module Injection de dépendances)."]}, "quiz": [{"q": "Qui crée l'instance de `EmpruntService` passée au contrôleur ?", "options": ["Le contrôleur avec `new`", "Le conteneur de services de Symfony (autowiring)", "Doctrine", "Le front"], "answer": 1, "why": "Il lit le type dans le constructeur et fournit l'objet."}, {"q": "Un DTO `EmpruntInput` est-il un service injecté ?", "options": ["Oui", "Non : c'est une donnée, créée par `new` ou remplie par `MapRequestPayload`", "Seulement s'il est final", "Seulement en prod"], "answer": 1, "why": "Services = objets qui font quelque chose ; DTO/entités = objets qui portent des données."}, {"q": "Quel sens de dépendance est correct ?", "options": ["Repository → Service", "Service → Contrôleur", "Contrôleur → Service → Repository", "Entité → Contrôleur"], "answer": 2, "why": "Toujours de la couche HTTP vers les données."}], "td": {"title": "Dessiner les liens", "enonce": "Pour la fonctionnalité « rendre un livre », écris les classes et leurs constructeurs (sans le corps des méthodes), puis dessine la chaîne.", "consignes": ["`RetourController` (route `POST /api/emprunts/{id}/retour`)", "`RetourService::rendre(int $empruntId, User $membre): Emprunt`", "`EmpruntRepository` avec une méthode de lecture utile", "Ce que chacun reçoit dans son constructeur", "Un schéma texte des flèches de dépendance"], "starter": {"lang": "plaintext", "code": "RetourController\n  constructeur : ...\n  méthode : ...\n\nRetourService\n  constructeur : ...\n\nEmpruntRepository\n  méthode : ...\n\nSchéma :\n  ... -> ... -> ..."}, "hints": ["Le service doit vérifier que l'emprunt appartient bien au membre : de quoi a-t-il besoin pour lire, et pour écrire ?", "L'entité `Emprunt` peut avoir une méthode `cloturer(\\DateTimeImmutable $le)` qui rend aussi le livre disponible."], "solution": {"lang": "php", "code": "final class RetourController extends AbstractController\n{\n    public function __construct(private RetourService $retours) {}\n\n    #[Route('/api/emprunts/{id}/retour', methods: ['POST'])]\n    public function rendre(int $id, #[CurrentUser] User $membre): JsonResponse\n    {\n        return $this->json(EmpruntOutput::fromEntity($this->retours->rendre($id, $membre)));\n    }\n}\n\nfinal class RetourService\n{\n    public function __construct(\n        private EmpruntRepository $emprunts,     // lire l'emprunt\n        private EntityManagerInterface $em,      // enregistrer (flush)\n        private ClockInterface $clock,           // la date du jour, remplaçable en test\n    ) {}\n\n    public function rendre(int $empruntId, User $membre): Emprunt { /* ... */ }\n}\n\nfinal class EmpruntRepository extends ServiceEntityRepository\n{\n    public function findEnCoursPourMembre(int $id, User $membre): ?Emprunt { /* ... */ }\n}\n\n// Schéma :\n// RetourController -> RetourService -> EmpruntRepository -> Doctrine\n//                                   -> EntityManager\n//                                   -> Emprunt::cloturer() -> Livre::rendre()"}, "checks": ["Aucune flèche ne remonte (ex. repository → service)", "Aucun `new` de service dans ton code"]}}, {"id": "arch-erreurs", "track": "arch", "title": "Les erreurs à travers les couches", "minutes": 12, "goal": "Savoir où chaque erreur est détectée et comment elle devient un code HTTP.", "why": "Si chaque couche renvoie ses erreurs à sa façon (`return false`, `null`, `JsonResponse`…), le contrôleur se remplit de `if` et le front reçoit des réponses incohérentes.", "flow": ["**DTO** : données mal formées → **422** (automatique avec `MapRequestPayload`)", "**Repository** : renvoie `null` si rien n'est trouvé ; le **service** transforme ça en exception « introuvable » → **404**", "**Entité / service** : règle métier violée → **exception métier** (`LivreIndisponible`) → **409**", "Le contrôleur **ne fait rien** : Symfony convertit l'exception en réponse grâce à `#[WithHttpStatus]`"], "points": ["Une exception métier par cas, avec un nom clair : `LivreIndisponible`, `QuotaEmpruntsAtteint`.", "`#[WithHttpStatus(409)]` sur la classe d'exception (Symfony 6.3+) : Symfony répond 409 tout seul.", "Le service et l'entité lèvent des exceptions **métier**, jamais des exceptions HTTP : ils ne connaissent pas HTTP.", "Côté React, tu lis le statut : `err.response?.status === 409` (module Mutations).", "Codes à retenir : 400 requête mal formée, 401 pas connecté, 403 pas le droit, 404 introuvable, 409 conflit avec l'état actuel, 422 données invalides."], "pitfalls": ["`return null` ou `return false` pour signaler une erreur métier : l'appelant oublie de vérifier.", "Un `try/catch` dans chaque contrôleur pour la même exception."], "example": {"lang": "php", "code": "// src/Exception/LivreIndisponible.php\nuse Symfony\\Component\\HttpKernel\\Attribute\\WithHttpStatus;\n\n#[WithHttpStatus(409)]\nfinal class LivreIndisponible extends \\DomainException\n{\n    public function __construct(int $livreId)\n    {\n        parent::__construct(\"Le livre $livreId est déjà emprunté\");\n    }\n}\n\n#[WithHttpStatus(404)]\nfinal class LivreIntrouvable extends \\DomainException {}\n\n// Entité : la règle\npublic function emprunter(): void\n{\n    if (!$this->disponible) {\n        throw new LivreIndisponible($this->id);\n    }\n    $this->disponible = false;\n}\n\n// Service : null -> exception\n$livre = $this->livres->find($in->livreId) ?? throw new LivreIntrouvable();\n$livre->emprunter();\n\n// Contrôleur : aucun try/catch\n$emprunt = $this->emprunts->emprunter($input, $membre);\nreturn $this->json(EmpruntOutput::fromEntity($emprunt), 201);", "notes": ["L'entité ne sait pas que 409 existe : elle lève juste `LivreIndisponible`.", "C'est l'attribut sur la classe d'exception qui fait le lien avec HTTP.", "En environnement de production, le message est masqué ; pour l'exposer au front, utilise un listener d'exception ou renvoie un DTO d'erreur."]}, "quiz": [{"q": "Le titre envoyé est vide. Qui détecte l'erreur, et quel code ?", "options": ["L'entité, 409", "Le DTO (validation), 422", "Le repository, 404", "Le contrôleur, 500"], "answer": 1, "why": "C'est un problème de forme des données."}, {"q": "Le livre existe mais est déjà emprunté. Quel code ?", "options": ["404", "409", "422", "500"], "answer": 1, "why": "Les données sont valides, mais l'état actuel empêche l'action : conflit."}, {"q": "L'entité doit-elle lever une `HttpException` ?", "options": ["Oui", "Non : elle lève une exception métier ; le lien avec HTTP se fait ailleurs", "Seulement pour 404", "Seulement en API"], "answer": 1, "why": "Le domaine ne dépend pas de HTTP."}], "td": {"title": "Quota d'emprunts", "enonce": "Un membre ne peut pas avoir plus de 3 emprunts en cours.", "consignes": ["Exception `QuotaEmpruntsAtteint` → 409 via `#[WithHttpStatus]`", "Le repository fournit `compterEnCours(User $membre): int`", "Le service vérifie le quota avant d'emprunter", "Le contrôleur ne change pas", "Côté React : affiche « Tu as déjà 3 livres » si 409 et que le message contient « quota »… ou mieux, propose une solution plus fiable"], "starter": {"lang": "php", "code": "final class QuotaEmpruntsAtteint extends \\DomainException\n{\n    // à toi\n}\n\n// EmpruntRepository::compterEnCours : à toi\n// EmpruntService::emprunter : ajoute la vérification"}, "hints": ["`COUNT(e.id)` avec `e.membre = :m AND e.rendu = false`.", "Pour que le front distingue deux 409, renvoie un code d'erreur stable dans le JSON (`\"code\": \"QUOTA\"`) avec un listener d'exception, plutôt que de lire le message."], "solution": {"lang": "php", "code": "#[WithHttpStatus(409)]\nfinal class QuotaEmpruntsAtteint extends \\DomainException\n{\n    public function __construct(int $max)\n    {\n        parent::__construct(\"Quota de $max emprunts atteint\");\n    }\n}\n\n// EmpruntRepository\npublic function compterEnCours(User $membre): int\n{\n    return (int) $this->createQueryBuilder('e')\n        ->select('COUNT(e.id)')\n        ->andWhere('e.membre = :m')->setParameter('m', $membre)\n        ->andWhere('e.rendu = false')\n        ->getQuery()->getSingleScalarResult();\n}\n\n// EmpruntService\nprivate const MAX = 3;\n\npublic function emprunter(EmpruntInput $in, User $membre): Emprunt\n{\n    if ($this->emprunts->compterEnCours($membre) >= self::MAX) {\n        throw new QuotaEmpruntsAtteint(self::MAX);\n    }\n    $livre = $this->livres->find($in->livreId) ?? throw new LivreIntrouvable();\n    $livre->emprunter();\n    // ...\n}\n\n// Plus fiable pour le front : un ExceptionListener qui renvoie\n// {\"code\": \"QUOTA_ATTEINT\", \"message\": \"...\"} pour QuotaEmpruntsAtteint,\n// et {\"code\": \"LIVRE_INDISPONIBLE\", ...} pour LivreIndisponible.\n// React teste alors err.response.data.code au lieu du texte."}, "checks": ["Le contrôleur n'a pas été modifié", "Le 4e emprunt renvoie 409"]}}, {"id": "arch-bout-en-bout", "track": "arch", "title": "Une fonctionnalité de bout en bout", "minutes": 18, "goal": "Suivre une action de l'utilisateur à travers toutes les couches, du clic React à la base de données et retour.", "why": "Chaque parcours t'a montré une partie. Ici, on les assemble : c'est en voyant le trajet complet qu'on comprend pourquoi chaque couche existe.", "flow": ["**React** : le composant appelle le hook ; le hook appelle `api/emprunts.ts` ; axios envoie `POST /api/emprunts`", "**Symfony entrée** : la route → le contrôleur → `MapRequestPayload` remplit et valide le **DTO d'entrée**", "**Symfony métier** : le **service** lit via le **repository**, applique la règle de l'**entité**, `flush()`", "**Retour** : entité → **DTO de sortie** → JSON 201 → axios `res.data` → le hook met à jour le state → React redessine"], "points": ["Front et back ont la **même organisation** : une couche qui parle à l'extérieur (composant / contrôleur), une couche de logique (hook / service), une couche d'accès aux données (api / repository).", "Le **DTO** est le contrat entre les deux : le type TypeScript `Emprunt` = le DTO `EmpruntOutput`.", "Quand un bug apparaît, demande-toi **à quelle étape** du trajet il se produit. L'onglet Réseau (F12) te dit tout de suite si c'est avant ou après le serveur.", "Ajouter une fonctionnalité = ajouter une petite pièce à chaque couche, pas un gros bloc à un seul endroit."], "pitfalls": ["Débugger au hasard au lieu de suivre le trajet étape par étape.", "Changer un nom de champ dans le DTO sans mettre à jour le type TypeScript."], "example": {"lang": "plaintext", "code": "  NAVIGATEUR (React)                         SERVEUR (Symfony)\n  ==================                         =================\n  Catalogue.tsx  (composant)                 EmpruntController   (contrôleur)\n     | clic \"Emprunter\"                         | route POST /api/emprunts\n     v                                          v\n  useLivres()    (hook = logique)            EmpruntInput        (DTO d'entrée, validé)\n     |                                          |\n     v                                          v\n  api/livres.ts  (accès aux données)         EmpruntService      (service = logique)\n     | axios.post('/emprunts', {...})           |        |\n     |                                          v        v\n     |  ------------ HTTP JSON -------->     LivreRepo   Livre::emprunter()  (règle)\n     |                                          |        |\n     |                                          +--> flush() --> BASE DE DONNÉES\n     |                                          |\n     |  <----------- 201 JSON ---------      EmpruntOutput       (DTO de sortie)\n     v\n  res.data -> setLivres(...) -> React redessine\n\n  Les deux côtés en miroir :\n    composant  <->  contrôleur      (parle à l'extérieur)\n    hook       <->  service         (logique)\n    api/*.ts   <->  repository      (accès aux données)\n    type TS    <->  DTO             (contrat)", "notes": ["Le trajet complet fait environ 10 étapes, mais chaque étape est courte et ne fait qu'une chose.", "Le miroir front/back est le même principe de séparation des rôles, dans deux langages.", "Si l'écran ne bouge pas mais que le Réseau montre 201 : le problème est dans le hook (state non mis à jour)."]}, "quiz": [{"q": "Le Réseau (F12) montre un 422. Où chercher ?", "options": ["Dans le hook React", "Dans les données envoyées et les contraintes du DTO d'entrée", "Dans le repository", "Dans le CSS"], "answer": 1, "why": "422 = validation du DTO refusée : compare le corps envoyé et les contraintes."}, {"q": "Le Réseau montre 201 avec le bon JSON, mais l'écran ne change pas. Où chercher ?", "options": ["Dans le service Symfony", "Dans le hook / composant React : le state n'est pas mis à jour", "Dans la base", "Dans le DTO"], "answer": 1, "why": "Le serveur a fait son travail ; le problème est après la réponse."}, {"q": "Quel est l'équivalent front du service Symfony ?", "options": ["Le composant", "Le hook (logique)", "Le CSS", "axios"], "answer": 1, "why": "Composant ↔ contrôleur, hook ↔ service, api ↔ repository."}], "td": {"title": "Fonctionnalité complète : noter un livre", "enonce": "Un membre peut donner une note de 1 à 5 à un livre qu'il a emprunté. Écris chaque pièce, du front au back.", "consignes": ["Back : DTO `NoteInput` (note 1–5, commentaire optionnel ≤ 300 caractères)", "Back : entité `Note`, service `NoteService::noter()` (refuse si le membre n'a jamais emprunté le livre → 403 via exception métier), contrôleur `POST /api/livres/{id}/notes`", "Back : DTO `NoteOutput`", "Front : `api/notes.ts`, un hook ou une mutation TanStack Query, un composant avec 5 boutons", "Écris en commentaire le trajet complet, étape par étape"], "starter": {"lang": "plaintext", "code": "BACK\n  src/Dto/NoteInput.php\n  src/Dto/NoteOutput.php\n  src/Entity/Note.php\n  src/Exception/PasEmprunte.php\n  src/Service/NoteService.php\n  src/Controller/NoteController.php\n\nFRONT\n  src/api/notes.ts\n  src/components/NoterLivre.tsx\n\nTrajet :\n  1. ..."}, "hints": ["Le service a besoin d'`EmpruntRepository` pour vérifier qu'il existe au moins un emprunt du livre par ce membre.", "Côté React, `useMutation({ mutationFn: (note) => noterLivre(livreId, note) })` et un `onSuccess` qui invalide `['livres', livreId]`."], "solution": {"lang": "php", "code": "// ---------- BACK ----------\nfinal class NoteInput\n{\n    public function __construct(\n        #[Assert\\Range(min: 1, max: 5)]\n        public readonly int $note = 0,\n        #[Assert\\Length(max: 300)]\n        public readonly ?string $commentaire = null,\n    ) {}\n}\n\n#[WithHttpStatus(403)]\nfinal class PasEmprunte extends \\DomainException {}\n\nfinal class NoteService\n{\n    public function __construct(\n        private EmpruntRepository $emprunts,\n        private EntityManagerInterface $em,\n    ) {}\n\n    public function noter(Livre $livre, User $membre, NoteInput $in): Note\n    {\n        if (!$this->emprunts->aDejaEmprunte($membre, $livre)) {\n            throw new PasEmprunte('Tu dois avoir emprunté ce livre pour le noter');\n        }\n        $note = new Note($livre, $membre, $in->note, $in->commentaire);\n        $this->em->persist($note);\n        $this->em->flush();\n        return $note;\n    }\n}\n\n#[Route('/api/livres/{id}/notes', methods: ['POST'])]\npublic function noter(\n    Livre $livre,\n    #[MapRequestPayload] NoteInput $input,\n    #[CurrentUser] User $membre,\n    NoteService $notes,\n): JsonResponse {\n    return $this->json(NoteOutput::fromEntity($notes->noter($livre, $membre, $input)), 201);\n}\n\n// ---------- FRONT (TypeScript) ----------\n// api/notes.ts\n// export type NoteOutput = { id: number; note: number; commentaire: string | null };\n// export const noterLivre = (livreId: number, body: { note: number; commentaire?: string }) =>\n//   api.post<NoteOutput>(`/livres/${livreId}/notes`, body).then((r) => r.data);\n//\n// components/NoterLivre.tsx\n// const qc = useQueryClient();\n// const noter = useMutation({\n//   mutationFn: (note: number) => noterLivre(livreId, { note }),\n//   onSuccess: () => qc.invalidateQueries({ queryKey: ['livres', livreId] }),\n// });\n// {[1, 2, 3, 4, 5].map((n) => (\n//   <button key={n} onClick={() => noter.mutate(n)} disabled={noter.isPending}>{n}<\/button>\n// ))}\n// {axios.isAxiosError(noter.error) && noter.error.response?.status === 403 && <p>Emprunte-le d'abord<\/p>}\n\n// ---------- TRAJET ----------\n// clic \"4\" -> mutation -> noterLivre -> axios POST /api/livres/7/notes {\"note\":4}\n// -> route -> NoteController -> NoteInput validé -> NoteService::noter\n// -> EmpruntRepository::aDejaEmprunte -> new Note -> flush\n// -> NoteOutput -> JSON 201 -> onSuccess -> invalidation -> React recharge et redessine"}, "checks": ["Chaque pièce n'a qu'un rôle", "Tu sais dire, pour un 403, un 422 et un 201 sans changement d'écran, où chercher"]}}, {"id": "ddd-langage", "track": "ddd", "title": "Langage commun & bounded contexts", "minutes": 15, "goal": "Découper un domaine en contextes où chaque mot a un sens précis.", "why": "Dans une même entreprise, « Client » ne veut pas dire la même chose pour la compta et pour le support. Un seul modèle pour tout devient un monstre.", "flow": ["On parle avec les **experts métier**", "On fixe un **vocabulaire commun**, que le code reprend tel quel", "On repère où un même mot **change de sens**", "Chaque sens = un **bounded context** avec son propre modèle"], "points": ["Langage ubiquitaire : si le métier dit « valider une commande », le code a `$commande->valider()`, pas `setStatus(2)`.", "Un bounded context a ses propres classes. Le `Produit` du Catalogue (description, photos) n'est pas celui de l'Entrepôt (poids, emplacement).", "Les contextes communiquent par **identifiants** et **événements**, pas en partageant leurs entités.", "En code : souvent un dossier par contexte (`src/Catalogue`, `src/Facturation`)."], "pitfalls": ["Une seule entité `User` de 60 champs utilisée partout.", "Des noms techniques (`OrderManager`, `DataProcessor`) au lieu des mots du métier."], "example": {"lang": "plaintext", "code": "Domaine : boutique en ligne\n\nCATALOGUE               COMMANDE                LIVRAISON\n- Produit               - Commande              - Colis\n  nom, description,       lignes, total,          adresse, poids,\n  photos, prix affiché    statut                  transporteur, suivi\n- Catégorie             - Client (qui paie)     - Destinataire (qui reçoit)\n\nUne même personne réelle :\n  dans Commande  -> \"Client\"\n  dans Livraison -> \"Destinataire\"\n\nLiens entre contextes : produitId, commandeId\nÉvénement : CommandePayee  ->  Livraison crée un Colis", "notes": ["Chaque colonne est un contexte avec son vocabulaire.", "« Client » et « Destinataire » peuvent être la même personne, mais pas le même modèle.", "Les contextes ne se partagent que des ids et des événements."]}, "quiz": [{"q": "Dans le contexte Livraison, que doit contenir `Produit` ?", "options": ["Tout ce que contient le Catalogue", "Seulement ce dont la livraison a besoin (poids, dimensions…)", "Rien : on réutilise l'entité du Catalogue", "Les photos"], "answer": 1, "why": "Chaque contexte ne modélise que ce qui lui est utile."}, {"q": "Le métier dit « annuler une réservation ». Quel code respecte le langage commun ?", "options": ["`$r->setEtat(3)`", "`$r->annuler()`", "`ReservationManager::update($r)`", "`$r->etat = 'X'`"], "answer": 1, "why": "Le code reprend les verbes du métier."}, {"q": "Comment deux contextes se référencent-ils ?", "options": ["En partageant les entités Doctrine", "Par identifiants et événements", "Par héritage", "Avec une table commune"], "answer": 1, "why": "Ça garde chaque contexte libre d'évoluer."}], "td": {"title": "Découper une salle de sport", "enonce": "Une salle de sport gère : abonnements et paiements, planning des cours, réservation de places, accès par badge. Exercice d'analyse, sans code.", "consignes": ["Liste 3 ou 4 bounded contexts", "Pour chacun, écris 3 à 5 mots de son langage", "Trouve un mot qui change de sens selon le contexte", "Décris un événement qui passe d'un contexte à un autre"], "starter": {"lang": "plaintext", "code": "Contexte 1 : ...\n  mots : ...\n\nContexte 2 : ...\n  mots : ...\n\nMot qui change de sens : ...\n\nÉvénement : ... -> ..."}, "hints": ["Pense à qui utilise chaque partie : la compta, le coach, l'accueil, la porte d'entrée.", "« Membre » ne contient pas les mêmes infos pour la facturation et pour le contrôle d'accès."], "solution": {"lang": "plaintext", "code": "ABONNEMENT (compta)\n  mots : Abonné, Formule, Échéance, Prélèvement, Suspension\n\nPLANNING (coachs)\n  mots : Cours, Créneau, Coach, Salle, Capacité\n\nRÉSERVATION (membres)\n  mots : Réservation, Place, Liste d'attente, Annulation\n\nACCÈS (porte d'entrée)\n  mots : Badge, Passage, Autorisation, Horaire d'ouverture\n\nMot qui change de sens : \"Membre\"\n  Abonnement : qui paie, IBAN, formule\n  Accès      : un numéro de badge + autorisé oui/non\n\nÉvénement : AbonnementSuspendu (Abonnement) -> Accès bloque le badge\n            CoursAnnule (Planning) -> Réservation prévient les inscrits"}, "checks": ["Chaque contexte a un vocabulaire distinct", "Tu as au moins un événement entre deux contextes"]}}, {"id": "ddd-vo", "track": "ddd", "title": "Value Objects", "minutes": 15, "goal": "Remplacer les types primitifs par des objets qui portent les règles.", "why": "Un `float $prix` accepte -12 et ne connaît pas sa devise. Un `Money` refuse les valeurs absurdes et sait s'additionner.", "flow": ["Un concept métier **sans identité propre** (montant, email, période)", "devient une **classe immuable**", "qui se **valide** à la création", "Deux VO sont **égaux si leurs valeurs** sont égales"], "points": ["Immuable : aucune méthode ne modifie l'objet, elle en **renvoie un nouveau**.", "Pas d'identité : deux billets de 10 € sont interchangeables.", "Le VO attire le comportement : `$prix->appliquerRemise(10)` plutôt qu'un calcul recopié partout.", "Avec Doctrine : `#[ORM\\Embeddable]` sur le VO + `#[ORM\\Embedded]` dans l'entité pour le stocker dans ses colonnes."], "pitfalls": ["Des setters sur un VO.", "Comparer avec `===` (même instance) au lieu d'une méthode `equals()`."], "example": {"lang": "php", "code": "final class Money\n{\n    private function __construct(\n        public readonly int $centimes,\n        public readonly string $devise,\n    ) {\n        if ($centimes < 0) {\n            throw new InvalidArgumentException('Montant négatif');\n        }\n    }\n\n    public static function eur(int $centimes): self\n    {\n        return new self($centimes, 'EUR');\n    }\n\n    public function plus(Money $autre): self\n    {\n        if ($autre->devise !== $this->devise) {\n            throw new LogicException('Devises différentes');\n        }\n        return new self($this->centimes + $autre->centimes, $this->devise);\n    }\n\n    public function multiplier(int $n): self\n    {\n        return new self($this->centimes * $n, $this->devise);\n    }\n\n    public function equals(Money $autre): bool\n    {\n        return $this->centimes === $autre->centimes\n            && $this->devise === $autre->devise;\n    }\n}\n\n$total = Money::eur(1999)->multiplier(2)->plus(Money::eur(500)); // 44,98 €", "notes": ["Constructeur privé + `Money::eur()` : une création lisible.", "`plus()` renvoie un nouvel objet : l'original n'est jamais modifié.", "La règle « même devise » est écrite une seule fois."]}, "quiz": [{"q": "Qu'est-ce qui distingue un value object d'une entité ?", "options": ["Il est stocké en base", "Il n'a pas d'identité : il est défini par ses valeurs", "Il a plus de méthodes", "C'est toujours une interface"], "answer": 1, "why": "Deux `Money::eur(100)` sont interchangeables ; deux commandes identiques ne le sont pas."}, {"q": "`$a = Money::eur(100); $b = $a->plus(Money::eur(50));` Combien vaut `$a` ?", "options": ["150", "100", "50", "Erreur"], "answer": 1, "why": "Immuable : `$a` reste à 100, `$b` vaut 150."}, {"q": "Comment comparer deux `Money` ?", "options": ["`$a === $b`", "`$a->equals($b)`", "`$a == null`", "`spl_object_id`"], "answer": 1, "why": "`===` compare les instances, pas les valeurs."}], "td": {"title": "Période de réservation", "enonce": "Crée un value object `Periode` pour un système de réservation.", "consignes": ["`debut` et `fin` (`DateTimeImmutable`), immuables", "Exception si `fin` ≤ `debut`", "`dureeEnMinutes(): int`", "`chevauche(Periode $autre): bool`", "`equals(Periode $autre): bool`"], "starter": {"lang": "php", "code": "final class Periode\n{\n    // à toi\n}\n\n$a = new Periode(new DateTimeImmutable('2026-03-01 10:00'), new DateTimeImmutable('2026-03-01 11:00'));\n$b = new Periode(new DateTimeImmutable('2026-03-01 10:30'), new DateTimeImmutable('2026-03-01 12:00'));\nvar_dump($a->chevauche($b)); // true\necho $a->dureeEnMinutes();   // 60"}, "hints": ["Deux périodes se chevauchent si `$a->debut < $b->fin && $b->debut < $a->fin`.", "Durée : `intdiv($fin->getTimestamp() - $debut->getTimestamp(), 60)`.", "`DateTimeImmutable` se compare avec `<`, `>`, `==`."], "solution": {"lang": "php", "code": "final class Periode\n{\n    public function __construct(\n        public readonly DateTimeImmutable $debut,\n        public readonly DateTimeImmutable $fin,\n    ) {\n        if ($fin <= $debut) {\n            throw new InvalidArgumentException('La fin doit être après le début');\n        }\n    }\n\n    public function dureeEnMinutes(): int\n    {\n        return intdiv($this->fin->getTimestamp() - $this->debut->getTimestamp(), 60);\n    }\n\n    public function chevauche(Periode $autre): bool\n    {\n        return $this->debut < $autre->fin && $autre->debut < $this->fin;\n    }\n\n    public function equals(Periode $autre): bool\n    {\n        return $this->debut == $autre->debut && $this->fin == $autre->fin;\n    }\n}"}, "checks": ["[10h–11h] et [11h–12h] ne se chevauchent pas", "Aucune méthode ne modifie `debut` ou `fin`"]}}, {"id": "ddd-entite", "track": "ddd", "title": "Entités riches", "minutes": 15, "goal": "Mettre les règles métier dans l'entité plutôt que dans des services qui appellent des setters.", "why": "Avec un modèle « anémique » (que des getters et setters), les règles sont dispersées et n'importe qui peut mettre l'objet dans un état impossible.", "flow": ["L'entité a une **identité** stable (un id)", "Son état change via des **méthodes métier** (`confirmer()`, `annuler()`)", "Chaque méthode **vérifie** que le changement est permis", "Les services **orchestrent**, l'entité **décide**"], "points": ["Identité : deux commandes au contenu identique restent deux commandes différentes.", "Un id typé (`CommandeId`, un VO) empêche de passer un `ClientId` là où on attend un `CommandeId`.", "Générer l'id dans le domaine (UUID) permet de le connaître avant d'écrire en base.", "Une `enum` PHP rend explicites les statuts possibles."], "pitfalls": ["`setStatut()` public : n'importe qui passe de « annulée » à « expédiée ».", "Un `CommandeService` de 800 lignes qui contient toutes les règles."], "example": {"lang": "php", "code": "enum Statut: string\n{\n    case Brouillon = 'brouillon';\n    case Confirmee = 'confirmee';\n    case Annulee = 'annulee';\n}\n\nfinal class Commande\n{\n    private Statut $statut = Statut::Brouillon;\n    private array $lignes = [];\n\n    public function __construct(public readonly CommandeId $id) {}\n\n    public function ajouterLigne(string $produitId, int $quantite): void\n    {\n        $this->exigerStatut(Statut::Brouillon);\n        $this->lignes[] = ['produit' => $produitId, 'quantite' => $quantite];\n    }\n\n    public function confirmer(): void\n    {\n        $this->exigerStatut(Statut::Brouillon);\n        if ($this->lignes === []) {\n            throw new DomainException('Commande vide');\n        }\n        $this->statut = Statut::Confirmee;\n    }\n\n    public function annuler(): void\n    {\n        if ($this->statut === Statut::Annulee) {\n            return; // déjà annulée : rien à faire\n        }\n        $this->statut = Statut::Annulee;\n    }\n\n    private function exigerStatut(Statut $attendu): void\n    {\n        if ($this->statut !== $attendu) {\n            throw new DomainException(\"Impossible : commande {$this->statut->value}\");\n        }\n    }\n}", "notes": ["Aucun setter : seules les méthodes métier changent l'état.", "`exigerStatut()` centralise la règle « seulement en brouillon ».", "`annuler()` deux fois ne casse rien (idempotent)."]}, "quiz": [{"q": "Qu'est-ce qu'un modèle anémique ?", "options": ["Un modèle sans base de données", "Des entités avec seulement getters/setters, la logique est ailleurs", "Un modèle avec trop de méthodes", "Un value object"], "answer": 1, "why": "L'objet ne protège plus ses propres règles."}, {"q": "Qui doit refuser de confirmer une commande vide ?", "options": ["Le contrôleur", "La base de données", "L'entité `Commande` elle-même", "Le template"], "answer": 2, "why": "La règle vit là où se trouvent les données qu'elle protège."}, {"q": "Avantage d'un `CommandeId` typé plutôt qu'un `string` ?", "options": ["Plus rapide", "PHP et l'IDE empêchent de le confondre avec un autre id", "Obligatoire pour Doctrine", "Aucun"], "answer": 1, "why": "Une erreur de paramètre devient une erreur de type."}], "td": {"title": "Abonnement de salle de sport", "enonce": "Transforme ce modèle anémique en entité riche.", "consignes": ["Statut en `enum`", "`suspendre()` : seulement si actif, 2 suspensions max par abonnement", "`reactiver()` : seulement si suspendu", "`resilier(DateTimeImmutable $le)` : impossible si déjà résilié, fixe `finLe`", "Plus aucune propriété publique modifiable"], "starter": {"lang": "php", "code": "class Abonnement\n{\n    public string $id;\n    public string $statut;   // 'actif', 'suspendu', 'resilie'\n    public ?DateTimeImmutable $finLe = null;\n    public int $suspensionsUtilisees = 0;\n}\n\n// dans un service...\n$abo->statut = 'suspendu';\n$abo->suspensionsUtilisees++;"}, "hints": ["Commence par l'enum `StatutAbonnement` avec 3 cas.", "Une méthode privée `exiger(StatutAbonnement $s)` évite de répéter les vérifications.", "La limite de 2 se vérifie avant d'incrémenter."], "solution": {"lang": "php", "code": "enum StatutAbonnement\n{\n    case Actif;\n    case Suspendu;\n    case Resilie;\n}\n\nfinal class Abonnement\n{\n    private const MAX_SUSPENSIONS = 2;\n\n    private StatutAbonnement $statut = StatutAbonnement::Actif;\n    private ?DateTimeImmutable $finLe = null;\n    private int $suspensions = 0;\n\n    public function __construct(public readonly AbonnementId $id) {}\n\n    public function suspendre(): void\n    {\n        $this->exiger(StatutAbonnement::Actif);\n        if ($this->suspensions >= self::MAX_SUSPENSIONS) {\n            throw new DomainException('Nombre maximum de suspensions atteint');\n        }\n        $this->suspensions++;\n        $this->statut = StatutAbonnement::Suspendu;\n    }\n\n    public function reactiver(): void\n    {\n        $this->exiger(StatutAbonnement::Suspendu);\n        $this->statut = StatutAbonnement::Actif;\n    }\n\n    public function resilier(DateTimeImmutable $le): void\n    {\n        if ($this->statut === StatutAbonnement::Resilie) {\n            throw new DomainException('Déjà résilié');\n        }\n        $this->statut = StatutAbonnement::Resilie;\n        $this->finLe = $le;\n    }\n\n    public function statut(): StatutAbonnement\n    {\n        return $this->statut;\n    }\n\n    private function exiger(StatutAbonnement $attendu): void\n    {\n        if ($this->statut !== $attendu) {\n            throw new DomainException('Action impossible dans ce statut');\n        }\n    }\n}"}, "checks": ["Une 3e suspension lève une exception", "Impossible de réactiver un abonnement résilié"]}}, {"id": "ddd-agregat", "track": "ddd", "title": "Agrégats & invariants", "minutes": 18, "goal": "Savoir quels objets modifier ensemble, et par où passer.", "why": "Si on modifie une ligne de commande directement, la règle « 10 produits maximum » de la commande peut être contournée.", "flow": ["Un **agrégat** = un groupe d'objets qui doivent rester cohérents ensemble", "Une seule porte d'entrée : la **racine** (aggregate root)", "La racine **protège les règles** du groupe entier", "On sauvegarde **un agrégat par transaction** et on référence les autres **par id**"], "points": ["Exemple : `Commande` (racine) + ses `LigneCommande`. On ne touche jamais une ligne sans passer par la commande.", "Un repository **par racine** seulement : pas de `LigneCommandeRepository`.", "Garde les agrégats **petits** : `Commande` référence le client par `ClientId`, pas par l'objet `Client`.", "Une règle qui touche plusieurs agrégats se gère par **événements** (cohérence à terme)."], "pitfalls": ["Un agrégat géant (Client → Commandes → Lignes → Produits) : lent et plein de conflits.", "Exposer une collection modifiable : `getLignes()->add(...)` contourne la racine."], "example": {"lang": "php", "code": "final class Commande\n{\n    private const MAX_LIGNES = 10;\n\n    /** @var LigneCommande[] */\n    private array $lignes = [];\n\n    public function __construct(\n        public readonly CommandeId $id,\n        public readonly ClientId $clientId,   // référence par id\n    ) {}\n\n    public function ajouter(ProduitId $produit, int $quantite, Money $prixUnitaire): void\n    {\n        foreach ($this->lignes as $ligne) {\n            if ($ligne->produit->equals($produit)) {\n                $ligne->augmenter($quantite);\n                return;\n            }\n        }\n        if (count($this->lignes) >= self::MAX_LIGNES) {\n            throw new DomainException('10 produits différents maximum');\n        }\n        $this->lignes[] = new LigneCommande($produit, $quantite, $prixUnitaire);\n    }\n\n    public function total(): Money\n    {\n        return array_reduce(\n            $this->lignes,\n            fn(Money $t, LigneCommande $l) => $t->plus($l->sousTotal()),\n            Money::eur(0),\n        );\n    }\n}", "notes": ["Toute modification passe par `Commande::ajouter()`.", "La règle des 10 lignes est vérifiée à un seul endroit.", "`ClientId` plutôt que `Client` : la commande ne charge pas le client entier."]}, "quiz": [{"q": "Par où modifier une `LigneCommande` ?", "options": ["Directement via son repository", "Via la racine `Commande`", "Via du SQL", "Via le contrôleur"], "answer": 1, "why": "Seule la racine peut garantir les règles du groupe."}, {"q": "Pourquoi `Commande` garde `ClientId` et pas l'objet `Client` ?", "options": ["Pour économiser de la mémoire", "Pour garder l'agrégat petit et indépendant", "Doctrine ne gère pas les objets", "Par convention de nommage"], "answer": 1, "why": "Client et Commande sont deux agrégats, modifiés dans des transactions séparées."}, {"q": "Combien de repositories pour l'agrégat Commande + Lignes ?", "options": ["Deux", "Un, pour la racine", "Aucun", "Un par ligne"], "answer": 1, "why": "On charge et sauvegarde l'agrégat entier par sa racine."}], "td": {"title": "Panier avec règles", "enonce": "Modélise l'agrégat `Panier` d'une boutique (réutilise `Money` du module Value Objects).", "consignes": ["Racine `Panier` (id `PanierId`, `ClientId`), lignes internes", "Ajouter un produit déjà présent augmente sa quantité", "Quantité par ligne entre 1 et 20", "Total ≤ 1 000 € (sinon exception, et le panier reste inchangé)", "`retirer(ProduitId)` et `total(): Money`", "Aucun accès en écriture aux lignes depuis l'extérieur"], "starter": {"lang": "php", "code": "final class Panier\n{\n    // à toi\n}\n\nfinal class LignePanier\n{\n    // à toi\n}"}, "hints": ["Pour « le panier reste inchangé », calcule le futur total AVANT de modifier quoi que ce soit.", "Indexe les lignes par id produit : `$this->lignes[(string) $produit] = ...`", "`LignePanier` peut être immuable : `avecQuantite(int $q): self`."], "solution": {"lang": "php", "code": "final class LignePanier\n{\n    public function __construct(\n        public readonly ProduitId $produit,\n        public readonly int $quantite,\n        public readonly Money $prixUnitaire,\n    ) {\n        if ($quantite < 1 || $quantite > 20) {\n            throw new DomainException('Quantité entre 1 et 20');\n        }\n    }\n\n    public function avecQuantite(int $q): self\n    {\n        return new self($this->produit, $q, $this->prixUnitaire);\n    }\n\n    public function sousTotal(): Money\n    {\n        return $this->prixUnitaire->multiplier($this->quantite);\n    }\n}\n\nfinal class Panier\n{\n    private const PLAFOND = 100000; // centimes\n\n    /** @var array<string, LignePanier> */\n    private array $lignes = [];\n\n    public function __construct(\n        public readonly PanierId $id,\n        public readonly ClientId $clientId,\n    ) {}\n\n    public function ajouter(ProduitId $produit, int $quantite, Money $prix): void\n    {\n        $cle = (string) $produit;\n        $nouvelle = isset($this->lignes[$cle])\n            ? $this->lignes[$cle]->avecQuantite($this->lignes[$cle]->quantite + $quantite)\n            : new LignePanier($produit, $quantite, $prix);\n\n        $lignes = $this->lignes;\n        $lignes[$cle] = $nouvelle;\n        if ($this->totalDe($lignes)->centimes > self::PLAFOND) {\n            throw new DomainException('Panier limité à 1 000 €');\n        }\n        $this->lignes = $lignes;\n    }\n\n    public function retirer(ProduitId $produit): void\n    {\n        unset($this->lignes[(string) $produit]);\n    }\n\n    public function total(): Money\n    {\n        return $this->totalDe($this->lignes);\n    }\n\n    private function totalDe(array $lignes): Money\n    {\n        return array_reduce($lignes, fn(Money $t, LignePanier $l) => $t->plus($l->sousTotal()), Money::eur(0));\n    }\n}"}, "checks": ["Un ajout qui dépasse 1 000 € laisse le panier intact", "21 unités d'un même produit sont refusées"]}}, {"id": "ddd-couches", "track": "ddd", "title": "Couches & repositories", "minutes": 18, "goal": "Séparer domaine, application et infrastructure, et brancher Doctrine sans polluer le domaine.", "why": "Si ton domaine dépend de Doctrine, de Symfony ou de HTTP, tu ne peux plus le tester ni le faire évoluer seul.", "flow": ["**Domain** : entités, VO, interfaces de repository, sans dépendance technique", "**Application** : les cas d'usage (handlers) qui orchestrent le domaine", "**Infrastructure** : Doctrine, API, mail, qui **implémentent** les interfaces", "Les dépendances pointent **vers le domaine**, jamais l'inverse"], "points": ["L'interface `CommandeRepository` vit dans Domain ; `DoctrineCommandeRepository` vit dans Infrastructure.", "Un handler = un cas d'usage : charger, appeler une méthode métier, sauvegarder.", "Le contrôleur ne fait que traduire HTTP → appel du handler → réponse.", "Symfony relie automatiquement l'interface à son implémentation s'il n'y en a qu'une."], "pitfalls": ["Utiliser `EntityManagerInterface` dans une entité.", "Un handler qui contient les règles métier : elles doivent être dans le domaine."], "example": {"lang": "php", "code": "// src/Commande/Domain/CommandeRepository.php\nnamespace App\\Commande\\Domain;\n\ninterface CommandeRepository\n{\n    public function get(CommandeId $id): Commande;   // exception si absente\n    public function save(Commande $commande): void;\n}\n\n// src/Commande/Application/ConfirmerCommandeHandler.php\nnamespace App\\Commande\\Application;\n\nfinal class ConfirmerCommandeHandler\n{\n    public function __construct(private CommandeRepository $commandes) {}\n\n    public function __invoke(string $commandeId): void\n    {\n        $commande = $this->commandes->get(new CommandeId($commandeId));\n        $commande->confirmer();          // la règle est dans le domaine\n        $this->commandes->save($commande);\n    }\n}\n\n// src/Commande/Infrastructure/DoctrineCommandeRepository.php\nnamespace App\\Commande\\Infrastructure;\n\nfinal class DoctrineCommandeRepository implements CommandeRepository\n{\n    public function __construct(private EntityManagerInterface $em) {}\n\n    public function get(CommandeId $id): Commande\n    {\n        return $this->em->find(Commande::class, $id->valeur)\n            ?? throw new CommandeIntrouvable($id);\n    }\n\n    public function save(Commande $commande): void\n    {\n        $this->em->persist($commande);\n        $this->em->flush();\n    }\n}", "notes": ["Les `use` sont omis pour la lisibilité.", "Le handler ne connaît que l'interface : en test, on lui passe une version en mémoire.", "Doctrine n'apparaît que dans Infrastructure."]}, "quiz": [{"q": "Où vit l'interface `CommandeRepository` ?", "options": ["Infrastructure", "Domain", "Controller", "vendor"], "answer": 1, "why": "Le domaine définit le besoin, l'infrastructure le réalise."}, {"q": "Que fait un handler applicatif ?", "options": ["Il contient les règles métier", "Il charge l'agrégat, appelle une méthode métier, sauvegarde", "Il rend le HTML", "Il mappe les tables"], "answer": 1, "why": "Il orchestre ; le domaine décide."}, {"q": "Quelle dépendance est interdite ?", "options": ["Infrastructure → Domain", "Application → Domain", "Domain → Doctrine", "Controller → Application"], "answer": 2, "why": "Le domaine ne dépend de rien de technique."}], "td": {"title": "Réserver un cours", "enonce": "Salle de sport : un membre réserve une place dans un cours.", "consignes": ["Domain : agrégat `Cours` (capacité, liste des `MembreId` inscrits), `reserver(MembreId)` refuse si complet ou déjà inscrit", "Domain : interface `CoursRepository` (`get`, `save`)", "Application : `ReserverPlaceHandler`", "Infrastructure : `InMemoryCoursRepository` (Doctrine en bonus)", "Test : 2 places, 3 réservations → la 3e échoue"], "starter": {"lang": "plaintext", "code": "src/Reservation/\n├── Domain/\n│   ├── Cours.php\n│   ├── CoursId.php\n│   ├── MembreId.php\n│   └── CoursRepository.php\n├── Application/\n│   └── ReserverPlaceHandler.php\n└── Infrastructure/\n    └── InMemoryCoursRepository.php"}, "hints": ["`MembreId` peut avoir une méthode `equals()` ; garde les inscrits indexés par leur valeur.", "`InMemoryCoursRepository` : un simple tableau `[id => Cours]`.", "Le handler ne contient aucun `if` métier."], "solution": {"lang": "php", "code": "// Domain\nfinal class Cours\n{\n    /** @var array<string, MembreId> */\n    private array $inscrits = [];\n\n    public function __construct(public readonly CoursId $id, private int $capacite) {}\n\n    public function reserver(MembreId $membre): void\n    {\n        if (isset($this->inscrits[$membre->valeur])) {\n            throw new DomainException('Déjà inscrit');\n        }\n        if (count($this->inscrits) >= $this->capacite) {\n            throw new DomainException('Cours complet');\n        }\n        $this->inscrits[$membre->valeur] = $membre;\n    }\n}\n\ninterface CoursRepository\n{\n    public function get(CoursId $id): Cours;\n    public function save(Cours $cours): void;\n}\n\n// Application\nfinal class ReserverPlaceHandler\n{\n    public function __construct(private CoursRepository $cours) {}\n\n    public function __invoke(string $coursId, string $membreId): void\n    {\n        $cours = $this->cours->get(new CoursId($coursId));\n        $cours->reserver(new MembreId($membreId));\n        $this->cours->save($cours);\n    }\n}\n\n// Infrastructure\nfinal class InMemoryCoursRepository implements CoursRepository\n{\n    private array $items = [];\n\n    public function get(CoursId $id): Cours\n    {\n        return $this->items[$id->valeur] ?? throw new RuntimeException('Cours introuvable');\n    }\n\n    public function save(Cours $cours): void\n    {\n        $this->items[$cours->id->valeur] = $cours;\n    }\n}\n\n// Test\n$repo = new InMemoryCoursRepository();\n$repo->save(new Cours(new CoursId('yoga'), 2));\n$reserver = new ReserverPlaceHandler($repo);\n$reserver('yoga', 'ana');\n$reserver('yoga', 'leo');\ntry {\n    $reserver('yoga', 'zoe');\n    echo 'ERREUR : la 3e réservation aurait dû échouer';\n} catch (DomainException $e) {\n    echo 'OK : ' . $e->getMessage(); // OK : Cours complet\n}"}, "checks": ["Domain ne contient aucun `use Doctrine\\...`", "Le test tourne sans base de données"]}}, {"id": "react-composants", "track": "react", "title": "Composants, JSX & props", "minutes": 15, "goal": "Comprendre ce qu'est un composant et comment les données y entrent.", "why": "Sans composants, l'interface est un gros bloc de HTML à mettre à jour à la main. React la découpe en fonctions réutilisables.", "flow": ["Un **composant** est une fonction qui renvoie du JSX", "Le parent lui passe des **props** (ses paramètres)", "React **appelle** la fonction et obtient une desc
