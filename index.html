     4. envoyer la branche\n  -> GitHub : \"Compare & pull request\"        5. ouvrir la PR (description, captures)\n  -> relecture, CI verte, corrections         6. nouveaux commits = la PR se met à jour\n  -> \"Squash and merge\"                       7. fusion dans main\n  git switch main && git pull                 8. récupérer main à jour\n  git branch -d feat/export-pdf               9. supprimer la branche locale", "notes": ["`fetch` est toujours sans risque : il ne modifie pas tes branches.", "Pousser de nouveaux commits sur la branche met la PR à jour automatiquement.", "Nomme tes branches comme tes commits : `feat/…`, `fix/…`, `chore/…`."]}, "quiz": [{"q": "Différence entre `git fetch` et `git pull` ?", "options": ["Aucune", "fetch télécharge sans modifier ta branche ; pull télécharge ET fusionne", "fetch envoie, pull reçoit", "pull est plus sûr"], "answer": 1, "why": "pull = fetch + merge (ou rebase avec --rebase)."}, {"q": "Ton push est refusé car la branche distante a des commits que tu n'as pas. Que faire ?", "options": ["git push --force", "git pull --rebase puis git push", "Supprimer le dépôt", "git reset --hard"], "answer": 1, "why": "Intègre d'abord le travail des autres. --force effacerait leurs commits."}, {"q": "« Squash and merge » sur une PR de 6 commits donne…", "options": ["6 commits sur main", "1 seul commit sur main", "un merge commit + 6 commits", "rien"], "answer": 1, "why": "Utile pour garder un main lisible, une ligne par fonctionnalité."}], "td": {"title": "Ta première Pull Request propre", "enonce": "Publie le dashboard (ou un petit projet) sur GitHub en suivant le workflow complet.", "consignes": ["Crée un dépôt sur GitHub et relie-le (`git remote add origin …`)", "Pousse `main` avec un premier commit `chore: initialise le projet`", "Crée `feat/readme`, ajoute un README en 2 commits, pousse, ouvre une PR", "Fusionne avec « Squash and merge » ; récupère `main` en local ; supprime la branche", "Bonus : active GitHub Pages pour héberger `index.html`"], "starter": {"lang": "bash", "code": "git init -b main\ngit add .\ngit commit -m \"chore: initialise le projet\"\ngit remote add origin https://github.com/<ton-pseudo>/atelier-de-code.git\n# à toi"}, "hints": ["Ajoute un `.gitignore` avant le premier commit si tu as des dossiers générés.", "Après le squash, ta branche locale a des commits « différents » de main : `git branch -D` (D majuscule) est nécessaire pour la supprimer."], "solution": {"lang": "bash", "code": "git push -u origin main\n\ngit switch -c feat/readme\necho \"# Atelier de code\" > README.md && git add . && git commit -m \"docs: ajoute le titre du README\"\necho \"Dashboard pour apprendre.\" >> README.md && git commit -am \"docs: décrit le projet\"\ngit push -u origin feat/readme\n# GitHub : \"Compare & pull request\" -> description -> Create\n# Puis \"Squash and merge\" -> message : docs: ajoute le README\n\ngit switch main\ngit pull\ngit branch -D feat/readme           # -D car le squash a créé un commit différent\ngit push origin --delete feat/readme  # si GitHub ne l'a pas déjà supprimée\n\n# Bonus : Settings > Pages > Deploy from a branch > main / (root)"}, "checks": ["`main` sur GitHub contient un seul commit pour le README", "`git log --oneline --graph --all` ne montre plus la branche"]}}, {"id": "git-outils", "track": "git", "title": "Outils du quotidien : stash, cherry-pick, tags, bisect", "minutes": 15, "goal": "Connaître les commandes qui sauvent la mise au quotidien.", "why": "Tu es au milieu d'une tâche et on te demande un correctif urgent ; tu as besoin d'un seul commit d'une autre branche ; un bug est apparu « quelque part dans les 50 derniers commits ». Chaque situation a son outil.", "flow": ["**`stash`** : mettre de côté ton travail en cours, sans commit, pour changer de branche", "**`cherry-pick`** : copier **un** commit précis d'une autre branche sur la tienne", "**`tag`** : poser une étiquette **fixe** sur une version (`v1.2.0`)", "**`bisect`** : trouver le commit qui a introduit un bug, par recherche dichotomique"], "points": ["`git stash` met de côté, `git stash pop` récupère. `git stash -u` inclut les nouveaux fichiers. `git stash list` pour voir la pile.", "`git cherry-pick <id>` crée un nouveau commit avec les mêmes changements (comme un mini-rebase d'un seul commit).", "Un tag ne bouge pas, contrairement à une branche. `git tag -a v1.0.0 -m \"…\"` puis `git push origin v1.0.0`. Versions : MAJEUR.MINEUR.CORRECTIF (semver).", "`git bisect` : tu dis un commit « bon » et un « mauvais », Git te place au milieu, tu testes, tu réponds `good`/`bad`… En 6 étapes, il trouve le coupable parmi 50 commits.", "`git blame fichier` : qui a modifié chaque ligne, et dans quel commit (pour comprendre **pourquoi**, pas pour accuser)."], "pitfalls": ["Accumuler des stash oubliés : préfère un commit `wip` sur ta branche, que tu nettoieras au rebase.", "Cherry-picker beaucoup de commits entre branches : signe qu'il fallait plutôt fusionner."], "example": {"lang": "bash", "code": "# Correctif urgent en plein travail\ngit stash -u                         # mon travail est mis de côté\ngit switch main && git pull\ngit switch -c fix/paiement\n# ... correction, commit, push, PR ...\ngit switch feat/panier\ngit stash pop                        # je retrouve mon travail\n\n# Récupérer un seul correctif d'une autre branche\ngit log --oneline fix/paiement       # repère l'id : 4e5f6a7\ngit switch release/1.2\ngit cherry-pick 4e5f6a7\n\n# Marquer une version\ngit tag -a v1.2.0 -m \"Version 1.2.0 : export PDF\"\ngit push origin v1.2.0\n\n# Trouver le commit fautif\ngit bisect start\ngit bisect bad                       # la version actuelle a le bug\ngit bisect good v1.1.0               # cette version marchait\n# Git se place au milieu : teste, puis\ngit bisect good                      # ou : git bisect bad\n# ... jusqu'à : \"9f1e2d3 is the first bad commit\"\ngit bisect reset                     # retour à la normale", "notes": ["`stash` est une pile : le dernier mis de côté ressort en premier.", "Après un cherry-pick, le commit existe en deux exemplaires (ids différents) sur deux branches.", "`bisect` peut tourner tout seul avec un script de test : `git bisect run ./test.sh`."]}, "quiz": [{"q": "Tu dois changer de branche mais ton travail n'est pas prêt à être commité. Que faire ?", "options": ["git reset --hard", "git stash", "git revert", "git tag"], "answer": 1, "why": "Puis `git stash pop` en revenant."}, {"q": "Différence entre un tag et une branche ?", "options": ["Aucune", "Un tag reste sur son commit, une branche avance à chaque commit", "Un tag est privé", "Une branche est fixe"], "answer": 1, "why": "Le tag marque une version, une fois pour toutes."}, {"q": "Un bug est apparu entre v1.1.0 (ok) et aujourd'hui (128 commits). Quel outil ?", "options": ["git blame", "git bisect", "git stash", "git cherry-pick"], "answer": 1, "why": "Recherche dichotomique : environ 7 tests au lieu de 128."}], "td": {"title": "Trouver le coupable", "enonce": "Fabrique un historique avec un bug caché, puis retrouve-le avec `bisect`.", "consignes": ["Crée 20 commits qui ajoutent chacun une ligne à `nombres.txt`", "Au commit 13, ajoute aussi la ligne `BUG`", "Tague le commit 5 `v1.0.0`", "Avec `git bisect`, retrouve le commit fautif (sans regarder le log)", "Bonus : automatise avec `git bisect run`"], "starter": {"lang": "bash", "code": "git init -b main bisect-demo && cd bisect-demo\nfor i in $(seq 1 20); do\n  echo \"$i\" >> nombres.txt\n  # à toi : au tour 13, ajoute aussi BUG\n  git add . && git commit -qm \"feat: ajoute $i\"\n  # à toi : au tour 5, crée le tag v1.0.0\ndone"}, "hints": ["Dans la boucle : `if [ \"$i\" -eq 13 ]; then echo BUG >> nombres.txt; fi`.", "Test manuel : `grep BUG nombres.txt` → trouvé = bad, sinon good.", "Automatique : `git bisect run sh -c '! grep -q BUG nombres.txt'` (code 0 = good)."], "solution": {"lang": "bash", "code": "git init -b main bisect-demo && cd bisect-demo\nfor i in $(seq 1 20); do\n  echo \"$i\" >> nombres.txt\n  if [ \"$i\" -eq 13 ]; then echo BUG >> nombres.txt; fi\n  git add . && git commit -qm \"feat: ajoute $i\"\n  if [ \"$i\" -eq 5 ]; then git tag -a v1.0.0 -m \"v1\"; fi\ndone\n\ngit bisect start\ngit bisect bad              # HEAD (20) contient BUG\ngit bisect good v1.0.0\n# à chaque étape :\ngrep -q BUG nombres.txt && git bisect bad || git bisect good\n# ... \"xxxxxxx is the first bad commit  feat: ajoute 13\"\ngit bisect reset\n\n# Version automatique :\ngit bisect start HEAD v1.0.0\ngit bisect run sh -c '! grep -q BUG nombres.txt'\ngit bisect reset"}, "checks": ["bisect désigne bien « feat: ajoute 13 »", "Il a fallu environ 4 tests pour 15 commits"]}}]};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function inl(s) {
  return String(s ?? "").split("`").map((part, i) => i % 2 ? `<code>${esc(part)}</code>` : esc(part).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")).join("");
}
function md(text) {
  const out = []; const lines = String(text || "").split("\n"); let i = 0; let list = null; let para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${inl(para.join(" "))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.ol ? "ol class=\"consignes\"" : "ul class=\"points\""}>${list.items.map((l) => `<li>${inl(l)}</li>`).join("")}</${list.ol ? "ol" : "ul"}>`); list = null; } };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^```\s*(\S+)?/);
    if (fence) {
      flushPara(); flushList();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      const spec = fence[1] || "plaintext"; const [lang, ...rest] = spec.split(":");
      out.push(rest.length ? filesBlock([{ path: rest.join(":"), lang, code: buf.join("\n") }], "md" + out.length) : codeBlock(buf.join("\n"), lang));
      continue;
    }
    const li = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if (li) { flushPara(); const ol = /\d/.test(li[1]); if (list && list.ol !== ol) flushList(); (list = list || { ol, items: [] }).items.push(li[2]); i++; continue; }

/* ---------- rendu : parcours (roadmap) ---------- */
function viewTrack(tid) {
  const t = track(tid);

  const items = ms.map((m, i) => {

    const nodeIn = st === "done" ? "✓" : st === "due" ? "↻" : String(i + 1);
    const side = i % 2 === 0 ? "left" : "right";
    return `<li class="rm-item ${side} ${st} ${here ? "here" : ""} ${p?.done ? "passed" : ""}">
      <a class="rm-card" href="#m-${esc(m.id)}">
        ${here ? `<span class="rm-flag">${st === "started" ? "Tu en es là" : st === "due" ? "À réviser" : "Prochaine étape"}</span>` : ""}
        <span class="rm-meta"><span class="rm-num">Étape ${i + 1}</span><span>${m.minutes || 15} min</span>${isCustom(m.id) ? '<span class="pill custom">ajouté</span>' : ""}</span>
        <span class="rm-title">${esc(m.title)}</span>
        <span class="rm-goal">${inl(m.goal)}</span>
        <span class="rm-foot"><span class="rm-steps" title="Comprendre · Exemple · Quiz · TD, puis niveaux du TD">${steps}</span><span class="pill ${st}">${STATUS_LABEL[st]}</span></span>
      </a>
      <span class="rm-node" aria-hidden="true">${nodeIn}</span>
    </li>`;
  }).join("");
  const finished = s.total > 0 && s.done === s.total;
  return `<div class="wrap" style="${tc(t)}">
    <a class="small" href="#accueil">← Tableau de bord</a>
    <div class="rm-head card">
      ${logo(t, 56)}
      ${ring(s.total ? s.done / s.total : 0, 96, 10, "var(--tc)", `${s.done}<small>/${s.total}</small>`)}
      <div class="stack" style="gap:6px;flex:1;min-width:220px">
        <div class="eyebrow">Parcours</div>
        <h1>${esc(t.name)}</h1>
        <p class="muted small">${esc(t.desc || "")}</p>
      </div>
      <div class="rm-kpis">
        <div><b>${s.total - s.done}</b><span>étapes restantes</span></div>
        <div><b>${minsLeft >= 60 ? Math.floor(minsLeft / 60) + " h " + String(minsLeft % 60).padStart(2, "0") : minsLeft + " min"}</b><span>de travail estimé</span></div>
      </div>
    </div>
    ${ms.length ? `<ol class="roadmap">
      <li class="rm-start"><span class="rm-cap">Départ</span></li>
      ${items}
      <li class="rm-end ${finished ? "passed" : ""}"><span class="rm-goalnode" aria-hidden="true">★</span><span class="rm-cap">${finished ? "Parcours terminé" : "Objectif : " + esc(t.short || t.name) + " maîtrisé"}</span></li>
    </ol>` : `<p class="muted card">Aucun module pour l'instant. <a href="#ajouter">Ajoute le premier.</a></p>`}
  </div>`;
}

/* ---------- diagrammes SVG ---------- */
const DG = { colW: 190, rowH: 96, nodeW: 158, nodeH: 58, padX: 16, padY: 14 };
function dgColor(c) { return ({ tc: "var(--tc)", accent: "var(--accent)", good: "var(--good)", warn: "var(--warn)", bad: "var(--bad)", muted: "var(--muted)" })[c] || c || "var(--tc)"; }
function dgText(x, y, text, cls, anchor = "middle", size = 13, weight = 600, fill = "var(--ink)", lineH = 15) {
  const lines = String(text).split("\n");
  const y0 = y - ((lines.length - 1) * lineH) / 2;
  return lines.map((l, i) => `<text x="${x}" y="${y0 + i * lineH}" text-anchor="${anchor}" dominant-baseline="central" font-size="${size}" font-weight="${weight}" fill="${fill}" class="${cls || ""}">${esc(l)}</text>`).join("");
}
function diagram(d) {
  if (!d || !Array.isArray(d.nodes) || !d.nodes.length) return "";
  const cols = Math.max(...d.nodes.map((n) => n.col + (n.span || 1) - 1)) + 1;
  const rows = Math.max(...d.nodes.map((n) => n.row)) + 1;
  const W = DG.padX * 2 + cols * DG.colW, H = DG.padY * 2 + rows * DG.rowH + (d.lanes ? 26 : 0);
  const top = DG.padY + (d.lanes ? 26 : 0);
  const pos = {};
  for (const n of d.nodes) {
    const span = n.span || 1;
    const w = DG.nodeW + (span - 1) * DG.colW, h = n.sub ? DG.nodeH + 14 : DG.nodeH;
    const x = DG.padX + n.col * DG.colW + (DG.colW - DG.nodeW) / 2, y = top + n.row * DG.rowH + (DG.rowH - h) / 2;
    pos[n.id] = { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
  }
  let out = `<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>`;
  if (d.lanes) for (const l of d.lanes) {
    const x = DG.padX + l.from * DG.colW - 6, w = (l.to - l.from + 1) * DG.colW + 12;
    const col = dgColor(l.color || "muted");
    out += `<rect x="${x}" y="${DG.padY}" width="${w}" height="${H - DG.padY * 2}" rx="12" fill="${col}" fill-opacity="0.07" stroke="${col}" stroke-opacity="0.25" stroke-dasharray="4 4"/>`;
    out += dgText(x + w / 2, DG.padY + 13, l.label.toUpperCase(), "", "middle", 11, 700, col);
  }
  for (const e of d.edges || []) {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) continue;
    const col = dgColor(e.color || "muted");
    let path, lx, ly;
    if (Math.abs(a.cy - b.cy) < 2) {
      const dir = b.cx > a.cx ? 1 : -1; const x1 = dir > 0 ? a.x + a.w : a.x, x2 = dir > 0 ? b.x : b.x + b.w;
      const yy = a.cy + (e.back ? 14 : 0);
      path = `M${x1},${yy} L${x2},${yy}`; lx = (x1 + x2) / 2; ly = yy - 11;
    } else if (Math.abs(a.cx - b.cx) < 2) {
      const dir = b.cy > a.cy ? 1 : -1; const y1 = dir > 0 ? a.y + a.h : a.y, y2 = dir > 0 ? b.y : b.y + b.h;
      const xx = a.cx + (e.back ? 18 : 0);
      path = `M${xx},${y1} L${xx},${y2}`; lx = xx + 8; ly = (y1 + y2) / 2;
    } else {
      const dir = b.cx > a.cx ? 1 : -1; const x1 = dir > 0 ? a.x + a.w : a.x;
      const vdir = b.cy > a.cy ? 1 : -1; const y2 = vdir > 0 ? b.y : b.y + b.h;
      path = `M${x1},${a.cy} L${b.cx},${a.cy} L${b.cx},${y2}`; lx = (x1 + b.cx) / 2; ly = a.cy - 11;
    }
    out += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" ${e.dashed ? 'stroke-dasharray="5 4"' : ""} marker-end="url(#dg-arrow)"/>`;
    if (e.label) {
      const tw = e.label.length * 6.4 + 12;
      out += `<rect x="${lx - tw / 2}" y="${ly - 9}" width="${tw}" height="18" rx="9" fill="var(--surface)" stroke="${col}" stroke-opacity="0.35"/>` + dgText(lx, ly, e.label, "", "middle", 11, 500, "var(--ink)");
    }
  }
  for (const n of d.nodes) {
    const p = pos[n.id]; const col = dgColor(n.color || "tc"); const k = n.kind || "box";
    const fill = `color-mix(in srgb, ${col} ${k === "note" ? 6 : 12}%, var(--surface))`;
    if (k === "db") out += `<path d="M${p.x},${p.y + 10} a${p.w / 2},10 0 0 1 ${p.w},0 v${p.h - 20} a${p.w / 2},10 0 0 1 -${p.w},0 z" fill="${fill}" stroke="${col}" stroke-width="1.6"/><path d="M${p.x},${p.y + 10} a${p.w / 2},10 0 0 0 ${p.w},0" fill="none" stroke="${col}" stroke-width="1.6"/>`;
    else if (k === "actor") out += `<circle cx="${p.cx}" cy="${p.y + 16}" r="9" fill="${fill}" stroke="${col}" stroke-width="1.6"/><path d="M${p.cx},${p.y + 25} v16 M${p.cx - 14},${p.y + 32} h28 M${p.cx},${p.y + 41} l-10,14 M${p.cx},${p.y + 41} l10,14" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/>`;
    else if (k === "doc" || k === "file") out += `<path d="M${p.x},${p.y} h${p.w - 16} l16,16 v${p.h - 16} h-${p.w} z" fill="${fill}" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/><path d="M${p.x + p.w - 16},${p.y} v16 h16" fill="none" stroke="${col}" stroke-width="1.6"/>`;
    else if (k === "pill") out += `<rect x="${p.x}" y="${p.y + 10}" width="${p.w}" height="${p.h - 20}" rx="${(p.h - 20) / 2}" fill="${fill}" stroke="${col}" stroke-width="1.6"/>`;
    else if (k === "note") out += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6" fill="${fill}" stroke="${col}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    else out += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="10" fill="${fill}" stroke="${col}" stroke-width="1.6"/>`;
    const ty = k === "actor" ? p.y + p.h - 2 + 8 : p.cy + (n.sub ? -8 : 0);
    out += dgText(p.cx, k === "actor" ? p.y + p.h + 4 : ty, n.label, "", "middle", k === "note" ? 12 : 13, k === "note" ? 500 : 600, "var(--ink)");
    if (n.sub && k !== "actor") out += dgText(p.cx, p.cy + 12, n.sub, "", "middle", 11, 400, "var(--muted)", 13);
  }
  const minw = Math.min(W, 640);
  return `<figure class="diagram" style="margin:0;--minw:${minw}px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.caption || "Schéma")}">${out}</svg>${d.caption ? `<figcaption class="cap">${inl(d.caption)}</figcaption>` : ""}</figure>`;
}

/* ---------- rendu : module ---------- */
function stepDone(m, i) {
  const p = prog(m.id) || {};
  if (i === 2) return !!p.quizDone;
  if (i === 3) return levelDone(p, 1);
  return (p.seen || []).includes(i);
}
function viewModule(id) {

  const t = track(m.track);
  const ms = modulesOf(m.track);
  const idx = ms.findIndex((x) => x.id === id);
  const p = prog(id) || {};
  const step = state.ui.step[id] ?? (p.done ? 0 : levelDone(p, 1) ? 3 : p.quizDone ? 3 : 0);

  const st = status(id);

  const body = [panelLearn, panelExample, panelQuiz, panelTD][step](m);

  const next = step < 3 ? `<button class="btn primary" data-act="step" data-id="${esc(id)}" data-step="${step + 1}">${STEPS[step + 1]} →</button>` : (idx < ms.length - 1 ? `<a class="btn" href="#m-${esc(ms[idx + 1].id)}">Module suivant →</a>` : `<a class="btn" href="#t-${esc(t.id)}">Voir le parcours</a>`);

      <div class="row small">${logo(t, 22)}<a href="#t-${esc(t.id)}">${esc(t.name)}</a><span class="muted">· module ${idx + 1}/${ms.length} · ${m.minutes || 15} min</span><span class="spacer"></span><span class="pill ${st}">${STATUS_LABEL[st]}</span></div>

}

  if (phpRuntime) return phpRuntime;

  const modUrl = BASE + "vendor/php-wasm/PhpWeb.mjs";

  php.addEventListener("error", (e) => phpOut.push({ t: "err", s: e.detail }));

}
function joinPhpFiles(files) {
  // Plusieurs fichiers PHP sans namespace : on les concatène, un seul <?php au début.
  let body = "";
  files.forEach((f, i) => {
    let c = f.code.replace(/^﻿/, "");
    if (i > 0) { c = c.replace(/^\s*<\?php\s*/i, "").replace(/^\s*declare\s*\(\s*strict_types\s*=\s*1\s*\)\s*;\s*/i, ""); }

}

  function check(string $desc, bool $ok, string $detail = ''): void { echo "\\n@@CHECK|" . ($ok ? 'PASS' : 'FAIL') . "|" . str_replace(["|", "\\n"], [" ", " "], $desc) . "|" . str_replace(["|", "\\n"], [" ", " "], $detail); }

async function runPhp(m, td, key, withTests) {

}

  const allAnswered = it.qs.every((q) => q.a !== undefined);
  const qs = it.revealed ? it.qs.map((q, k) => {
    const Q = m.quiz[q.qi];
    const opts = q.perm.map((oi) => {
      let cls = "";
      if (q.a !== undefined && oi === Q.answer) cls = "right"; else if (q.a === oi) cls = "wrong";
      return `<button class="opt ${cls}" ${q.a !== undefined ? "disabled" : ""} data-act="rAnswer" data-k="${k}" data-o="${oi}">${inl(Q.options[oi])}</button>`;
    }).join("");
    const fb = q.a !== undefined ? `<div class="feedback ${q.a === Q.answer ? "right" : "wrong"}"><b>${q.a === Q.answer ? "Juste." : "Pas tout à fait."}</b>${inl(Q.why)}</div>` : "";
    return `<div class="q"><div class="q-title"><span class="k">Q${k + 1}</span><span>${inl(Q.q)}</span></div><div class="opts">${opts}</div>${fb}</div>`;
  }).join("") : "";
  return `<div class="wrap" style="${tc(t)}">
    <div class="row"><h1 style="font-size:1.4rem">${r.practice ? "Entraînement" : "Révision"}</h1><span class="spacer"></span><div class="progress-dots">${dots}</div><button class="btn sm ghost" data-act="closeReview">Quitter</button></div>
    <div class="card rev-card">
      <div class="row">${logo(t, 20)}<span class="chip" style="${tc(t)}">${esc(t.short || t.name)}</span><span class="muted small">${r.idx + 1}/${r.queue.length}</span></div>
      <h2>${esc(m.title)}</h2>
      <div class="stack"><b>1. Sans regarder : explique en 2 ou 3 phrases comment ça marche.</b>
        <textarea class="field" rows="3" placeholder="Écris de mémoire, même approximativement…" aria-label="Rappel libre"></textarea>
        ${it.revealed ? `<div class="stack small"><span class="muted">Compare avec le mécanisme :</span>${m.diagram ? diagram(m.diagram) : ""}<ol class="recall-flow">${m.flow.map((f) => `<li>${inl(f)}</li>`).join("")}</ol>${Array.isArray(m.recap) && m.recap.length ? `<div class="recap"><h3>À retenir</h3><ol>${m.recap.map((x) => `<li>${inl(x)}</li>`).join("")}</ol></div>` : ""}</div>` : `<div><button class="btn" data-act="reveal">Comparer avec le mécanisme</button></div>`}
      </div>
      ${it.revealed ? `<div class="stack" style="gap:18px"><b>2. Quiz</b>${qs}</div>` : ""}
      ${allAnswered ? `<div class="row"><button class="btn primary" data-act="rNext">${r.idx < r.queue.length - 1 ? "Module suivant" : "Terminer"}</button></div>` : ""}
    </div>
  </div>`;
}

  main.querySelectorAll("iframe[id^='prev-']").forEach((f) => { const k = f.id.slice(5); const old = keepFrames[k]; if (old && old.srcdoc) { old.id = f.id; f.replaceWith(old); } });

/* ---------- actions ---------- */
function markSeen(id, step) { const p = ensure(id); p.seen = p.seen || []; if (!p.seen.includes(step)) { p.seen.push(step); logActivity(); } }
function checkComplete(id) {
  const p = ensure(id);
  if (p.quizDone && levelDone(p, 1) && !p.done) {
    p.done = true; p.box = 1; p.due = addDays(INTERVALS[0]); p.doneAt = today();
    toast("Module acquis. Première révision demain.");
  }
}
function keepDrafts() {
  document.querySelectorAll("textarea.editor[data-ed]").forEach((ed) => {
    const key = ed.dataset.ed; const mm = key.match(/^td-(.+)-(\d+)$/); if (!mm) return;
    const dk = draftKey(mm[1], Number(mm[2]));
    const d = (state.drafts[dk] && typeof state.drafts[dk] === "object") ? state.drafts[dk] : (state.drafts[dk] = {});
    d[ed.dataset.path] = ed.value;
  });
  draftWriter.schedule();
}
const ACTIONS = {
  toggleTrack(el) {
    const id = el.dataset.id; const r = currentRoute();
    const cur = r.startsWith("m-") ? mod(r.slice(2))?.track : r.startsWith("t-") ? r.slice(2) : null;
    const isOpen = openTracks.has(id) || id === cur;
    if (isOpen) { openTracks.delete(id); if (id === cur) location.hash = "#accueil"; } else openTracks.add(id);
    saveOpen(); renderSide();
  },
  menu() { document.body.classList.toggle("menu-open"); },
  step(el) {
    keepDrafts(); const id = el.dataset.id; const s = Number(el.dataset.step);
    const cur = state.ui.step[id] ?? 0;
    if (cur === 0 || cur === 1) markSeen(id, cur);
    state.ui.step[id] = s;
    saveProgress(); render();
    const tabs = $(".steps"); if (tabs) tabs.scrollIntoView({ block: "nearest" });
  },
  level(el) { keepDrafts(); state.ui.level[el.dataset.id] = Number(el.dataset.level); render(); },
  ftab(el) { keepDrafts(); state.ui.ftab[el.dataset.key] = Number(el.dataset.i); const box = el.closest(".files"); if (box) { box.querySelectorAll(".ftab").forEach((t, i) => t.classList.toggle("on", i === Number(el.dataset.i))); box.querySelectorAll(".fpane").forEach((p, i) => p.classList.toggle("on", i === Number(el.dataset.i))); } },
  answer(el) {
    const id = el.dataset.id; const m = mod(id); const p = ensure(id);
    p.answers = p.answers || {};
    p.answers[el.dataset.q] = Number(el.dataset.o);
    logActivity();
    if (Object.keys(p.answers).length === m.quiz.length) { p.quizDone = true; checkComplete(id); }
    saveProgress(); render();
  },
  resetQuiz(el) { const p = ensure(el.dataset.id); p.answers = {}; saveProgress(); render(); },
  hint(el) { keepDrafts(); const k = el.dataset.key; state.ui.hints[k] = (state.ui.hints[k] || 0) + 1; render(); },
  solution(el) { keepDrafts(); const k = el.dataset.key; state.ui.showSol[k] = !state.ui.showSol[k]; render(); },
  check(el) {
    const p = ensure(el.dataset.id); const i = Number(el.dataset.i); const lvl = Number(el.dataset.level);
    if (Array.isArray(p.checks)) p.checks = { 1: p.checks };
    p.checks = p.checks || {};
    p.checks[lvl] = (p.checks[lvl] || []).filter((x) => x !== i); if (el.checked) p.checks[lvl].push(i);
    saveProgress();
  },
  tdDone(el) { const id = el.dataset.id; const lvl = Number(el.dataset.level); keepDrafts(); const p = ensure(id); p.levels = p.levels || {}; p.levels[lvl] = true; if (lvl === 1) p.tdDone = true; logActivity(); checkComplete(id); saveProgress(); render(); },
  tdUndo(el) { const p = ensure(el.dataset.id); const lvl = Number(el.dataset.level); if (p.levels) delete p.levels[lvl]; if (lvl === 1) p.tdDone = false; saveProgress(); render(); },
  resetCode(el) { const id = el.dataset.id; const lvl = Number(el.dataset.level); delete state.drafts[draftKey(id, lvl)]; if (lvl === 1) delete state.drafts[id]; draftWriter.schedule(); render(); },
  async copyCode(el) { keepDrafts(); const eds = document.querySelectorAll(`textarea.editor[data-ed="${CSS.escape(el.dataset.key)}"]`); const txt = Array.from(eds).map((e) => (eds.length > 1 ? `// ${e.dataset.path}\n` : "") + e.value).join("\n\n"); try { await navigator.clipboard.writeText(txt); toast("Code copié."); } catch (e) { toast("Copie impossible ici : sélectionne le code et utilise Ctrl+C."); } },
  run(el) { runTD(el.dataset.id, el.dataset.level, false); },
  runTests(el) { runTD(el.dataset.id, el.dataset.level, true); },
  explain(el) { aiExplain(mod(el.dataset.id)); },
  review(el) { aiReview(mod(el.dataset.id), Number(el.dataset.level)); },
  startReview() { startReview(dueModules().map((m) => m.id), false); },
  practice() { const ids = shuffle(allModules().filter((m) => prog(m.id)?.done).map((m) => m.id)).slice(0, 3); startReview(ids, true); },
  reveal() { state.ui.review.queue[state.ui.review.idx].revealed = true; render(); },
  rAnswer(el) { const r = state.ui.review; r.queue[r.idx].qs[Number(el.dataset.k)].a = Number(el.dataset.o); render(); },
  rNext() {
    const r = state.ui.review; const it = r.queue[r.idx]; const m = mod(it.id);
    it.result = it.qs.every((q) => q.a === m.quiz[q.qi].answer);
    if (!r.practice) {
      const p = ensure(it.id);
      if (it.result) { p.box = Math.min((p.box || 1) + 1, INTERVALS.length); p.due = addDays(INTERVALS[p.box - 1]); }
      else { p.box = 1; p.due = addDays(1); }
      p.lastReview = today(); p.reviews = (p.reviews || 0) + 1; logActivity();
      saveProgress();
    }
    if (r.idx < r.queue.length - 1) r.idx++; else r.finished = true;
    render();
  },
  closeReview() { state.ui.review = null; render(); },
  forgetKey() { setKey(""); applyStandaloneAI(); render(); toast("Clé supprimée de ce navigateur."); },
  async testKey() {
    const msg = $("#key-msg"); msg.textContent = "Test en cours…";
    try { await callApi("Réponds juste : OK", {}, 10); msg.textContent = "La clé fonctionne."; }
    catch (e) { msg.textContent = e.code === "not_granted" ? "Clé refusée : vérifie-la dans la console." : "Échec : " + (e.message || "erreur réseau"); }
  },
  color(el) { state.ui.newTrackColor = el.dataset.c; readGenForm(); render(); },
  genRun() { readGenForm(); aiGenerate(); },
  genSave() { saveGenerated(); },
  import() { importJSON(); },
  async copyTpl() { try { await navigator.clipboard.writeText(moduleTemplate()); toast("Modèle copié."); } catch (e) { $("#import-json").value = moduleTemplate(); toast("Modèle collé dans le champ."); } },
  askDel(el) { state.ui.confirmDel = el.dataset.id; render(); },
  cancelDel() { state.ui.confirmDel = null; render(); },
  delMod(el) {
    const id = el.dataset.id;
    state.custom.modules = state.custom.modules.filter((m) => m.id !== id);
    delete state.progress.modules[id]; for (const k of Object.keys(state.drafts)) if (k === id || k.startsWith(id + "#")) delete state.drafts[k];
    state.ui.confirmDel = null;
    libWriter.schedule(); saveProgress(); draftWriter.schedule(); render(); toast("Module supprimé.");
  },
  delTrack(el) { state.custom.tracks = state.custom.tracks.filter((t) => t.id !== el.dataset.id); libWriter.schedule(); render(); },
};

/* ---------- Claude ---------- */
function levelContext() { return "L'élève a un niveau intermédiaire en programmation. Il a besoin de comprendre COMMENT une chose fonctionne pour pouvoir la faire. Réponds en français, de façon simple, concise et concrète."; }
function moduleContext(m) {
  const lessons = (m.lessons || []).map((l) => `## ${l.title}\n${l.body}`).join("\n").slice(0, 6000);
  return `Module « ${m.title} » (parcours ${track(m.track).name}).\nObjectif : ${m.goal}\nMécanisme : ${m.flow.map((f, i) => `${i + 1}) ${f}`).join(" ")}\nPoints clés : ${m.points.join(" | ")}\n\nCours :\n${lessons}`;
}
async function runAI(outSel, prompt, intro) {
  const out = $(outSel);
  if (!out || !sample) return;
  out.style.display = "";
  out.innerHTML = `<p class="muted small"><span class="spin"></span> ${esc(intro)}</p>`;
  try {
    const res = await sample(prompt, { cache: false, onText: ({ text }) => { const o = $(outSel); if (o) { o.innerHTML = md(text); } } });
    const o = $(outSel);
    if (o) { o.innerHTML = md(res.text); highlight(o); }
  } catch (e) {
    const o = $(outSel);
    if (!o) return;
    if (e && e.code === "not_granted") { o.innerHTML = standalone ? `<p class="err">Clé API refusée. <a href="#claude">Vérifie ta clé</a>.</p>` : `<p class="err">Claude n'est pas autorisé dans cette vue.</p>`; }
    else if (e && e.code === "rate_limited") { o.innerHTML = `<p class="err">Trop de demandes d'un coup. Réessaie dans une minute.</p>`; }
    else { o.innerHTML = `<p class="err">La réponse n'a pas pu être générée. Réessaie.</p>`; }
  }
}
function aiExplain(m) {
  runAI("#ai-learn", `${levelContext()}\n\n${moduleContext(m)}\n\nL'élève n'a pas compris l'explication. Ré-explique autrement : commence par une analogie du quotidien (3 phrases max), puis relie chaque élément de l'analogie au mécanisme, puis donne un mini exemple de code de 5 à 10 lignes dans un bloc \`\`\`. 180 mots maximum hors code. Pas de titre.`, "Claude reformule…");
}
function aiAsk(m, q) {
  runAI("#ai-learn", `${levelContext()}\n\n${moduleContext(m)}\n\nQuestion de l'élève : ${q}\n\nRéponds directement à la question, en 150 mots maximum (hors code). Si un exemple aide, un bloc \`\`\` court. Pas de titre.`, "Claude réfléchit…");
}
function aiReview(m, level) {
  const td = tds(m).find((x) => x.level === level) || tds(m)[0];
  keepDrafts();
  const files = currentFiles(m, td);
  const codeTxt = files.map((f) => `// ${f.path}\n${f.code}`).join("\n\n");
  if (files.every((f, i) => f.code.trim() === (td.files[i] || {}).code?.trim())) { toast("Écris d'abord ton code dans l'éditeur."); return; }
  const sol = (td.solution || []).map((f) => `// ${f.path}\n${f.code}`).join("\n\n");
  runAI("#ai-td", `${levelContext()}\n\nTu corriges un TD (niveau ${td.level}).\nTD : ${td.title}\nÉnoncé : ${td.enonce}\nConsignes :\n${td.consignes.map((c, i) => `${i + 1}. ${c}`).join("\n")}\n\nSolution de référence (NE LA RECOPIE PAS) :\n${sol}\n\nCode de l'élève :\n${codeTxt}\n\nRéponds ainsi :\n- Une ligne par consigne : « OK » ou ce qui manque/est faux, en une phrase.\n- Le point le plus important à corriger et POURQUOI (lié au mécanisme du module).\n- Un indice pour corriger, sans donner le code complet.\nSi tout est bon, dis-le et propose une amélioration. 220 mots maximum.`, "Claude relit ton code…");
}
function readGenForm() {
  const f = document.querySelector('form[data-form="gen"]');
  if (!f) return;
  const g = state.ui.gen || (state.ui.gen = {});
  g.track = f.track.value; g.topic = f.topic.value; g.notes = f.notes.value;
  if (f.tname) g.tname = f.tname.value;
}
async function aiGenerate() {
  const g = state.ui.gen || {};
  if (!sample) return;
  if (!g.topic || !g.topic.trim()) { g.error = "Indique un sujet."; render(); return; }
  if (g.track === "__new" && !(g.tname || "").trim()) { g.error = "Donne un nom au nouveau parcours."; render(); return; }
  const trackName = g.track === "__new" ? g.tname.trim() : track(g.track).name;
  const exemple = moduleTemplate();
  g.loading = true; g.error = null; g.result = null; render();
  const prompt = `${levelContext()}\n\nÉcris UN module d'apprentissage complet sur le sujet « ${g.topic.trim()} » pour le parcours « ${trackName} ».${g.notes ? `\nPrécisions de l'élève : ${g.notes}` : ""}\n\nMéthode : (1) why : le problème que ça résout, en 2-3 phrases concrètes ; (2) prereq : 3 à 6 mots de vocabulaire de base utilisés dans le module, avec une définition d'une phrase chacun ; (3) flow : le mécanisme en 4 étapes courtes ; (4) lessons : 3 à 4 leçons de 2 à 4 paragraphes chacune, progressives, qui expliquent vraiment (pas des listes de mots-clés), avec de petits blocs de code \`\`\`lang:chemin/fichier ; (5) points : 4 ou 5 points essentiels ; (6) pitfalls : 2 ou 3 pièges ; (7) recap : 3 à 5 phrases à retenir ; (8) example : un exemple réaliste de 20 à 60 lignes, découpé en fichiers si le projet en a plusieurs, avec 3 ou 4 notes ; (9) quiz : 4 questions à 4 options (answer = index de la bonne réponse, why = explication) ; (10) tds : 3 TD de niveaux 1 (application directe), 2 (cas à adapter), 3 (approfondissement combinant d'autres notions), chacun avec énoncé, 3 à 5 consignes, fichiers de départ, 2 ou 3 indices progressifs, solution complète, 2 ou 3 vérifications. Si le code est du PHP pur (sans framework) ou du React/TypeScript sans librairie externe, ajoute run : {kind:"php"|"react", tests:"..."} (PHP : fonctions check('desc', bool) ; React : assert(cond, 'desc') avec h.$(), h.click(), h.type(), h.text()). Sinon, ne mets pas run et donne expected (résultat attendu en texte).\nContraintes : français ; markdown inline (\`code\`, **gras**) dans les textes ; lang parmi php, tsx, ts, javascript, sql, bash, yaml, json, python, plaintext ; contenu exact et à jour.\n\nRéponds UNIQUEMENT avec un objet JSON valide ayant exactement cette structure :\n${exemple}`;
  try {
    const val = await sample.json(prompt, { modelTier: "complex" });
    const m = normalizeModule(val);
    if (!m) throw new Error("format");
    g.result = m;
  } catch (e) {
    g.error = e && e.code === "rate_limited" ? "Trop de demandes. Réessaie dans une minute." : e && e.code === "not_granted" ? (standalone ? "Clé API refusée : vérifie-la dans « Activer les boutons Claude »." : "Claude n'est pas autorisé dans cette vue.") : "Le module généré était incomplet. Réessaie.";
  }
  g.loading = false;
  if (currentRoute() === "ajouter") render();
}
function asStrArr(a) { return Array.isArray(a) ? a.filter((x) => typeof x === "string" && x.trim()).map((x) => x.trim()) : []; }
function normFile(f, i) { if (!f || typeof f.code !== "string") return null; return { path: typeof f.path === "string" ? f.path.trim() : "", lang: LANGS[f.lang] !== undefined ? f.lang : "plaintext", code: f.code.replace(/\s+$/, "") }; }
function normFiles(v) { if (Array.isArray(v)) return v.map(normFile).filter(Boolean); const f = normFile(v); return f ? [f] : []; }
function normalizeModule(v) {
  if (!v || typeof v !== "object") return null;
  const str = (x) => (typeof x === "string" ? x.trim() : "");
  const quiz = (Array.isArray(v.quiz) ? v.quiz : []).map((q) => ({ q: str(q && q.q), options: asStrArr(q && q.options), answer: Number(q && q.answer), why: str(q && q.why) }))
    .filter((q) => q.q && q.options.length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length);
  const ex = v.example || {};
  const rawTds = Array.isArray(v.tds) && v.tds.length ? v.tds : v.td ? [{ level: 1, ...v.td, files: v.td.files || (v.td.starter ? [v.td.starter] : []), solution: v.td.solution }] : [];
  const tdsN = rawTds.map((td, i) => {
    if (!td) return null;
    const files = normFiles(td.files || td.starter); const solution = normFiles(td.solution);
    const o = { level: Number(td.level) || i + 1, title: str(td.title) || "TD", enonce: str(td.enonce), consignes: asStrArr(td.consignes), files, hints: asStrArr(td.hints), solution, checks: asStrArr(td.checks) };
    if (td.run && typeof td.run === "object" && ["php", "react", "js"].includes(td.run.kind)) o.run = { kind: td.run.kind, tests: str(td.run.tests), entry: str(td.run.entry) || undefined, api: str(td.run.api) || undefined };
    if (str(td.expected)) o.expected = str(td.expected);
    if (!o.enonce || !o.consignes.length || !o.solution.length) return null;
    if (!o.files.length) o.files = o.solution.map((f) => ({ ...f, code: "// à toi" }));
    if (!o.hints.length) o.hints = ["Relis le mécanisme du module."];
    if (!o.checks.length) o.checks = ["Ton code respecte toutes les consignes"];
    return o;
  }).filter(Boolean);
  const m = {
    title: str(v.title), minutes: Number(v.minutes) || 15, goal: str(v.goal), why: str(v.why),
    prereq: (Array.isArray(v.prereq) ? v.prereq : []).map((p) => ({ term: str(p && p.term), def: str(p && p.def) })).filter((p) => p.term && p.def),
    flow: asStrArr(v.flow).slice(0, 6), diagram: v.diagram && Array.isArray(v.diagram.nodes) ? v.diagram : null,
    lessons: (Array.isArray(v.lessons) ? v.lessons : []).map((l) => ({ title: str(l && l.title), body: str(l && l.body) })).filter((l) => l.title && l.body),
    points: asStrArr(v.points), pitfalls: asStrArr(v.pitfalls), recap: asStrArr(v.recap),
    example: { files: normFiles(ex.files || (ex.code !== undefined ? { path: "", lang: ex.lang, code: ex.code } : [])), notes: asStrArr(ex.notes) },
    quiz, tds: tdsN,
  };
  if (!m.title || !m.goal || m.flow.length < 2 || !m.points.length || !m.example.files.length || !quiz.length || !m.tds.length) return null;
  if (!m.why) m.why = m.goal;
  return m;
}
function ensureTrack(name, color) {
  const n = name.trim();
  const existing = tracks().find((t) => t.name.toLowerCase() === n.toLowerCase() || (t.short || "").toLowerCase() === n.toLowerCase());
  if (existing) return existing.id;
  const t = { id: "t" + rid(), name: n, short: n.length > 14 ? n.slice(0, 13) + "…" : n, color: color || "rose", desc: "Parcours ajouté." };
  state.custom.tracks.push(t);
  return t.id;
}
function saveGenerated() {
  const g = state.ui.gen; if (!g || !g.result) return;
  const tid = g.track === "__new" ? ensureTrack(g.tname, state.ui.newTrackColor) : g.track;
  const m = { ...g.result, id: "c" + rid(), track: tid };
  state.custom.modules.push(m);
  libWriter.schedule();
  state.ui.gen = { track: tid };
  location.hash = "#m-" + m.id;
  toast("Module ajouté.");
}
function importJSON() {
  const err = $("#import-err");
  let v;
  try { v = JSON.parse($("#import-json").value); } catch (e) { err.textContent = "JSON invalide : vérifie les virgules et les guillemets."; return; }
  const list = Array.isArray(v) ? v : [v];
  let added = 0, firstId = null;
  for (const raw of list) {
    const m = normalizeModule(raw);
    if (!m) continue;
    let tid = raw.track && tracks().some((t) => t.id === raw.track) ? raw.track : null;
    if (!tid) tid = ensureTrack(raw.trackName || raw.track || "Mes modules", "rose");
    const id = "c" + rid();
    state.custom.modules.push({ ...m, id, track: tid });
    added++; firstId = firstId || id;
  }
  if (!added) { err.textContent = "Aucun module valide : il faut au moins title, goal, flow, points, example, quiz et tds."; return; }
  libWriter.schedule();
  toast(`${added} module(s) importé(s).`);
  location.hash = "#m-" + firstId;
}
