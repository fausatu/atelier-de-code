<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier de code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Un seul thème clair, teinté bleu-gris (choix : pas de mode sombre). Layout : barre latérale (parcours + modules) | zone de travail. Un module = 4 étapes courtes en onglets. */
:root {
  --bg: #eef3f8;
  --surface: #fbfcfe;
  --surface-2: #e5ecf4;
  --ink: #1f2633;
  --muted: #5d6779;
  --line: #d6dfea;
  --accent: #3a5bd6;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9fc;
  --good: #1d8a4f; --good-soft: #e1f3e8;
  --warn: #a96d00; --warn-soft: #fbf0d9;
  --bad: #c83c3c;  --bad-soft: #fbe5e5;
  --t-violet: #6b55cc; --t-orange: #cf6a1d; --t-green: #18865f; --t-cyan: #13809f; --t-graphite: #4a5263;
  --t-rose: #c23f78; --t-olive: #6f7f1a; --t-blue: #2f63c9; --t-brick: #b8432f;
  --code-bg: #f4f7fb; --code-ink: #24292f; --code-line: #d6dfea;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.85rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100%; }
.side { align-self: start; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px 14px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 13px var(--font-mono); }
.brand b { font-family: var(--font-display); font-size: 1.1rem; }
.nav-main { display: flex; flex-direction: column; gap: 2px; }
.nav-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 500; }
.nav-link:hover { background: var(--surface-2); }
.nav-link.on { background: var(--accent-soft); color: var(--accent); }
.count { min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--warn); color: #fff; font: 600 12px/20px var(--font-body); text-align: center; font-variant-numeric: tabular-nums; }
.count.zero { background: var(--surface-2); color: var(--muted); }
.track-group { display: flex; flex-direction: column; gap: 1px; }
.track-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 0.86rem; }
.track-head:hover { background: var(--surface-2); }
.track-head .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--tc); flex: none; }
.track-head .frac { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.mod-link { display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 0.86rem; line-height: 1.35; }
.mod-link:hover { background: var(--surface-2); color: var(--ink); }
.mod-link.on { background: var(--surface-2); color: var(--ink); font-weight: 500; }
.st { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; position: relative; }
.st.started { border-color: var(--tc, var(--accent)); background: linear-gradient(90deg, var(--tc, var(--accent)) 50%, transparent 50%); }
.st.done { border-color: var(--good); background: var(--good); }
.st.due { border-color: var(--warn); background: var(--warn); }
.side-foot { margin-top: auto; font-size: 0.78rem; color: var(--muted); padding: 8px 10px 0; border-top: 1px solid var(--line); display: flex; gap: 7px; align-items: flex-start; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-top: 7px; flex: none; }
.sync-dot.ok { background: var(--good); } .sync-dot.err { background: var(--bad); } .sync-dot.local { background: var(--warn); }

.topbar { display: none; }
main { padding: 32px clamp(16px, 4vw, 48px) 64px; min-width: 0; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); max-width: 65ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 0.84rem; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.ai-only { display: none !important; }
body.has-ai .ai-only { display: inline-flex !important; }
body.has-ai .ai-block.ai-only { display: block !important; }
body.has-ai .no-ai { display: none !important; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: color-mix(in srgb, var(--tc, var(--accent)) 14%, transparent); color: var(--tc, var(--accent)); }
.pill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; }
.pill.new { background: var(--surface-2); color: var(--muted); }
.pill.started { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.due { background: var(--warn-soft); color: var(--warn); }
.pill.custom { background: var(--surface-2); color: var(--muted); }

.bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--tc, var(--accent)); border-radius: 99px; }
.big { font-family: var(--font-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }

.home-top .card { display: flex; flex-direction: column; gap: 10px; }
.track-card { border-top: 3px solid var(--tc); display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--ink); }
.track-card:hover { border-color: var(--tc); box-shadow: 0 1px 0 var(--line); }
.track-card .row .muted { font-variant-numeric: tabular-nums; }
.path { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.86rem; }
.path .arrow { color: var(--muted); }
.method { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; counter-reset: m; }
.method div { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; }
.method b { display: block; font-size: 0.9rem; }
.method span { font-size: 0.84rem; color: var(--muted); }
.due-list { display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; }
.due-list a { color: var(--ink); text-decoration: none; display: flex; gap: 8px; align-items: center; }
.due-list a:hover { color: var(--accent); }

/* Module */
.mod-head { display: flex; flex-direction: column; gap: 8px; }
.steps { display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.step-tab { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 0; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.step-tab .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--font-mono); background: var(--surface-2); color: var(--muted); }
.step-tab.ok .n { background: var(--good); color: #fff; }
.step-tab.on { color: var(--ink); border-bottom-color: var(--tc); }
.step-tab.on .n { background: var(--tc); color: #fff; }
.step-tab.ok.on .n { background: var(--good); }
.panel { display: flex; flex-direction: column; gap: 18px; }
.why { border-left: 3px solid var(--tc); padding: 4px 0 4px 14px; max-width: 70ch; }
.flow { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 0; align-items: stretch; }
.flow-step { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; line-height: 1.45; margin-right: 22px; }
.flow-step:last-child { margin-right: 0; }
.flow-step:not(:last-child)::after { content: ""; position: absolute; right: -17px; top: 50%; width: 12px; height: 12px; border-top: 2px solid var(--tc); border-right: 2px solid var(--tc); transform: translateY(-50%) rotate(45deg); }
.flow-step .k { font: 600 12px var(--font-mono); color: var(--tc); }
.points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.points li { padding-left: 18px; position: relative; }
.points li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 7px; height: 7px; border-radius: 2px; background: var(--tc); }
.pitfalls { background: var(--bad-soft); border-radius: var(--r); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.pitfalls h3 { color: var(--bad); font-size: 0.9rem; }
.pitfalls li { margin-left: 16px; }
.pitfalls ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ai-box { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.ai-out { font-size: 0.93rem; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.ai-out:empty { display: none; }
.ai-out pre { margin: 0; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; }
.field { padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
textarea.field { width: 100%; resize: vertical; }

pre.code { margin: 0; border: 1px solid var(--code-line); background: var(--code-bg); color: var(--code-ink); border-radius: var(--r); padding: 14px 16px; overflow-x: auto; font: 13px/1.6 var(--font-mono); tab-size: 4; }
pre.code code { background: none; padding: 0; font-size: inherit; color: inherit; }
.ex { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.notes { display: flex; flex-direction: column; gap: 10px; counter-reset: n; margin: 0; padding: 0; list-style: none; }
.notes li { counter-increment: n; display: grid; grid-template-columns: 24px 1fr; gap: 8px; font-size: 0.9rem; }
.notes li::before { content: counter(n); width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font: 600 12px var(--font-mono); color: var(--tc); }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword { color: #cf222e; }
.hljs-string, .hljs-regexp { color: #0a3069; }
.hljs-number, .hljs-literal { color: #0550ae; }
.hljs-comment { color: #6e7781; font-style: italic; }
.hljs-title, .hljs-title.function_ { color: #8250df; }
.hljs-variable, .hljs-template-variable { color: #953800; }
.hljs-attr, .hljs-attribute, .hljs-type, .hljs-title.class_, .hljs-built_in { color: #0550ae; }
.hljs-meta, .hljs-tag, .hljs-name, .hljs-symbol { color: #116329; }
.hljs-subst { color: var(--code-ink); }

.q { display: flex; flex-direction: column; gap: 10px; }
.q-title { font-weight: 600; display: flex; gap: 10px; }
.q-title .k { font: 600 13px var(--font-mono); color: var(--tc); padding-top: 1px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.4; }
.opt:hover:not([disabled]) { border-color: var(--tc); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { font-size: 0.9rem; padding: 8px 12px; border-radius: 8px; }
.feedback.right { background: var(--good-soft); }
.feedback.wrong { background: var(--bad-soft); }
.feedback b { margin-right: 4px; }
.score { display: flex; align-items: center; gap: 14px; }

.td-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.consignes { margin: 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 5px; }
.editor { width: 100%; min-height: 280px; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--code-line); border-radius: var(--r); padding: 14px 16px; font: 13px/1.6 var(--font-mono); tab-size: 4; resize: vertical; white-space: pre; overflow: auto; }
.editor:focus { outline: 2px solid var(--tc); outline-offset: 1px; }
.hint { background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.checks label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; font-size: 0.92rem; }
.checks input { margin-top: 4px; accent-color: var(--good); }
.solution-warn { font-size: 0.86rem; color: var(--muted); }
.done-banner { display: flex; align-items: center; gap: 12px; background: var(--good-soft); border-radius: var(--r); padding: 12px 16px; }
.done-banner b { color: var(--good); }
.nav-steps { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }

.list-mod { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.list-mod:last-child { border-bottom: 0; }
.list-mod:hover { background: var(--surface-2); }
.list-mod .num { font: 600 13px var(--font-mono); color: var(--tc); }
.list-mod .t { font-weight: 600; }
.list-mod .g { font-size: 0.86rem; color: var(--muted); }
.list { padding: 0; overflow: hidden; }

.rev-card { display: flex; flex-direction: column; gap: 14px; border-top: 3px solid var(--tc); }
.recall-flow { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; }
.progress-dots { display: flex; gap: 5px; }
.progress-dots i { width: 22px; height: 5px; border-radius: 99px; background: var(--surface-2); }
.progress-dots i.on { background: var(--accent); }
.progress-dots i.ok { background: var(--good); }
.progress-dots i.ko { background: var(--warn); }
.sched { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.sched td, .sched th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.sched th { font-weight: 600; color: var(--muted); font-size: 0.8rem; }
.sched td.num { font-variant-numeric: tabular-nums; }

.form-grid { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 10px 14px; align-items: center; }
.form-grid label { font-weight: 500; font-size: 0.9rem; }
.swatches { display: flex; gap: 6px; }
.swatch { width: 26px; height: 26px; border-radius: 7px; border: 2px solid transparent; background: var(--tc); cursor: pointer; }
.swatch.on { border-color: var(--ink); }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; display: inline-block; }
@keyframes s { to { transform: rotate(360deg); } }
.err { color: var(--bad); font-size: 0.9rem; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 0.92rem; box-shadow: 0 6px 20px rgb(0 0 0 / 0.2); z-index: 50; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }


/* Accueil graphique */
.home-hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.25fr) minmax(0, 0.75fr) minmax(0, 0.75fr); gap: 14px; }
.ring { position: relative; flex: none; }
.ring svg { display: block; }
.ring circle { transition: stroke-dasharray 0.6s ease; }
.ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ring-in b { font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.ring-in b small { font-size: 0.7em; color: var(--muted); font-weight: 600; }
.ring-in span { font-size: 0.78rem; color: var(--muted); }
.hero-ring { display: flex; align-items: center; gap: 18px; }
.hero-ring .ring-in b { font-size: 2rem; }
.kpis { display: flex; flex-direction: column; gap: 10px; }
.kpis div { display: flex; align-items: baseline; gap: 8px; }
.kpis b { font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; min-width: 2ch; }
.kpis span { color: var(--muted); font-size: 0.86rem; white-space: nowrap; }
.kpis div:nth-child(1) b { color: var(--good); }
.kpis div:nth-child(2) b { color: var(--accent); }
.next-card { display: flex; flex-direction: column; gap: 8px; justify-content: center; border-left: 4px solid var(--tc, var(--accent)); }
.next-card h2 { font-size: 1.25rem; }
.next-card .btn { align-self: flex-start; }
.stat-card { display: flex; flex-direction: column; justify-content: center; gap: 4px; text-decoration: none; color: var(--ink); }
.stat-card .btn { align-self: flex-start; margin-top: 6px; }
.stat-num { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-num small { font-size: 0.45em; color: var(--muted); }
.stat-lbl { color: var(--muted); font-size: 0.88rem; }
.stat-card.warn .stat-num { color: var(--warn); }
.tr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.tr-ring { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 6px; border-radius: var(--r); text-decoration: none; color: var(--ink); font-size: 0.86rem; font-weight: 500; text-align: center; }
.tr-ring:hover { background: var(--surface-2); }
.hm-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1 1 300px; min-width: 260px; max-width: 680px; }
.hm-months { display: grid; gap: 4px; font-size: 0.72rem; color: var(--muted); }
.hm-months span { white-space: nowrap; overflow: visible; }
.hm-grid { display: grid; gap: 4px; }
.hm-col { display: grid; gap: 4px; }
.hm { display: block; width: 100%; aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); }
.hm-legend .hm { width: 11px; }
.hm.l-1 { background: transparent; }
.hm.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); }
.hm.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--surface-2)); }
.hm.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--surface-2)); }
.hm.l4 { background: var(--accent); }
.hm-legend { display: flex; align-items: center; gap: 3px; font-size: 0.72rem; color: var(--muted); }
.hm-legend span { margin: 0 4px; }
.act-row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.act-stats { display: flex; flex-direction: column; gap: 12px; }
.act-stats div { display: flex; align-items: baseline; gap: 8px; }

.track-head { width: 100%; border: 0; background: none; cursor: pointer; text-align: left; }

.track-group.open .chev { transform: rotate(45deg); }

@media (max-width: 1100px) { .home-hero { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .home-hero { grid-template-columns: minmax(0, 1fr); } .hero-ring { flex-direction: column; } .kpis { flex-direction: row; gap: 18px; } .kpis div { flex-direction: column; align-items: center; gap: 0; } .act-stats { flex-direction: row; gap: 18px; } .act-stats div { flex-direction: column; gap: 0; } .hm-months { font-size: 0.62rem; } }

}

"use strict";
const DATA = {"tracks": [{"id": "php", "name": "PHP orienté objet", "short": "PHP POO", "color": "violet", "desc": "Classes, encapsulation, héritage, interfaces, autoload, injection de dépendances."}, {"id": "doctrine", "name": "Doctrine ORM", "short": "Doctrine", "color": "orange", "desc": "Entités, migrations, persist/flush, repositories, relations, N+1."}, {"id": "dto", "name": "DTO avec Symfony", "short": "DTO", "color": "blue", "desc": "Recevoir et renvoyer du JSON proprement : DTO d'entrée, validation, sortie, filtres."}, {"id": "arch", "name": "Architecture : qui fait quoi", "short": "Architecture", "color": "olive", "desc": "Contrôleur, DTO, service, entité, repository : leurs rôles, leurs liens, et le trajet complet React → Symfony."}, {"id": "ddd", "name": "DDD (bonus)", "short": "DDD (bonus)", "color": "green", "desc": "Pour aller plus loin : value objects, entités riches, agrégats, architecture en couches."}, {"id": "react", "name": "React", "short": "React", "color": "cyan", "desc": "Composants, state, formulaires, effets, hooks personnalisés."}, {"id": "data", "name": "React : données & API", "short": "Données & API", "color": "rose", "desc": "Requêtes HTTP, fetch et axios, mutations, couche API, TanStack Query."}, {"id": "next", "name": "Next.js (App Router)", "short": "Next.js", "color": "graphite", "desc": "Routes, Server/Client Components, cache, Server Actions, API."}, {"id": "git", "name": "Git & GitHub", "short": "Git & GitHub", "color": "brick", "desc": "Le modèle de Git, merge, rebase, revenir en arrière, Conventional Commits, Pull Requests, outils."}], "modules": [{"id": "php-classes", "track": "php", "title": "Classes & objets", "minutes": 15, "goal": "Savoir créer une classe, l'instancier et comprendre ce que contient un objet.", "why": "Sans objets, les données et les fonctions qui les manipulent vivent séparément : n'importe quel code peut tout modifier, et ça finit par casser.", "flow": ["Tu écris la **classe** : le plan (propriétés + méthodes)", "`new Produit(...)` crée un **objet** en mémoire", "Le **constructeur** remplit son état initial", "Les **méthodes** lisent et modifient cet état via `$this`"], "points": ["Une classe ne fait rien seule. Chaque `new` crée un objet **indépendant** avec ses propres valeurs.", "`$this` = l'objet sur lequel la méthode est appelée.", "Depuis PHP 8, la **promotion de constructeur** déclare et remplit une propriété en une ligne : `public function __construct(private string $nom) {}`.", "Un objet passé à une fonction n'est **pas copié** : si la fonction le modifie, l'original est modifié. Pour une copie : `clone`."], "pitfalls": ["Oublier `$this->` : `$nom` tout seul est une variable locale, pas la propriété.", "Confondre `->` (objet) et `::` (statique, constante)."], "example": {"lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nclass Produit\n{\n    public function __construct(\n        private string $nom,\n        private float $prixHT,\n    ) {}\n\n    public function prixTTC(float $tva = 0.2): float\n    {\n        return round($this->prixHT * (1 + $tva), 2);\n    }\n\n    public function nom(): string\n    {\n        return $this->nom;\n    }\n}\n\n$clavier = new Produit('Clavier', 50.0);\n$souris  = new Produit('Souris', 20.0);\n\necho $clavier->prixTTC(); // 60\necho $souris->nom();      // Souris", "notes": ["`declare(strict_types=1)` : PHP refuse un mauvais type au lieu de le convertir en silence.", "`private string $nom` dans le constructeur déclare ET assigne la propriété.", "`$clavier` et `$souris` : même plan, deux états différents."]}, "quiz": [{"q": "Que se passe-t-il à chaque `new Produit(...)` ?", "options": ["La classe est rechargée", "Un nouvel objet indépendant est créé et son constructeur est appelé", "Le même objet est réutilisé", "Les propriétés statiques sont remises à zéro"], "answer": 1, "why": "Chaque `new` crée un objet distinct puis exécute `__construct`."}, {"q": "Dans une méthode, `$this` désigne…", "options": ["La classe", "L'objet sur lequel la méthode est appelée", "La classe parente", "Le dernier objet créé"], "answer": 1, "why": "`$clavier->prixTTC()` : dans `prixTTC`, `$this` est `$clavier`."}, {"q": "Une fonction reçoit l'objet `$p` et appelle `$p->renommer('X')`. L'objet d'origine…", "options": ["reste inchangé, PHP a copié l'objet", "est modifié : c'est le même objet", "provoque une erreur", "est détruit"], "answer": 1, "why": "Les objets ne sont pas copiés au passage en paramètre. Pour une copie, il faut `clone`."}], "td": {"title": "Compte bancaire", "enonce": "Crée une classe `CompteBancaire` qui gère un solde en respectant des règles simples.", "consignes": ["Constructeur : `titulaire` (string), solde de départ à 0", "`deposer(float $montant)` refuse un montant ≤ 0 (`InvalidArgumentException`)", "`retirer(float $montant)` refuse si le solde est insuffisant (`DomainException`)", "`solde(): float` pour lire le solde", "Le solde ne doit **pas** être modifiable depuis l'extérieur"], "starter": {"lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nclass CompteBancaire\n{\n    // à toi\n}\n\n$c = new CompteBancaire('Ana');\n$c->deposer(100);\n$c->retirer(30);\necho $c->solde(); // 70"}, "hints": ["Le solde est une propriété `private float $solde = 0;`.", "Exception : `throw new DomainException('Solde insuffisant');`", "Vérifie la condition AVANT de modifier le solde."], "solution": {"lang": "php", "code": "class CompteBancaire\n{\n    private float $solde = 0;\n\n    public function __construct(private string $titulaire) {}\n\n    public function deposer(float $montant): void\n    {\n        if ($montant <= 0) {\n            throw new InvalidArgumentException('Montant invalide');\n        }\n        $this->solde += $montant;\n    }\n\n    public function retirer(float $montant): void\n    {\n        if ($montant <= 0) {\n            throw new InvalidArgumentException('Montant invalide');\n        }\n        if ($montant > $this->solde) {\n            throw new DomainException('Solde insuffisant');\n        }\n        $this->solde -= $montant;\n    }\n\n    public function solde(): float\n    {\n        return $this->solde;\n    }\n}"}, "checks": ["`$c->solde = 1000;` provoque une erreur", "`retirer(500)` sur un compte à 70 lève une exception et le solde reste à 70", "`deposer(-5)` lève une exception"]}}, {"id": "php-encapsulation", "track": "php", "title": "Encapsulation & visibilité", "minutes": 15, "goal": "Protéger l'état d'un objet pour qu'il soit toujours valide.", "why": "Si n'importe qui peut écrire `$user->email = 'nimporte quoi'`, ton objet peut devenir invalide n'importe où dans le code.", "flow": ["L'état est **private**", "On ne le modifie que par des **méthodes** publiques", "Chaque méthode **vérifie les règles** (invariants)", "L'objet est donc **toujours valide**"], "points": ["`public` : accessible partout. `protected` : la classe et ses enfants. `private` : la classe seule.", "Un **invariant** est une règle toujours vraie pour l'objet (un email contient un @, un prix n'est pas négatif).", "Valide dans le **constructeur** : un objet invalide ne doit jamais exister.", "`readonly` (PHP 8.1) : la propriété ne s'écrit qu'une fois, à l'initialisation.", "Préfère des méthodes métier (`changerEmail()`) aux setters génériques (`setEmail()`) : le nom dit l'intention."], "pitfalls": ["Un getter ET un setter pour chaque propriété : c'est une propriété publique avec plus de code.", "Valider en dehors de l'objet : la règle finit dupliquée ou oubliée."], "example": {"lang": "php", "code": "final class Email\n{\n    public readonly string $valeur;\n\n    public function __construct(string $valeur)\n    {\n        $valeur = strtolower(trim($valeur));\n        if (!filter_var($valeur, FILTER_VALIDATE_EMAIL)) {\n            throw new InvalidArgumentException(\"Email invalide : $valeur\");\n        }\n        $this->valeur = $valeur;\n    }\n}\n\nfinal class Utilisateur\n{\n    public function __construct(private Email $email) {}\n\n    public function changerEmail(Email $nouveau): void\n    {\n        $this->email = $nouveau;\n    }\n\n    public function email(): Email\n    {\n        return $this->email;\n    }\n}\n\n$u = new Utilisateur(new Email('Ana@Mail.com'));\necho $u->email()->valeur; // ana@mail.com", "notes": ["`Email` valide dans son constructeur : un `Email` invalide ne peut pas exister.", "`readonly` : on lit `->valeur`, on ne peut pas la réécrire.", "`Utilisateur` n'a plus à valider l'email : le type `Email` le garantit."]}, "quiz": [{"q": "Où placer la validation d'un objet ?", "options": ["Dans le contrôleur", "Dans le constructeur et dans les méthodes qui modifient l'état", "Dans la base de données", "Dans un setter public"], "answer": 1, "why": "C'est l'objet qui connaît ses règles : il les vérifie à chaque changement d'état."}, {"q": "`protected` signifie…", "options": ["visible partout", "visible dans la classe et ses classes enfants", "visible dans le même fichier", "modifiable une seule fois"], "answer": 1, "why": "`protected` ouvre l'accès aux enfants, pas à l'extérieur."}, {"q": "Avantage de `changerEmail(Email $e)` sur `setEmail(string $e)` ?", "options": ["Aucun", "Il est plus rapide", "Le type garantit la validité et le nom exprime l'intention", "Il évite d'écrire un constructeur"], "answer": 2, "why": "Le type `Email` est forcément valide, et le nom de la méthode parle le langage du métier."}], "td": {"title": "Prix et panier", "enonce": "Crée un objet `Prix` qui ne peut jamais être négatif, et un `Panier` qui l'utilise.", "consignes": ["`Prix` : propriété `readonly int $centimes` (on stocke en centimes pour éviter les erreurs d'arrondi)", "Exception si `$centimes < 0`", "`ajouter(Prix $autre): Prix` **renvoie un nouveau** `Prix` sans modifier l'actuel", "`Panier` : `ajouterArticle(Prix $p)` et `total(): Prix`, aucune propriété publique"], "starter": {"lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nfinal class Prix\n{\n    // à toi\n}\n\nfinal class Panier\n{\n    // à toi\n}\n\n$panier = new Panier();\n$panier->ajouterArticle(new Prix(1999));\n$panier->ajouterArticle(new Prix(500));\necho $panier->total()->centimes; // 2499"}, "hints": ["`ajouter` fait `return new Prix($this->centimes + $autre->centimes);`", "Dans `Panier`, garde une liste `private array $articles = [];`", "Calcule le total à la demande en partant de `new Prix(0)`."], "solution": {"lang": "php", "code": "final class Prix\n{\n    public function __construct(public readonly int $centimes)\n    {\n        if ($centimes < 0) {\n            throw new InvalidArgumentException('Prix négatif');\n        }\n    }\n\n    public function ajouter(Prix $autre): Prix\n    {\n        return new Prix($this->centimes + $autre->centimes);\n    }\n}\n\nfinal class Panier\n{\n    /** @var Prix[] */\n    private array $articles = [];\n\n    public function ajouterArticle(Prix $prix): void\n    {\n        $this->articles[] = $prix;\n    }\n\n    public function total(): Prix\n    {\n        $total = new Prix(0);\n        foreach ($this->articles as $prix) {\n            $total = $total->ajouter($prix);\n        }\n        return $total;\n    }\n}"}, "checks": ["`new Prix(-1)` lève une exception", "`$p->centimes = 5;` provoque une erreur", "`ajouter` ne modifie pas l'objet d'origine"]}}, {"id": "php-heritage", "track": "php", "title": "Héritage & classes abstraites", "minutes": 15, "goal": "Savoir quand hériter, et à quoi sert une classe abstraite.", "why": "Plusieurs classes partagent une structure et du code. L'héritage évite de le dupliquer, mais mal utilisé il rigidifie tout.", "flow": ["Une classe **abstraite** définit ce qui est commun", "Elle déclare des méthodes **abstraites**, sans corps", "Chaque **enfant** (`extends`) les implémente", "Le code appelant manipule le **parent** sans connaître l'enfant"], "points": ["`extends` : l'enfant récupère les méthodes `public` et `protected` du parent.", "Une classe `abstract` ne s'instancie pas : elle sert de base.", "`parent::__construct(...)` appelle le constructeur du parent.", "Test « est-un » : un `Cercle` **est une** `Forme` → héritage. Une `Voiture` **a un** `Moteur` → composition (une propriété).", "`final` interdit d'hériter : bon réflexe par défaut pour les classes non prévues pour ça."], "pitfalls": ["Hériter juste pour réutiliser une méthode : préfère la composition.", "Des hiérarchies sur 3 niveaux ou plus deviennent vite illisibles."], "example": {"lang": "php", "code": "abstract class Forme\n{\n    public function __construct(protected string $nom) {}\n\n    abstract public function aire(): float;\n\n    public function decrire(): string\n    {\n        return sprintf('%s : %.2f m²', $this->nom, $this->aire());\n    }\n}\n\nfinal class Cercle extends Forme\n{\n    public function __construct(private float $rayon)\n    {\n        parent::__construct('Cercle');\n    }\n\n    public function aire(): float\n    {\n        return M_PI * $this->rayon ** 2;\n    }\n}\n\nfinal class Rectangle extends Forme\n{\n    public function __construct(private float $l, private float $h)\n    {\n        parent::__construct('Rectangle');\n    }\n\n    public function aire(): float\n    {\n        return $this->l * $this->h;\n    }\n}\n\nforeach ([new Cercle(1), new Rectangle(2, 3)] as $forme) {\n    echo $forme->decrire(), PHP_EOL;\n}", "notes": ["`decrire()` est écrit une seule fois dans le parent, mais appelle l'`aire()` de l'enfant.", "La boucle ne sait pas si c'est un cercle ou un rectangle : c'est le **polymorphisme**.", "`protected $nom` : visible dans les enfants, pas depuis l'extérieur."]}, "quiz": [{"q": "`Forme` est abstraite. Peut-on faire `new Forme('x')` ?", "options": ["Oui", "Non, une classe abstraite ne s'instancie pas", "Oui si elle a un constructeur", "Seulement en PHP 8"], "answer": 1, "why": "Elle sert uniquement de base aux classes enfants."}, {"q": "Une `Commande` a une `Adresse`. Que choisir ?", "options": ["`Commande extends Adresse`", "`Adresse extends Commande`", "Composition : une propriété `Adresse` dans `Commande`", "Un trait"], "answer": 2, "why": "« A un » = composition. L'héritage est réservé au « est un »."}, {"q": "Dans `decrire()`, `$this->aire()` appelle…", "options": ["toujours la méthode abstraite", "la méthode de la classe réelle de l'objet", "une erreur", "la méthode du parent"], "answer": 1, "why": "PHP choisit la méthode selon la classe réelle de l'objet au moment de l'appel."}], "td": {"title": "Employés et salaires", "enonce": "Modélise des employés dont le salaire se calcule différemment selon leur type.", "consignes": ["Classe abstraite `Employe` avec `nom` et une méthode abstraite `salaireMensuel(): float`", "`Salarie` : salaire annuel / 12", "`Freelance` : taux journalier × jours travaillés", "Méthode commune `fiche(): string` dans `Employe` → « Ana : 2500.00 € »", "Calcule la masse salariale d'un tableau d'employés"], "starter": {"lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\nabstract class Employe\n{\n    // à toi\n}\n\n// Salarie, Freelance...\n\n$equipe = [new Salarie('Ana', 30000), new Freelance('Léo', 400, 10)];\n// affiche chaque fiche + le total"}, "hints": ["`abstract public function salaireMensuel(): float;`", "`fiche()` : `sprintf('%s : %.2f €', $this->nom, $this->salaireMensuel())`", "Total : `array_sum(array_map(fn(Employe $e) => $e->salaireMensuel(), $equipe))`"], "solution": {"lang": "php", "code": "abstract class Employe\n{\n    public function __construct(protected string $nom) {}\n\n    abstract public function salaireMensuel(): float;\n\n    public function fiche(): string\n    {\n        return sprintf('%s : %.2f €', $this->nom, $this->salaireMensuel());\n    }\n}\n\nfinal class Salarie extends Employe\n{\n    public function __construct(string $nom, private float $annuel)\n    {\n        parent::__construct($nom);\n    }\n\n    public function salaireMensuel(): float\n    {\n        return $this->annuel / 12;\n    }\n}\n\nfinal class Freelance extends Employe\n{\n    public function __construct(string $nom, private float $tjm, private int $jours)\n    {\n        parent::__construct($nom);\n    }\n\n    public function salaireMensuel(): float\n    {\n        return $this->tjm * $this->jours;\n    }\n}\n\n$equipe = [new Salarie('Ana', 30000), new Freelance('Léo', 400, 10)];\nforeach ($equipe as $e) {\n    echo $e->fiche(), PHP_EOL;\n}\n$total = array_sum(array_map(fn(Employe $e) => $e->salaireMensuel(), $equipe));\necho \"Total : $total €\";"}, "checks": ["Ajouter un nouveau type d'employé ne demande pas de toucher à `fiche()`", "`new Employe('x')` est impossible"]}}, {"id": "php-interfaces", "track": "php", "title": "Interfaces & polymorphisme", "minutes": 15, "goal": "Programmer contre un contrat plutôt que contre une classe précise.", "why": "Si ton service dépend de `MailjetMailer`, changer de fournisseur oblige à modifier le service. Avec une interface, tu changes seulement l'implémentation.", "flow": ["L'**interface** décrit le contrat (des méthodes, sans code)", "Des classes l'**implémentent** (`implements`)", "Ton service **demande l'interface**, pas une classe", "On peut **brancher** n'importe quelle implémentation"], "points": ["Une interface = une liste de méthodes publiques à fournir. Pas d'état, pas de code.", "Une classe peut implémenter **plusieurs** interfaces, mais n'hérite que d'**une** classe.", "Interface : ce que ça sait faire. Classe abstraite : ce que c'est, avec du code partagé.", "C'est la base de l'injection de dépendances et des repositories en DDD."], "pitfalls": ["Une interface pour chaque classe « au cas où » : crée-la quand tu as plusieurs implémentations ou besoin de tester.", "Mettre dans l'interface des méthodes qu'une seule implémentation utilise."], "example": {"lang": "php", "code": "interface Notifier\n{\n    public function envoyer(string $destinataire, string $message): void;\n}\n\nfinal class EmailNotifier implements Notifier\n{\n    public function envoyer(string $destinataire, string $message): void\n    {\n        echo \"Email à $destinataire : $message\\n\";\n    }\n}\n\nfinal class SmsNotifier implements Notifier\n{\n    public function envoyer(string $destinataire, string $message): void\n    {\n        echo \"SMS à $destinataire : $message\\n\";\n    }\n}\n\nfinal class AlerteStock\n{\n    public function __construct(private Notifier $notifier) {}\n\n    public function verifier(string $produit, int $stock): void\n    {\n        if ($stock < 5) {\n            $this->notifier->envoyer('gerant', \"Stock bas : $produit ($stock)\");\n        }\n    }\n}\n\n(new AlerteStock(new SmsNotifier()))->verifier('Clavier', 2);", "notes": ["`AlerteStock` ne sait pas si c'est un email ou un SMS.", "Pour passer à l'email, on change uniquement la ligne de création.", "En test, on passe un faux `Notifier` qui enregistre les messages."]}, "quiz": [{"q": "Combien d'interfaces une classe peut-elle implémenter ?", "options": ["Une seule", "Deux maximum", "Autant qu'elle veut", "Aucune si elle hérite déjà"], "answer": 2, "why": "`class A extends B implements C, D, E` est valide."}, {"q": "Pourquoi `AlerteStock` reçoit-il un `Notifier` et pas un `SmsNotifier` ?", "options": ["Pour la performance", "Pour changer d'implémentation sans modifier `AlerteStock`", "Parce que `SmsNotifier` est final", "C'est obligatoire en PHP"], "answer": 1, "why": "Il dépend du contrat, pas d'un fournisseur précis."}, {"q": "Une interface peut contenir…", "options": ["des propriétés privées", "des signatures de méthodes publiques (et des constantes)", "le code des méthodes", "un constructeur avec du code"], "answer": 1, "why": "Une interface décrit, elle n'implémente pas."}], "td": {"title": "Moyens de paiement", "enonce": "Ton site accepte plusieurs moyens de paiement. Le service de commande ne doit pas savoir lequel est utilisé.", "consignes": ["Interface `PaymentGateway` avec `payer(int $centimes): string` (renvoie un id de transaction)", "`StripeGateway` : id préfixé `stripe_`", "`FakeGateway` (pour les tests) : mémorise les montants payés dans `public array $paiements`", "`CheckoutService` reçoit une `PaymentGateway`, méthode `checkout(int $centimes): string`", "`checkout` refuse un montant ≤ 0"], "starter": {"lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\ninterface PaymentGateway\n{\n    // à toi\n}\n\n// StripeGateway, FakeGateway, CheckoutService\n\n$fake = new FakeGateway();\n$service = new CheckoutService($fake);\n$service->checkout(4200);\nvar_dump($fake->paiements); // [4200]"}, "hints": ["`uniqid('stripe_')` génère un id simple.", "`FakeGateway` ajoute chaque montant à `$this->paiements[]`.", "`public function __construct(private PaymentGateway $gateway) {}`"], "solution": {"lang": "php", "code": "interface PaymentGateway\n{\n    public function payer(int $centimes): string;\n}\n\nfinal class StripeGateway implements PaymentGateway\n{\n    public function payer(int $centimes): string\n    {\n        // appel à l'API Stripe ici\n        return uniqid('stripe_');\n    }\n}\n\nfinal class FakeGateway implements PaymentGateway\n{\n    public array $paiements = [];\n\n    public function payer(int $centimes): string\n    {\n        $this->paiements[] = $centimes;\n        return 'fake_' . count($this->paiements);\n    }\n}\n\nfinal class CheckoutService\n{\n    public function __construct(private PaymentGateway $gateway) {}\n\n    public function checkout(int $centimes): string\n    {\n        if ($centimes <= 0) {\n            throw new InvalidArgumentException('Montant invalide');\n        }\n        return $this->gateway->payer($centimes);\n    }\n}"}, "checks": ["`CheckoutService` ne mentionne jamais Stripe", "Tu peux tester `checkout` sans réseau grâce à `FakeGateway`"]}}, {"id": "php-namespaces", "track": "php", "title": "Namespaces & autoload", "minutes": 12, "goal": "Organiser le code en dossiers et laisser Composer charger les classes.", "why": "Sans namespace, ta classe `User` entre en conflit avec celle d'une librairie, et tu dois écrire des `require` partout.", "flow": ["Chaque fichier déclare un **namespace** (`App\\Catalogue`)", "Le namespace **suit les dossiers** (norme PSR-4)", "`composer.json` associe `App\\` au dossier `src/`", "Quand tu utilises une classe, l'**autoloader** trouve et charge le fichier"], "points": ["PSR-4 : `App\\Catalogue\\Produit` → `src/Catalogue/Produit.php`. Une classe par fichier, nom du fichier = nom de la classe.", "`use App\\Catalogue\\Produit;` permet d'écrire `Produit` sans le chemin complet.", "`require __DIR__ . '/vendor/autoload.php';` une seule fois, au point d'entrée.", "Après avoir changé la section `autoload` : `composer dump-autoload`.", "Symfony le fait déjà : `src/` correspond à `App\\`."], "pitfalls": ["Namespace qui ne correspond pas au dossier → « Class not found ».", "Dans un namespace, `new DateTimeImmutable()` sans `use` cherche `App\\...\\DateTimeImmutable`. Ajoute `use DateTimeImmutable;` ou écris `\\DateTimeImmutable`."], "example": {"lang": "php", "code": "// composer.json\n// {\n//   \"autoload\": { \"psr-4\": { \"App\\\\\": \"src/\" } }\n// }\n\n// src/Catalogue/Produit.php\nnamespace App\\Catalogue;\n\nuse DateTimeImmutable;\n\nfinal class Produit\n{\n    public function __construct(\n        private string $nom,\n        private DateTimeImmutable $creeLe = new DateTimeImmutable(),\n    ) {}\n}\n\n// public/index.php\nrequire __DIR__ . '/../vendor/autoload.php';\n\nuse App\\Catalogue\\Produit;\n\n$produit = new Produit('Clavier');", "notes": ["Le dossier `src/Catalogue` correspond au namespace `App\\Catalogue`.", "`use DateTimeImmutable;` importe la classe globale de PHP.", "`index.php` ne fait aucun `require` de `Produit.php` : l'autoloader s'en charge."]}, "quiz": [{"q": "Avec `App\\` → `src/`, où se trouve `App\\Infra\\Doctrine\\OrderRepo` ?", "options": ["src/App/Infra/Doctrine/OrderRepo.php", "src/Infra/Doctrine/OrderRepo.php", "Infra/Doctrine/OrderRepo.php", "vendor/App/OrderRepo.php"], "answer": 1, "why": "Le préfixe `App\\` est remplacé par `src/`, le reste suit les dossiers."}, {"q": "Tu viens d'ajouter un mapping PSR-4 dans composer.json. Que lancer ?", "options": ["composer install --force", "composer dump-autoload", "php -l", "Rien"], "answer": 1, "why": "`dump-autoload` régénère la table de chargement."}, {"q": "Dans `namespace App\\Domain;`, `new DateTimeImmutable()` sans `use`…", "options": ["trouve la classe globale", "cherche `App\\Domain\\DateTimeImmutable` → erreur", "cherche dans vendor", "cherche dans le namespace parent"], "answer": 1, "why": "Pour les classes, PHP ne retombe pas sur l'espace global : il faut `use` ou `\\`."}], "td": {"title": "Ranger un mini-projet", "enonce": "Organise un petit projet avec Composer et PSR-4, sans aucun `require` de classe.", "consignes": ["`composer.json` avec le préfixe `App\\` vers `src/`", "`src/Catalogue/Produit.php` (namespace `App\\Catalogue`)", "`src/Catalogue/Catalogue.php` qui stocke des `Produit`, avec `ajouter()` et `compter()`", "`index.php` qui charge l'autoload et utilise les deux classes", "Lance `composer dump-autoload` puis `php index.php`"], "starter": {"lang": "plaintext", "code": "mon-projet/\n├── composer.json\n├── index.php\n└── src/\n    └── Catalogue/\n        ├── Produit.php\n        └── Catalogue.php"}, "hints": ["`composer.json` minimal : `{\"autoload\": {\"psr-4\": {\"App\\\\\": \"src/\"}}}`", "Dans `Catalogue.php`, `Produit` est dans le même namespace : pas besoin de `use`.", "`index.php` est à la racine : `require __DIR__ . '/vendor/autoload.php';`"], "solution": {"lang": "php", "code": "// composer.json\n// { \"autoload\": { \"psr-4\": { \"App\\\\\": \"src/\" } } }\n\n// src/Catalogue/Produit.php\nnamespace App\\Catalogue;\n\nfinal class Produit\n{\n    public function __construct(public readonly string $nom) {}\n}\n\n// src/Catalogue/Catalogue.php\nnamespace App\\Catalogue;\n\nfinal class Catalogue\n{\n    /** @var Produit[] */\n    private array $produits = [];\n\n    public function ajouter(Produit $p): void\n    {\n        $this->produits[] = $p;\n    }\n\n    public function compter(): int\n    {\n        return count($this->produits);\n    }\n}\n\n// index.php\nrequire __DIR__ . '/vendor/autoload.php';\n\nuse App\\Catalogue\\Catalogue;\nuse App\\Catalogue\\Produit;\n\n$catalogue = new Catalogue();\n$catalogue->ajouter(new Produit('Clavier'));\necho $catalogue->compter(); // 1"}, "checks": ["`php index.php` fonctionne sans `require` de tes classes", "Renomme le dossier `Catalogue` sans changer le namespace : tu obtiens « Class not found » (essaie)"]}}, {"id": "php-di", "track": "php", "title": "Injection de dépendances", "minutes": 15, "goal": "Comprendre pourquoi on passe les dépendances au constructeur au lieu de les créer.", "why": "Une classe qui fait `new PDO(...)` ou `new Mailer()` à l'intérieur est impossible à tester et à reconfigurer.", "flow": ["La classe **déclare** ce dont elle a besoin dans son constructeur", "Quelqu'un d'autre **crée** les dépendances", "et les **injecte** à la création", "En Symfony, le **conteneur** le fait automatiquement (autowiring)"], "points": ["Une classe de service ne fait pas `new` de ses services : elle les reçoit.", "Les objets valeur (`Email`, `Prix`, `DateTimeImmutable`) peuvent être créés avec `new` partout : ce ne sont pas des services.", "Interface + injection = changer d'implémentation sans toucher la classe.", "En Symfony, type-hinter le constructeur suffit : le conteneur trouve le service."], "pitfalls": ["Injecter le conteneur lui-même et piocher dedans : ça cache les vraies dépendances.", "Un constructeur avec 8 dépendances : la classe fait trop de choses, découpe-la."], "example": {"lang": "php", "code": "// AVANT : couplé, impossible à tester sans vraie base ni vrai serveur mail\nfinal class InscriptionService\n{\n    public function inscrire(string $email): void\n    {\n        $repo = new MysqlUserRepository(new PDO('mysql:...'));\n        $repo->save($email);\n        (new SmtpMailer())->send($email, 'Bienvenue');\n    }\n}\n\n// APRÈS : les dépendances arrivent de l'extérieur\nfinal class InscriptionService\n{\n    public function __construct(\n        private UserRepository $users,\n        private Mailer $mailer,\n    ) {}\n\n    public function inscrire(string $email): void\n    {\n        $this->users->save($email);\n        $this->mailer->send($email, 'Bienvenue');\n    }\n}\n\n// En test :\n$service = new InscriptionService(new InMemoryUserRepository(), new FakeMailer());", "notes": ["`UserRepository` et `Mailer` sont des interfaces.", "En production, Symfony injecte les vraies implémentations.", "En test, on injecte des versions en mémoire : rapide et sans effets de bord."]}, "quiz": [{"q": "Quelle classe peut raisonnablement être créée avec `new` dans un service ?", "options": ["Un repository Doctrine", "Un client HTTP", "Un objet valeur comme `Email` ou `DateTimeImmutable`", "Le mailer"], "answer": 2, "why": "Les objets valeur n'ont pas de dépendances externes à remplacer."}, {"q": "Avantage principal de l'injection ?", "options": ["Le code est plus court", "On peut remplacer les dépendances (tests, autre implémentation) sans modifier la classe", "PHP va plus vite", "On évite les namespaces"], "answer": 1, "why": "La classe ne décide plus quelle implémentation utiliser."}, {"q": "En Symfony, comment un service reçoit-il un autre service ?", "options": ["`$this->get('service')`", "En le type-hintant dans son constructeur (autowiring)", "Avec `new`", "Via une variable globale"], "answer": 1, "why": "Le conteneur lit les types du constructeur et injecte ce qui correspond."}], "td": {"title": "Rendre testable", "enonce": "Ce service est impossible à tester. Refactorise-le avec l'injection de dépendances.", "consignes": ["Extrais l'accès aux données dans une interface `VentesRepository` : `totalDu(DateTimeImmutable $jour): float`", "Extrais l'horloge dans une interface `Horloge` : `aujourdhui(): DateTimeImmutable` (sinon le test dépend du jour)", "Injecte les deux dans le constructeur de `RapportService`", "Écris un petit test à la main avec de fausses implémentations"], "starter": {"lang": "php", "code": "final class RapportService\n{\n    public function genererDuJour(): string\n    {\n        $date = new DateTimeImmutable('today');\n        $pdo = new PDO('mysql:host=localhost;dbname=shop', 'root', '');\n        $stmt = $pdo->prepare('SELECT SUM(total) FROM commandes WHERE DATE(passee_le) = ?');\n        $stmt->execute([$date->format('Y-m-d')]);\n        $total = (float) $stmt->fetchColumn();\n\n        return sprintf('Ventes du %s : %.2f €', $date->format('d/m/Y'), $total);\n    }\n}"}, "hints": ["La requête SQL part dans une classe `PdoVentesRepository implements VentesRepository`.", "Fausse horloge en une ligne : une classe anonyme `new class implements Horloge { ... }`.", "Vérifie le résultat avec `assert(...)`."], "solution": {"lang": "php", "code": "interface VentesRepository\n{\n    public function totalDu(DateTimeImmutable $jour): float;\n}\n\ninterface Horloge\n{\n    public function aujourdhui(): DateTimeImmutable;\n}\n\nfinal class RapportService\n{\n    public function __construct(\n        private VentesRepository $ventes,\n        private Horloge $horloge,\n    ) {}\n\n    public function genererDuJour(): string\n    {\n        $jour = $this->horloge->aujourdhui();\n        $total = $this->ventes->totalDu($jour);\n\n        return sprintf('Ventes du %s : %.2f €', $jour->format('d/m/Y'), $total);\n    }\n}\n\n// Test à la main\n$service = new RapportService(\n    new class implements VentesRepository {\n        public function totalDu(DateTimeImmutable $jour): float { return 1234.5; }\n    },\n    new class implements Horloge {\n        public function aujourdhui(): DateTimeImmutable { return new DateTimeImmutable('2026-01-15'); }\n    },\n);\nassert($service->genererDuJour() === 'Ventes du 15/01/2026 : 1234.50 €');"}, "checks": ["`RapportService` ne contient plus `new PDO` ni `new DateTimeImmutable('today')`", "Le test donne le même résultat quel que soit le jour"]}}, {"id": "doc-orm", "track": "doctrine", "title": "ORM, entités & migrations", "minutes": 15, "goal": "Comprendre ce que Doctrine fait entre tes objets et la base de données.", "why": "Écrire du SQL à la main pour chaque objet est long et fragile. Doctrine traduit tes objets en lignes, et inversement.", "flow": ["Tu écris une **entité** : une classe PHP + des attributs de mapping", "Doctrine lit le **mapping** : classe → table, propriété → colonne", "Une **migration** crée ou modifie la table", "L'**EntityManager** sauvegarde et recharge tes objets"], "points": ["Entité = classe dont les objets sont stockés en base, avec un identifiant.", "`#[ORM\\Column]` décrit chaque colonne ; le type est souvent déduit du type PHP.", "`php bin/console make:migration` génère le SQL à partir de la différence entre tes entités et la base. `php bin/console doctrine:migrations:migrate` l'exécute.", "Doctrine **hydrate** les objets : il remplit les propriétés directement, sans appeler ton constructeur."], "pitfalls": ["Modifier la base à la main au lieu de passer par une migration : tes environnements divergent.", "Ajouter des setters partout « parce que Doctrine en a besoin » : il n'en a pas besoin."], "example": {"lang": "php", "code": "namespace App\\Entity;\n\nuse App\\Repository\\ArticleRepository;\nuse Doctrine\\DBAL\\Types\\Types;\nuse Doctrine\\ORM\\Mapping as ORM;\n\n#[ORM\\Entity(repositoryClass: ArticleRepository::class)]\nclass Article\n{\n    #[ORM\\Id]\n    #[ORM\\GeneratedValue]\n    #[ORM\\Column]\n    private ?int $id = null;\n\n    #[ORM\\Column(length: 180)]\n    private string $titre;\n\n    #[ORM\\Column(type: Types::TEXT)]\n    private string $contenu;\n\n    #[ORM\\Column]\n    private \\DateTimeImmutable $creeLe;\n\n    public function __construct(string $titre, string $contenu)\n    {\n        $this->titre = $titre;\n        $this->contenu = $contenu;\n        $this->creeLe = new \\DateTimeImmutable();\n    }\n\n    public function getId(): ?int { return $this->id; }\n    public function getTitre(): string { return $this->titre; }\n\n    public function renommer(string $titre): void\n    {\n        $this->titre = $titre;\n    }\n}", "notes": ["`?int $id = null` : l'id n'existe qu'après l'insertion en base.", "`string` → VARCHAR, `DateTimeImmutable` → DATETIME : Doctrine déduit le type.", "Pas de `setId()` : c'est la base qui génère l'id."]}, "quiz": [{"q": "Quand Doctrine recharge un `Article` depuis la base, il…", "options": ["appelle le constructeur", "remplit les propriétés directement, sans le constructeur", "appelle les setters", "renvoie un tableau"], "answer": 1, "why": "C'est pour ça que ton constructeur peut exiger des paramètres métier."}, {"q": "Quelle commande génère le fichier de migration ?", "options": ["doctrine:schema:update --force", "make:migration", "make:entity --regenerate", "cache:clear"], "answer": 1, "why": "`make:migration` compare tes entités et la base, puis écrit le SQL dans un fichier versionné."}, {"q": "Pourquoi `$id` vaut `null` juste après `new Article(...)` ?", "options": ["Bug de Doctrine", "L'id est généré par la base à l'insertion (au flush)", "Il faut appeler setId", "Le constructeur l'oublie"], "answer": 1, "why": "Avec `GeneratedValue`, l'id vient de la base."}], "td": {"title": "Entité Livre", "enonce": "Crée une entité `Livre` pour une bibliothèque, puis sa migration.", "consignes": ["Champs : `id`, `titre` (255), `isbn` (13, unique), `publieLe` (date immuable), `disponible` (bool, `true` par défaut)", "Constructeur avec titre, isbn et date", "Méthodes métier `emprunter()` (exception si déjà indisponible) et `rendre()`", "Génère puis lance la migration"], "starter": {"lang": "php", "code": "namespace App\\Entity;\n\nuse Doctrine\\DBAL\\Types\\Types;\nuse Doctrine\\ORM\\Mapping as ORM;\n\n#[ORM\\Entity]\nclass Livre\n{\n    // à toi\n}"}, "hints": ["Unique : `#[ORM\\Column(length: 13, unique: true)]`", "Date sans heure : `#[ORM\\Column(type: Types::DATE_IMMUTABLE)]`", "Valeur par défaut : `private bool $disponible = true;`"], "solution": {"lang": "php", "code": "#[ORM\\Entity]\nclass Livre\n{\n    #[ORM\\Id, ORM\\GeneratedValue, ORM\\Column]\n    private ?int $id = null;\n\n    #[ORM\\Column(length: 255)]\n    private string $titre;\n\n    #[ORM\\Column(length: 13, unique: true)]\n    private string $isbn;\n\n    #[ORM\\Column(type: Types::DATE_IMMUTABLE)]\n    private \\DateTimeImmutable $publieLe;\n\n    #[ORM\\Column]\n    private bool $disponible = true;\n\n    public function __construct(string $titre, string $isbn, \\DateTimeImmutable $publieLe)\n    {\n        $this->titre = $titre;\n        $this->isbn = $isbn;\n        $this->publieLe = $publieLe;\n    }\n\n    public function emprunter(): void\n    {\n        if (!$this->disponible) {\n            throw new \\DomainException('Livre déjà emprunté');\n        }\n        $this->disponible = false;\n    }\n\n    public function rendre(): void\n    {\n        $this->disponible = true;\n    }\n}\n\n// Terminal :\n// php bin/console make:migration\n// php bin/console doctrine:migrations:migrate"}, "checks": ["La migration contient un index UNIQUE sur `isbn`", "Aucun `setDisponible()` : on passe par `emprunter()` et `rendre()`"]}}, {"id": "doc-uow", "track": "doctrine", "title": "persist, flush & Unit of Work", "minutes": 12, "goal": "Savoir exactement quand Doctrine écrit en base.", "why": "Beaucoup de bugs viennent de là : « j'ai modifié l'objet mais rien n'est en base », ou l'inverse.", "flow": ["`persist($obj)` : Doctrine **commence à suivre** un nouvel objet", "Les objets chargés depuis la base sont **déjà suivis** (managed)", "Tu modifies tes objets normalement", "`flush()` **compare** et envoie tous les INSERT / UPDATE / DELETE dans une transaction"], "points": ["`persist` n'écrit rien. Seul `flush` exécute du SQL.", "Un objet récupéré via `find()` est déjà suivi : le modifier puis `flush()` suffit.", "La **Unit of Work** garde l'état d'origine de chaque objet suivi et calcule les différences au flush.", "`remove($obj)` marque pour suppression, effective au `flush`.", "Un seul `flush()` à la fin d'une action, pas un par objet."], "pitfalls": ["`flush()` dans une boucle : une transaction par tour, très lent.", "Oublier `persist` sur un **nouvel** objet : il n'est jamais inséré (sauf cascade)."], "example": {"lang": "php", "code": "// Créer\n$article = new Article('Hello', 'Premier article');\n$em->persist($article);   // suivi, rien en base\n$em->flush();             // INSERT INTO article ...\n\n// Modifier\n$article = $em->find(Article::class, 42); // déjà suivi\n$article->renommer('Nouveau titre');\n$em->flush();             // UPDATE article SET titre = ... WHERE id = 42\n\n// Supprimer\n$em->remove($article);\n$em->flush();             // DELETE FROM article WHERE id = 42", "notes": ["En Symfony, `$em` est un `EntityManagerInterface` injecté.", "Le bloc « Modifier » n'a pas de `persist` : l'objet vient de la base.", "Si rien n'a changé, `flush()` n'envoie aucune requête."]}, "quiz": [{"q": "Après `$em->persist($a)` sans `flush`, la ligne est-elle en base ?", "options": ["Oui", "Non", "Seulement en dev", "Oui, mais sans id"], "answer": 1, "why": "`persist` ne fait qu'inscrire l'objet dans la Unit of Work."}, {"q": "Tu charges un article avec `find`, changes son titre, puis `flush()`. Résultat ?", "options": ["Rien, il manque persist", "Un UPDATE automatique", "Un INSERT en double", "Une exception"], "answer": 1, "why": "L'objet est déjà suivi : Doctrine détecte le changement."}, {"q": "Tu importes 1000 produits. Où placer `flush()` ?", "options": ["Après chaque persist", "Une fois à la fin, ou par lots d'environ 100", "Jamais", "Avant les persist"], "answer": 1, "why": "Les lots évitent à la fois 1000 transactions et une mémoire qui explose."}], "td": {"title": "Prédire le SQL", "enonce": "Sans exécuter, écris en commentaire les requêtes envoyées à chaque `flush()`. Vérifie ensuite dans le profiler Symfony (onglet Doctrine).", "consignes": ["Pour chaque flush, écris INSERT, UPDATE, DELETE ou « rien »", "Justifie chaque réponse en une phrase"], "starter": {"lang": "php", "code": "$a = new Article('A', '...');\n$b = new Article('B', '...');\n$em->persist($a);\n$em->flush();          // 1) ?\n\n$b->renommer('B2');\n$em->flush();          // 2) ?\n\n$a->renommer('A2');\n$em->flush();          // 3) ?\n\n$em->persist($b);\n$em->remove($a);\n$em->flush();          // 4) ?\n\n$em->flush();          // 5) ?"}, "hints": ["`$b` n'a pas encore été persisté au 2e flush.", "Au 4e flush, `$b` porte déjà le titre « B2 »."], "solution": {"lang": "php", "code": "// 1) INSERT article (A) : $a est persisté\n// 2) Rien : $b n'est pas suivi par Doctrine\n// 3) UPDATE article SET titre = 'A2' WHERE id = <id de A> : $a est suivi\n// 4) INSERT article (B2) + DELETE article WHERE id = <id de A>, dans une transaction\n// 5) Rien : aucun changement depuis le dernier flush"}, "checks": ["Tu sais expliquer pourquoi le 2) n'envoie rien", "Tu as vérifié dans le profiler"]}}, {"id": "doc-repo", "track": "doctrine", "title": "Repositories & requêtes", "minutes": 15, "goal": "Récupérer des entités proprement : find, findBy, QueryBuilder.", "why": "Des requêtes éparpillées dans les contrôleurs sont dupliquées et dures à modifier. Le repository les rassemble.", "flow": ["Chaque entité a un **repository**", "Méthodes prêtes : `find`, `findBy`, `findOneBy`", "Pour le reste : une **méthode nommée** avec le QueryBuilder", "Le QueryBuilder produit du **DQL** (sur les entités), traduit en SQL"], "points": ["Le DQL parle d'**entités et de propriétés** (`a.creeLe`), pas de tables et de colonnes.", "Toujours des **paramètres** (`:depuis`) : jamais de concaténation, sinon injection SQL.", "Nomme les méthodes selon le besoin : `findPubliesDepuis()` plutôt que `findByStatusAndDate()`.", "`getResult()` : liste d'objets. `getOneOrNullResult()` : un objet ou null. `getSingleScalarResult()` : une valeur."], "pitfalls": ["Écrire du QueryBuilder dans un contrôleur.", "Charger toute la table puis filtrer en PHP avec `array_filter`."], "example": {"lang": "php", "code": "namespace App\\Repository;\n\nuse App\\Entity\\Article;\nuse Doctrine\\Bundle\\DoctrineBundle\\Repository\\ServiceEntityRepository;\nuse Doctrine\\Persistence\\ManagerRegistry;\n\n/** @extends ServiceEntityRepository<Article> */\nclass ArticleRepository extends ServiceEntityRepository\n{\n    public function __construct(ManagerRegistry $registry)\n    {\n        parent::__construct($registry, Article::class);\n    }\n\n    /** @return Article[] */\n    public function findPubliesDepuis(\\DateTimeImmutable $depuis, int $max = 10): array\n    {\n        return $this->createQueryBuilder('a')\n            ->andWhere('a.publie = true')\n            ->andWhere('a.creeLe >= :depuis')\n            ->setParameter('depuis', $depuis)\n            ->orderBy('a.creeLe', 'DESC')\n            ->setMaxResults($max)\n            ->getQuery()\n            ->getResult();\n    }\n}\n\n// Utilisation\n$recents = $articleRepository->findPubliesDepuis(new \\DateTimeImmutable('-7 days'));\n$un = $articleRepository->findOneBy(['titre' => 'Hello']);", "notes": ["`'a'` est l'alias de l'entité dans la requête.", "`:depuis` + `setParameter` : Doctrine échappe et type la valeur.", "Pour des filtres d'égalité simples, `findBy([...])` suffit."]}, "quiz": [{"q": "En DQL, on écrit…", "options": ["le nom des tables SQL", "le nom des entités et de leurs propriétés", "du SQL brut", "du JSON"], "answer": 1, "why": "Doctrine traduit ensuite vers les vraies tables et colonnes."}, {"q": "Pourquoi `setParameter` plutôt que concaténer la valeur ?", "options": ["C'est plus court", "Éviter l'injection SQL et gérer les types", "Obligatoire seulement en DQL", "Pour le cache"], "answer": 1, "why": "La valeur n'est jamais interprétée comme du code."}, {"q": "Quelle méthode renvoie un objet ou null ?", "options": ["getResult()", "getOneOrNullResult()", "getArrayResult()", "execute()"], "answer": 1, "why": "Elle lève une exception s'il y a plusieurs résultats."}], "td": {"title": "Recherche de livres", "enonce": "Dans `LivreRepository`, écris les méthodes dont la page de recherche a besoin.", "consignes": ["`rechercher(string $terme): array` : titres contenant le terme (insensible à la casse), triés par titre", "`compterDisponibles(): int`", "`plusRecents(int $n): array` : les n livres publiés le plus récemment"], "starter": {"lang": "php", "code": "class LivreRepository extends ServiceEntityRepository\n{\n    public function __construct(ManagerRegistry $registry)\n    {\n        parent::__construct($registry, Livre::class);\n    }\n\n    // à toi\n}"}, "hints": ["LIKE : `->andWhere('LOWER(l.titre) LIKE :t')->setParameter('t', '%' . mb_strtolower($terme) . '%')`", "Compter : `->select('COUNT(l.id)')` puis `getSingleScalarResult()`, à caster en int.", "Tri : `->orderBy('l.publieLe', 'DESC')->setMaxResults($n)`"], "solution": {"lang": "php", "code": "/** @return Livre[] */\npublic function rechercher(string $terme): array\n{\n    return $this->createQueryBuilder('l')\n        ->andWhere('LOWER(l.titre) LIKE :t')\n        ->setParameter('t', '%' . mb_strtolower($terme) . '%')\n        ->orderBy('l.titre', 'ASC')\n        ->getQuery()\n        ->getResult();\n}\n\npublic function compterDisponibles(): int\n{\n    return (int) $this->createQueryBuilder('l')\n        ->select('COUNT(l.id)')\n        ->andWhere('l.disponible = true')\n        ->getQuery()\n        ->getSingleScalarResult();\n}\n\n/** @return Livre[] */\npublic function plusRecents(int $n): array\n{\n    return $this->createQueryBuilder('l')\n        ->orderBy('l.publieLe', 'DESC')\n        ->setMaxResults($n)\n        ->getQuery()\n        ->getResult();\n}"}, "checks": ["`$terme` n'est jamais concaténé dans la chaîne DQL", "`compterDisponibles()` renvoie un `int`"]}}, {"id": "doc-relations", "track": "doctrine", "title": "Relations entre entités", "minutes": 18, "goal": "Mapper un ManyToOne / OneToMany et comprendre le côté propriétaire.", "why": "Les relations sont la première source de confusion avec Doctrine : on modifie un côté et rien n'est enregistré.", "flow": ["En base, une relation = **une clé étrangère** dans une table", "Le côté qui porte la clé est le **côté propriétaire** (ManyToOne)", "L'autre côté (OneToMany) est l'**inverse** : il sert juste à naviguer", "Au flush, Doctrine ne lit **que le côté propriétaire**"], "points": ["`commentaire.article_id` existe en base → `Commentaire::$article` est propriétaire (`inversedBy`).", "`Article::$commentaires` est inverse (`mappedBy`) : une `Collection`, initialisée dans le constructeur.", "Écris des méthodes qui **gardent les deux côtés cohérents** (`commenter()`).", "`cascade: ['persist']` : persister l'article persiste aussi ses nouveaux commentaires.", "`orphanRemoval: true` : retirer un commentaire de la collection le supprime en base."], "pitfalls": ["`$article->getCommentaires()->add($c)` sans fixer `$c->article` : le lien n'est pas enregistré.", "Mettre du `cascade` partout sans savoir pourquoi."], "example": {"lang": "php", "code": "#[ORM\\Entity]\nclass Article\n{\n    // ... id, titre\n\n    /** @var Collection<int, Commentaire> */\n    #[ORM\\OneToMany(targetEntity: Commentaire::class, mappedBy: 'article', cascade: ['persist'], orphanRemoval: true)]\n    private Collection $commentaires;\n\n    public function __construct(/* ... */)\n    {\n        $this->commentaires = new ArrayCollection();\n    }\n\n    public function commenter(string $auteur, string $texte): Commentaire\n    {\n        $commentaire = new Commentaire($this, $auteur, $texte);\n        $this->commentaires->add($commentaire);\n        return $commentaire;\n    }\n}\n\n#[ORM\\Entity]\nclass Commentaire\n{\n    // ... id\n\n    #[ORM\\ManyToOne(inversedBy: 'commentaires')]\n    #[ORM\\JoinColumn(nullable: false)]\n    private Article $article;\n\n    public function __construct(\n        Article $article,\n        #[ORM\\Column(length: 80)] private string $auteur,\n        #[ORM\\Column(type: 'text')] private string $texte,\n    ) {\n        $this->article = $article;\n    }\n}", "notes": ["`commenter()` crée le commentaire avec son article : les deux côtés sont cohérents.", "`cascade: ['persist']` : `persist($article)` + `flush()` insère aussi le commentaire.", "`JoinColumn(nullable: false)` : un commentaire sans article est interdit en base."]}, "quiz": [{"q": "Article (1) ↔ Commentaire (N) : quel côté est propriétaire ?", "options": ["Article", "Commentaire (ManyToOne, il porte la clé étrangère)", "Les deux", "Aucun"], "answer": 1, "why": "Le propriétaire est toujours le côté qui a la colonne `..._id`."}, {"q": "Tu fais seulement `$article->getCommentaires()->add($c)` puis `flush()`. Le lien est-il enregistré ?", "options": ["Oui", "Non : Doctrine ignore le côté inverse", "Oui, en double", "Seulement avec cascade"], "answer": 1, "why": "Seul `$c->article` (propriétaire) compte au flush."}, {"q": "`orphanRemoval: true` fait quoi ?", "options": ["Supprime l'article quand il n'a plus de commentaires", "Supprime un commentaire retiré de la collection", "Supprime les doublons", "Rien depuis Doctrine 3"], "answer": 1, "why": "Un commentaire sans article n'a pas de sens : il est supprimé."}], "td": {"title": "Auteurs et livres", "enonce": "Un auteur écrit plusieurs livres ; un livre a un seul auteur.", "consignes": ["Entité `Auteur` (id, nom) avec une collection `livres` (OneToMany)", "`Livre` a un `ManyToOne` vers `Auteur`, non nullable, reçu dans son constructeur", "`Auteur::ecrire(string $titre, string $isbn, \\DateTimeImmutable $date): Livre` crée le livre et l'ajoute à la collection", "Un seul `persist($auteur)` + `flush()` doit insérer l'auteur et ses livres"], "starter": {"lang": "php", "code": "#[ORM\\Entity]\nclass Auteur\n{\n    // à toi\n}\n\n#[ORM\\Entity]\nclass Livre\n{\n    // ajoute la relation vers Auteur\n}\n\n$auteur = new Auteur('Ursula K. Le Guin');\n$auteur->ecrire('Terremer', '9782253023418', new \\DateTimeImmutable('1968-01-01'));\n$em->persist($auteur);\n$em->flush(); // INSERT auteur + INSERT livre"}, "hints": ["Côté `Auteur` : `#[ORM\\OneToMany(targetEntity: Livre::class, mappedBy: 'auteur', cascade: ['persist'])]`", "Côté `Livre` : `#[ORM\\ManyToOne(inversedBy: 'livres')]` + `#[ORM\\JoinColumn(nullable: false)]`", "Initialise `$this->livres = new ArrayCollection();` dans le constructeur d'`Auteur`."], "solution": {"lang": "php", "code": "#[ORM\\Entity]\nclass Auteur\n{\n    #[ORM\\Id, ORM\\GeneratedValue, ORM\\Column]\n    private ?int $id = null;\n\n    /** @var Collection<int, Livre> */\n    #[ORM\\OneToMany(targetEntity: Livre::class, mappedBy: 'auteur', cascade: ['persist'])]\n    private Collection $livres;\n\n    public function __construct(#[ORM\\Column(length: 120)] private string $nom)\n    {\n        $this->livres = new ArrayCollection();\n    }\n\n    public function ecrire(string $titre, string $isbn, \\DateTimeImmutable $date): Livre\n    {\n        $livre = new Livre($this, $titre, $isbn, $date);\n        $this->livres->add($livre);\n        return $livre;\n    }\n}\n\n#[ORM\\Entity]\nclass Livre\n{\n    // ... id, titre, isbn, publieLe, disponible\n\n    #[ORM\\ManyToOne(inversedBy: 'livres')]\n    #[ORM\\JoinColumn(nullable: false)]\n    private Auteur $auteur;\n\n    public function __construct(Auteur $auteur, string $titre, string $isbn, \\DateTimeImmutable $publieLe)\n    {\n        $this->auteur = $auteur;\n        // ...\n    }\n}"}, "checks": ["On ne peut pas créer de `Livre` sans `Auteur`", "La migration ajoute `auteur_id` à la table `livre`"]}}, {"id": "doc-n1", "track": "doctrine", "title": "Lazy loading & problème N+1", "minutes": 12, "goal": "Repérer et corriger le problème N+1.", "why": "Une page qui affiche 50 articles et leurs auteurs peut lancer 51 requêtes sans que tu le voies.", "flow": ["Doctrine charge les relations en **lazy** : un **proxy** vide remplace l'objet", "Le proxy se charge **au premier accès** (une requête)", "Dans une boucle : 1 requête pour la liste **+ N** pour les relations", "Solution : un **fetch join** charge tout en une requête"], "points": ["Lazy = pratique par défaut, piège dans les boucles.", "Repère le N+1 dans le **profiler Symfony** : nombre de requêtes et requêtes identiques répétées.", "`leftJoin('a.auteur', 'au')->addSelect('au')` : c'est `addSelect` qui charge vraiment l'auteur.", "OneToMany joint + `setMaxResults` : utilise le `Paginator` de Doctrine, sinon la limite porte sur les lignes SQL et pas sur les entités."], "pitfalls": ["`leftJoin` sans `addSelect` : la jointure filtre, mais l'auteur reste lazy.", "Passer toutes les relations en `fetch: 'EAGER'` : tu charges trop, partout."], "example": {"lang": "php", "code": "// Contrôleur ou template\n$articles = $repo->findAll();              // 1 requête\nforeach ($articles as $a) {\n    echo $a->getAuteur()->getNom();        // +1 requête par auteur !\n}\n\n// Repository : version corrigée\npublic function findAvecAuteur(): array\n{\n    return $this->createQueryBuilder('a')\n        ->leftJoin('a.auteur', 'au')\n        ->addSelect('au')                  // charge l'auteur dans la même requête\n        ->orderBy('a.creeLe', 'DESC')\n        ->getQuery()\n        ->getResult();                     // 1 seule requête au total\n}", "notes": ["Sans `addSelect`, `getAuteur()` renvoie un proxy qui déclenche une requête.", "Avec, les auteurs sont déjà en mémoire.", "Doctrine ne recharge pas deux fois le même auteur (identity map)."]}, "quiz": [{"q": "50 articles affichent leur auteur (lazy). Combien de requêtes au maximum ?", "options": ["1", "2", "51", "50"], "answer": 2, "why": "1 pour la liste, puis 1 par auteur différent."}, {"q": "Quelle ligne charge réellement l'auteur avec l'article ?", "options": ["`leftJoin` seul", "`addSelect('au')`", "`orderBy`", "`getResult`"], "answer": 1, "why": "La jointure sans `addSelect` ne sélectionne pas les colonnes de l'auteur."}, {"q": "Où voir le nombre de requêtes d'une page Symfony ?", "options": ["Dans les logs Apache", "Dans le profiler (barre de debug, onglet Doctrine)", "Dans composer.json", "Impossible"], "answer": 1, "why": "Le profiler signale aussi les requêtes répétées."}], "td": {"title": "Corriger la page catalogue", "enonce": "La page catalogue affiche chaque livre, son auteur et son nombre d'emprunts. Elle lance 101 requêtes pour 50 livres.", "consignes": ["Explique d'où viennent les 101 requêtes", "Écris `LivreRepository::catalogue()` qui charge auteur et emprunts en une requête", "Bonus : pour juste afficher un nombre, compare avec une requête qui renvoie un COUNT"], "starter": {"lang": "php", "code": "// LivreController\n$livres = $livreRepository->findBy([], ['titre' => 'ASC']);\n\n// templates/livre/catalogue.html.twig\n// {% for livre in livres %}\n//   {{ livre.titre }} - {{ livre.auteur.nom }} - {{ livre.emprunts|length }} emprunts\n// {% endfor %}"}, "hints": ["101 = 1 (livres) + 50 (auteurs) + 50 (collections d'emprunts).", "Deux jointures, chacune avec son `addSelect`."], "solution": {"lang": "php", "code": "// 101 requêtes = 1 (liste) + 50 (auteur de chaque livre) + 50 (emprunts de chaque livre)\n\n/** @return Livre[] */\npublic function catalogue(): array\n{\n    return $this->createQueryBuilder('l')\n        ->leftJoin('l.auteur', 'a')->addSelect('a')\n        ->leftJoin('l.emprunts', 'e')->addSelect('e')\n        ->orderBy('l.titre', 'ASC')\n        ->getQuery()\n        ->getResult();\n}\n\n// Bonus : si on veut juste le nombre, pas besoin de charger les emprunts\npublic function catalogueAvecNbEmprunts(): array\n{\n    return $this->createQueryBuilder('l')\n        ->select('l AS livre', 'a', 'COUNT(e.id) AS nbEmprunts')\n        ->leftJoin('l.auteur', 'a')\n        ->leftJoin('l.emprunts', 'e')\n        ->groupBy('l.id, a.id')\n        ->orderBy('l.titre', 'ASC')\n        ->getQuery()\n        ->getResult(); // [['livre' => Livre, 'nbEmprunts' => 3], ...]\n}"}, "checks": ["Le profiler affiche 1 requête pour la page", "Tu sais expliquer pourquoi `addSelect` est nécessaire"]}}, {"id": "dto-pourquoi", "track": "dto", "title": "DTO : à quoi ça sert", "minutes": 12, "goal": "Comprendre ce qu'est un DTO et où il se place entre l'API et tes entités.", "why": "Si ton API renvoie directement l'entité `User`, tu exposes le mot de passe haché, tu crées des boucles infinies avec les relations, et le moindre renommage de colonne casse le front.", "flow": ["Le front envoie du **JSON** (ex. `axios.post('/api/articles', {...})`)", "Symfony le transforme en **DTO d'entrée** et le **valide**", "Ton service utilise le DTO pour créer ou modifier l'**entité**", "La réponse part sous forme de **DTO de sortie**, converti en JSON"], "points": ["DTO = *Data Transfer Object* : une petite classe **sans logique**, juste des propriétés, qui décrit des données qui voyagent.", "L'entité représente ta base ; le DTO représente **ce que l'API accepte ou renvoie**. Ce ne sont pas les mêmes besoins.", "Un DTO par usage : `CreateArticleInput`, `UpdateArticleInput`, `ArticleOutput`, `ArticleListItem`…", "Les propriétés sont souvent `public readonly` : simple à lire, impossible à modifier par erreur.", "C'est le **contrat** entre ton back Symfony et ton front React."], "pitfalls": ["Utiliser l'entité Doctrine comme objet de formulaire ou de réponse JSON.", "Mettre de la logique métier dans un DTO : il transporte, il ne décide pas."], "example": {"lang": "php", "code": "// Ce que le front ENVOIE pour créer un article\nfinal class CreateArticleInput\n{\n    public function __construct(\n        public readonly string $titre,\n        public readonly string $contenu,\n        public readonly array $tags = [],\n    ) {}\n}\n\n// Ce que l'API RENVOIE (on choisit les champs exposés)\nfinal class ArticleOutput\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly
