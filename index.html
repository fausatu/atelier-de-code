es constructeurs", "color": "accent"}, {"id": "repo", "col": 0, "row": 1, "label": "MysqlUserRepository", "kind": "box", "sub": "implements UserRepository"}, {"id": "mail", "col": 2, "row": 1, "label": "SmtpMailer", "kind": "box", "sub": "implements Mailer"}, {"id": "svc", "col": 1, "row": 2, "label": "InscriptionService", "kind": "box", "sub": "(UserRepository, Mailer)", "color": "good"}, {"id": "ctrl", "col": 1, "row": 3, "label": "Contrôleur", "kind": "pill", "sub": "reçoit InscriptionService"}], "edges": [{"from": "cont", "to": "repo", "label": "1 crée", "color": "accent"}, {"from": "cont", "to": "mail", "label": "1 crée", "color": "accent"}, {"from": "repo", "to": "svc", "label": "2 injecte"}, {"from": "mail", "to": "svc", "label": "2 injecte"}, {"from": "svc", "to": "ctrl", "label": "3 injecte"}], "lanes": [{"label": "Construit automatiquement par Symfony", "from": 0, "to": 2, "color": "accent"}], "caption": "Personne n'écrit ces `new` : le conteneur construit chaque service une fois et le passe à ceux qui le demandent."}, "lessons": [{"title": "Le problème : une classe qui construit ses propres outils", "body": "```php\nfinal class InscriptionService\n{\n    public function inscrire(string $email): void\n    {\n        $repo = new MysqlUserRepository(new PDO('mysql:host=db;dbname=shop', 'root', 'secret'));\n        $repo->save($email);\n        (new SmtpMailer('smtp.exemple.com'))->send($email, 'Bienvenue');\n    }\n}\n```\n\nCette classe **décide** elle-même de ses outils. Trois conséquences :\n\n- **Impossible à tester** sans une vraie base MySQL et un vrai serveur SMTP. Chaque test envoie un mail.\n- **Impossible à reconfigurer** : passer à PostgreSQL ou à Mailjet oblige à modifier `InscriptionService`, qui n'a pourtant rien à voir avec ces choix.\n- **Les secrets se baladent** dans le code métier (`'root', 'secret'`).\n\nLe principe de l'**injection de dépendances** est simple : une classe ne construit pas ses dépendances, elle les **reçoit**. Elle déclare ce dont elle a besoin, et quelqu'un d'autre les lui fournit."}, {"title": "Injecter par le constructeur", "body": "```php\nfinal class InscriptionService\n{\n    public function __construct(\n        private UserRepository $users,   // une interface\n        private Mailer $mailer,          // une interface\n    ) {}\n\n    public function inscrire(string $email): void\n    {\n        $this->users->save($email);\n        $this->mailer->send($email, 'Bienvenue');\n    }\n}\n```\n\nLe constructeur est la liste des besoins de la classe. Elle n'a plus aucun `new` de service, aucun secret, aucune idée de l'implémentation utilisée. Celui qui la construit choisit :\n\n```php\n// En production\n$service = new InscriptionService(new MysqlUserRepository($pdo), new SmtpMailer($config));\n\n// En test : instantané, sans réseau\n$service = new InscriptionService(new InMemoryUserRepository(), new FakeMailer());\n```\n\nPourquoi le constructeur plutôt qu'un setter ? Parce qu'un objet dont le constructeur a réussi est **prêt à l'emploi** : il ne peut pas exister à moitié configuré. Les dépendances obligatoires passent toujours par le constructeur."}, {"title": "Ce qui s'injecte et ce qui se crée avec `new`", "body": "Tout ne doit pas être injecté. La distinction :\n\n- **Services** : objets qui *font* quelque chose, souvent branchés sur l'extérieur (base, réseau, fichiers, horloge), dont une seule instance suffit. `UserRepository`, `Mailer`, `Logger`, `HttpClient`, `PaymentGateway`. → **injectés**.\n- **Objets de données** : entités, DTO, value objects (`Email`, `Prix`, `DateTimeImmutable`, `Commande`). Ils n'ont pas de dépendances externes, on en crée autant qu'on veut, avec des valeurs différentes à chaque fois. → **`new` partout, c'est normal**.\n\nUn cas limite : le **temps**. `new DateTimeImmutable('today')` dans un service rend les tests dépendants du jour où ils tournent. On injecte alors une interface `Horloge` (Symfony fournit `ClockInterface`), dont la fausse version renvoie une date fixe. Même logique pour le hasard (`random_int`) : si un test doit être reproductible, la source d'aléa s'injecte."}, {"title": "Le conteneur Symfony fait les `new` pour toi", "body": "Dans un vrai projet, écrire à la main `new InscriptionService(new MysqlUserRepository(new PDO(...)), new SmtpMailer(...))` serait vite ingérable. C'est le travail du **conteneur de services**.\n\nAu démarrage, Symfony parcourt `src/`, enregistre chaque classe comme service, puis lit les **types** de leurs constructeurs. Pour construire `InscriptionService`, il voit qu'il faut un `UserRepository` et un `Mailer` ; il cherche quel service a ce type, le construit (en construisant d'abord **ses** dépendances), et l'injecte. C'est l'**autowiring**. Il ne construit chaque service qu'une fois et le réutilise.\n\nDeux règles pour que ça marche :\n\n- Type-hinter avec l'**interface** quand il y en a une. Si une seule classe l'implémente, Symfony fait le lien tout seul. S'il y en a plusieurs, tu indiques laquelle dans `config/services.yaml` (un alias).\n- Les valeurs qui ne sont pas des services (une chaîne de connexion, une clé d'API) se passent par des **paramètres** liés dans la configuration, ou par des variables d'environnement.\n\n`php bin/console debug:autowiring Mailer` te montre ce que tu peux injecter en tapant un nom. Et si tu vois une classe injecter le conteneur lui-même (`ContainerInterface`) pour y piocher des services, c'est un anti-pattern : ça cache ses vraies dépendances, et on perd tout l'intérêt de la lisibilité du constructeur."}], "recap": ["Une classe **reçoit** ses dépendances par le constructeur ; elle n'en fait pas le `new`.", "Les dépendances sont typées par des **interfaces** : en test on injecte une fausse implémentation.", "Services (font quelque chose, une instance) → injectés. Objets de données (entités, VO, DTO) → `new`.", "Le temps et le hasard sont des dépendances comme les autres quand ils influencent le résultat.", "Symfony construit et injecte tout seul en lisant les types : c'est l'autowiring."], "tds": [{"level": 1, "title": "Rendre testable", "enonce": "Ce service est impossible à tester. Refactorise-le avec l'injection de dépendances.", "consignes": ["Extrais l'accès aux données dans une interface `VentesRepository` : `totalDu(DateTimeImmutable $jour): float`", "Extrais l'horloge dans une interface `Horloge` : `aujourdhui(): DateTimeImmutable` (sinon le test dépend du jour)", "Injecte les deux dans le constructeur de `RapportService`", "Écris un petit test à la main avec de fausses implémentations"], "files": [{"path": "RapportService.php", "lang": "php", "code": "final class RapportService\n{\n    public function genererDuJour(): string\n    {\n        $date = new DateTimeImmutable('today');\n        $pdo = new PDO('mysql:host=localhost;dbname=shop', 'root', '');\n        $stmt = $pdo->prepare('SELECT SUM(total) FROM commandes WHERE DATE(passee_le) = ?');\n        $stmt->execute([$date->format('Y-m-d')]);\n        $total = (float) $stmt->fetchColumn();\n\n        return sprintf('Ventes du %s : %.2f €', $date->format('d/m/Y'), $total);\n    }\n}"}], "hints": ["La requête SQL part dans une classe `PdoVentesRepository implements VentesRepository`.", "Fausse horloge en une ligne : une classe anonyme `new class implements Horloge { ... }`.", "Vérifie le résultat avec `assert(...)`."], "solution": [{"path": "RapportService.php", "lang": "php", "code": "interface VentesRepository\n{\n    public function totalDu(DateTimeImmutable $jour): float;\n}\n\ninterface Horloge\n{\n    public function aujourdhui(): DateTimeImmutable;\n}\n\nfinal class RapportService\n{\n    public function __construct(\n        private VentesRepository $ventes,\n        private Horloge $horloge,\n    ) {}\n\n    public function genererDuJour(): string\n    {\n        $jour = $this->horloge->aujourdhui();\n        $total = $this->ventes->totalDu($jour);\n\n        return sprintf('Ventes du %s : %.2f €', $jour->format('d/m/Y'), $total);\n    }\n}\n\n// Test à la main\n$service = new RapportService(\n    new class implements VentesRepository {\n        public function totalDu(DateTimeImmutable $jour): float { return 1234.5; }\n    },\n    new class implements Horloge {\n        public function aujourdhui(): DateTimeImmutable { return new DateTimeImmutable('2026-01-15'); }\n    },\n);\nassert($service->genererDuJour() === 'Ventes du 15/01/2026 : 1234.50 €');"}], "checks": ["`RapportService` ne contient plus `new PDO` ni `new DateTimeImmutable('today')`", "Le test donne le même résultat quel que soit le jour"], "run": {"kind": "php", "tests": "check('VentesRepository est une interface', interface_exists('VentesRepository'));\ncheck('Horloge est une interface', interface_exists('Horloge'));\n$ctor = new ReflectionMethod(RapportService::class, '__construct');\n$types = array_map(fn($p) => (string) $p->getType(), $ctor->getParameters());\ncheck('le constructeur reçoit VentesRepository et Horloge', in_array('VentesRepository', $types) && in_array('Horloge', $types), implode(', ', $types));\n$service = new RapportService(\n    new class implements VentesRepository { public function totalDu(DateTimeImmutable $jour): float { return 1234.5; } },\n    new class implements Horloge { public function aujourdhui(): DateTimeImmutable { return new DateTimeImmutable('2026-01-15'); } },\n);\ncheck('genererDuJour() utilise l\\'horloge et le repository injectés', $service->genererDuJour() === 'Ventes du 15/01/2026 : 1234.50 €', $service->genererDuJour());\n$src = (new ReflectionClass(RapportService::class));\n$body = implode(\"\\n\", array_slice(file(__FILE__), $src->getStartLine() - 1, $src->getEndLine() - $src->getStartLine() + 1));\ncheck('RapportService ne contient plus \"new PDO\"', !str_contains($body, 'new PDO'));\ncheck('RapportService ne contient plus new DateTimeImmutable(\\'today\\')', !str_contains($body, \"DateTimeImmutable('today')\"));"}}, {"level": 2, "title": "Horloge et générateur d'identifiants", "enonce": "Un service crée des commandes avec un numéro `CMD-AAAAMMJJ-XXXX` (date du jour + 4 caractères aléatoires) et refuse les commandes passées le dimanche. Impossible à tester tel quel : le résultat change chaque jour et à chaque exécution. Injecte le temps et le hasard.", "consignes": ["Interface `Horloge { public function maintenant(): DateTimeImmutable; }` et interface `GenerateurId { public function generer(int $longueur): string; }`", "`HorlogeSysteme` et `GenerateurAleatoire` : les vraies implémentations (`new DateTimeImmutable()`, `bin2hex(random_bytes(...))` tronqué)", "`CommandeService::__construct(Horloge $horloge, GenerateurId $ids)` et `creer(string $client): string` qui renvoie le numéro", "`DomainException` si `maintenant()` tombe un dimanche (`format('N') === '7'`)", "Fausses implémentations pour le test : `HorlogeFixe(DateTimeImmutable $date)` et `GenerateurFixe(string $valeur)`"], "files": [{"path": "CommandeService.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\n// AVANT : impossible à tester\nfinal class CommandeServiceAvant\n{\n    public function creer(string $client): string\n    {\n        $now = new DateTimeImmutable();\n        if ($now->format('N') === '7') {\n            throw new DomainException('Pas de commande le dimanche');\n        }\n        return 'CMD-' . $now->format('Ymd') . '-' . strtoupper(substr(bin2hex(random_bytes(2)), 0, 4));\n    }\n}\n\n// APRÈS : à toi (interfaces, vraies implémentations, fausses, service)\n\n$service = new CommandeService(new HorlogeFixe(new DateTimeImmutable('2026-03-02')), new GenerateurFixe('AB12'));\necho $service->creer('ana');   // CMD-20260302-AB12"}], "hints": ["Une fausse horloge : `final class HorlogeFixe implements Horloge { public function __construct(private DateTimeImmutable $d) {} public function maintenant(): DateTimeImmutable { return $this->d; } }`.", "Le test du dimanche : `new HorlogeFixe(new DateTimeImmutable('2026-03-01'))` (un dimanche) doit faire lever l'exception.", "Le service ne fait plus aucun `new DateTimeImmutable()` ni `random_bytes` : tout passe par les interfaces."], "solution": [{"path": "CommandeService.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\ninterface Horloge\n{\n    public function maintenant(): DateTimeImmutable;\n}\n\ninterface GenerateurId\n{\n    public function generer(int $longueur): string;\n}\n\nfinal class HorlogeSysteme implements Horloge\n{\n    public function maintenant(): DateTimeImmutable { return new DateTimeImmutable(); }\n}\n\nfinal class GenerateurAleatoire implements GenerateurId\n{\n    public function generer(int $longueur): string\n    {\n        return strtoupper(substr(bin2hex(random_bytes((int) ceil($longueur / 2))), 0, $longueur));\n    }\n}\n\nfinal class HorlogeFixe implements Horloge\n{\n    public function __construct(private DateTimeImmutable $date) {}\n    public function maintenant(): DateTimeImmutable { return $this->date; }\n}\n\nfinal class GenerateurFixe implements GenerateurId\n{\n    public function __construct(private string $valeur) {}\n    public function generer(int $longueur): string { return $this->valeur; }\n}\n\nfinal class CommandeService\n{\n    public function __construct(private Horloge $horloge, private GenerateurId $ids) {}\n\n    public function creer(string $client): string\n    {\n        $now = $this->horloge->maintenant();\n        if ($now->format('N') === '7') {\n            throw new DomainException('Pas de commande le dimanche');\n        }\n        return 'CMD-' . $now->format('Ymd') . '-' . $this->ids->generer(4);\n    }\n}\n\n$service = new CommandeService(new HorlogeFixe(new DateTimeImmutable('2026-03-02')), new GenerateurFixe('AB12'));\necho $service->creer('ana');   // CMD-20260302-AB12"}], "checks": ["Le même test donne le même résultat quel que soit le jour où il tourne", "Le cas « dimanche » est testable sans attendre dimanche", "`new CommandeService(new HorlogeSysteme(), new GenerateurAleatoire())` fonctionne en production"], "run": {"kind": "php", "tests": "check('Horloge et GenerateurId sont des interfaces', interface_exists('Horloge') && interface_exists('GenerateurId'));\n$s = new CommandeService(new HorlogeFixe(new DateTimeImmutable('2026-03-02')), new GenerateurFixe('AB12'));\ncheck('numéro déterministe CMD-20260302-AB12', $s->creer('ana') === 'CMD-20260302-AB12', $s->creer('ana'));\n$dim = new CommandeService(new HorlogeFixe(new DateTimeImmutable('2026-03-01')), new GenerateurFixe('AB12'));\ncheck('dimanche refusé', throws(fn() => $dim->creer('ana'), DomainException::class));\n$real = new CommandeService(new HorlogeSysteme(), new GenerateurAleatoire());\ntry { $num = $real->creer('x'); check('vraies implémentations : format CMD-AAAAMMJJ-XXXX', preg_match('/^CMD-\\d{8}-[A-Z0-9]{4}$/', $num) === 1, $num); }\ncatch (DomainException $e) { check('vraies implémentations : dimanche refusé (on est dimanche)', true); }\ncheck('GenerateurAleatoire::generer(4) fait 4 caractères', strlen((new GenerateurAleatoire())->generer(4)) === 4);\n$body = implode(\"\\n\", array_slice(file(__FILE__), (new ReflectionClass(CommandeService::class))->getStartLine() - 1, (new ReflectionClass(CommandeService::class))->getEndLine() - (new ReflectionClass(CommandeService::class))->getStartLine() + 1));\ncheck('CommandeService ne fait plus new DateTimeImmutable()', !str_contains($body, 'new DateTimeImmutable'));\ncheck('CommandeService n\\'appelle plus random_bytes', !str_contains($body, 'random_bytes'));"}, "expected": "CMD-20260302-AB12"}, {"level": 3, "title": "Un mini-conteneur avec autowiring", "enonce": "Pour comprendre ce que Symfony fait pour toi, écris un **mini-conteneur** : une classe `Conteneur` capable de construire n'importe quel service en lisant les types de son constructeur avec la Reflection, en construisant d'abord ses dépendances, et en gardant une seule instance de chaque. Tu lui ajoutes la possibilité de lier une interface à une implémentation. C'est, en 60 lignes, le cœur de l'autowiring.", "consignes": ["`Conteneur::lier(string $interface, string $classe)` : « quand on demande cette interface, construis cette classe »", "`Conteneur::get(string $id): object` : renvoie toujours la **même** instance pour un même id", "Construction : via `new ReflectionClass($classe)`, lire les paramètres du constructeur ; pour chaque paramètre typé par une classe ou une interface, appeler récursivement `get()` ; un paramètre avec valeur par défaut et sans type d'objet prend sa valeur par défaut", "Exceptions claires : interface non liée → `LogicException('Aucune implémentation pour X')` ; paramètre scalaire sans défaut → `LogicException`", "Détecte une **dépendance circulaire** (A a besoin de B qui a besoin de A) et lève une `LogicException` au lieu de boucler", "Fais-le fonctionner sur `InscriptionService(UserRepository, Mailer)` du cours"], "files": [{"path": "Conteneur.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\ninterface UserRepository { public function save(string $email): void; }\ninterface Mailer { public function send(string $to, string $subject): void; }\n\nfinal class InMemoryUserRepository implements UserRepository\n{\n    public array $saved = [];\n    public function save(string $email): void { $this->saved[] = $email; }\n}\n\nfinal class FakeMailer implements Mailer\n{\n    public array $sent = [];\n    public function __construct(private Logger $logger) {}\n    public function send(string $to, string $subject): void { $this->sent[] = [$to, $subject]; $this->logger->log(\"mail à $to\"); }\n}\n\nfinal class Logger\n{\n    public array $lignes = [];\n    public function __construct(private string $prefixe = '[log]') {}\n    public function log(string $m): void { $this->lignes[] = \"$this->prefixe $m\"; }\n}\n\nfinal class InscriptionService\n{\n    public function __construct(private UserRepository $users, private Mailer $mailer) {}\n    public function inscrire(string $email): void { $this->users->save($email); $this->mailer->send($email, 'Bienvenue'); }\n}\n\nfinal class Conteneur\n{\n    // à toi\n}\n\n$c = new Conteneur();\n$c->lier(UserRepository::class, InMemoryUserRepository::class);\n$c->lier(Mailer::class, FakeMailer::class);\n\n$service = $c->get(InscriptionService::class);\n$service->inscrire('ana@mail.com');\n\necho count($c->get(InMemoryUserRepository::class)->saved), PHP_EOL;   // 1 : même instance\necho $c->get(Logger::class)->lignes[0], PHP_EOL;                       // [log] mail à ana@mail.com"}], "hints": ["`$ref = new ReflectionClass($classe); $ctor = $ref->getConstructor(); $params = $ctor ? $ctor->getParameters() : [];`", "Pour un paramètre : `$type = $p->getType(); if ($type instanceof ReflectionNamedType && !$type->isBuiltin()) $args[] = $this->get($type->getName()); elseif ($p->isDefaultValueAvailable()) $args[] = $p->getDefaultValue(); else throw ...`.", "Instance unique : un tableau `private array $instances = []` consulté au début de `get()`.", "Circularité : un tableau `$enCours` ; si `$id` y est déjà quand on entre dans `get()`, c'est une boucle. Pense à le retirer à la sortie."], "solution": [{"path": "Conteneur.php", "lang": "php", "code": "<?php\ndeclare(strict_types=1);\n\ninterface UserRepository { public function save(string $email): void; }\ninterface Mailer { public function send(string $to, string $subject): void; }\n\nfinal class InMemoryUserRepository implements UserRepository\n{\n    public array $saved = [];\n    public function save(string $email): void { $this->saved[] = $email; }\n}\n\nfinal class FakeMailer implements Mailer\n{\n    public array $sent = [];\n    public function __construct(private Logger $logger) {}\n    public function send(string $to, string $subject): void { $this->sent[] = [$to, $subject]; $this->logger->log(\"mail à $to\"); }\n}\n\nfinal class Logger\n{\n    public array $lignes = [];\n    public function __construct(private string $prefixe = '[log]') {}\n    public function log(string $m): void { $this->lignes[] = \"$this->prefixe $m\"; }\n}\n\nfinal class InscriptionService\n{\n    public function __construct(private UserRepository $users, private Mailer $mailer) {}\n    public function inscrire(string $email): void { $this->users->save($email); $this->mailer->send($email, 'Bienvenue'); }\n}\n\nfinal class Conteneur\n{\n    /** @var array<string, string> interface => classe */\n    private array $liaisons = [];\n    /** @var array<string, object> */\n    private array $instances = [];\n    /** @var array<string, true> */\n    private array $enCours = [];\n\n    public function lier(string $interface, string $classe): void\n    {\n        $this->liaisons[$interface] = $classe;\n    }\n\n    public function get(string $id): object\n    {\n        if (isset($this->instances[$id])) {\n            return $this->instances[$id];\n        }\n        if (isset($this->enCours[$id])) {\n            throw new LogicException(\"Dépendance circulaire détectée sur $id\");\n        }\n        $classe = $this->liaisons[$id] ?? $id;\n        if (interface_exists($classe)) {\n            throw new LogicException(\"Aucune implémentation pour $classe\");\n        }\n        if (!class_exists($classe)) {\n            throw new LogicException(\"Classe inconnue : $classe\");\n        }\n\n        $this->enCours[$id] = true;\n        try {\n            $instance = $this->construire($classe);\n        } finally {\n            unset($this->enCours[$id]);\n        }\n        return $this->instances[$id] = $this->instances[$classe] = $instance;\n    }\n\n    private function construire(string $classe): object\n    {\n        $ref = new ReflectionClass($classe);\n        $ctor = $ref->getConstructor();\n        if ($ctor === null) {\n            return new $classe();\n        }\n        $args = [];\n        foreach ($ctor->getParameters() as $p) {\n            $type = $p->getType();\n            if ($type instanceof ReflectionNamedType && !$type->isBuiltin()) {\n                $args[] = $this->get($type->getName());\n            } elseif ($p->isDefaultValueAvailable()) {\n                $args[] = $p->getDefaultValue();\n            } else {\n                throw new LogicException(sprintf('Impossible de résoudre le paramètre $%s de %s', $p->getName(), $classe));\n            }\n        }\n        return $ref->newInstanceArgs($args);\n    }\n}\n\n$c = new Conteneur();\n$c->lier(UserRepository::class, InMemoryUserRepository::class);\n$c->lier(Mailer::class, FakeMailer::class);\n\n$service = $c->get(InscriptionService::class);\n$service->inscrire('ana@mail.com');\n\necho count($c->get(InMemoryUserRepository::class)->saved), PHP_EOL;   // 1 : même instance\necho $c->get(Logger::class)->lignes[0], PHP_EOL;                       // [log] mail à ana@mail.com"}], "checks": ["`$c->get(X::class) === $c->get(X::class)` : toujours la même instance", "Demander une interface non liée donne un message clair, pas une erreur PHP obscure", "Deux classes qui se demandent mutuellement lèvent une exception au lieu de planter par récursion infinie"], "run": {"kind": "php", "tests": "$c = new Conteneur();\n$c->lier(UserRepository::class, InMemoryUserRepository::class);\n$c->lier(Mailer::class, FakeMailer::class);\n$s = $c->get(InscriptionService::class);\ncheck('get() construit InscriptionService avec ses dépendances', $s instanceof InscriptionService);\n$s->inscrire('ana@mail.com');\ncheck('le repository est partagé (même instance)', $c->get(InMemoryUserRepository::class)->saved === ['ana@mail.com']);\ncheck('get() renvoie toujours la même instance', $c->get(Logger::class) === $c->get(Logger::class));\ncheck('la dépendance transitive Logger est construite avec sa valeur par défaut', ($c->get(Logger::class)->lignes[0] ?? '') === '[log] mail à ana@mail.com', json_encode($c->get(Logger::class)->lignes));\ncheck('interface non liée : LogicException', throws(fn() => (new Conteneur())->get(Mailer::class), LogicException::class));\nfinal class BesoinScalaire { public function __construct(public string $dsn) {} }\ncheck('paramètre scalaire sans défaut : LogicException', throws(fn() => (new Conteneur())->get(BesoinScalaire::class), LogicException::class));\nfinal class CircA { public function __construct(public CircB $b) {} }\nfinal class CircB { public function __construct(public CircA $a) {} }\ncheck('dépendance circulaire détectée', throws(fn() => (new Conteneur())->get(CircA::class), LogicException::class));"}, "expected": "1\n[log] mail à ana@mail.com"}]}, {"id": "doc-orm", "track": "doctrine", "title": "ORM, entités & migrations", "minutes": 15, "goal": "Comprendre ce que Doctrine fait entre tes objets et la base de données.", "why": "Écrire du SQL à la main pour chaque objet est long et fragile. Doctrine traduit tes objets en lignes, et inversement.", "flow": ["Tu écris une **entité** : une classe PHP + des attributs de mapping", "Doctrine lit le **mapping** : classe → table, propriété → colonne", "Une **migration** crée ou modifie la table", "L'**EntityManager** sauvegarde et recharge tes objets"], "points": ["Entité = classe dont les objets sont stockés en base, avec un identifiant.", "`#[ORM\\Column]` décrit chaque colonne ; le type est souvent déduit du type PHP.", "`php bin/console make:migration` génère le SQL à partir de la différence entre tes entités et la base. `php bin/console doctrine:migrations:migrate` l'exécute.", "Doctrine **hydrate** les objets : il remplit les propriétés directement, sans appeler ton constructeur."], "pitfalls": ["Modifier la base à la main au lieu de passer par une migration : tes environnements divergent.", "Ajouter des setters partout « parce que Doctrine en a besoin » : il n'en a pas besoin."], "example": {"lang": "php", "code": "namespace App\\Entity;\n\nuse App\\Repository\\ArticleRepository;\nuse Doctrine\\DBAL\\Types\\Types;\nuse Doctrine\\ORM\\Mapping as ORM;\n\n#[ORM\\Entity(repositoryClass: ArticleRepository::class)]\nclass Article\n{\n    #[ORM\\Id]\n    #[ORM\\GeneratedValue]\n    #[ORM\\Column]\n    private ?int $id = null;\n\n    #[ORM\\Column(length: 180)]\n    private string $titre;\n\n    #[ORM\\Column(type: Types::TEXT)]\n    private string $contenu;\n\n    #[ORM\\Column]\n    private \\DateTimeImmutable $creeLe;\n\n    public function __construct(string $titre, string $contenu)\n    {\n        $this->titre = $titre;\n        $this->contenu = $contenu;\n        $this->creeLe = new \\DateTimeImmutable();\n    }\n\n    public function getId(): ?int { return $this->id; }\n    public function getTitre(): string { return $this->titre; }\n\n    public function renommer(string $titre): void\n    {\n        $this->titre = $titre;\n    }\n}", "notes": ["`?int $id = null` : l'id n'existe qu'après l'insertion en base.", "`string` → VARCHAR, `DateTimeImmutable` → DATETIME : Doctrine déduit le type.", "Pas de `setId()` : c'est la base qui génère l'id."]}, "quiz": [{"q": "Quand Doctrine recharge un `Article` depuis la base, il…", "options": ["appelle le constructeur", "remplit les propriétés directement, sans le constructeur", "appelle les setters", "renvoie un tableau"], "answer": 1, "why": "C'est pour ça que ton constructeur peut exiger des paramètres métier."}, {"q": "Quelle commande génère le fichier de migration ?", "options": ["doctrine:schema:update --force", "make:migration", "make:entity --regenerate", "cache:clear"], "answer": 1, "why": "`make:migration` compare tes entités et la base, puis écrit le SQL dans un fichier versionné."}, {"q": "Pourquoi `$id` vaut `null` juste après `new Article(...)` ?", "options": ["Bug de Doctrine", "L'id est généré par la base à l'insertion (au flush)", "Il faut appeler setId", "Le constructeur l'oublie"], "answer": 1, "why": "Avec `GeneratedValue`, l'id vient de la base."}], "td": {"title": "Entité Livre", "enonce": "Crée une entité `Livre` pour une bibliothèque, puis sa migration.", "consignes": ["Champs : `id`, `titre` (255), `isbn` (13, unique), `publieLe` (date immuable), `disponible` (bool, `true` par défaut)", "Constructeur avec titre, isbn et date", "Méthodes métier `emprunter()` (exception si déjà indisponible) et `rendre()`", "Génère puis lance la migration"], "starter": {"lang": "php", "code": "namespace App\\Entity;\n\nuse Doctrine\\DBAL\\Types\\Types;\nuse Doctrine\\ORM\\Mapping as ORM;\n\n#[ORM\\Entity]\nclass Livre\n{\n    // à toi\n}"}, "hints": ["Unique : `#[ORM\\Column(length: 13, unique: true)]`", "Date sans heure : `#[ORM\\Column(type: Types::DATE_IMMUTABLE)]`", "Valeur par défaut : `private bool $disponible = true;`"], "solution": {"lang": "php", "code": "#[ORM\\Entity]\nclass Livre\n{\n    #[ORM\\Id, ORM\\GeneratedValue, ORM\\Column]\n    private ?int $id = null;\n\n    #[ORM\\Column(length: 255)]\n    private string $titre;\n\n    #[ORM\\Column(length: 13, unique: true)]\n    private string $isbn;\n\n    #[ORM\\Column(type: Types::DATE_IMMUTABLE)]\n    private \\DateTimeImmutable $publieLe;\n\n    #[ORM\\Column]\n    private bool $disponible = true;\n\n    public function __construct(string $titre, string $isbn, \\DateTimeImmutable $publieLe)\n    {\n        $this->titre = $titre;\n        $this->isbn = $isbn;\n        $this->publieLe = $publieLe;\n    }\n\n    public function emprunter(): void\n    {\n        if (!$this->disponible) {\n            throw new \\DomainException('Livre déjà emprunté');\n        }\n        $this->disponible = false;\n    }\n\n    public function rendre(): void\n    {\n        $this->disponible = true;\n    }\n}\n\n// Terminal :\n// php bin/console make:migration\n// php bin/console doctrine:migrations:migrate"}, "checks": ["La migration contient un index UNIQUE sur `isbn`", "Aucun `setDisponible()` : on passe par `emprunter()` et `rendre()`"]}}, {"id": "doc-uow", "track": "doctrine", "title": "persist, flush & Unit of Work", "minutes": 12, "goal": "Savoir exactement quand Doctrine écrit en base.", "why": "Beaucoup de bugs viennent de là : « j'ai modifié l'objet mais rien n'est en base », ou l'inverse.", "flow": ["`persist($obj)` : Doctrine **commence à suivre** un nouvel objet", "Les objets chargés depuis la base sont **déjà suivis** (managed)", "Tu modifies tes objets normalement", "`flush()` **compare** et envoie tous les INSERT / UPDATE / DELETE dans une transaction"], "points": ["`persist` n'écrit rien. Seul `flush` exécute du SQL.", "Un objet récupéré via `find()` est déjà suivi : le modifier puis `flush()` suffit.", "La **Unit of Work** garde l'état d'origine de chaque objet suivi et calcule les différences au flush.", "`remove($obj)` marque pour suppression, effective au `flush`.", "Un seul `flush()` à la fin d'une action, pas un par objet."], "pitfalls": ["`flush()` dans une boucle : une transaction par tour, très lent.", "Oublier `persist` sur un **nouvel** objet : il n'est jamais inséré (sauf cascade)."], "example": {"lang": "php", "code": "// Créer\n$article = new Article('Hello', 'Premier article');\n$em->persist($article);   // suivi, rien en base\n$em->flush();             // INSERT INTO article ...\n\n// Modifier\n$article = $em->find(Article::class, 42); // déjà suivi\n$article->renommer('Nouveau titre');\n$em->flush();             // UPDATE article SET titre = ... WHERE id = 42\n\n// Supprimer\n$em->remove($article);\n$em->flush();             // DELETE FROM article WHERE id = 42", "notes": ["En Symfony, `$em` est un `EntityManagerInterface` injecté.", "Le bloc « Modifier » n'a pas de `persist` : l'objet vient de la base.", "Si rien n'a changé, `flush()` n'envoie aucune requête."]}, "quiz": [{"q": "Après `$em->persist($a)` sans `flush`, la ligne est-elle en base ?", "options": ["Oui", "Non", "Seulement en dev", "Oui, mais sans id"], "answer": 1, "why": "`persist` ne fait qu'inscrire l'objet dans la Unit of Work."}, {"q": "Tu charges un article avec `find`, changes son titre, puis `flush()`. Résultat ?", "options": ["Rien, il manque persist", "Un UPDATE automatique", "Un INSERT en double", "Une exception"], "answer": 1, "why": "L'objet est déjà suivi : Doctrine détecte le changement."}, {"q": "Tu importes 1000 produits. Où placer `flush()` ?", "options": ["Après chaque persist", "Une fois à la fin, ou par lots d'environ 100", "Jamais", "Avant les persist"], "answer": 1, "why": "Les lots évitent à la fois 1000 transactions et une mémoire qui explose."}], "td": {"title": "Prédire le SQL", "enonce": "Sans exécuter, écris en commentaire les requêtes envoyées à chaque `flush()`. Vérifie ensuite dans le profiler Symfony (onglet Doctrine).", "consignes": ["Pour chaque flush, écris INSERT, UPDATE, DELETE ou « rien »", "Justifie chaque réponse en une phrase"], "starter": {"lang": "php", "code": "$a = new Article('A', '...');\n$b = new Article('B', '...');\n$em->persist($a);\n$em->flush();          // 1) ?\n\n$b->renommer('B2');\n$em->flush();          // 2) ?\n\n$a->renommer('A2');\n$em->flush();          // 3) ?\n\n$em->persist($b);\n$em->remove($a);\n$em->flush();          // 4) ?\n\n$em->flush();          // 5) ?"}, "hints": ["`$b` n'a pas encore été persisté au 2e flush.", "Au 4e flush, `$b` porte déjà le titre « B2 »."], "solution": {"lang": "php", "code": "// 1) INSERT article (A) : $a est persisté\n// 2) Rien : $b n'est pas suivi par Doctrine\n// 3) UPDATE article SET titre = 'A2' WHERE id = <id de A> : $a est suivi\n// 4) INSERT article (B2) + DELETE article WHERE id = <id de A>, dans une transaction\n// 5) Rien : aucun changement depuis le dernier flush"}, "checks": ["Tu sais expliquer pourquoi le 2) n'envoie rien", "Tu as vérifié dans le profiler"]}}, {"id": "doc-repo", "track": "doctrine", "title": "Repositories & requêtes", "minutes": 15, "goal": "Récupérer des entités proprement : find, findBy, QueryBuilder.", "why": "Des requêtes éparpillées dans les contrôleurs sont dupliquées et dures à modifier. Le repository les rassemble.", "flow": ["Chaque entité a un **repository**", "Méthodes prêtes : `find`, `findBy`, `findOneBy`", "Pour le reste : une **méthode nommée** avec le QueryBuilder", "Le QueryBuilder produit du **DQL** (sur les entités), traduit en SQL"], "points": ["Le DQL parle d'**entités et de propriétés** (`a.creeLe`), pas de tables et de colonnes.", "Toujours des **paramètres** (`:depuis`) : jamais de concaténation, sinon injection SQL.", "Nomme les méthodes selon le besoin : `findPubliesDepuis()` plutôt que `findByStatusAndDate()`.", "`getResult()` : liste d'objets. `getOneOrNullResult()` : un objet ou null. `getSingleScalarResult()` : une valeur."], "pitfalls": ["Écrire du QueryBuilder dans un contrôleur.", "Charger toute la table puis filtrer en PHP avec `array_filter`."], "example": {"lang": "php", "code": "namespace App\\Repository;\n\nuse App\\Entity\\Article;\nuse Doctrine\\Bundle\\DoctrineBundle\\Repository\\ServiceEntityRepository;\nuse Doctrine\\Persistence\\ManagerRegistry;\n\n/** @extends ServiceEntityRepository<Article> */\nclass ArticleRepository extends ServiceEntityRepository\n{\n    public function __construct(ManagerRegistry $registry)\n    {\n        parent::__construct($registry, Article::class);\n    }\n\n    /** @return Article[] */\n    public function findPubliesDepuis(\\DateTimeImmutable $depuis, int $max = 10): array\n    {\n        return $this->createQueryBuilder('a')\n            ->andWhere('a.publie = true')\n            ->andWhere('a.creeLe >= :depuis')\n            ->setParameter('depuis', $depuis)\n            ->orderBy('a.creeLe', 'DESC')\n            ->setMaxResults($max)\n            ->getQuery()\n            ->getResult();\n    }\n}\n\n// Utilisation\n$recents = $articleRepository->findPubliesDepuis(new \\DateTimeImmutable('-7 days'));\n$un = $articleRepository->findOneBy(['titre' => 'Hello']);", "notes": ["`'a'` est l'alias de l'entité dans la requête.", "`:depuis` + `setParameter` : Doctrine échappe et type la valeur.", "Pour des filtres d'égalité simples, `findBy([...])` suffit."]}, "quiz": [{"q": "En DQL, on écrit…", "options": ["le nom des tables SQL", "le nom des entités et de leurs propriétés", "du SQL brut", "du JSON"], "answer": 1, "why": "Doctrine traduit ensuite vers les vraies tables et colonnes."}, {"q": "Pourquoi `setParameter` plutôt que concaténer la valeur ?", "options": ["C'est plus court", "Éviter l'injection SQL et gérer les types", "Obligatoire seulement en DQL", "Pour le cache"], "answer": 1, "why": "La valeur n'est jamais interprétée comme du code."}, {"q": "Quelle méthode renvoie un objet ou null ?", "options": ["getResult()", "getOneOrNullResult()", "getArrayResult()", "execute()"], "answer": 1, "why": "Elle lève une exception s'il y a plusieurs résultats."}], "td": {"title": "Recherche de livres", "enonce": "Dans `LivreRepository`, écris les méthodes dont la page de recherche a besoin.", "consignes": ["`rechercher(string $terme): array` : titres contenant le terme (insensible à la casse), triés par titre", "`compterDisponibles(): int`", "`plusRecents(int $n): array` : les n livres publiés le plus récemment"], "starter": {"lang": "php", "code": "class LivreRepository extends ServiceEntityRepository\n{\n    public function __construct(ManagerRegistry $registry)\n    {\n        parent::__construct($registry, Livre::class);\n    }\n\n    // à toi\n}"}, "hints": ["LIKE : `->andWhere('LOWER(l.titre) LIKE :t')->setParameter('t', '%' . mb_strtolower($terme) . '%')`", "Compter : `->select('COUNT(l.id)')` puis `getSingleScalarResult()`, à caster en int.", "Tri : `->orderBy('l.publieLe', 'DESC')->setMaxResults($n)`"], "solution": {"lang": "php", "code": "/** @return Livre[] */\npublic function rechercher(string $terme): array\n{\n    return $this->createQueryBuilder('l')\n        ->andWhere('LOWER(l.titre) LIKE :t')\n        ->setParameter('t', '%' . mb_strtolower($terme) . '%')\n        ->orderBy('l.titre', 'ASC')\n        ->getQuery()\n        ->getResult();\n}\n\npublic function compterDisponibles(): int\n{\n    return (int) $this->createQueryBuilder('l')\n        ->select('COUNT(l.id)')\n        ->andWhere('l.disponible = true')\n        ->getQuery()\n        ->getSingleScalarResult();\n}\n\n/** @return Livre[] */\npublic function plusRecents(int $n): array\n{\n    return $this->createQueryBuilder('l')\n        ->orderBy('l.publieLe', 'DESC')\n        ->setMaxResults($n)\n        ->getQuery()\n        ->getResult();\n}"}, "checks": ["`$terme` n'est jamais concaténé dans la chaîne DQL", "`compterDisponibles()` renvoie un `int`"]}}, {"id": "doc-relations", "track": "doctrine", "title": "Relations entre entités", "minutes": 18, "goal": "Mapper un ManyToOne / OneToMany et comprendre le côté propriétaire.", "why": "Les relations sont la première source de confusion avec Doctrine : on modifie un côté et rien n'est enregistré.", "flow": ["En base, une relation = **une clé étrangère** dans une table", "Le côté qui porte la clé est le **côté propriétaire** (ManyToOne)", "L'autre côté (OneToMany) est l'**inverse** : il sert juste à naviguer", "Au flush, Doctrine ne lit **que le côté propriétaire**"], "points": ["`commentaire.article_id` existe en base → `Commentaire::$article` est propriétaire (`inversedBy`).", "`Article::$commentaires` est inverse (`mappedBy`) : une `Collection`, initialisée dans le constructeur.", "Écris des méthodes qui **gardent les deux côtés cohérents** (`commenter()`).", "`cascade: ['persist']` : persister l'article persiste aussi ses nouveaux commentaires.", "`orphanRemoval: true` : retirer un commentaire de la collection le supprime en base."], "pitfalls": ["`$article->getCommentaires()->add($c)` sans fixer `$c->article` : le lien n'est pas enregistré.", "Mettre du `cascade` partout sans savoir pourquoi."], "example": {"lang": "php", "code": "#[ORM\\Entity]\nclass Article\n{\n    // ... id, titre\n\n    /** @var Collection<int, Commentaire> */\n    #[ORM\\OneToMany(targetEntity: Commentaire::class, mappedBy: 'article', cascade: ['persist'], orphanRemoval: true)]\n    private Collection $commentaires;\n\n    public function __construct(/* ... */)\n    {\n        $this->commentaires = new ArrayCollection();\n    }\n\n    public function commenter(string $auteur, string $texte): Commentaire\n    {\n        $commentaire = new Commentaire($this, $auteur, $texte);\n        $this->commentaires->add($commentaire);\n        return $commentaire;\n    }\n}\n\n#[ORM\\Entity]\nclass Commentaire\n{\n    // ... id\n\n    #[ORM\\ManyToOne(inversedBy: 'commentaires')]\n    #[ORM\\JoinColumn(nullable: false)]\n    private Article $article;\n\n    public function __construct(\n        Article $article,\n        #[ORM\\Column(length: 80)] private string $auteur,\n        #[ORM\\Column(type: 'text')] private string $texte,\n    ) {\n        $this->article = $article;\n    }\n}", "notes": ["`commenter()` crée le commentaire avec son article : les deux côtés sont cohérents.", "`cascade: ['persist']` : `persist($article)` + `flush()` insère aussi le commentaire.", "`JoinColumn(nullable: false)` : un commentaire sans article est interdit en base."]}, "quiz": [{"q": "Article (1) ↔ Commentaire (N) : quel côté est propriétaire ?", "options": ["Article", "Commentaire (ManyToOne, il porte la clé étrangère)", "Les deux", "Aucun"], "answer": 1, "why": "Le propriétaire est toujours le côté qui a la colonne `..._id`."}, {"q": "Tu fais seulement `$article->getCommentaires()->add($c)` puis `flush()`. Le lien est-il enregistré ?", "options": ["Oui", "Non : Doctrine ignore le côté inverse", "Oui, en double", "Seulement avec cascade"], "answer": 1, "why": "Seul `$c->article` (propriétaire) compte au flush."}, {"q": "`orphanRemoval: true` fait quoi ?", "options": ["Supprime l'article quand il n'a plus de commentaires", "Supprime un commentaire retiré de la collection", "Supprime les doublons", "Rien depuis Doctrine 3"], "answer": 1, "why": "Un commentaire sans article n'a pas de sens : il est supprimé."}], "td": {"title": "Auteurs et livres", "enonce": "Un auteur écrit plusieurs livres ; un livre a un seul auteur.", "consignes": ["Entité `Auteur` (id, nom) avec une collection `livres` (OneToMany)", "`Livre` a un `ManyToOne` vers `Auteur`, non nullable, reçu dans son constructeur", "`Auteur::ecrire(string $titre, string $isbn, \\DateTimeImmutable $date): Livre` crée le livre et l'ajoute à la collection", "Un seul `persist($auteur)` + `flush()` doit insérer l'auteur et ses livres"], "starter": {"lang": "php", "code": "#[ORM\\Entity]\nclass Auteur\n{\n    // à toi\n}\n\n#[ORM\\Entity]\nclass Livre\n{\n    // ajoute la relation vers Auteur\n}\n\n$auteur = new Auteur('Ursula K. Le Guin');\n$auteur->ecrire('Terremer', '9782253023418', new \\DateTimeImmutable('1968-01-01'));\n$em->persist($auteur);\n$em->flush(); // INSERT auteur + INSERT livre"}, "hints": ["Côté `Auteur` : `#[ORM\\OneToMany(targetEntity: Livre::class, mappedBy: 'auteur', cascade: ['persist'])]`", "Côté `Livre` : `#[ORM\\ManyToOne(inversedBy: 'livres')]` + `#[ORM\\JoinColumn(nullable: false)]`", "Initialise `$this->livres = new ArrayCollection();` dans le constructeur d'`Auteur`."], "solution": {"lang": "php", "code": "#[ORM\\Entity]\nclass Auteur\n{\n    #[ORM\\Id, ORM\\GeneratedValue, ORM\\Column]\n    private ?int $id = null;\n\n    /** @var Collection<int, Livre> */\n    #[ORM\\OneToMany(targetEntity: Livre::class, mappedBy: 'auteur', cascade: ['persist'])]\n    private Collection $livres;\n\n    public function __construct(#[ORM\\Column(length: 120)] private string $nom)\n    {\n        $this->livres = new ArrayCollection();\n    }\n\n    public function ecrire(string $titre, string $isbn, \\DateTimeImmutable $date): Livre\n    {\n        $livre = new Livre($this, $titre, $isbn, $date);\n        $this->livres->add($livre);\n        return $livre;\n    }\n}\n\n#[ORM\\Entity]\nclass Livre\n{\n    // ... id, titre, isbn, publieLe, disponible\n\n    #[ORM\\ManyToOne(inversedBy: 'livres')]\n    #[ORM\\JoinColumn(nullable: false)]\n    private Auteur $auteur;\n\n    public function __construct(Auteur $auteur, string $titre, string $isbn, \\DateTimeImmutable $publieLe)\n    {\n        $this->auteur = $auteur;\n        // ...\n    }\n}"}, "checks": ["On ne peut pas créer de `Livre` sans `Auteur`", "La migration ajoute `auteur_id` à la table `livre`"]}}, {"id": "doc-n1", "track": "doctrine", "title": "Lazy loading & problème N+1", "minutes": 12, "goal": "Repérer et corriger le problème N+1.", "why": "Une page qui affiche 50 articles et leurs auteurs peut lancer 51 requêtes sans que tu le voies.", "flow": ["Doctrine charge les relations en **lazy** : un **proxy** vide remplace l'objet", "Le proxy se charge **au premier accès** (une requête)", "Dans une boucle : 1 requête pour la liste **+ N** pour les relations", "Solution : un **fetch join** charge tout en une requête"], "points": ["Lazy = pratique par défaut, piège dans les boucles.", "Repère le N+1 dans le **profiler Symfony** : nombre de requêtes et requêtes identiques répétées.", "`leftJoin('a.auteur', 'au')->addSelect('au')` : c'est `addSelect` qui charge vraiment l'auteur.", "OneToMany joint + `setMaxResults` : utilise le `Paginator` de Doctrine, sinon la limite porte sur les lignes SQL et pas sur les entités."], "pitfalls": ["`leftJoin` sans `addSelect` : la jointure filtre, mais l'auteur reste lazy.", "Passer toutes les relations en `fetch: 'EAGER'` : tu charges trop, partout."], "example": {"lang": "php", "code": "// Contrôleur ou template\n$articles = $repo->findAll();              // 1 requête\nforeach ($articles as $a) {\n    echo $a->getAuteur()->getNom();        // +1 requête par auteur !\n}\n\n// Repository : version corrigée\npublic function findAvecAuteur(): array\n{\n    return $this->createQueryBuilder('a')\n        ->leftJoin('a.auteur', 'au')\n        ->addSelect('au')                  // charge l'auteur dans la même requête\n        ->orderBy('a.creeLe', 'DESC')\n        ->getQuery()\n        ->getResult();                     // 1 seule requête au total\n}", "notes": ["Sans `addSelect`, `getAuteur()` renvoie un proxy qui déclenche une requête.", "Avec, les auteurs sont déjà en mémoire.", "Doctrine ne recharge pas deux fois le même auteur (identity map)."]}, "quiz": [{"q": "50 articles affichent leur auteur (lazy). Combien de requêtes au maximum ?", "options": ["1", "2", "51", "50"], "answer": 2, "why": "1 pour la liste, puis 1 par auteur différent."}, {"q": "Quelle ligne charge réellement l'auteur avec l'article ?", "options": ["`leftJoin` seul", "`addSelect('au')`", "`orderBy`", "`getResult`"], "answer": 1, "why": "La jointure sans `addSelect` ne sélectionne pas les colonnes de l'auteur."}, {"q": "Où voir le nombre de requêtes d'une page Symfony ?", "options": ["Dans les logs Apache", "Dans le profiler (barre de debug, onglet Doctrine)", "Dans composer.json", "Impossible"], "answer": 1, "why": "Le profiler signale aussi les requêtes répétées."}], "td": {"title": "Corriger la page catalogue", "enonce": "La page catalogue affiche chaque livre, son auteur et son nombre d'emprunts. Elle lance 101 requêtes pour 50 livres.", "consignes": ["Explique d'où viennent les 101 requêtes", "Écris `LivreRepository::catalogue()` qui charge auteur et emprunts en une requête", "Bonus : pour juste afficher un nombre, compare avec une requête qui renvoie un COUNT"], "starter": {"lang": "php", "code": "// LivreController\n$livres = $livreRepository->findBy([], ['titre' => 'ASC']);\n\n// templates/livre/catalogue.html.twig\n// {% for livre in livres %}\n//   {{ livre.titre }} - {{ livre.auteur.nom }} - {{ livre.emprunts|length }} emprunts\n// {% endfor %}"}, "hints": ["101 = 1 (livres) + 50 (auteurs) + 50 (collections d'emprunts).", "Deux jointures, chacune avec son `addSelect`."], "solution": {"lang": "php", "code": "// 101 requêtes = 1 (liste) + 50 (auteur de chaque livre) + 50 (emprunts de chaque livre)\n\n/** @return Livre[] */\npublic function catalogue(): array\n{\n    return $this->createQueryBuilder('l')\n        ->leftJoin('l.auteur', 'a')->addSelect('a')\n        ->leftJoin('l.emprunts', 'e')->addSelect('e')\n        ->orderBy('l.titre', 'ASC')\n        ->getQuery()\n        ->getResult();\n}\n\n// Bonus : si on veut juste le nombre, pas besoin de charger les emprunts\npublic function catalogueAvecNbEmprunts(): array\n{\n    return $this->createQueryBuilder('l')\n        ->select('l AS livre', 'a', 'COUNT(e.id) AS nbEmprunts')\n        ->leftJoin('l.auteur', 'a')\n        ->leftJoin('l.emprunts', 'e')\n        ->groupBy('l.id, a.id')\n        ->orderBy('l.titre', 'ASC')\n        ->getQuery()\n        ->getResult(); // [['livre' => Livre, 'nbEmprunts' => 3], ...]\n}"}, "checks": ["Le profiler affiche 1 requête pour la page", "Tu sais expliquer pourquoi `addSelect` est nécessaire"]}}, {"id": "dto-pourquoi", "track": "dto", "title": "DTO : à quoi ça sert", "minutes": 12, "goal": "Comprendre ce qu'est un DTO et où il se place entre l'API et tes entités.", "why": "Si ton API renvoie directement l'entité `User`, tu exposes le mot de passe haché, tu crées des boucles infinies avec les relations, et le moindre renommage de colonne casse le front.", "flow": ["Le front envoie du **JSON** (ex. `axios.post('/api/articles', {...})`)", "Symfony le transforme en **DTO d'entrée** et le **valide**", "Ton service utilise le DTO pour créer ou modifier l'**entité**", "La réponse part sous forme de **DTO de sortie**, converti en JSON"], "points": ["DTO = *Data Transfer Object* : une petite classe **sans logique**, juste des propriétés, qui décrit des données qui voyagent.", "L'entité représente ta base ; le DTO représente **ce que l'API accepte ou renvoie**. Ce ne sont pas les mêmes besoins.", "Un DTO par usage : `CreateArticleInput`, `UpdateArticleInput`, `ArticleOutput`, `ArticleListItem`…", "Les propriétés sont souvent `public readonly` : simple à lire, impossible à modifier par erreur.", "C'est le **contrat** entre ton back Symfony et ton front React."], "pitfalls": ["Utiliser l'entité Doctrine comme objet de formulaire ou de réponse JSON.", "Mettre de la logique métier dans un DTO : il transporte, il ne décide pas."], "example": {"lang": "php", "code": "// Ce que le front ENVOIE pour créer un article\nfinal class CreateArticleInput\n{\n    public function __construct(\n        public readonly string $titre,\n        public readonly string $contenu,\n        public readonly array $tags = [],\n    ) {}\n}\n\n// Ce que l'API RENVOIE (on choisit les champs exposés)\nfinal class ArticleOutput\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly string $titre,\n        public readonly string $extrait,\n        public readonly string $auteur,      // juste le nom, pas l'objet User\n        public readonly string $creeLe,      // date formatée\n    ) {}\n}\n\n// L'entité Article, elle, reste interne : relations, id, mot de passe de l'auteur...\n// Elle ne sort jamais telle quelle de l'API.", "notes": ["Deux DTO différents pour l'entrée et la sortie : ils n'ont pas les mêmes champs.", "`auteur` est une simple chaîne : pas de relation à sérialiser, pas de boucle.", "Si tu renommes une colonne en base, seul le code qui remplit `ArticleOutput` change : le front ne voit rien."]}, "quiz": [{"q": "Pourquoi ne pas renvoyer l'entité `User` directement en JSON ?", "options": ["C'est plus lent", "On exposerait des champs sensibles et on lierait le front à la structure de la base", "Symfony l'interdit", "Le JSON ne gère pas les objets"], "answer": 1, "why": "Le DTO choisit exactement ce qui sort."}, {"q": "Un DTO contient…", "options": ["la logique métier", "des données à transporter, sans logique", "les requêtes SQL", "le mapping Doctrine"], "answer": 1, "why": "Il décrit une forme de données, c'est tout."}, {"q": "Pour créer et pour afficher un article, combien de DTO ?", "options": ["Un seul pour tout", "Deux : un d'entrée et un de sortie", "Aucun, on utilise l'entité", "Un par colonne"], "answer": 1, "why": "Le client n'envoie pas l'id ni la date de création, mais il les reçoit."}], "td": {"title": "Concevoir les DTO d'une inscription", "enonce": "Pour l'inscription d'un utilisateur, écris les deux DTO. Pas encore de contrôleur.", "consignes": ["`RegisterInput` : ce que le formulaire React envoie (email, mot de passe, pseudo, acceptation des CGU)", "`UserOutput` : ce que l'API renvoie après inscription", "Explique en commentaire pourquoi le mot de passe n'apparaît que dans l'un des deux", "Propriétés `public readonly`, aucune méthode"], "starter": {"lang": "php", "code": "final class RegisterInput\n{\n    // à toi\n}\n\nfinal class UserOutput\n{\n    // à toi\n}"}, "hints": ["Le client n'envoie pas d'id ni de date : ils sont générés côté serveur.", "La sortie peut contenir `id`, `email`, `pseudo`, `inscritLe`… mais jamais le mot de passe."], "solution": {"lang": "php", "code": "final class RegisterInput\n{\n    public function __construct(\n        public readonly string $email,\n        public readonly string $motDePasse,   // en clair, uniquement à l'entrée : on le hache tout de suite\n        public readonly string $pseudo,\n        public readonly bool $accepteCgu,\n    ) {}\n}\n\nfinal class UserOutput\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly string $email,\n        public readonly string $pseudo,\n        public readonly string $inscritLe,\n    ) {}\n    // Pas de mot de passe : une réponse d'API ne renvoie jamais un secret, même haché.\n}"}, "checks": ["`UserOutput` ne contient aucun champ sensible", "`RegisterInput` ne contient pas d'id"]}}, {"id": "dto-entree", "track": "dto", "title": "DTO d'entrée & validation", "minutes": 15, "goal": "Recevoir le JSON du front dans un DTO validé automatiquement.", "why": "Lire `$request->getContent()`, faire `json_decode` et vérifier chaque champ à la main est long et on oublie toujours un cas.", "flow": ["Le front envoie un corps JSON (`POST /api/articles`)", "`#[MapRequestPayload]` **désérialise** le JSON dans ton DTO", "Le **Validator** vérifie les contraintes `#[Assert\\...]`", "Valide → ton contrôleur reçoit le DTO. Invalide → Symfony répond **422** avec la liste des erreurs"], "points": ["`#[MapRequestPayload]` existe depuis Symfony 6.3.", "Les noms des clés JSON doivent correspondre aux propriétés du DTO.", "Contraintes courantes : `NotBlank`, `Length`, `Email`, `Positive`, `Choice`, `Count`.", "Si la validation échoue, ton code ne s'exécute même pas : le contrôleur reste court.", "Côté React, le 422 arrive dans `error.response.data` avec axios : tu peux afficher les erreurs sous chaque champ."], "pitfalls": ["Valider dans le contrôleur avec des `if` au lieu des contraintes.", "Oublier `NotBlank` : une chaîne vide passe le type `string`."], "example": {"lang": "php", "code": "// src/Dto/CreateArticleInput.php\nnamespace App\\Dto;\n\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nfinal class CreateArticleInput\n{\n    public function __construct(\n        #[Assert\\NotBlank]\n        #[Assert\\Length(min: 5, max: 180)]\n        public readonly string $titre = '',\n\n        #[Assert\\NotBlank]\n        public readonly string $contenu = '',\n\n        #[Assert\\Count(max: 5)]\n        #[Assert\\All([new Assert\\Length(max: 30)])]\n        public readonly array $tags = [],\n    ) {}\n}\n\n// src/Controller/ArticleController.php\n#[Route('/api/articles', methods: ['POST'])]\npublic function create(\n    #[MapRequestPayload] CreateArticleInput $input,\n    ArticleService $articles,\n): JsonResponse {\n    $article = $articles->creer($input);              // on ne passe que des données valides\n    return $this->json(ArticleOutput::fromEntity($article), 201);\n}", "notes": ["Les valeurs par défaut (`''`) permettent de signaler « champ manquant » proprement via `NotBlank`.", "Le contrôleur fait 2 lignes : la validation est déjà faite.", "201 = « créé »."]}, "quiz": [{"q": "Que fait `#[MapRequestPayload]` ?", "options": ["Il enregistre en base", "Il transforme le JSON reçu en DTO et le valide", "Il génère une migration", "Il crée une route"], "answer": 1, "why": "Désérialisation + validation, avant d'entrer dans ton contrôleur."}, {"q": "Le front envoie un titre vide. Que se passe-t-il ?", "options": ["Le contrôleur plante", "Symfony répond 422 avec les erreurs, le contrôleur n'est pas exécuté", "L'article est créé sans titre", "200 OK"], "answer": 1, "why": "`NotBlank` échoue, Symfony arrête là."}, {"q": "Pourquoi `#[Assert\\NotBlank]` sur une propriété `string` ?", "options": ["Inutile, le type suffit", "Le type accepte une chaîne vide `''`", "Pour la performance", "Pour Doctrine"], "answer": 1, "why": "Le type vérifie que c'est une chaîne, pas qu'elle contient quelque chose."}], "td": {"title": "Endpoint d'inscription", "enonce": "Reprends `RegisterInput` et branche-le sur un endpoint qui valide tout.", "consignes": ["Email valide et obligatoire", "Mot de passe : 8 caractères minimum", "Pseudo : 3 à 20 caractères, lettres, chiffres et `_` seulement (`Regex`)", "`accepteCgu` doit valoir `true` (`IsTrue`)", "Route `POST /api/register` qui renvoie 201 et un `UserOutput`"], "starter": {"lang": "php", "code": "use Symfony\\Component\\Validator\\Constraints as Assert;\n\nfinal class RegisterInput\n{\n    public function __construct(\n        public readonly string $email = '',\n        public readonly string $motDePasse = '',\n        public readonly string $pseudo = '',\n        public readonly bool $accepteCgu = false,\n    ) {}\n}\n\n// Contrôleur : à toi"}, "hints": ["`#[Assert\\Regex('/^[a-zA-Z0-9_]+$/')]`", "`#[Assert\\IsTrue(message: 'Tu dois accepter les CGU')]`", "Le hachage du mot de passe se fait dans le service, avec `UserPasswordHasherInterface`."], "solution": {"lang": "php", "code": "final class RegisterInput\n{\n    public function __construct(\n        #[Assert\\NotBlank, Assert\\Email]\n        public readonly string $email = '',\n\n        #[Assert\\NotBlank, Assert\\Length(min: 8)]\n        public readonly string $motDePasse = '',\n\n        #[Assert\\NotBlank, Assert\\Length(min: 3, max: 20), Assert\\Regex('/^[a-zA-Z0-9_]+$/')]\n        public readonly string $pseudo = '',\n\n        #[Assert\\IsTrue(message: 'Tu dois accepter les CGU')]\n        public readonly bool $accepteCgu = false,\n    ) {}\n}\n\n#[Route('/api/register', methods: ['POST'])]\npublic function register(\n    #[MapRequestPayload] RegisterInput $input,\n    InscriptionService $inscription,\n): JsonResponse {\n    $user = $inscription->inscrire($input);\n    return $this->json(new UserOutput(\n        $user->getId(),\n        $user->getEmail(),\n        $user->getPseudo(),\n        $user->getInscritLe()->format(DATE_ATOM),\n    ), 201);\n}"}, "checks": ["Un POST avec `\"pseudo\": \"a b\"` renvoie 422", "Le contrôleur ne contient aucun `if` de validation"]}}, {"id": "dto-sortie", "track": "dto", "title": "DTO de sortie & mapping", "minutes": 12, "goal": "Transformer une entité en DTO de sortie, proprement et à un seul endroit.", "why": "Sérialiser l'entité directement provoque des boucles (Article → Auteur → Articles → …) et expose des champs que le front n'a pas à voir.", "flow": ["Le contrôleur récupère une ou plusieurs **entités**", "Une méthode **`fromEntity()`** construit le DTO de sortie", "Le DTO ne contient que des **types simples** (string, int, tableaux)", "`$this->json($dto)` le convertit en **JSON**"], "points": ["Mets le mapping dans une méthode statique du DTO (`ArticleOutput::fromEntity($a)`) ou dans une classe dédiée (`ArticleMapper`).", "Formate les dates en chaînes (`DATE_ATOM`) : le front sait les lire.", "Pour une liste : `array_map(ArticleOutput::fromEntity(...), $articles)`.", "Un DTO « liste » plus léger qu'un DTO « détail » évite d'envoyer le contenu complet de 50 articles."], "pitfalls": ["Faire le mapping dans chaque contrôleur : il finit copié-collé et différent partout.", "Mettre un objet entité dans le DTO de sortie : la boucle revient."], "example": {"lang": "php", "code": "final class ArticleOutput\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly string $titre,\n        public readonly string $extrait,\n        public readonly string $auteur,\n        public readonly string $creeLe,\n    ) {}\n\n    public static function fromEntity(Article $a): self\n    {\n        return new self(\n            id: $a->getId(),\n            titre: $a->getTitre(),\n            extrait: mb_substr($a->getContenu(), 0, 140),\n            auteur: $a->getAuteur()->getNom(),\n            creeLe: $a->getCreeLe()->format(DATE_ATOM),\n        );\n    }\n}\n\n#[Route('/api/articles', methods: ['GET'])]\npublic function list(ArticleRepository $repo): JsonResponse\n{\n    $articles = $repo->findAvecAuteur();   // fetch join, voir le module N+1\n    return $this->json(array_map(ArticleOutput::fromEntity(...), $articles));\n}\n\n// JSON renvoyé :\n// [{\"id\":1,\"titre\":\"Hello\",\"extrait\":\"...\",\"auteur\":\"Ana\",\"creeLe\":\"2026-11-10T09:00:00+01:00\"}]", "notes": ["Les arguments nommés (`id:`, `titre:`) rendent le mapping lisible.", "`ArticleOutput::fromEntity(...)` (syntaxe PHP 8.1) passe la méthode comme fonction à `array_map`.", "Le JSON correspond exactement aux propriétés du DTO : c'est ce que React reçoit dans `response.data`."]}, "quiz": [{"q": "Pourquoi `auteur` est une `string` et pas un objet `User` ?", "options": ["Pour la performance", "Pour éviter les boucles et ne pas exposer tout l'utilisateur", "Doctrine l'impose", "Par habitude"], "answer": 1, "why": "Le DTO de sortie ne contient que ce dont l'écran a besoin."}, {"q": "Où placer le code entité → DTO ?", "options": ["Dans chaque contrôleur", "À un seul endroit : `fromEntity()` ou un mapper", "Dans le template", "Dans l'entité"], "answer": 1, "why": "Un seul endroit = une seule version du JSON."}, {"q": "Côté React avec axios, où se trouve ce JSON ?", "options": ["`response.json`", "`response.data`", "`response.body`", "`response.dto`"], "answer": 1, "why": "axios décode le JSON et le met dans `data`."}], "td": {"title": "API du catalogue de livres", "enonce": "Expose les livres de la bibliothèque (modules Doctrine) avec deux DTO.", "consignes": ["`LivreListItem` : id, titre, auteur (nom), disponible", "`LivreDetail` : tout `LivreListItem` + isbn, publieLe (Y-m-d)", "`GET /api/livres` renvoie une liste de `LivreListItem`", "`GET /api/livres/{id}` renvoie un `LivreDetail` ou 404"], "starter": {"lang": "php", "code": "final class LivreListItem\n{\n    // à toi\n}\n\nfinal class LivreDetail\n{\n    // à toi\n}\n\n// LivreController : à toi"}, "hints": ["404 : `throw $this->createNotFoundException();` si le livre est introuvable.", "Avec `#[Route('/api/livres/{id}')]` et un paramètre `Livre $livre`, Symfony charge l'entité et renvoie 404 tout seul (EntityValueResolver)."], "solution": {"lang": "php", "code": "final class LivreListItem\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly string $titre,\n        public readonly string $auteur,\n        public readonly bool $disponible,\n    ) {}\n\n    public static function fromEntity(Livre $l): self\n    {\n        return new self($l->getId(), $l->getTitre(), $l->getAuteur()->getNom(), $l->isDisponible());\n    }\n}\n\nfinal class LivreDetail\n{\n    public function __construct(\n        public readonly int $id,\n        public readonly string $titre,\n        public readonly string $auteur,\n        public readonly bool $disponible,\n        public readonly string $isbn,\n        public readonly string $publieLe,\n    ) {}\n\n    public static function fromEntity(Livre $l): self\n    {\n        return new self(\n            $l->getId(), $l->getTitre(), $l->getAuteur()->getNom(), $l->isDisponible(),\n            $l->getIsbn(), $l->getPublieLe()->format('Y-m-d'),\n        );\n    }\n}\n\n#[Route('/api/livres', methods: ['GET'])]\npublic function list(LivreRepository $repo): JsonResponse\n{\n    return $this->json(array_map(LivreListItem::fromEntity(...), $repo->catalogue()));\n}\n\n#[Route('/api/livres/{id}', methods: ['GET'])]\npublic function show(Livre $livre): JsonResponse   // 404 automatique si absent\n{\n    return $this->json(LivreDetail::fromEntity($livre));\n}"}, "checks": ["Le JSON ne contient aucun objet imbriqué `auteur: {...}`", "`/api/livres/999999` renvoie 404"]}}, {"id": "dto-modifier", "track": "dto", "title": "Du DTO à l'entité (créer, modifier)", "minutes": 15, "goal": "Utiliser un DTO d'entrée pour créer ou modifier une entité, sans setters partout.", "why": "Faire `$article->setTitre($data['titre'])` champ par champ dans le contrôleur mélange HTTP, règles et base de données.", "flow": ["Le contrôleur reçoit un **DTO validé**", "Il le passe à un **service** (le cas d'usage)", "Le service appelle le **constructeur** ou une **méthode métier** de l'entité avec les valeurs du DTO", "Puis `flush()`, et on renvoie un **DTO de sortie**"], "points": ["Création : `new Article($input->titre, $input->contenu, $auteur)`.", "Modification : une méthode métier, `$article->modifier($input->titre, $input->contenu)`.", "PUT = remplacer toute la ressource (tous les champs requis). PATCH = modifier une partie (champs optionnels, souvent `?string`).", "L'entité garde ses règles (modules Encapsulation et Entités riches) ; le DTO ne fait que transporter."], "pitfalls": ["Faire hériter le DTO de l'entité, ou l'inverse.", "Utiliser un seul DTO pour créer et modifier alors que les champs obligatoires ne sont pas les mêmes."], "example": {"lang": "php", "code": "final class UpdateArticleInput\n{\n    public function __construct(\n        #[Assert\\NotBlank, Assert\\Length(min: 5, max: 180)]\n        public readonly string $titre = '',\n        #[Assert\\NotBlank]\n        public readonly string $contenu = '',\n    ) {}\n}\n\nfinal class ArticleService\n{\n    public function __construct(private EntityManagerInterface $em) {}\n\n    public function creer(CreateArticleInput $in, User $auteur): Article\n    {\n        $article = new Article($in->titre, $in->contenu, $auteur);\n        $this->em->persist($article);\n        $this->em->flush();\n        return $article;\n    }\n\n    public function modifier(Article $article, UpdateArticleInput $in): Article\n    {\n        $article->modifier($in->titre, $in->contenu);   // méthode métier de l'entité\n        $this->em->flush();                             // déjà suivie : pas de persist\n        return $article;\n    }\n}\n\n#[Route('/api/articles/{id}', methods: ['PUT'])]\npublic function update(\n    Article $article,\n    #[MapRequestPayload] UpdateArticleInput $input,\n    ArticleService $service,\n): JsonResponse {\n    return $this->json(ArticleOutput::fromEntity($service->modifier($article, $input)));\n}", "notes": ["Le contrôleur : HTTP → DTO → service → DTO de sortie.", "Le service : il orchestre, sans connaître HTTP.", "Pas de `persist` dans `modifier` : l'article vient de la base (module Unit of Work)."]}, "quiz": [{"q": "Pour modifier seulement le titre d'un article, quelle méthode HTTP ?", "options": ["GET", "PATCH", "DELETE", "POST"], "answer": 1, "why": "PATCH = modification partielle ; PUT remplace toute la ressource."}, {"q": "Qui applique les valeurs du DTO à l'entité ?", "options": ["Le DTO lui-même", "Un service, via le constructeur ou une méthode métier de l'entité", "Le front", "Doctrine automatiquement"], "answer": 1, "why": "Le service orchestre, l'entité garde ses règles."}, {"q": "Dans `modifier()`, pourquoi pas de `persist` ?", "options": ["Oubli", "L'article vient de la base, il est déjà suivi par Doctrine", "PUT n'en a pas besoin", "Le DTO s'en charge"], "answer": 1, "why": "Seuls les nouveaux objets ont besoin de `persist`."}], "td": {"title": "Emprunter un livre via l'API", "enonce": "Crée l'endpoint qui enregistre un emprunt.", "consignes": ["DTO `EmpruntInput` : `livreId` (int, positif), `rendreLe` (date `Y-m-d`, dans le futur)", "Service `EmpruntService::emprunter(EmpruntInput $in, User $membre): Emprunt`", "Le service appelle `$livre->emprunter()` (exception si indisponible)", "Route `POST /api/emprunts` → 201 + `EmpruntOutput` ; 409 si le livre est déjà emprunté"], "starter": {"lang": "php", "code": "final class EmpruntInput\n{\n    // à toi\n}\n\nfinal class EmpruntService\n{\n    // à toi\n}\n\n// Contrôleur : à toi"}, "hints": ["Date : `#[Assert\\Date]` sur une `string`, puis `new \\DateTimeImmutable($in->rendreLe)` dans le service. Vérifie qu'elle est future dans le service ou avec `GreaterThan('today')` sur un `DateTimeImmutable`.", "409 Conflict : attrape la `DomainException` dans le contrôleur et renvoie `$this->json(['error' => ...], 409)`.", "`#[CurrentUser] User $membre` donne l'utilisateur connecté."], "solution": {"lang": "php", "code": "final class EmpruntInput\n{\n    public function __construct(\n        #[Assert\\Positive]\n        public readonly int $livreId = 0,\n        #[Assert\\NotBlank, Assert\\Date]\n        public readonly string $rendreLe = '',\n    ) {}\n}\n\nfinal class EmpruntService\n{\n    public function __construct(private EntityManagerInterface $em, private LivreRepository $livres) {}\n\n    public function emprunter(EmpruntInput $in, User $membre): Emprunt\n    {\n        $livre = $this->livres->find($in->livreId) ?? throw new NotFoundHttpException('Livre introuvable');\n        $retour = new \\DateTimeImmutable($in->rendreLe);\n        if ($retour <= new \\DateTimeImmutable('today')) {\n            throw new \\InvalidArgumentException('La date de retour doit être dans le futur');\n        }\n        $livre->emprunter();                         // DomainException si indisponible\n        $emprunt = new Emprunt($livre, $membre, $retour);\n        $this->em->persist($emprunt);\n        $this->em->flush();\n        return $emprunt;\n    }\n}\n\n#[Route('/api/emprunts', methods: ['POST'])]\npublic function create(\n    #[MapRequestPayload] EmpruntInput $input,\n    #[CurrentUser] User $membre,\n    EmpruntService $service,\n): JsonResponse {\n    try {\n        $emprunt = $service->emprunter($input, $membre);\n    } catch (\\DomainException $e) {\n        return $this->json(['error' => $e->getMessage()], 409);\n    } catch (\\InvalidArgumentException $e) {\n        return $this->json(['error' => $e->getMessage()], 422);\n    }\n    return $this->json(EmpruntOutput::fromEntity($emprunt), 201);\n}"}, "checks": ["Emprunter deux fois le même livre renvoie 409", "Le contrôleur ne modifie aucune entité lui-même"]}}, {"id": "dto-query", "track": "dto", "title": "Filtres & pagination (query string)", "minutes": 10, "goal": "Recevoir les paramètres d'URL (`?page=2&q=php`) dans un DTO validé.", "why": "Une liste a presque toujours des filtres et une pagination. Les lire un par un avec `$request->query->get()` est fastidieux et non validé.", "flow": ["Le front appelle `GET /api/articles?q=php&page=2`", "`#[MapQueryString]` remplit un **DTO de filtres**", "Les contraintes **valident** (page ≥ 1, taille max…)", "Le repository reçoit le DTO et construit la requête"], "points": ["`#[MapQueryString]` (Symfony 6.3+) fonctionne comme `#[MapRequestPayload]`, mais avec l'URL.", "Donne des valeurs par défaut : `page = 1`, `parPage = 20`.", "Limite `parPage` (ex. 100) pour qu'on ne puisse pas demander un million de lignes.", "Renvoie aussi le total pour que le front affiche la pagination : `{ items: [...], total: 134, page: 2 }`.", "Côté axios : `api.get('/articles', { params: { q: 'php', page: 2 } })` construit l'URL pour toi."], "pitfalls": ["Accepter `parPage` sans limite.", "Construire la requête en concaténant les filtres (injection SQL)."], "example": {"lang": "php", "code": "final class ArticleFilters\n{\n    public function __construct(\n        #[Assert\\Length(max: 50)]\n        public readonly ?string $q = null,\n        #[Assert\\Positive]\n        public readonly int $page = 1,\n        #[Assert\\Range(min: 1, max: 100)]\n        public readonly int $parPage = 20,\n    ) {}\n}\n\n#[Route('/api/articles', methods: ['GET'])]\npublic function list(\n    #[MapQueryString] ?ArticleFilters $filters,\n    ArticleRepository $repo,\n): JsonResponse {\n    $filters ??= new ArticleFilters();             // aucune query string\n    [$articles, $total] = $repo->rechercher($filters);\n\n    return $this->json([\n        'items' => array_map(ArticleOutput::fromEntity(...), $articles),\n        'total' => $total,\n        'page' => $filters->page,\n    ]);\n}\n\n// Repository\npublic function rechercher(ArticleFilters $f): array\n{\n    $qb = $this->createQueryBuilder('a')->leftJoin('a.auteur', 'u')->addSelect('u');\n    if ($f->q) {\n        $qb->andWhere('LOWER(a.titre) LIKE :q')->setParameter('q', '%' . mb_strtolower($f->q) . '%');\n    }\n    $qb->orderBy('a.creeLe', 'DESC')\n       ->setFirstResult(($f->page - 1) * $f->parPage)\n       ->setMaxResults($f->parPage);\n\n    $paginator = new Paginator($qb);\n    return [iterator_to_array($paginator), count($paginator)];\n}", "notes": ["`?ArticleFilters` + `??=` : sans query string, on prend les valeurs par défaut.", "`Paginator` (Doctrine) donne la page ET le total.", "La réponse a une forme fixe que le front peut utiliser pour la pagination."]}, "quiz": [{"q": "`GET /api/articles?parPage=5000` avec `Range(max: 100)` :", "options": ["Renvoie 5000 articles", "Renvoie une erreur de validation (4xx)", "Renvoie 100 articles", "Plante"], "answer": 1, "why": "La contrainte protège ta base."}, {"q": "Avec axios, comment envoyer `?q=php&page=2` proprement ?", "options": ["Concaténer la chaîne à la main", "`api.get('/articles', { params: { q: 'php', page: 2 } })`", "Dans le body", "Dans un header"], "answer": 1, "why": "axios encode les paramètres pour toi."}, {"q": "Pourquoi renvoyer `total` avec la liste ?", "options": ["Pour le cache", "Pour que le front calcule le nombre de pages", "Doctrine l'exige", "Pour la sécurité"], "answer": 1, "why": "Sans total, impossible d'afficher « page 2 sur 7 »."}], "td": {"title": "Filtrer le catalogue", "enonce": "Ajoute filtres et pagination à `GET /api/livres`.", "consignes": ["DTO `LivreFilters` : `q` (texte), `disponible` (booléen optionnel), `page`, `parPage` (max 50)", "Le repository applique uniquement les filtres fournis", "Réponse : `{ items, total, page, pages }`"], "starter": {"lang": "php", "code": "final class LivreFilters\n{\n    // à toi\n}\n\n// LivreRepository::rechercher(LivreFilters $f): array  -> [livres, total]\n// LivreController::list : à toi"}, "hints": ["`public readonly ?bool $disponible = null` : null = pas de filtre.", "`pages` = `(int) ceil($total / $f->parPage)`."], "solution": {"lang": "php", "code": "final class LivreFilters\n{\n    public function __construct(\n        #[Assert\\Length(max: 50)]\n        public readonly ?string $q = null,\n        public readonly ?bool $disponible = null,\n        #[Assert\\Positive]\n        public readonly int $page = 1,\n        #[Assert\\Range(min: 1, max: 50)]\n        public readonly int $parPage = 20,\n    ) {}\n}\n\npublic function rechercher(LivreFilters $f): array\n{\n    $qb = $this->createQueryBuilder('l')->leftJoin('l.auteur', 'a')->addSelect('a');\n    if ($f->q) {\n        $qb->andWhere('LOWER(l.titre) LIKE :q')->setParameter('q', '%' . mb_strtolower($f->q) . '%');\n    }\n    if ($f->disponible !== null) {\n        $qb->andWhere('l.disponible = :d')->setParameter('d', $f->disponible);\n    }\n    $qb->orderBy('l.titre', 'ASC')\n       ->setFirstResult(($f->page - 1) * $f->parPage)\n       ->setMaxResults($f->parPage);\n    $p = new Paginator($qb);\n    return [iterator_to_array($p), count($p)];\n}\n\n#[Route('/api/livres', methods: ['GET'])]\npublic function list(#[MapQueryString] ?LivreFilters $f, LivreRepository $repo): JsonResponse\n{\n    $f ??= new LivreFilters();\n    [$livres, $total] = $repo->rechercher($f);\n    return $this->json([\n        'items' => array_map(LivreListItem::fromEntity(...), $livres),\n        'total' => $total,\n        'page' => $f->page,\n        'pages' => (int) ceil($total / $f->parPage),\n    ]);\n}"}, "checks": ["`?disponible=true` ne renvoie que les livres disponibles", "`?parPage=200` est refusé"]}}, {"id": "arch-roles", "track": "arch", "title": "Qui fait quoi : les 5 rôles", "minutes": 15, "goal": "Savoir exactement le rôle du contrôleur, du DTO, du service, de l'entité et du repository.", "why": "Sans séparation, tout finit dans le contrôleur : 200 lignes qui lisent le JSON, valident, calculent, font du SQL et formatent la réponse. Impossible à relire, à tester ou à réutiliser. Pense à un restaurant : le serveur prend la commande, le chef cuisine, le magasinier gère le stock. Personne ne fait le travail des autres.", "flow": ["**Contrôleur** (le serveur du restaurant) : reçoit la requête HTTP, appelle le bon service, renvoie la réponse", "**DTO** (le bon de commande) : la forme des données qui entrent et qui sortent", "**Service** (le chef) : exécute le cas d'usage, applique la logique, coordonne", "**Entité + Repository** (les ingrédients + le magasinier) : l'entité porte les données et ses règles ; le repository les cherche et les range en base"], "points": ["**Contrôleur** : parle HTTP (route, statut, JSON). Il ne contient **aucune** règle métier ni requête. Objectif : moins de 15 lignes par action.", "**DTO** : aucune logique ; juste des propriétés et des contraintes de validation.", "**Service** : ne connaît **pas** HTTP (pas de `Request`, pas de `JsonResponse`). Il pourrait être appelé par une commande console ou un test.", "**Entité** : ses propres règles (`emprunter()` refuse si indisponible). **Repository** : seulement des lectures en base (`find`, QueryBuilder).", "Test simple : si tu peux décrire une classe en une phrase sans « et », elle a un seul rôle."], "pitfalls": ["Un `if` métier dans le contrôleur (« si le stock est à 0… »).", "Un service qui renvoie une `JsonResponse` ou lit `$request`."], "example": {"lang": "plaintext", "code": "            REQUÊTE HTTP  POST /api/emprunts  {\"livreId\": 3, \"rendreLe\": \"2026-12-01\"}\n                 |\n                 v\n  +-----------------------------+\n  | CONTRÔLEUR                  |  \"Je reçois, je délègue, je réponds.\"\n  | EmpruntController::create   |\n  +-----------------------------+\n        |  JSON -> EmpruntInput (DTO d'entrée, validé)\n        v\n  +-----------------------------+\n  | SERVICE                     |  \"J'exécute le cas d'usage.\"\n  | EmpruntService::emprunter   |\n  +-----------------------------+\n        |                     |\n        | find(3)             | $livre->emprunter()   (règle : disponible ?)\n        v                     v\n  +---------------+     +---------------+\n  | REPOSITORY    |     | ENTITÉ        |  \"Je garde mes règles.\"\n  | LivreRepo     |---->| Livre         |\n  +---------------+     +---------------+\n        |                     |\n        v                     | persist / flush (EntityManager)\n     BASE DE DONNÉES  <-------+\n                 |\n                 v\n  CONTRÔLEUR : Emprunt -> EmpruntOutput (DTO de sortie) -> JSON, statut 201", "notes": ["La flèche descend toujours : le contrôleur connaît le service, le service connaît le repository et l'entité. Jamais l'inverse.", "Le DTO sert de frontière : en entrée (JSON → objet) et en sortie (entité → JSON).", "La règle « livre disponible ? » vit dans l'entité, pas dans le contrôleur ni dans le service."]}, "quiz": [{"q": "Où placer « un membre ne peut pas avoir plus de 3 emprunts en cours » ?", "options": ["Dans le contrôleur", "Dans le DTO", "Dans le service (ou l'entité si elle a l'info)", "Dans le repository"], "answer": 2, "why": "C'est une règle métier : service ou entité, jamais le contrôleur ni le DTO."}, {"q": "Le service doit-il renvoyer une `JsonResponse` ?", "options": ["Oui", "Non : il renvoie des objets métier, le contrôleur fabrique la réponse HTTP", "Seulement en API", "Seulement pour les erreurs"], "answer": 1, "why": "Le service ne connaît pas HTTP, ce qui permet de l'appeler depuis une commande ou un test."}, {"q": "Quel est le rôle du repository ?", "options": ["Valider les donnée
