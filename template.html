<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier de code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Un seul thème clair, teinté bleu-gris. Layout : barre latérale repliable (parcours) | zone de travail. Un module = 4 étapes en onglets ; le TD a 3 niveaux. */
:root {
  --bg: #eef3f8;
  --surface: #fbfcfe;
  --surface-2: #e5ecf4;
  --ink: #1f2633;
  --muted: #5d6779;
  --line: #d6dfea;
  --accent: #3a5bd6;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9fc;
  --good: #1d8a4f; --good-soft: #e1f3e8;
  --warn: #a96d00; --warn-soft: #fbf0d9;
  --bad: #c83c3c;  --bad-soft: #fbe5e5;
  --t-violet: #6b55cc; --t-orange: #cf6a1d; --t-green: #18865f; --t-cyan: #13809f; --t-graphite: #4a5263;
  --t-rose: #c23f78; --t-olive: #6f7f1a; --t-blue: #2f63c9; --t-brick: #b8432f; --t-amber: #b7791f; --t-teal: #0f8a7e; --t-indigo: #4a4fc4; --t-plum: #8e3f8a; --t-navy: #2f5d9e; --t-slate: #3d5566; --t-coral: #d9533d; --t-moss: #4f7a2e;
  --code-bg: #f4f7fb; --code-ink: #24292f; --code-line: #d6dfea;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.85rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; } h4 { font-size: 0.95rem; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100%; }
.side { align-self: start; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px 14px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand-row { display: flex; align-items: center; gap: 6px; }
.brand-row .brand { flex: 1; min-width: 0; }
.side-x, .side-open { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
.side-x:hover { background: var(--surface-2); color: var(--ink); }
.side-x svg, .side-open svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.side-open { display: none; position: fixed; top: 14px; left: 14px; z-index: 35; border-color: var(--line); background: var(--surface); box-shadow: 0 2px 8px rgb(0 0 0 / 0.06); }
.side-open:hover { color: var(--accent); border-color: var(--accent); }
@media (min-width: 861px) {
  body.side-off .app { grid-template-columns: minmax(0, 1fr); }
  body.side-off .side { display: none; }
  body.side-off .side-open { display: grid; }
  body.side-off main { padding-left: max(64px, clamp(16px, 4vw, 48px)); }
}
.brand { align-items: center; gap: 10px; padding: 0 6px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--font-display); font-size: 1.1rem; }
.nav-main { display: flex; flex-direction: column; gap: 2px; }
.nav-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 500; }
.nav-link:hover { background: var(--surface-2); }
.nav-link.on { background: var(--accent-soft); color: var(--accent); }
.count { min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--warn); color: #fff; font: 600 12px/20px var(--font-body); text-align: center; font-variant-numeric: tabular-nums; }
.count.zero { background: var(--surface-2); color: var(--muted); }
.side-group { display: flex; flex-direction: column; gap: 1px; }
.side-group + .side-group { margin-top: 8px; }
.group-label { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; font: 600 0.68rem var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 5px 10px 3px; border-radius: 6px; }
.group-label:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
.group-label .gchev { width: 0; height: 0; border-left: 4px solid currentColor; border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; transform: rotate(90deg); transition: transform .12s; }
.side-group.shut .gchev { transform: none; }
.group-label .gcount { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; }

.k-ecole { --kc: #f2c200; } .k-entreprise { --kc: #9aa3ad; } .k-examens { --kc: #3fa34d; } .k-rattrapages { --kc: #d65fd0; } .k-ferie { --kc: #c0392b; } .k-weekend, .k-libre { --kc: transparent; }
.cal-pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: color-mix(in srgb, var(--kc) 28%, transparent); color: var(--ink); border: 1px solid color-mix(in srgb, var(--kc) 70%, transparent); }
.cal-pill.k-weekend, .cal-pill.k-libre { background: var(--surface-2); border-color: var(--line); }
.cal-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--kc); flex: none; }
.tool-ic .cal-dot { position: absolute; top: 4px; right: 5px; width: 7px; height: 7px; box-shadow: 0 0 0 2px var(--surface); }
.cal-dot.k-weekend, .cal-dot.k-libre { background: var(--line); }
.cal-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; text-decoration: none; color: var(--ink); font-size: 0.9rem; }
.cal-strip:hover { border-color: var(--accent); }
.cal-warn { color: var(--warn); font-weight: 600; }
.cal-layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .cal-layout { grid-template-columns: 1fr; } }
.cal-title { margin: 0; min-width: 170px; text-align: center; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: 0.72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; text-align: center; padding-bottom: 2px; }
.cal-cell { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-height: 78px; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--kc) 18%, var(--surface)); text-align: left; cursor: pointer; font: inherit; color: var(--ink); overflow: hidden; }
.cal-cell.k-weekend, .cal-cell.k-libre { background: var(--surface-2); }
.cal-cell.out { border: 0; background: none; cursor: default; }
.cal-cell:hover { border-color: var(--accent); }
.cal-cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal-cell.today .cal-num { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px; }
.cal-num { font-weight: 600; font-size: 0.85rem; align-self: flex-start; }
.cal-kind { font-size: 0.68rem; color: var(--muted); font-weight: 600; }
.cal-ev { font-size: 0.7rem; line-height: 1.25; padding: 1px 4px; border-radius: 4px; background: var(--surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev.done, .cal-evlist li.done .grow, .cal-up li.done { text-decoration: line-through; opacity: 0.6; }
.cal-more { font-size: 0.68rem; color: var(--muted); }
.t-rendu { --evc: var(--warn); } .t-examen { --evc: #3fa34d; } .t-ecole { --evc: #d4a800; } .t-rdv { --evc: var(--accent); } .t-perso { --evc: #8a5cf6; } .t-info { --evc: var(--muted); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--muted); }
.cal-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--kc); margin-right: 5px; vertical-align: -1px; }
.cal-evlist, .cal-up { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; }
.cal-evlist li { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); }
.cal-evlist .grow { flex: 1; min-width: 0; }
.cal-tag { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--evc, var(--muted)); }
.cal-form { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.cal-form input, .cal-form select { font: inherit; font-size: 0.88rem; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.tool-row { display: flex; gap: 4px; padding: 0 6px; }
.tool-ic { position: relative; display: grid; place-items: center; width: 34px; height: 32px; border-radius: 8px; color: var(--muted); }
.tool-ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool-ic:hover { background: var(--surface-2); color: var(--ink); }
.tool-ic.on { background: var(--accent-soft); color: var(--accent); }
.tool-ic::after { content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: var(--surface); font-size: 0.76rem; font-weight: 500; padding: 4px 8px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 5; }
.tool-ic:hover::after, .tool-ic:focus-visible::after { opacity: 1; }
.tool-ic:first-child::after { left: 0; transform: none; }
.side-more { margin-top: 6px; border: 0; background: none; color: var(--muted); font: 500 0.82rem var(--font-body); text-align: left; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.side-more:hover { color: var(--accent); background: var(--surface-2); }
.side-empty { margin: 4px 0 0; padding: 0 10px; font-size: 0.82rem; color: var(--muted); }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tcard { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); background: var(--surface); transition: border-color .14s, transform .14s, box-shadow .14s; }
.tcard:hover { border-color: color-mix(in srgb, var(--tc) 40%, var(--line)); transform: translateY(-2px); box-shadow: 0 8px 22px rgb(31 38 51 / 0.07); }
.tcard-name { font-size: 0.98rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcard .row { flex-wrap: nowrap; }
.tcard-desc { margin: 0; }
.tcard-next { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcard-go { margin-top: auto; font-weight: 600; font-size: 0.86rem; color: var(--tc); }
.done-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.done-line .chip { text-decoration: none; }
.act-card h3 { font-size: 1rem; }
.act-card .hm-wrap { max-width: 330px; flex: 0 1 330px; min-width: 220px; }
.act-card .act-row { gap: 40px; }
.home-group { display: flex; flex-direction: column; gap: 8px; }
.home-group + .home-group { border-top: 1px solid var(--line); padding-top: 14px; }
.home-group h4 { margin: 0; font-size: 0.95rem; }
.side-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 10px; }
.groups { display: flex; flex-direction: column; gap: 2px; margin-top: -8px; }
.track-group { display: flex; flex-direction: column; gap: 1px; }
.track-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--ink); font-weight: 600; font-size: 0.86rem; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; }
.track-head:hover { background: var(--surface-2); }
.track-head .tname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); flex: none; margin-right: 2px; transition: transform 0.15s; }
.track-group.open .chev { transform: rotate(45deg); }
.minibar { margin-left: 8px; width: 32px; height: 4px; border-radius: 9px; background: var(--surface-2); overflow: hidden; flex: none; }
.minibar i { display: block; height: 100%; background: var(--tc); }
.track-head .frac { margin-left: 6px; min-width: 30px; text-align: right; color: var(--muted); font-weight: 500; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.mods { display: flex; flex-direction: column; gap: 1px; padding: 2px 0 8px; }
.mod-link { display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 0.86rem; line-height: 1.35; }
.mod-link:hover { background: var(--surface-2); color: var(--ink); }
.mod-link.on { background: var(--surface-2); color: var(--ink); font-weight: 500; }
.mod-link.all { color: var(--accent); font-size: 0.8rem; padding-left: 35px; }
.st { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; position: relative; }
.st.started { border-color: var(--tc, var(--accent)); background: linear-gradient(90deg, var(--tc, var(--accent)) 50%, transparent 50%); }
.st.done { border-color: var(--good); background: var(--good); }
.st.due { border-color: var(--warn); background: var(--warn); }
.side-foot { margin-top: auto; font-size: 0.78rem; color: var(--muted); padding: 8px 10px 0; border-top: 1px solid var(--line); display: flex; gap: 7px; align-items: flex-start; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-top: 7px; flex: none; }
.sync-dot.ok { background: var(--good); } .sync-dot.err { background: var(--bad); } .sync-dot.local { background: var(--warn); }

/* Logo d'un parcours : image logos/<id>.svg|png si présente, sinon badge texte */
.tlogo { display: inline-flex; align-items: center; justify-content: center; flex: none; width: var(--ls, 20px); height: var(--ls, 20px); border-radius: 6px; overflow: hidden; }
.tlogo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.tlogo .tbadge { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; border-radius: inherit; background: color-mix(in srgb, var(--tc) 14%, transparent); color: var(--tc); font: 600 calc(var(--ls, 20px) * 0.42) var(--font-mono); letter-spacing: -0.02em; white-space: nowrap; }
.tlogo.nologo .tbadge { display: flex; }
.tlogo.nologo img { display: none; }

.topbar { display: none; }
main { padding: 32px clamp(16px, 4vw, 48px) 64px; min-width: 0; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.prose { max-width: 75ch; display: flex; flex-direction: column; gap: 12px; line-height: 1.7; }
.prose p { margin: 0; }
.prose pre.code { max-width: none; }
.prose ul.points { margin: 2px 0; }
.prose h4 { margin-top: 6px; }
.tbl { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.92rem; line-height: 1.5; }
.tbl th, .tbl td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.tbl th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.tbl td:first-child { font-weight: 500; }
.tbl td code, .tbl th code { white-space: normal; overflow-wrap: anywhere; }
.tbl td:first-child { min-width: 9em; }
.tbl .c { text-align: center; } .tbl .r { text-align: right; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.run { background: var(--good); border-color: var(--good); color: #fff; }
.btn.run:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 0.84rem; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.ai-only { display: none !important; }
body.has-ai .ai-only { display: inline-flex !important; }
body.has-ai .ai-block.ai-only { display: block !important; }
body.has-ai .no-ai { display: none !important; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: color-mix(in srgb, var(--tc, var(--accent)) 14%, transparent); color: var(--tc, var(--accent)); }
.pill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; }
.pill.new { background: var(--surface-2); color: var(--muted); }
.pill.started { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.due { background: var(--warn-soft); color: var(--warn); }
.pill.custom { background: var(--surface-2); color: var(--muted); }
.pill.lvl { background: var(--surface-2); color: var(--muted); }
.bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--tc, var(--accent)); border-radius: 99px; }
.big { font-family: var(--font-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.due-list { display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; }
.due-list a { color: var(--ink); text-decoration: none; display: flex; gap: 8px; align-items: center; }
.due-list a:hover { color: var(--accent); }

/* Accueil */
.home-hero { display: grid; grid-template-columns: minmax(330px, 1.15fr) minmax(0, 1.2fr) minmax(190px, 0.8fr); gap: 14px; align-items: stretch; }
.home-hero > .card, .stat-col > .card { min-width: 0; }
.stat-col { display: grid; grid-template-rows: 1fr 1fr; gap: 14px; }
.ring { position: relative; flex: none; }
.ring svg { display: block; }
.ring circle { transition: stroke-dasharray 0.6s ease; }
.ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ring-in b { font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.ring-in b small { font-size: 0.7em; color: var(--muted); font-weight: 600; }
.ring-in span { font-size: 0.78rem; color: var(--muted); }
.hero-ring { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
.hero-ring .ring-in b { font-size: 2rem; }
.kpis { display: flex; flex-direction: column; gap: 10px; }
.kpis div { display: flex; align-items: baseline; gap: 8px; }
.kpis b { font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; min-width: 2ch; }
.kpis span { color: var(--muted); font-size: 0.86rem; white-space: nowrap; }
.kpis div:nth-child(1) b { color: var(--good); }
.kpis div:nth-child(2) b { color: var(--accent); }
.next-card { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.next-card h2 { font-size: 1.25rem; }
.next-card .btn { align-self: flex-start; }
.stat-card { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 14px 16px; text-decoration: none; color: var(--ink); }
.stat-card .stat-num { grid-row: 1 / 3; }
.stat-link { font-size: 0.84rem; color: var(--accent); font-weight: 500; }
a.stat-card:hover { border-color: var(--accent); }
.stat-link.muted { color: var(--muted); font-weight: 400; }
.stat-num { font-family: var(--font-display); font-size: 2.3rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-num small { font-size: 0.45em; color: var(--muted); }
.stat-lbl { color: var(--muted); font-size: 0.88rem; }
.stat-card.warn .stat-num { color: var(--warn); }
.tr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.tr-ring { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: var(--r); text-decoration: none; color: var(--ink); font-size: 0.84rem; font-weight: 500; text-align: center; }
.tr-ring:hover { background: var(--surface-2); }
.tr-ring .ring-in .tlogo { --ls: 26px; }
.hm-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1 1 300px; min-width: 260px; max-width: 680px; }
.hm-months { display: grid; gap: 4px; font-size: 0.72rem; color: var(--muted); }
.hm-months span { white-space: nowrap; overflow: visible; }
.hm-grid { display: grid; gap: 4px; }
.hm-col { display: grid; gap: 4px; }
.hm { display: block; width: 100%; aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); }
.hm-legend .hm { width: 11px; }
.hm.l-1 { background: transparent; }
.hm.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); }
.hm.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--surface-2)); }
.hm.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--surface-2)); }
.hm.l4 { background: var(--accent); }
.hm-legend { display: flex; align-items: center; gap: 3px; font-size: 0.72rem; color: var(--muted); }
.hm-legend span { margin: 0 4px; }
.act-row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.act-stats { display: flex; flex-direction: column; gap: 12px; }
.act-stats div { display: flex; align-items: baseline; gap: 8px; }
.act-stats b { font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; min-width: 2.5ch; }
.act-stats span { color: var(--muted); font-size: 0.86rem; }

/* Roadmap */
.rm-head { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.rm-head .tlogo { --ls: 56px; border-radius: 14px; }
.rm-kpis { display: flex; gap: 22px; }
.rm-kpis div { display: flex; flex-direction: column; }
.rm-kpis b { font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rm-kpis span { font-size: 0.8rem; color: var(--muted); }
.roadmap { list-style: none; margin: 8px 0 0; padding: 0; position: relative; display: flex; flex-direction: column; }
.roadmap::before { content: ""; position: absolute; left: 50%; top: 14px; bottom: 30px; width: 4px; margin-left: -2px; border-radius: 4px; background: repeating-linear-gradient(to bottom, var(--line) 0 10px, transparent 10px 18px); }
.rm-start, .rm-end { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 1; }
.rm-start::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 0 5px color-mix(in srgb, var(--tc) 20%, var(--bg)); }
.rm-cap { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); background: var(--bg); padding: 2px 10px; border-radius: 99px; }
.rm-end { margin-top: 18px; }
.rm-goalnode { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; line-height: 1; background: var(--surface); border: 2px dashed var(--line); color: var(--muted); }
.rm-end.passed .rm-goalnode { background: var(--tc); border: 0; color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--tc) 35%, transparent); }
.rm-end.passed .rm-cap { color: var(--tc); }
.rm-item { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); align-items: center; padding: 14px 0; }
.rm-item::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: transparent; }
.rm-item.passed::before { background: var(--tc); }
.rm-item.passed + .rm-item:not(.passed)::before { background: linear-gradient(to bottom, var(--tc) 50%, transparent 50%); }
.rm-node { grid-column: 2; grid-row: 1; justify-self: center; position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font-display); background: var(--surface); border: 3px solid var(--line); color: var(--muted); }
.rm-item.started .rm-node { border-color: var(--tc); color: var(--tc); background: conic-gradient(color-mix(in srgb, var(--tc) 22%, var(--surface)) 0 50%, var(--surface) 50% 100%); }
.rm-item.done .rm-node { background: var(--tc); border-color: var(--tc); color: #fff; }
.rm-item.due .rm-node { background: var(--warn); border-color: var(--warn); color: #fff; }
.rm-item.here .rm-node { box-shadow: 0 0 0 6px color-mix(in srgb, var(--tc) 22%, transparent); animation: rm-pulse 2.2s ease-in-out infinite; }
@keyframes rm-pulse { 50% { box-shadow: 0 0 0 11px color-mix(in srgb, var(--tc) 8%, transparent); } }
.rm-card { grid-row: 1; position: relative; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; color: var(--ink); transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
.rm-card:hover { transform: translateY(-2px); border-color: var(--tc); box-shadow: 0 8px 22px color-mix(in srgb, var(--tc) 14%, transparent); }
.rm-item.left .rm-card { grid-column: 1; margin-right: 6px; }
.rm-item.right .rm-card { grid-column: 3; margin-left: 6px; }
.rm-item.left .rm-card::after, .rm-item.right .rm-card::after { content: ""; position: absolute; top: 50%; width: 14px; height: 2px; background: var(--line); }
.rm-item.left .rm-card::after { right: -21px; }
.rm-item.right .rm-card::after { left: -21px; }
.rm-item.here .rm-card { border: 2px solid var(--tc); box-shadow: 0 8px 26px color-mix(in srgb, var(--tc) 18%, transparent); }
.rm-item.done .rm-card { background: color-mix(in srgb, var(--tc) 5%, var(--surface)); }
.rm-flag { position: absolute; top: -11px; left: 14px; background: var(--tc); color: #fff; font-size: 0.72rem; font-weight: 600; padding: 2px 10px; border-radius: 99px; }
.rm-meta { display: flex; gap: 10px; align-items: center; font-size: 0.76rem; color: var(--muted); }
.rm-num { font: 600 0.76rem var(--font-mono); color: var(--tc); text-transform: uppercase; }
.rm-title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
.rm-goal { font-size: 0.86rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rm-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.rm-steps { display: flex; gap: 4px; align-items: center; }
.rm-steps i { width: 18px; height: 5px; border-radius: 9px; background: var(--surface-2); }
.rm-steps i.on { background: var(--tc); }
.rm-steps i.lv { width: 8px; height: 8px; border-radius: 50%; }
.rm-steps .sep { width: 1px; height: 10px; background: var(--line); margin: 0 3px; }

/* Module */
.mod-head { display: flex; flex-direction: column; gap: 8px; }
.mod-head .tlogo { --ls: 22px; }
.steps { display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.step-tab { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 0; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.step-tab .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--font-mono); background: var(--surface-2); color: var(--muted); }
.step-tab.ok .n { background: var(--good); color: #fff; }
.step-tab.on { color: var(--ink); border-bottom-color: var(--tc); }
.step-tab.on .n { background: var(--tc); color: #fff; }
.step-tab.ok.on .n { background: var(--good); }
.panel { display: flex; flex-direction: column; gap: 22px; }
.why { background: color-mix(in srgb, var(--tc) 7%, var(--surface)); border-radius: 12px; padding: 14px 18px; max-width: 75ch; }
.prereq { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.prereq summary { cursor: pointer; padding: 12px 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; list-style: none; }
.prereq summary::-webkit-details-marker { display: none; }
.prereq summary::before { content: ""; width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); transition: transform 0.15s; }
.prereq[open] summary::before { transform: rotate(45deg); }
.prereq summary .muted { font-weight: 400; }
.prereq dl { margin: 0; padding: 0 16px 14px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: 0.92rem; }
.prereq dt { font-weight: 600; color: var(--tc); }
.prereq dd { margin: 0; }
.croiser > p { margin: 0 16px 10px; }
.croiser dt { max-width: 260px; }
.mech { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, 0.8fr); gap: 18px; align-items: start; }
.flow-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: f; }
.flow-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 0.92rem; line-height: 1.45; align-items: start; }
.flow-list li::before { counter-increment: f; content: counter(f); width: 26px; height: 26px; border-radius: 50%; background: var(--tc); color: #fff; display: grid; place-items: center; font: 600 12px var(--font-mono); }
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; overflow-x: auto; }
.diagram svg { display: block; width: 100%; height: auto; min-width: var(--minw, 480px); font-family: var(--font-body); }
.diagram .cap { font-size: 0.82rem; color: var(--muted); padding: 8px 6px 0; }
.lesson { display: flex; flex-direction: column; gap: 10px; }
.lesson h2 { font-size: 1.2rem; }
.points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.points li { padding-left: 18px; position: relative; }
.points li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 7px; height: 7px; border-radius: 2px; background: var(--tc); }
.pitfalls { background: var(--bad-soft); border-radius: var(--r); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.pitfalls h3 { color: var(--bad); font-size: 0.9rem; }
.pitfalls ul { margin: 0; padding: 0 0 0 16px; display: flex; flex-direction: column; gap: 4px; }
.recap { background: color-mix(in srgb, var(--tc) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tc) 30%, transparent); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.recap h3 { color: var(--tc); font-size: 0.9rem; }
.recap ol { margin: 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 5px; font-size: 0.93rem; }
.ai-box { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.ai-out { font-size: 0.93rem; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.ai-out:empty { display: none; }
.ai-out pre { margin: 0; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; }
.field { padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
textarea.field { width: 100%; resize: vertical; }

/* Code : fichiers à onglets */
pre.code { margin: 0; border: 1px solid var(--code-line); background: var(--code-bg); color: var(--code-ink); border-radius: var(--r); padding: 14px 16px; overflow-x: auto; font: 13.5px/1.65 var(--font-mono); tab-size: 4; }
pre.code code { background: none; padding: 0; font-size: inherit; color: inherit; }
.files { border: 1px solid var(--code-line); border-radius: var(--r); overflow: hidden; background: var(--code-bg); }
.files-tabs { display: flex; gap: 2px; background: var(--surface-2); border-bottom: 1px solid var(--code-line); padding: 4px 4px 0; overflow-x: auto; }
.ftab { border: 0; background: transparent; padding: 6px 12px; font: 500 12.5px var(--font-mono); color: var(--muted); border-radius: 7px 7px 0 0; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.ftab .dir { opacity: 0.6; }
.ftab.on { background: var(--code-bg); color: var(--ink); }
.ftab.mod::after { content: "•"; color: var(--accent); }
.fpane { display: none; }
.fpane.on { display: block; }
.files pre.code { border: 0; border-radius: 0; }
.files .editor { border: 0; border-radius: 0; }
.files.explorer { display: grid; grid-template-columns: 188px minmax(0, 1fr); }
.files.explorer.tree-off { grid-template-columns: minmax(0, 1fr); }
.files.explorer.tree-off .tree { display: none; }
.tree { background: var(--surface-2); border-right: 1px solid var(--code-line); display: flex; flex-direction: column; min-width: 0; max-height: 640px; }
.tree-head { display: flex; align-items: center; gap: 2px; padding: 6px 6px 4px 10px; font: 600 10.5px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tree-search { margin: 0 6px 6px; padding: 4px 8px; font: 12px var(--font-body); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 0; }
.tree-list { overflow-y: auto; padding-bottom: 8px; }
.tree-dir { display: flex; align-items: center; gap: 4px; width: 100%; border: 0; background: transparent; cursor: pointer; padding: 3px 8px 3px calc(8px + var(--d) * 10px); font: 600 12px var(--font-mono); color: var(--muted); text-align: left; }
.tree-dir:hover { color: var(--ink); }
.tree-dir .chev { display: inline-block; width: 0; height: 0; border-left: 4px solid currentColor; border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; transition: transform .12s; margin-right: 2px; }
.tree-dir .chev.open { transform: rotate(90deg); }
.trow { display: flex; align-items: center; padding-left: calc(var(--d) * 10px); }
.trow:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.trow.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.trow.danger { background: var(--bad-soft); }
.tree-file { flex: 1; min-width: 0; border-radius: 0; padding: 4px 6px 4px 10px; gap: 6px; background: transparent !important; }
.tree-file .fname { overflow: hidden; text-overflow: ellipsis; }
.tree-file.on { color: var(--ink); font-weight: 600; }
.ficon { flex: none; display: inline-grid; place-items: center; min-width: 22px; height: 15px; padding: 0 2px; border-radius: 3px; font: 700 8.5px var(--font-body); letter-spacing: 0.02em; color: var(--fi); background: color-mix(in srgb, var(--fi) 14%, transparent); }
.tact { flex: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: 12px var(--font-body); padding: 3px 6px; border-radius: 5px; line-height: 1.2; }
.tact:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.trow .tact { opacity: 0; }
.trow:hover .tact, .trow:focus-within .tact, .trow.danger .tact { opacity: 1; }
.tact.del-yes { color: var(--bad); font-weight: 600; opacity: 1; }
.tree-edit { padding: 3px 6px 3px calc(10px + var(--d) * 10px); gap: 6px; }
.tree-edit input { flex: 1; min-width: 0; font: 12px var(--font-mono); padding: 2px 6px; border: 1px solid var(--accent); border-radius: 4px; background: var(--surface); color: var(--ink); }
.tree-main { min-width: 0; display: flex; flex-direction: column; }
.files-crumbs { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--code-line); background: var(--surface-2); font: 12px var(--font-mono); color: var(--muted); min-height: 31px; }
.files-crumbs .crumb { display: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files-crumbs .crumb.on { display: inline; }
.files-crumbs .crumb i { font-style: normal; margin: 0 5px; opacity: 0.6; }
.files-crumbs .crumb b { color: var(--ink); font-weight: 600; }
.files-crumbs .show-tree { font-size: 11.5px; }
@media (max-width: 720px) { .files.explorer { grid-template-columns: minmax(0, 1fr); } .tree { border-right: 0; border-bottom: 1px solid var(--code-line); max-height: 180px; } .trow .tact { opacity: 1; } }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword { color: #cf222e; }
.hljs-string, .hljs-regexp { color: #0a3069; }
.hljs-number, .hljs-literal { color: #0550ae; }
.hljs-comment { color: #6e7781; font-style: italic; }
.hljs-title, .hljs-title.function_ { color: #8250df; }
.hljs-variable, .hljs-template-variable { color: #953800; }
.hljs-attr, .hljs-attribute, .hljs-type, .hljs-title.class_, .hljs-built_in { color: #0550ae; }
.hljs-meta, .hljs-tag, .hljs-name, .hljs-symbol { color: #116329; }
.hljs-subst { color: var(--code-ink); }
.hljs-property { color: #0550ae; }
.hljs-params { color: #24292f; }
.hljs-operator { color: #cf222e; }
.hljs-punctuation { color: #57606a; }
.hljs-section, .hljs-selector-class, .hljs-selector-id { color: #8250df; }
.hljs-addition { color: #116329; background: #dafbe1; }
.hljs-deletion { color: #82071e; background: #ffebe9; }
.ex { display: flex; flex-direction: column; gap: 16px; }
.croiser dt .mref { font: 600 0.9rem var(--font-mono); }
.notes { display: flex; flex-direction: column; gap: 10px; counter-reset: n; margin: 0; padding: 0; list-style: none; }
.notes li { counter-increment: n; display: grid; grid-template-columns: 24px 1fr; gap: 8px; font-size: 0.9rem; }
.notes li::before { content: counter(n); width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font: 600 12px var(--font-mono); color: var(--tc); }

/* Quiz */
.q { display: flex; flex-direction: column; gap: 10px; }
.q-title { font-weight: 600; display: flex; gap: 10px; }
.q-title .k { font: 600 13px var(--font-mono); color: var(--tc); padding-top: 1px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.4; }
.opt:hover:not([disabled]) { border-color: var(--tc); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { font-size: 0.9rem; padding: 8px 12px; border-radius: 8px; }
.feedback.right { background: var(--good-soft); }
.feedback.wrong { background: var(--bad-soft); }
.feedback b { margin-right: 4px; }
.score { display: flex; align-items: center; gap: 14px; }

/* TD */
.levels { display: flex; gap: 8px; flex-wrap: wrap; }
.lvl-tab { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-width: 180px; text-align: left; flex: 1; }
.lvl-tab b { font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
.lvl-tab span { font-size: 0.8rem; color: var(--muted); }
.lvl-tab.on { border-color: var(--tc); box-shadow: inset 0 0 0 1px var(--tc); }
.lvl-tab.ok b::after { content: "✓"; color: var(--good); font-weight: 700; }
.consignes { margin: 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 5px; }
.editor { width: 100%; min-height: 460px; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--code-line); border-radius: var(--r); padding: 14px 16px; font: 13.5px/1.65 var(--font-mono); tab-size: 4; resize: vertical; white-space: pre; overflow: auto; display: block; }
.ed-wrap { position: relative; background: var(--code-bg); --gut: 50px; }
.ed-wrap .ed-ln { position: absolute; left: 1px; top: 1px; bottom: 1px; width: calc(var(--gut) - 10px); margin: 0; padding: 13px 10px 13px 0; border: 0; border-right: 1px solid var(--code-line); overflow: hidden; pointer-events: none; user-select: none; text-align: right; font: 13.5px/1.65 var(--font-mono); color: color-mix(in srgb, var(--code-ink) 34%, transparent); background: var(--code-bg); z-index: 1; border-radius: var(--r) 0 0 var(--r); }
.files .ed-wrap .ed-ln { left: 0; top: 0; bottom: 0; padding: 14px 10px 14px 0; border-radius: 0; }
.ed-ln span { display: block; }
.ed-ln span.on { color: var(--code-ink); font-weight: 600; }
pre.code.ln { position: relative; padding-left: calc(16px + var(--gut, 42px)); }

/* ---------- rendu : parcours (roadmap) ---------- */
function viewTrack(tid) {
  const t = track(tid);

  const s = trackStats(tid);
  const nextId = (ms.find((m) => status(m.id) === "started") || ms.find((m) => status(m.id) === "due") || ms.find((m) => status(m.id) === "new") || {}).id;
  const minsLeft = ms.filter((m) => !prog(m.id)?.done).reduce((a, m) => a + (m.minutes || 15), 0);
  const items = ms.map((m, i) => {
    const st = status(m.id);
    const here = m.id === nextId;
    const p = prog(m.id);
    const steps = [0, 1, 2, 3].map((k) => `<i class="${stepDone(m, k) ? "on" : ""}"></i>`).join("") + (tds(m).length > 1 ? `<span class="sep"></span>` + tds(m).map((td) => `<i class="lv ${levelDone(p, td.level) ? "on" : ""}" title="TD niveau ${td.level}"></i>`).join("") : "");
    const nodeIn = st === "done" ? "✓" : st === "due" ? "↻" : String(i + 1);
    const side = i % 2 === 0 ? "left" : "right";
    return `<li class="rm-item ${side} ${st} ${here ? "here" : ""} ${p?.done ? "passed" : ""}">
      <a class="rm-card" href="#m-${esc(m.id)}">
        ${here ? `<span class="rm-flag">${st === "started" ? "Tu en es là" : st === "due" ? "À réviser" : "Prochaine étape"}</span>` : ""}
        <span class="rm-meta"><span class="rm-num">Étape ${i + 1}</span><span>${m.minutes || 15} min</span>${noteOf(m.id) ? `<span class="rm-note" title="Tu as des notes sur ce module">${NOTE_ICON}notes</span>` : ""}${isCustom(m.id) ? '<span class="pill custom">ajouté</span>' : ""}</span>
        <span class="rm-title">${esc(m.title)}</span>
        <span class="rm-goal">${inl(m.goal)}</span>
        <span class="rm-foot"><span class="rm-steps" title="Comprendre · Exemple · Quiz · TD, puis niveaux du TD">${steps}</span><span class="pill ${st}">${STATUS_LABEL[st]}</span></span>
      </a>
      <span class="rm-node" aria-hidden="true">${nodeIn}</span>
    </li>`;
  }).join("");
  const finished = s.total > 0 && s.done === s.total;
  return `<div class="wrap" style="${tc(t)}">
    <a class="small" href="#accueil">← Tableau de bord</a>
    <div class="rm-head card">
      ${logo(t, 56)}
      ${ring(s.total ? s.done / s.total : 0, 96, 10, "var(--tc)", `${s.done}<small>/${s.total}</small>`)}
      <div class="stack" style="gap:6px;flex:1;min-width:220px">
        <div class="eyebrow">Parcours</div>
        <h1>${esc(t.name)}</h1>
        <p class="muted small">${esc(t.desc || "")}</p>
      </div>
      <div class="rm-kpis">
        <div><b>${s.total - s.done}</b><span>étapes restantes</span></div>
        <div><b>${minsLeft >= 60 ? Math.floor(minsLeft / 60) + " h " + String(minsLeft % 60).padStart(2, "0") : minsLeft + " min"}</b><span>de travail estimé</span></div>
      </div>
    </div>
    ${ms.length ? `<ol class="roadmap">
      <li class="rm-start"><span class="rm-cap">Départ</span></li>
      ${items}
      <li class="rm-end ${finished ? "passed" : ""}"><span class="rm-goalnode" aria-hidden="true">★</span><span class="rm-cap">${finished ? "Parcours terminé" : "Objectif : " + esc(t.short || t.name) + " maîtrisé"}</span></li>
    </ol>` : `<p class="muted card">Aucun module pour l'instant. <a href="#ajouter">Ajoute le premier.</a></p>`}
  </div>`;
}

/* ---------- diagrammes SVG ---------- */
const DG = { colW: 190, rowH: 96, nodeW: 158, nodeH: 58, padX: 16, padY: 14 };
function dgColor(c) { return ({ tc: "var(--tc)", accent: "var(--accent)", good: "var(--good)", warn: "var(--warn)", bad: "var(--bad)", muted: "var(--muted)" })[c] || c || "var(--tc)"; }
function dgText(x, y, text, cls, anchor = "middle", size = 13, weight = 600, fill = "var(--ink)", lineH = 15) {
  const lines = String(text).split("\n");
  const y0 = y - ((lines.length - 1) * lineH) / 2;
  return lines.map((l, i) => `<text x="${x}" y="${y0 + i * lineH}" text-anchor="${anchor}" dominant-baseline="central" font-size="${size}" font-weight="${weight}" fill="${fill}" class="${cls || ""}">${esc(l)}</text>`).join("");
}
function diagram(d) {
  if (!d || !Array.isArray(d.nodes) || !d.nodes.length) return "";
  const lw = (t) => Math.max(...String(t).split("\n").map((x) => x.length)) * 6.4 + 16;
  const hLabels = (d.edges || []).filter((e) => e.label).map((e) => { const A = d.nodes.find((n) => n.id === e.from), B = d.nodes.find((n) => n.id === e.to); return A && B && A.row === B.row ? lw(e.label) : 0; });
  const colW = Math.min(320, Math.max(DG.colW, DG.nodeW + Math.max(0, ...hLabels) + 20));
  const cols = Math.max(...d.nodes.map((n) => n.col + (n.span || 1) - 1)) + 1;
  const rows = Math.max(...d.nodes.map((n) => n.row)) + 1;
  const W = DG.padX * 2 + cols * colW, H = DG.padY * 2 + rows * DG.rowH + (d.lanes ? 26 : 0);
  const top = DG.padY + (d.lanes ? 26 : 0);
  const pos = {};
  for (const n of d.nodes) {
    const span = n.span || 1;
    const w = DG.nodeW + (span - 1) * colW, h = n.sub ? DG.nodeH + 14 : DG.nodeH;
    const x = DG.padX + n.col * colW + (colW - DG.nodeW) / 2, y = top + n.row * DG.rowH + (DG.rowH - h) / 2;
    pos[n.id] = { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
  }
  let labels = "";
  let out = `<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>`;
  if (d.lanes) for (const l of d.lanes) {
    const x = DG.padX + l.from * colW - 6, w = (l.to - l.from + 1) * colW + 12;
    const col = dgColor(l.color || "muted");
    out += `<rect x="${x}" y="${DG.padY}" width="${w}" height="${H - DG.padY * 2}" rx="12" fill="${col}" fill-opacity="0.07" stroke="${col}" stroke-opacity="0.25" stroke-dasharray="4 4"/>`;
    out += dgText(x + w / 2, DG.padY + 13, l.label.toUpperCase(), "", "middle", 11, 700, col);
  }
  for (const e of d.edges || []) {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) continue;
    const col = dgColor(e.color || "muted");
    let path, lx, ly;
    if (Math.abs(a.cy - b.cy) < 2) {
      const dir = b.cx > a.cx ? 1 : -1; const x1 = dir > 0 ? a.x + a.w : a.x, x2 = dir > 0 ? b.x : b.x + b.w;
      const yy = a.cy + (e.back ? 14 : 0);
      path = `M${x1},${yy} L${x2},${yy}`; lx = (x1 + x2) / 2; ly = e.back ? yy + 12 : yy - 11;
    } else if (Math.abs(a.cx - b.cx) < 2) {
      const dir = b.cy > a.cy ? 1 : -1; const y1 = dir > 0 ? a.y + a.h : a.y, y2 = dir > 0 ? b.y : b.y + b.h;
      const xx = a.cx + (e.back ? 18 : 0);
      path = `M${xx},${y1} L${xx},${y2}`; lx = xx + 8; ly = (y1 + y2) / 2;
    } else {
      const dir = b.cx > a.cx ? 1 : -1; const x1 = dir > 0 ? a.x + a.w : a.x;
      const vdir = b.cy > a.cy ? 1 : -1; const y2 = vdir > 0 ? b.y : b.y + b.h;
      path = `M${x1},${a.cy} L${b.cx},${a.cy} L${b.cx},${y2}`; lx = (x1 + b.cx) / 2; ly = a.cy - 11;
    }
    out += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" ${e.dashed ? 'stroke-dasharray="5 4"' : ""} marker-end="url(#dg-arrow)"/>`;
    if (e.label) {
      const tw = lw(e.label) - 4;
      labels += `<rect x="${lx - tw / 2}" y="${ly - 9}" width="${tw}" height="18" rx="9" fill="var(--surface)" stroke="${col}" stroke-opacity="0.35"/>` + dgText(lx, ly, e.label, "", "middle", 11, 500, "var(--ink)");
    }
  }
  for (const n of d.nodes) {
    const p = pos[n.id]; const col = dgColor(n.color || "tc"); const k = n.kind || "box";
    const fill = `color-mix(in srgb, ${col} ${k === "note" ? 6 : 12}%, var(--surface))`;
    if (k === "db") out += `<path d="M${p.x},${p.y + 10} a${p.w / 2},10 0 0 1 ${p.w},0 v${p.h - 20} a${p.w / 2},10 0 0 1 -${p.w},0 z" fill="${fill}" stroke="${col}" stroke-width="1.6"/><path d="M${p.x},${p.y + 10} a${p.w / 2},10 0 0 0 ${p.w},0" fill="none" stroke="${col}" stroke-width="1.6"/>`;
    else if (k === "actor") out += `<circle cx="${p.cx}" cy="${p.y + 16}" r="9" fill="${fill}" stroke="${col}" stroke-width="1.6"/><path d="M${p.cx},${p.y + 25} v16 M${p.cx - 14},${p.y + 32} h28 M${p.cx},${p.y + 41} l-10,14 M${p.cx},${p.y + 41} l10,14" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/>`;
    else if (k === "doc" || k === "file") out += `<path d="M${p.x},${p.y} h${p.w - 16} l16,16 v${p.h - 16} h-${p.w} z" fill="${fill}" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/><path d="M${p.x + p.w - 16},${p.y} v16 h16" fill="none" stroke="${col}" stroke-width="1.6"/>`;
    else if (k === "pill") out += `<rect x="${p.x}" y="${p.y + 10}" width="${p.w}" height="${p.h - 20}" rx="${(p.h - 20) / 2}" fill="${fill}" stroke="${col}" stroke-width="1.6"/>`;
    else if (k === "note") out += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6" fill="${fill}" stroke="${col}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    else out += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="10" fill="${fill}" stroke="${col}" stroke-width="1.6"/>`;
    const ty = k === "actor" ? p.y + p.h - 2 + 8 : p.cy + (n.sub ? -8 : 0);
    out += dgText(p.cx, k === "actor" ? p.y + p.h + 4 : ty, n.label, "", "middle", k === "note" ? 12 : 13, k === "note" ? 500 : 600, "var(--ink)");
    if (n.sub && k !== "actor") out += dgText(p.cx, p.cy + 12, n.sub, "", "middle", 11, 400, "var(--muted)", 13);
  }
  out += labels;
  const minw = Math.min(W, 560);
  return `<figure class="diagram" style="margin:0;--minw:${minw}px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.caption || "Schéma")}">${out}</svg>${d.caption ? `<figcaption class="cap">${inl(d.caption)}</figcaption>` : ""}</figure>`;
}

/* ---------- rendu : module ---------- */
function stepDone(m, i) {

}

function qSave(texte, ask) {
  const u = qUi(); texte = String(texte || "").trim();
  if (!texte) { toast("Écris d'abord ta question."); return null; }
  const q = { id: rid(), ts: Date.now(), date: today(), texte: texte.slice(0, 4000), citation: (u.quote || "").slice(0, 700), ctx: u.ctx || null, statut: "ouverte", reponse: "", source: "" };
  questions().unshift(q); if (questions().length > 300) questions().length = 300;
  u.texte = ""; u.quote = "";
  if (u.ctx && u.ctx.module) u.tab = "ici"; else u.tab = "aposer";
  saveProgress();
  renderQ(); if (currentRoute() === "questions") render(); renderSide();
  toast(ask ? "Question notée, Claude répond…" : "Question notée.");
  if (ask) qAsk(q.id);
  else { const t = $("#qpanel textarea[name=texte]"); if (t) t.focus(); }
  return q;
}
function qRefreshViews() { renderQ(); if (currentRoute() === "questions") render(); else renderSide(); qBadge(); }
async function qAsk(id) {
  const q = questions().find((x) => x.id === id); if (!q || !sample) return;
  const u = qUi(); u.loading = id; qRefreshViews();
  const m = q.ctx && q.ctx.module && mod(q.ctx.module);
  let extra = "";
  if (m && q.ctx.etape && /^TD/.test(q.ctx.etape)) {
    const lvl = Number(q.ctx.etape.replace(/\D/g, "")) || 1; const td = tds(m).find((t) => t.level === lvl);
    if (td) extra = `\n\nL'élève travaillait sur le TD « ${td.title} » : ${td.enonce}\nConsignes : ${(td.consignes || []).join(" | ")}`;
  }
  const prompt = `${levelContext()}\n\n${m ? moduleContext(m) + `\n\nL'élève est à l'étape « ${q.ctx.etape || ""} » du module.` : q.ctx && q.ctx.page ? "L'élève était sur la page : " + q.ctx.page + "." : "Question générale de l'élève."}${extra}${q.citation ? `\n\nPassage du cours qu'il cite :\n"""\n${q.citation}\n"""` : ""}\n\nQuestion notée pendant sa révision : ${q.texte}\n\nRéponds directement à la question, en t'appuyant sur le cours quand c'est utile. 200 mots maximum hors code ; un court bloc \`\`\` si un exemple aide. Pas de titre.`;
  const sel = "#qans-" + CSS.escape(id);
  const paint = (text) => { document.querySelectorAll(sel).forEach((o) => { o.style.display = ""; o.innerHTML = `<div class="who">Réponse de Claude</div>${md(text)}`; }); };
  try {
    const res = await sample(prompt, { cache: false, onText: ({ text }) => paint(text) });
    q.reponse = String(res.text || "").trim(); q.source = "claude"; q.statut = "repondue"; (u.keep = u.keep || []).push(id);
    saveProgress();
  } catch (e) {
    toast(e && e.code === "rate_limited" ? "Trop de demandes d'un coup. Réessaie dans une minute." : e && e.code === "not_granted" ? "Claude n'est pas autorisé ici." : "La réponse n'a pas pu être générée. Réessaie.");
  }
  if (u.loading === id) u.loading = null;
  qRefreshViews();
}
async function qCopy() {
  const open = questions().filter((q) => q.statut !== "repondue").slice().reverse();
  if (!open.length) return;
  const txt = "Voici des questions que je me suis posées en révisant mon atelier de code :\n\n" + open.map((q, i) => {
    const where = qCtxText(q.ctx);
    return `${i + 1}. ${where ? "[" + where + "] " : ""}${q.texte}${q.citation ? "\n   Passage concerné : « " + q.citation.replace(/\s*\n\s*/g, " ") + " »" : ""}`;
  }).join("\n\n");
  try { await navigator.clipboard.writeText(txt); toast(`${open.length} question${open.length > 1 ? "s" : ""} copiée${open.length > 1 ? "s" : ""} : colle-les dans ta conversation avec Claude.`); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Questions copiées."); } catch (_) { toast("Copie impossible dans ce navigateur."); } ta.remove(); }
}

  runAI("#ai-td", `${levelContext()}\n\nTu corriges un TD (niveau ${td.level}).\nTD : ${td.title}\nÉnoncé : ${td.enonce}\nConsignes :\n${td.consignes.map((c, i) => `${i + 1}. ${c}`).join("\n")}\n\nSolution de référence (NE LA RECOPIE PAS) :\n${sol}\n\nCode de l'élève :\n${codeTxt}\n\nRéponds ainsi :\n- Une ligne par consigne : « OK » ou ce qui manque/est faux, en une phrase.\n- Le point le plus important à corriger et POURQUOI (lié au mécanisme du module).\n- Un indice pour corriger, sans donner le code complet.\nSi tout est bon, dis-le et propose une amélioration. 220 mots maximum.`, "Claude relit ton code…");
}
function readGenForm() {
  const f = document.querySelector('form[data-form="gen"]');
  if (!f) return;
  const g = state.ui.gen || (state.ui.gen = {});
  g.track = f.track.value; g.topic = f.topic.value; g.notes = f.notes.value;
  if (f.tname) g.tname = f.tname.value;
}
async function aiGenerate() {
  const g = state.ui.gen || {};
  if (!sample) return;
  if (!g.topic || !g.topic.trim()) { g.error = "Indique un sujet."; render(); return; }
  if (g.track === "__new" && !(g.tname || "").trim()) { g.error = "Donne un nom au nouveau parcours."; render(); return; }
  const trackName = g.track === "__new" ? g.tname.trim() : track(g.track).name;
  const exemple = moduleTemplate();
  g.loading = true; g.error = null; g.result = null; render();
  const prompt = `${levelContext()}\n\nÉcris UN module d'apprentissage complet sur le sujet « ${g.topic.trim()} » pour le parcours « ${trackName} ».${g.notes ? `\nPrécisions de l'élève : ${g.notes}` : ""}\n\nMéthode : (1) why : le problème que ça résout, en 2-3 phrases concrètes ; (2) prereq : 3 à 6 mots de vocabulaire de base utilisés dans le module, avec une définition d'une phrase chacun ; (3) flow : le mécanisme en 4 étapes courtes ; (4) lessons : 3 à 4 leçons de 2 à 4 paragraphes chacune, progressives, qui expliquent vraiment (pas des listes de mots-clés), avec de petits blocs de code \`\`\`lang:chemin/fichier ; (5) points : 4 ou 5 points essentiels ; (6) pitfalls : 2 ou 3 pièges ; (7) recap : 3 à 5 phrases à retenir ; (8) example : un exemple réaliste de 20 à 60 lignes, découpé en fichiers si le projet en a plusieurs, avec 3 ou 4 notes ; (9) quiz : 4 questions à 4 options (answer = index de la bonne réponse, why = explication) ; (10) tds : 3 TD de niveaux 1 (application directe), 2 (cas à adapter), 3 (approfondissement combinant d'autres notions), chacun avec énoncé, 3 à 5 consignes, fichiers de départ, 2 ou 3 indices progressifs, solution complète, 2 ou 3 vérifications. Si le code est du PHP pur (sans framework) ou du React/TypeScript sans librairie externe, ajoute run : {kind:"php"|"react", tests:"..."} (PHP : fonctions check('desc', bool) ; React : assert(cond, 'desc') avec h.$(), h.click(), h.type(), h.text()). Sinon, ne mets pas run et donne expected (résultat attendu en texte).\nContraintes : français ; markdown inline (\`code\`, **gras**) dans les textes ; lang parmi php, tsx, ts, javascript, sql, bash, yaml, json, python, plaintext ; contenu exact et à jour.\n\nRéponds UNIQUEMENT avec un objet JSON valide ayant exactement cette structure :\n${exemple}`;
  try {
    const val = await sample.json(prompt, { modelTier: "complex" });
    const m = normalizeModule(val);
    if (!m) throw new Error("format");
    g.result = m;
  } catch (e) {
    g.error = e && e.code === "rate_limited" ? "Trop de demandes. Réessaie dans une minute." : e && e.code === "not_granted" ? (standalone ? "Clé API refusée : vérifie-la dans « Activer les boutons Claude »." : "Claude n'est pas autorisé dans cette vue.") : "Le module généré était incomplet. Réessaie.";
  }

}
function asStrArr(a) { return Array.isArray(a) ? a.filter((x) => typeof x === "string" && x.trim()).map((x) => x.trim()) : []; }
function normFile(f, i) { if (!f || typeof f.code !== "string") return null; return { path: typeof f.path === "string" ? f.path.trim() : "", lang: LANGS[f.lang] !== undefined ? f.lang : "plaintext", code: f.code.replace(/\s+$/, "") }; }
function normFiles(v) { if (Array.isArray(v)) return v.map(normFile).filter(Boolean); const f = normFile(v); return f ? [f] : []; }
function normalizeModule(v) {
  if (!v || typeof v !== "object") return null;
  const str = (x) => (typeof x === "string" ? x.trim() : "");
  const quiz = (Array.isArray(v.quiz) ? v.quiz : []).map((q) => ({ q: str(q && q.q), options: asStrArr(q && q.options), answer: Number(q && q.answer), why: str(q && q.why) }))
    .filter((q) => q.q && q.options.length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length);
  const ex = v.example || {};
  const rawTds = Array.isArray(v.tds) && v.tds.length ? v.tds : v.td ? [{ level: 1, ...v.td, files: v.td.files || (v.td.starter ? [v.td.starter] : []), solution: v.td.solution }] : [];
  const tdsN = rawTds.map((td, i) => {
    if (!td) return null;
    const files = normFiles(td.files || td.starter); const solution = normFiles(td.solution);
    const o = { level: Number(td.level) || i + 1, title: str(td.title) || "TD", enonce: str(td.enonce), consignes: asStrArr(td.consignes), files, hints: asStrArr(td.hints), solution, checks: asStrArr(td.checks) };
    if (td.run && typeof td.run === "object" && ["php", "react", "js"].includes(td.run.kind)) o.run = { kind: td.run.kind, tests: str(td.run.tests), entry: str(td.run.entry) || undefined, api: str(td.run.api) || undefined };
    if (str(td.expected)) o.expected = str(td.expected);
    if (!o.enonce || !o.consignes.length || !o.solution.length) return null;
    if (!o.files.length) o.files = o.solution.map((f) => ({ ...f, code: "// à toi" }));
    if (!o.hints.length) o.hints = ["Relis le mécanisme du module."];
    if (!o.checks.length) o.checks = ["Ton code respecte toutes les consignes"];
    return o;
  }).filter(Boolean);
  const m = {
    title: str(v.title), minutes: Number(v.minutes) || 15, goal: str(v.goal), why: str(v.why),
    prereq: (Array.isArray(v.prereq) ? v.prereq : []).map((p) => ({ term: str(p && p.term), def: str(p && p.def) })).filter((p) => p.term && p.def),
    flow: asStrArr(v.flow).slice(0, 6), diagram: v.diagram && Array.isArray(v.diagram.nodes) ? v.diagram : null,
    lessons: (Array.isArray(v.lessons) ? v.lessons : []).map((l) => ({ title: str(l && l.title), body: str(l && l.body) })).filter((l) => l.title && l.body),
    points: asStrArr(v.points), pitfalls: asStrArr(v.pitfalls), recap: asStrArr(v.recap),
    example: { files: normFiles(ex.files || (ex.code !== undefined ? { path: "", lang: ex.lang, code: ex.code } : [])), notes: asStrArr(ex.notes) },
    quiz, tds: tdsN,
  };
  if (!m.title || !m.goal || m.flow.length < 2 || !m.points.length || !m.example.files.length || !quiz.length || !m.tds.length) return null;
  if (!m.why) m.why = m.goal;
  return m;
}
function ensureTrack(name, color) {
  const n = name.trim();
  const existing = tracks().find((t) => t.name.toLowerCase() === n.toLowerCase() || (t.short || "").toLowerCase() === n.toLowerCase());
  if (existing) return existing.id;
  const t = { id: "t" + rid(), name: n, short: n.length > 14 ? n.slice(0, 13) + "…" : n, color: color || "rose", desc: "Parcours ajouté." };
  state.custom.tracks.push(t);
  return t.id;
}
function saveGenerated() {
  const g = state.ui.gen; if (!g || !g.result) return;
  const tid = g.track === "__new" ? ensureTrack(g.tname, state.ui.newTrackColor) : g.track;
  const m = { ...g.result, id: "c" + rid(), track: tid };
  state.custom.modules.push(m);
  libWriter.schedule();
  state.ui.gen = { track: tid };
  location.hash = "#m-" + m.id;
  toast("Module ajouté.");
}
function importJSON() {
  const err = $("#import-err");
  let v;
  try { v = JSON.parse($("#import-json").value); } catch (e) { err.textContent = "JSON invalide : vérifie les virgules et les guillemets."; return; }
  const list = Array.isArray(v) ? v : [v];
  let added = 0, firstId = null;
  for (const raw of list) {
    const m = normalizeModule(raw);
    if (!m) continue;
    let tid = raw.track && tracks().some((t) => t.id === raw.track) ? raw.track : null;
    if (!tid) tid = ensureTrack(raw.trackName || raw.track || "Mes modules", "rose");
    const id = "c" + rid();
    state.custom.modules.push({ ...m, id, track: tid });
    added++; firstId = firstId || id;
  }
  if (!added) { err.textContent = "Aucun module valide : il faut au moins title, goal, flow, points, example, quiz et tds."; return; }
  libWriter.schedule();
  toast(`${added} module(s) importé(s).`);
  location.hash = "#m-" + firstId;
}
